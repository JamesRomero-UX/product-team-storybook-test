name: Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@risk-smart'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install dependencies
        run: pnpm install

      - name: Build themed components
        run: pnpm run build

      - name: Update package versions
        run: |
          # Extract version from tag or input
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF#refs/tags/v}
          else
            VERSION=${{ github.event.inputs.version }}
          fi

          # Update main package.json
          npm version $VERSION --no-git-tag-version
          npm pkg set name="@risk-smart/web-theme"
          npm pkg set version="$VERSION"
          npm pkg set description="RiskSmart web theme"
          npm pkg set repository.type="git"
          npm pkg set repository.url="https://github.com/${{ github.repository }}.git"
          npm pkg set publishConfig.@risk-smart:registry="https://npm.pkg.github.com"

          # Update generated package.json files with RiskSmart naming and version
          cd risksmart-themed/components
          npm pkg set name="@risk-smart/themed-cloudscape-components"
          npm pkg set version="$VERSION"
          npm pkg set description="RiskSmart themed CloudScape Design System components"
          npm pkg set repository.type="git"
          npm pkg set repository.url="https://github.com/${{ github.repository }}.git"
          npm pkg set publishConfig.@risk-smart:registry="https://npm.pkg.github.com"

          cd ../design-tokens
          npm pkg set name="@risk-smart/themed-design-tokens"
          npm pkg set version="$VERSION"
          npm pkg set description="RiskSmart themed design tokens for CloudScape components"
          npm pkg set repository.type="git"
          npm pkg set repository.url="https://github.com/${{ github.repository }}.git"
          npm pkg set publishConfig.@risk-smart:registry="https://npm.pkg.github.com"

      - name: Publish theme
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish components package
        run: |
          cd risksmart-themed/components
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish design tokens package
        run: |
          cd risksmart-themed/design-tokens
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
