# AWS Account definitions for OpenTofu **account** pipelines (not workspaces!)
#
# Adding a new account:
#   1. Add entry below with aws_account_id, role_name, and regions
#   2. Create folder: infrastructure/aws/accounts/<account-name>/<region>/
#   3. Update workflow_dispatch options in .github/workflows/auto-tofu-accounts.yml
#      (GitHub Actions doesn't support dynamic choice options from external files)
#
# Structure:
#   <account-name>: # must match folder name under infrastructure/aws/accounts
#     aws_account_id: "123456789012"
#     role_name: RiskSmart-GitHub-Deploy-Role
#     regions:
#       - eu-west-2
#       - us-east-1

audit:
  aws_account_id: "060364747537"
  role_name: RiskSmart-GitHub-Deploy-Role
  regions:
    - us-east-1

