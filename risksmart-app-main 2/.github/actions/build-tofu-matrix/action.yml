name: Build GitHub Actions Job Matrix
description: >
  Builds a GitHub Actions matrix from accounts config for the specified changed accounts.
  Enriches account names with AWS account IDs, role names, and regions from config.
  Supports two input formats:
    - "account:region" specific region only (for PR/push change detection)
    - "account" all regions from config (for workflow_dispatch)

inputs:
  config-file:
    description: Path to accounts YAML config file
    required: true
    default: .github/config/accounts.yml
  changed-accounts:
    description: |
      Comma-separated list of accounts to process. Supports two formats:
        - "account:region" process only that specific region
        - "account" process all regions from config
    required: false

outputs:
  matrix:
    description: JSON matrix for GitHub Actions strategy
    value: ${{ steps.build.outputs.matrix }}
  has-changes:
    description: Whether any accounts need processing ("true" or "false")
    value: ${{ steps.build.outputs.has_changes }}
  config-accounts:
    description: JSON array of account names from config
    value: ${{ steps.build.outputs.config_accounts }}

runs:
  using: composite
  steps:
    - name: Build matrix
      id: build
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        CHANGED_ACCOUNTS: ${{ inputs.changed-accounts }}
      run: ${{ github.action_path }}/build-matrix.sh
