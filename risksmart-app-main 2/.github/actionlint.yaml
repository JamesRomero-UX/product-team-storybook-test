# Configuration for actionlint, a linter for GitHub Actions workflow files
# https://github.com/rhysd/actionlint

self-hosted-runner:
  labels:
    - Risksmart-large-runner

# Path-specific configurations
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # Ignore runner-label errors for self-hosted runners (sprinters labels)
      - 'label "sprinters.+" is unknown'
      # Ignore SC2129 style suggestion about grouping redirects, not a functional issue
      - 'SC2129'
