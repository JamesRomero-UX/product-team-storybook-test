      risksmart_region_id: "UAE-1"
      vpn_enabled: true
      external_api_image_tag: ${{ needs.ExtAPIBuildCheck.outputs.current_version }}
      external_api_config: ${{ needs.ExtAPIBuildCheck.outputs.ssm_config_value }}
      integrations_image_tag: ${{ needs.IntegrationsVersionCheck.outputs.current_version }}
      auth0_domain: ${{ needs.ResolveAuth0Config.outputs.auth0_domain_uae }}
      auth0_management_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_management_client_id_uae }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_risk_smart_rest_api_client_id_uae }}
      auth0_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_client_id_uae }}
    secrets: inherit

  RiskSmartCARegionDeployInfra:
    name: CDK / Deploy CA
    if: ${{ inputs.deploy_ca }}
