      aws_region: "us-east-1"
      multi_tenant_snapshot_prefix: "US-1-"
      risksmart_region: true
      risksmart_region_prefix: "us"
      risksmart_region_id: "US-1"
      vpn_enabled: true
      external_api_image_tag: ${{ needs.ExtAPIBuildCheck.outputs.current_version }}
      external_api_config: ${{ needs.ExtAPIBuildCheck.outputs.ssm_config_value }}
      integrations_image_tag: ${{ needs.IntegrationsVersionCheck.outputs.current_version }}
      auth0_domain: ${{ needs.ResolveAuth0Config.outputs.auth0_domain_us }}
      auth0_management_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_management_client_id_us }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_risk_smart_rest_api_client_id_us }}
      auth0_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_client_id_us }}
    secrets: inherit

  RiskSmartUAERegionDeployInfra:
