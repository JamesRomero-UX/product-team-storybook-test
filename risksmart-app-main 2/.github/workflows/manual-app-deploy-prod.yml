      - ExtAPIBuildCheck
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
      packages: read
    with:
      env: prod
      enable_turbo_cache: true
      aws_region: "ca-central-1"
      multi_tenant_snapshot_prefix: "CA-1-"
      risksmart_region: true
      risksmart_region_prefix: "ca"
      risksmart_region_id: "CA-1"
      vpn_enabled: true
      external_api_image_tag: ${{ needs.ExtAPIBuildCheck.outputs.current_version }}
      external_api_config: ${{ needs.ExtAPIBuildCheck.outputs.ssm_config_value }}
      integrations_image_tag: ${{ needs.IntegrationsVersionCheck.outputs.current_version }}
      auth0_domain: ${{ needs.ResolveAuth0Config.outputs.auth0_domain_ca }}
      auth0_management_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_management_client_id_ca }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_risk_smart_rest_api_client_id_ca }}
      auth0_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_client_id_ca }}
    secrets: inherit

