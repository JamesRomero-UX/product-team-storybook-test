name: Auto / Post-Merge Chromatic Baseline

permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - main
    paths:
      - 'packages/atomic-ui/**'
      - 'packages/web/src/blocks/**'

jobs:
  DetectChanges:
    name: Meta / Detect Changes
    runs-on:
      - sprinters:aws:ubuntu-24.04-minimal
      - ${{ github.run_id }}-${{ github.run_attempt }}-DetectChanges
    permissions:
      contents: read
    outputs:
      atomic_ui: ${{ steps.filter.outputs.atomic_ui }}
      web_blocks: ${{ steps.filter.outputs.web_blocks }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            atomic_ui:
              - 'packages/atomic-ui/**'
            web_blocks:
              - 'packages/web/src/blocks/**'

  ChromaticBaselineAtomic:
    name: Chromatic / Update Atomic UI Baseline
    needs: DetectChanges
    if: needs.DetectChanges.outputs.atomic_ui == 'true'
    runs-on:
      - sprinters:aws:ubuntu-24.04-minimal
      - ${{ github.run_id }}-${{ github.run_attempt }}-ChromaticBaselineAtomic
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.28.2

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Configure pnpm for GitHub Packages
        run: |
          pnpm config set @risk-smart:registry https://npm.pkg.github.com
          pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Generate CSS
        run: pnpm run tw:build
        working-directory: packages/atomic-ui

      - name: Publish to Chromatic
        uses: chromaui/action@5ec258af08deb3e8c36653bd618cb7fe52090031 # v15.2.0
        with:
          projectToken: ${{ secrets.CHROMATIC_ATOMIC_UI_TOKEN }}
          workingDir: packages/atomic-ui
          autoAcceptChanges: true
          onlyChanged: true


  ChromaticBaselineWeb:
    name: Chromatic / Update Web Baseline
    needs: DetectChanges
    if: needs.DetectChanges.outputs.web_blocks == 'true' || needs.DetectChanges.outputs.atomic_ui == 'true'
    runs-on:
      - sprinters:aws:ubuntu-24.04-minimal
      - ${{ github.run_id }}-${{ github.run_attempt }}-ChromaticBaselineWeb
    steps:
      - name: Setup Turbo cache
        uses: rharkor/caching-for-turbo@d124d2921c97c169010f6a7a624a36e9831472e1 # v 1.8

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.28.2

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Configure pnpm for GitHub Packages
        run: |
          pnpm config set @risk-smart:registry https://npm.pkg.github.com
          pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Publish to Chromatic
        uses: chromaui/action@5ec258af08deb3e8c36653bd618cb7fe52090031 # v15.2.0
        with:
          projectToken: ${{ secrets.CHROMATIC_WEB_TOKEN }}
          workingDir: packages/web
          autoAcceptChanges: true
          onlyChanged: true
        env:
          NODE_OPTIONS: --max-old-space-size=8192

