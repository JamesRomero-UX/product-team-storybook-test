name: Template / Tenant Config Deploy

permissions:
  actions: write
  contents: read
  id-token: write
  packages: read

on:
  workflow_call:
    inputs:
      runner_label:
        required: false
        type: string
        default: 'sprinters:aws:eu-west-2:ubuntu-24.04-arm:c6g.large:spot=false'
      env:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      table_name:
        required: true
        type: string
      deployment_regions:
        required: true
        type: string
        description: 'JSON array of deployment regions, e.g. ["eu-west-2","us-east-1"]'

jobs:
  DeployGlobalTenantConfig:
    name: Deploy Global Tenant Config
    runs-on:
      - ${{ inputs.runner_label }}
      - ${{ github.run_id }}-${{ github.run_attempt }}-DeployGlobalTenantConfig-${{ inputs.env }}-${{ inputs.aws_region }}
    environment: ${{ inputs.env }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.28.2

      - name: Configure pnpm for GitHub Packages
        run: |
          pnpm config set @risk-smart:registry https://npm.pkg.github.com
          pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          cd cdk-stack
          pnpm install

      - name: Set config version
        id: config
        run: echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ inputs.aws_region }}

      - name: Deploy Global Tenant Config to DynamoDB
        run: |
          cd cdk-stack
          pnpm run update-tenant-table
        env:
          ENV: ${{ inputs.env }}
          DYNAMODB_TABLE_NAME: ${{ inputs.table_name }}
          AWS_REGION: ${{ inputs.aws_region }}
          VERSION: ${{ steps.config.outputs.version }}
          DEPLOYMENT_REGIONS: ${{ inputs.deployment_regions }}

  MonitorTenantDeployment:
    name: Monitor Step Function Deployments (${{ matrix.region }})
    needs: DeployGlobalTenantConfig
    runs-on:
      - ${{ inputs.runner_label }}
      - ${{ github.run_id }}-${{ github.run_attempt }}-MonitorTenantDeployment-${{ strategy.job-index }}
    environment: ${{ inputs.env }}
    strategy:
      fail-fast: false
      matrix:
        region: ${{ fromJson(inputs.deployment_regions) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.2'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE }}
          aws-region: ${{ matrix.region }}

      - name: Install AWS CLI
        run: |
          pip install awscli
          aws --version

      - name: Monitor tenant deployer step function executions
        run: ./scripts/poll-step-function-executions.sh
        env:
          APP_NAME: ${{ matrix.region == 'eu-west-2' && 'risksmartApp' || 'app' }}
          STAGE: ${{ vars.STAGE }}
          AWS_REGION: ${{ matrix.region }}
