name: Manual / Auth0 Deploy

permissions:
  actions: write
  contents: read
  id-token: write
  packages: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev-cloud
          - staging
          - prod
      tenant:
        description: 'Target Auth0 tenant (or all for environment)'
        required: true
        type: choice
        default: all
        options:
          - all
          - UK-1
          - US-4
          - EU-2
          - CA-1

concurrency: auth0-${{ inputs.environment }}

jobs:
  # UK-1 Auth0 Tenant - Available in all environments
  Auth0-UK-1:
    name: Auth0 / UK-1
    if: ${{ inputs.tenant == 'all' || inputs.tenant == 'UK-1' }}
    uses: ./.github/workflows/_template-auth0-deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: 'sprinters:aws:eu-west-2:ubuntu-latest:m7i.4xlarge:spot=false:temp=14'
      env: ${{ inputs.environment }}
      domain_prefix: ''
      app_or_risksmart_app: 'risksmartapp'
      auth0_region_identifier: 'uk-1'
      # Environment-specific values selected via expression
      auth0_tenant_client_id: ${{ inputs.environment == 'prod' && 'cKzwk5hFEetYroYG8g1XkZbmNJPurIor' || inputs.environment == 'staging' && 'sHg6sxuNQu2X6e096xtMXlBju8Au8P71' || 'Drja98Y070tm47O1ASmblG7fR9rfK6Na' }}
      auth0_client_secret_name: 'UK_1_AUTH0_CLIENT_SECRET'
      auth0_tenant_name: ${{ inputs.environment == 'prod' && 'prod' || inputs.environment == 'staging' && 'staging-risksmart' || 'dev-cloud-t8t3iey3b54zkh7i' }}
      hasura_admin_secret_name: 'HASURA_ADMIN_SECRET'
      # MFA bypass tenant IDs (only for dev-cloud and staging)
      dev_tenant_id_secret_name: ${{ inputs.environment != 'prod' && 'UK_1_DEV_TENANT_ID' || '' }}
      dev_cloud_tenant_id_secret_name: ${{ inputs.environment != 'prod' && 'UK_1_DEV_CLOUD_TENANT_ID' || '' }}
      staging_tenant_id_secret_name: ${{ inputs.environment != 'prod' && 'UK_1_STAGING_TENANT_ID' || '' }}
    secrets: inherit

  # US-4 Auth0 Tenant - Available in staging and prod
  Auth0-US-4:
    name: Auth0 / US-4
    if: ${{ inputs.environment != 'dev-cloud' && (inputs.tenant == 'all' || inputs.tenant == 'US-4') }}
    uses: ./.github/workflows/_template-auth0-deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: 'sprinters:aws:us-east-1:ubuntu-latest:m7i.4xlarge:spot=false:temp=14'
      env: ${{ inputs.environment }}
      domain_prefix: 'us.'
      app_or_risksmart_app: 'app'
      auth0_region_identifier: ${{ inputs.environment == 'prod' && 'us-4' || 'us-4' }}
      auth0_tenant_client_id: ${{ inputs.environment == 'prod' && 'lRBBhaperwqfTOvKrXDPawbFVI8HMbLg' || 'eC4MDfcli2Lm5yzNBw6v8hSCSSmizNzl' }}
      auth0_client_secret_name: 'US_1_AUTH0_CLIENT_SECRET'
      auth0_tenant_name: ${{ inputs.environment == 'prod' && 'prod-dh7sj49hs63' || 'staging-dh7sj49hs63' }}
      hasura_admin_secret_name: 'HASURA_ADMIN_SECRET_US_1'
    secrets: inherit

  # EU-2 Auth0 Tenant (for UAE) - Available in prod only
  Auth0-EU-2:
    name: Auth0 / EU-2 (UAE)
    if: ${{ inputs.environment == 'prod' && (inputs.tenant == 'all' || inputs.tenant == 'EU-2') }}
    uses: ./.github/workflows/_template-auth0-deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: 'sprinters:aws:us-east-1:ubuntu-latest:m7i.4xlarge:spot=false:temp=14'
      env: prod
      domain_prefix: 'uae.'
      app_or_risksmart_app: 'app'
      auth0_region_identifier: 'eu-2'
      auth0_tenant_client_id: 'NZGkfg2g6nhv81JZNPn3BNjiNY2k7Kkn'
      auth0_client_secret_name: 'UAE_1_AUTH0_CLIENT_SECRET'
      auth0_tenant_name: 'prod-t8t3iey3b54zkh7i'
      hasura_admin_secret_name: 'HASURA_ADMIN_SECRET_UAE_1'
    secrets: inherit

  # CA-1 Auth0 Tenant - Available in prod only
  Auth0-CA-1:
    name: Auth0 / CA-1
    if: ${{ inputs.environment == 'prod' && (inputs.tenant == 'all' || inputs.tenant == 'CA-1') }}
    uses: ./.github/workflows/_template-auth0-deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: 'sprinters:aws:ca-central-1:ubuntu-latest:m7i.4xlarge:spot=false:temp=14'
      env: prod
      domain_prefix: 'ca.'
      app_or_risksmart_app: 'app'
      auth0_region_identifier: 'ca-1'
      auth0_tenant_client_id: '8VV7UHIzJmPk2LyNYNPilH4WV6TmdBTd'
      auth0_client_secret_name: 'CA_1_AUTH0_CLIENT_SECRET'
      auth0_tenant_name: 'prod-gtsdfasdf123'
      hasura_admin_secret_name: 'HASURA_ADMIN_SECRET_CA_1'
    secrets: inherit
