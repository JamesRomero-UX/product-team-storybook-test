# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Manual / App Deploy Staging

permissions:
  actions: write
  contents: read
  id-token: write
  packages: read

on:
  workflow_dispatch:
    inputs:
      deploy_uk:
        description: 'Deploy to UK (eu-west-2)'
        type: boolean
        default: true
      deploy_us:
        description: 'Deploy to US (us-east-1)'
        type: boolean
        default: true

concurrency: staging
jobs:
  ResolveAuth0Config:
    name: Resolve Auth0 Config
    runs-on: ubuntu-latest
    environment: staging
    outputs:
      auth0_domain_uk: ${{ steps.config.outputs.auth0_domain_uk }}
      auth0_management_client_id_uk: ${{ steps.config.outputs.auth0_management_client_id_uk }}
      auth0_client_id_uk: ${{ steps.config.outputs.auth0_client_id_uk }}
      auth0_risk_smart_rest_api_client_id_uk: ${{ steps.config.outputs.auth0_risk_smart_rest_api_client_id_uk }}
      auth0_domain_us: ${{ steps.config.outputs.auth0_domain_us }}
      auth0_management_client_id_us: ${{ steps.config.outputs.auth0_management_client_id_us }}
      auth0_client_id_us: ${{ steps.config.outputs.auth0_client_id_us }}
      auth0_risk_smart_rest_api_client_id_us: ${{ steps.config.outputs.auth0_risk_smart_rest_api_client_id_us }}
    steps:
      - name: Set Auth0 config from environment vars
        id: config
        run: |
          # UK
          echo "auth0_domain_uk=${{ vars.AUTH0_DOMAIN_UK }}" >> "$GITHUB_OUTPUT"
          echo "auth0_management_client_id_uk=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
          echo "auth0_client_id_uk=${{ vars.REACT_APP_AUTH0_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
          echo "auth0_risk_smart_rest_api_client_id_uk=${{ vars.AUTH0_RISK_SMART_REST_API_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
          # US
          echo "auth0_domain_us=${{ vars.AUTH0_DOMAIN_US }}" >> "$GITHUB_OUTPUT"
          echo "auth0_management_client_id_us=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID_US }}" >> "$GITHUB_OUTPUT"
          echo "auth0_client_id_us=${{ vars.REACT_APP_AUTH0_CLIENT_ID_US }}" >> "$GITHUB_OUTPUT"
          echo "auth0_risk_smart_rest_api_client_id_us=${{ vars.AUTH0_RISK_SMART_REST_API_CLIENT_ID_US }}" >> "$GITHUB_OUTPUT"

  IntegrationsVersionCheck:
    name: Integrations / Version Check
    uses: ./.github/workflows/_template-package-version-check.yml
    with:
      env: staging
      package_path: 'packages/integrations/package.json'
      package_name: 'Integrations'
      run_published_check: true
      not_published_fail: true
      ecr_repository: 'risksmart/integrations'
    secrets: inherit

  ExtAPIBuildCheck:
    name: External API / Version Check
    uses: ./.github/workflows/_template-package-version-check.yml
    with:
      env: staging
      package_path: "packages/external-api/package.json"
      package_name: "External API"
      run_published_check: true
      not_published_fail: true
      ssm_config_name: "/staging/ext-api/config"
      s3_bucket: 'ext-api-lambda-artifacts-eu-west-2'
      s3_key_prefix: 'pre-token/'
      s3_key_suffix: '.zip'
      ecr_repository: 'risksmart/external-api'
    secrets: inherit

  # ============================================================================
  # TOFU PACKAGE DEPLOYMENTS (External API & Permit.io)
  # ============================================================================

  tofu-ext-api-plan:
    name: External API / Tofu Plan
    needs: ExtAPIBuildCheck
    uses: ./.github/workflows/_template-tofu-plan-workspaces.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
    with:
      package_version: ${{ needs.ExtAPIBuildCheck.outputs.current_version }}
      runner_label: 'sprinters:aws:eu-west-2:ubuntu-latest:m7i-flex.large:spot=false:temp=15'
      env: staging
      aws_region: eu-west-2
      tf_actions_working_dir: 'packages/external-api/terraform/workspaces/ext-api-resources/'
      tf_vars_file: 'staging-eu-west-2.tfvars'
      uses_workspaces: true
      deploy_role: 'arn:aws:iam::629531182017:role/RiskSmart-GitHub-Deploy-Role'
      account: staging
    secrets: inherit

  tofu-ext-api-apply:
    name: External API / Tofu Apply
    needs:
      - ExtAPIBuildCheck
      - tofu-ext-api-plan
    uses: ./.github/workflows/_template-tofu-apply-workspaces.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
    with:
      package_version: ${{ needs.ExtAPIBuildCheck.outputs.current_version }}
      runner_label: 'sprinters:aws:eu-west-2:ubuntu-latest:m7i-flex.large:spot=false'
      env: staging
      aws_region: eu-west-2
      tf_actions_working_dir: 'packages/external-api/terraform/workspaces/ext-api-resources/'
      tf_vars_file: 'staging-eu-west-2.tfvars'
      uses_workspaces: true
      deploy_role: 'arn:aws:iam::629531182017:role/RiskSmart-GitHub-Deploy-Role'
      account: staging
    secrets: inherit

  tofu-permitio-plan:
    name: Permit.io / Tofu Plan
    uses: ./.github/workflows/_template-tofu-plan-workspaces.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
    with:
      runner_label: 'sprinters:aws:eu-west-1:ubuntu-latest:m7i-flex.large:spot=false:temp=15'
      env: staging
      aws_region: eu-west-1
      account: ci
      tf_actions_working_dir: 'packages/permitio'
      tf_vars_file: 'staging-eu-west-1.tfvars'
      uses_workspaces: true
      deploy_role: 'arn:aws:iam::437474201705:role/RiskSmart-GitHub-Deploy-Role'
    secrets: inherit

  tofu-permitio-apply:
    name: Permit.io / Tofu Apply
    needs: tofu-permitio-plan
    uses: ./.github/workflows/_template-tofu-apply-workspaces.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
    with:
      runner_label: 'sprinters:aws:eu-west-1:ubuntu-latest:m7i-flex.large:spot=false'
      env: staging
      aws_region: eu-west-1
      account: ci
      tf_actions_working_dir: 'packages/permitio'
      tf_vars_file: 'staging-eu-west-1.tfvars'
      uses_workspaces: true
      deploy_role: 'arn:aws:iam::437474201705:role/RiskSmart-GitHub-Deploy-Role'
    secrets: inherit

  ECRTagCommitSHA:
    name: ECR / Tag staging (commit SHA repos)
    uses: ./.github/workflows/_template-ecr-environment-tag.yml
    with:
      environment_tag: staging
      ecr_repos: 'risksmart/trpc-api risksmart/tenant-deployer risksmart/mcp'
      image_tag: commit-sha
    secrets: inherit

  RiskSmartLegacyUKDeployInfra:
    name: CDK / Deploy UK
    if: ${{ inputs.deploy_uk }}
    uses: ./.github/workflows/_template-cdk-deploy-region.yml
    needs:
      - ResolveAuth0Config
      - IntegrationsVersionCheck
      - ExtAPIBuildCheck
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
      packages: read
    with:
      env: staging
      enable_turbo_cache: true
      aws_region: "eu-west-2"
      multi_tenant_snapshot_prefix: ""
      vpn_enabled: true
      risksmart_region: false
      external_api_image_tag: ${{ needs.ExtAPIBuildCheck.outputs.current_version }}
      external_api_config: ${{ needs.ExtAPIBuildCheck.outputs.ssm_config_value }}
      integrations_image_tag: ${{ needs.IntegrationsVersionCheck.outputs.current_version }}
      auth0_domain: ${{ needs.ResolveAuth0Config.outputs.auth0_domain_uk }}
      auth0_management_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_management_client_id_uk }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_risk_smart_rest_api_client_id_uk }}
      auth0_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_client_id_uk }}
    secrets: inherit

  RiskSmartUSRegionDeployInfra:
    name: CDK / Deploy US
    if: ${{ inputs.deploy_us }}
    uses: ./.github/workflows/_template-cdk-deploy-region.yml
    needs:
      - ResolveAuth0Config
      - IntegrationsVersionCheck
      - ExtAPIBuildCheck
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
      packages: read
    with:
      env: staging
      enable_turbo_cache: true
      aws_region: "us-east-1"
      multi_tenant_snapshot_prefix: "US-1-"
      risksmart_region: true
      risksmart_region_prefix: "us"
      risksmart_region_id: "US-1"
      vpn_enabled: false
      external_api_image_tag: ${{ needs.ExtAPIBuildCheck.outputs.current_version }}
      external_api_config: ${{ needs.ExtAPIBuildCheck.outputs.ssm_config_value }}
      integrations_image_tag: ${{ needs.IntegrationsVersionCheck.outputs.current_version }}
      auth0_domain: ${{ needs.ResolveAuth0Config.outputs.auth0_domain_us }}
      auth0_management_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_management_client_id_us }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_risk_smart_rest_api_client_id_us }}
      auth0_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_client_id_us }}
    secrets: inherit

  DeployStagingGlobalTenantConfig:
    name: Tenant Config / Deploy Global Tenant Config
    if: ${{ inputs.deploy_uk || inputs.deploy_us }}
    uses: ./.github/workflows/_template-tenant-config-deploy.yml
    needs:
      - RiskSmartLegacyUKDeployInfra
      - RiskSmartUSRegionDeployInfra
    with:
      env: staging
      aws_region: 'eu-west-2'
      table_name: 'staging-risksmartApp-GlobalTenantConfig'
      deployment_regions: '["eu-west-2","us-east-1"]'
    secrets: inherit

  RestApiDeployLegacyUK:
    name: API / Deploy REST (UK Legacy)
    if: ${{ inputs.deploy_uk }}
    uses: ./.github/workflows/_template-sst-deploy.yml
    needs:
      - RiskSmartLegacyUKDeployInfra
      - DeployStagingGlobalTenantConfig
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: "sprinters:aws:eu-west-2:ubuntu-latest:m7i.8xlarge:spot=false:root=gp3/5000/1000:temp=64/gp3/max/750"
      env: staging
      region: "eu-west-2"
      domain_prefix: ""
      resource_prefix: ""
      is_risksmart_region: false
      app_or_risksmart_app: "risksmartapp"
      react_app_auth0_domain: staging-risksmart.uk.auth0.com
      auth0_domain_noncustom: staging-risksmart.uk.auth0.com
      auth0_third_party_connection_name: Username-Password-ThirdParty
      react_app_tpp_auth0_client_id: qmzm0UjTXVTnfL7S4nUppHjbvcfSTWl0
      auth0_risk_smart_rest_api_client_id: LTv2kh5E6kVH1gh1aGBCjny5MjKGMuJD
      react_app_auth0_client_id: NAG1yutSY5ZCR3uabEdwyskEjOxqWRGH
      bedrock_guardrail_identifier: loue9qieeqji
      bedrock_guardrail_version: 1
    secrets: inherit

  RestApiDeployUS-1:
    name: API / Deploy REST (US-1)
    if: ${{ inputs.deploy_us }}
    uses: ./.github/workflows/_template-sst-deploy.yml
    needs:

      - RiskSmartUSRegionDeployInfra

      - DeployStagingGlobalTenantConfig
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: "sprinters:aws:us-east-1:ubuntu-latest:m7i.8xlarge:spot=false:root=gp3/5000/1000:temp=64/gp3/max/750"
      env: staging
      region: us-east-1
      is_risksmart_region: true
      domain_prefix: "us."
      resource_prefix: "US-1-"
      app_or_risksmart_app: "app"
      react_app_auth0_domain: staging-dh7sj49hs63.us.auth0.com
      auth0_domain_noncustom: staging-dh7sj49hs63.us.auth0.com
      auth0_third_party_connection_name: Username-Password-ThirdParty
      react_app_tpp_auth0_client_id: UJCOjDAdirsySmWgmA2nUFDrGgXFV6gl
      auth0_risk_smart_rest_api_client_id: mRZhQBefv1GvRFX4D6fsHc9arsw3Ybao
      react_app_auth0_client_id: KNclker8jE7qEKHCZNSAqGDf24VgzeFh
      bedrock_guardrail_identifier: loue9qieeqji
      bedrock_guardrail_version: 1
    secrets: inherit

  HasuraMigration-TenantUKLegacy:
    name: Hasura / Migration (UK Legacy)
    if: ${{ inputs.deploy_uk }}
    uses: ./.github/workflows/_template-hasura-migrate.yml
    needs:

      - RiskSmartLegacyUKDeployInfra

      - RestApiDeployLegacyUK
    with:
      runner_label: "sprinters:aws:eu-west-2:ubuntu-latest:m7i-flex.large:spot=false"
      env: staging
      aws_region: "eu-west-2"
      domain_prefix: ""
      matrix: '{"tenantKey": ["MultiTenant", "OctoEnergy"]}'
      secret_name: "HASURA_ADMIN_SECRET"
      app_or_risksmart_app: "risksmartapp"
    secrets: inherit

    ##### UNCOMMENT THESE WHEN WE WANT TO ADD A TENANT TO THE REGION #####

  HasuraMigration-TenantUS-1:
    name: Hasura Migration Jobs
    if: ${{ inputs.deploy_us }}
    uses: ./.github/workflows/_template-hasura-migrate.yml
    needs:
      - RiskSmartUSRegionDeployInfra
    with:
      runner_label: 'sprinters:aws:us-east-1:ubuntu-latest:m7i-flex.large:spot=false'
      env: staging
      aws_region: 'us-east-1'
      domain_prefix: 'us.'
      matrix: '{"tenantKey": ["TestTenantUS"]}'
      secret_name: 'HASURA_ADMIN_SECRET_US_1'
      app_or_risksmart_app: 'app'
    secrets: inherit

  WebBuildAndDeployLegacyUK:
    name: Web / Deploy (UK Legacy)
    if: ${{ inputs.deploy_uk }}
    uses: ./.github/workflows/_template-web-build-deploy.yml
    needs:
      - HasuraMigration-TenantUKLegacy
      - RestApiDeployLegacyUK
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
      packages: read
    with:
      env: staging
      aws_region: "eu-west-2"
      domain_prefix: ""
      resource_prefix: ""
      app_cloudfront_id: "E1YAD8RXMMH5M0" # Legacy UK Cloudfront ID
      app_or_risksmart_app: "risksmartapp"
      react_app_auth0_domain: staging-risksmart.uk.auth0.com
      react_app_auth0_client_id: NAG1yutSY5ZCR3uabEdwyskEjOxqWRGH
    secrets: inherit

  WebBuildAndDeployUS-1:
    name: Web / Deploy (US-1)
    if: ${{ inputs.deploy_us }}
    uses: ./.github/workflows/_template-web-build-deploy.yml
    needs:
      - HasuraMigration-TenantUS-1
      - RestApiDeployUS-1
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
      packages: read
    with:
      env: staging
      aws_region: 'us-east-1'
      domain_prefix: 'us.'
      resource_prefix: 'us-1-'
      app_cloudfront_id: 'ELNDUTJOAWYU'  # US-1 Cloudfront ID
      app_or_risksmart_app: 'app'
      react_app_auth0_domain: staging-dh7sj49hs63.us.auth0.com
      react_app_auth0_client_id: KNclker8jE7qEKHCZNSAqGDf24VgzeFh
    secrets: inherit

  ThirdPartyPortalLegacyUK:
    name: Web / Deploy Third-Party Portal (UK Legacy)
    if: ${{ inputs.deploy_uk }}
    uses: ./.github/workflows/_template-tpp-build-deploy.yml
    needs:
      - RiskSmartLegacyUKDeployInfra
      - HasuraMigration-TenantUKLegacy
      - RestApiDeployLegacyUK
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      env: staging
      aws_region: "eu-west-2"
      domain_prefix: ""
      resource_prefix: ""
      app_cloudfront_id: "E1YAD8RXMMH5M0" # Legacy UK Cloudfront ID
      app_or_risksmart_app: "risksmartapp"
      react_app_auth0_domain: staging-risksmart.uk.auth0.com # Uses Non-custom domain for TPP
      auth0_third_party_connection_name: Username-Password-ThirdParty
      react_app_tpp_auth0_client_id: qmzm0UjTXVTnfL7S4nUppHjbvcfSTWl0
    secrets: inherit

  ThirdPartyPortalUS-1:
    name: Web / Deploy Third-Party Portal (US-1)
    if: ${{ inputs.deploy_us }}
    uses: ./.github/workflows/_template-tpp-build-deploy.yml
    needs:
      - RiskSmartUSRegionDeployInfra
      - HasuraMigration-TenantUS-1
      - RestApiDeployUS-1
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      env: staging
      aws_region: 'us-east-1'
      domain_prefix: 'us.'
      resource_prefix: 'us-1-'
      app_cloudfront_id: 'ELNDUTJOAWYU'  # US-1 Cloudfront ID
      app_or_risksmart_app: 'app'
      react_app_auth0_domain: staging-dh7sj49hs63.us.auth0.com # Uses Non-custom domain for TPP
      auth0_third_party_connection_name: Username-Password-ThirdParty
      react_app_tpp_auth0_client_id: UJCOjDAdirsySmWgmA2nUFDrGgXFV6gl # Different to UK
    secrets: inherit

  Auth0ConfigDeployUK-1:
    name: Auth0 / Deploy (UK-1)
    if: ${{ inputs.deploy_uk }}
    uses: ./.github/workflows/_template-auth0-deploy.yml
    needs:
      - RestApiDeployLegacyUK
      - HasuraMigration-TenantUKLegacy
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      env: staging
      domain_prefix: ""
      app_or_risksmart_app: "risksmartapp"
      auth0_region_identifier: "uk-1"
      auth0_tenant_client_id: "sHg6sxuNQu2X6e096xtMXlBju8Au8P71"
      auth0_client_secret_name: "UK_1_AUTH0_CLIENT_SECRET"
      hasura_admin_secret_name: "HASURA_ADMIN_SECRET"
      auth0_tenant_name: "staging-risksmart"
      dev_tenant_id_secret_name: "UK_1_DEV_TENANT_ID"
      dev_cloud_tenant_id_secret_name: "UK_1_DEV_CLOUD_TENANT_ID"
      staging_tenant_id_secret_name: "UK_1_STAGING_TENANT_ID"
    secrets: inherit

  Auth0ConfigDeployUS-4:
    name: Auth0 / Deploy (US-4)
    if: ${{ inputs.deploy_us }}
    uses: ./.github/workflows/_template-auth0-deploy.yml
    needs:
      - RestApiDeployUS-1
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: "sprinters:aws:us-east-1:ubuntu-latest:m7i.4xlarge:spot=false:root=gp3/5000/1000:temp=14/gp3/max/750"
      env: staging
      domain_prefix: "us."
      app_or_risksmart_app: "app"
      auth0_region_identifier: "us-4"
      auth0_tenant_client_id: "eC4MDfcli2Lm5yzNBw6v8hSCSSmizNzl"
      auth0_client_secret_name: "US_1_AUTH0_CLIENT_SECRET"
      auth0_tenant_name: "staging-dh7sj49hs63"
      hasura_admin_secret_name: "HASURA_ADMIN_SECRET_US_1"
    secrets: inherit

  ######## ZAPIER APP VALIDATE ########

  ZapierAppValidate:
    name: Zapier App / Validate (Staging)
    runs-on:
      - sprinters:aws:ubuntu-24.04-minimal
    environment:
      name: staging
    timeout-minutes: 15
    steps:
      - name: Setup Turbo cache
        uses: rharkor/caching-for-turbo@d124d2921c97c169010f6a7a624a36e9831472e1 # v 1.8

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.28.2

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Configure pnpm for GitHub Packages
        run: |
          pnpm config set @risk-smart:registry https://npm.pkg.github.com
          pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Build Zapier app
        # Use pnpm directly instead of turbo to avoid triggering external-api's
        # generate-graphql task, which requires a running Hasura instance.
        # The zapier-app's only workspace dependency (external-api) is type-only
        # and fully erased at compile time.
        run: pnpm --filter @risksmart-app/zapier-app run build

      - name: Run integration tests (Layer 1 - in-process)
        env:
          ZAPIER_INTEGRATION_CLIENT_KEY: ${{ vars.ZAPIER_INTEGRATION_CLIENT_KEY }}
          ZAPIER_INTEGRATION_CLIENT_SECRET: ${{ secrets.ZAPIER_INTEGRATION_CLIENT_SECRET }}
          ZAPIER_INTEGRATION_API_BASE_URL: ${{ vars.ZAPIER_INTEGRATION_API_BASE_URL }}
          ZAPIER_INTEGRATION_OWNER_ID: ${{ vars.ZAPIER_INTEGRATION_OWNER_ID }}
        run: pnpm exec turbo test:integration --filter=@risksmart-app/zapier-app

      - name: Run remote invoke tests (Layer 2 - Zapier infrastructure)
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
          ZAPIER_INVOKE_AUTH_ID: ${{ secrets.ZAPIER_INVOKE_AUTH_ID }}
        run: |
          cd packages/zapier-app
          pnpm run test:invoke-remote
