name: Manual / Web Deploy Prod (Web Only)

on:
  workflow_dispatch:
    inputs:
      deploy_uk:
        description: 'Deploy to UK (eu-west-2)'
        type: boolean
        default: true
      deploy_us:
        description: 'Deploy to US (us-east-1)'
        type: boolean
        default: true
      deploy_uae:
        description: 'Deploy to UAE (me-central-1)'
        type: boolean
        default: true
      deploy_ca:
        description: 'Deploy to CA (ca-central-1)'
        type: boolean
        default: true

permissions:
  actions: write
  contents: read
  id-token: write
  packages: read

concurrency: prod

jobs:
  WebBuildAndDeployLegacyUK:
    name: Web / Deploy (UK Legacy)
    if: ${{ inputs.deploy_uk }}
    uses: ./.github/workflows/_template-web-build-deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
      packages: read
    with:
      env: prod
      aws_region: "eu-west-2"
      domain_prefix: ""
      resource_prefix: ""
      app_cloudfront_id: "EKPL2TP9AY074" # Legacy UK Cloudfront ID
      app_or_risksmart_app: "risksmartapp"
      react_app_auth0_domain: prod.uk.auth0.com
      react_app_auth0_client_id: nuRz1vX2MFA85DUlwYxbcgrQgjs28jYX
    secrets: inherit

  WebBuildAndDeployUS-1:
    name: Web / Deploy (US-1)
    if: ${{ inputs.deploy_us }}
    uses: ./.github/workflows/_template-web-build-deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
      packages: read
    with:
      env: prod
      aws_region: "us-east-1"
      domain_prefix: "us."
      resource_prefix: "us-1-"
      app_cloudfront_id: "EY8P1Q7MX093E" # US-1 Cloudfront ID
      app_or_risksmart_app: "app"
      react_app_auth0_domain: prod-dh7sj49hs63.us.auth0.com
      react_app_auth0_client_id: AxRKeRUzDVgrXV4l1ENPXKwM2C1rqByc
    secrets: inherit

  WebBuildAndDeployUAE-1:
    name: Web / Deploy (UAE-1)
    if: ${{ inputs.deploy_uae }}
    uses: ./.github/workflows/_template-web-build-deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
      packages: read
    with:
      env: prod
      aws_region: "me-central-1"
      domain_prefix: "uae."
      resource_prefix: "uae-1-"
      app_cloudfront_id: "E1AVLYC3V70R82" # UAE-1 Cloudfront ID
      app_or_risksmart_app: "app"
      react_app_auth0_domain: prod-t8t3iey3b54zkh7i.eu.auth0.com # EU Auth0 for UAE
      react_app_auth0_client_id: 0ETPcd3KarzgZM9MK3sOuTMFiAGM8RRB
    secrets: inherit

  WebBuildAndDeployCA-1:
    name: Web / Deploy (CA-1)
    if: ${{ inputs.deploy_ca }}
    uses: ./.github/workflows/_template-web-build-deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
      packages: read
    with:
      env: prod
      aws_region: "ca-central-1"
      domain_prefix: "ca."
      resource_prefix: "ca-1-"
      app_cloudfront_id: "E18WF9DBF907IF" # CA-1 Cloudfront ID
      app_or_risksmart_app: "app"
      react_app_auth0_domain: prod-gtsdfasdf123.ca.auth0.com
      react_app_auth0_client_id: m8xd1SVSwrQz7383BCtIZTagBRJt27ky
    secrets: inherit

  ThirdPartyPortalLegacyUK:
    name: Web / Deploy Third-Party Portal (UK Legacy)
    if: ${{ inputs.deploy_uk }}
    uses: ./.github/workflows/_template-tpp-build-deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      env: prod
      aws_region: "eu-west-2"
      domain_prefix: ""
      resource_prefix: ""
      app_cloudfront_id: "EKPL2TP9AY074" # Legacy UK Cloudfront ID
      app_or_risksmart_app: "risksmartapp"
      react_app_auth0_domain: prod.uk.auth0.com
      auth0_third_party_connection_name: Username-Password-ThirdParty
      react_app_tpp_auth0_client_id: bQmwCwCoDHb8B6e61sxrjXDUESYRpU4B
    secrets: inherit
