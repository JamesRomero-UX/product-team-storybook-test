name: Template / Tofu Plan Workspaces

permissions:
  pull-requests: write
  contents: read
  id-token: write
  actions: read

on:
  workflow_call:
    inputs:
      aws_region:
        description: 'AWS region to deploy to'
        required: true
        type: string
      env:
        description: 'Environment to deploy to - allowed values: tech-admin, dev-cloud, staging, prod'
        required: true
        type: string
      account: # TODO: remove or implement usage
        description: 'AWS account to deploy to'
        required: true
        type: string
      deploy_role:
        description: 'AWS role to assume for tofu deployment'
        required: true
        type: string
      tf_actions_working_dir:
        description: 'Terraform working directory'
        type: string
        required: true
      tf_vars_file:
        description: 'Path to the Terraform variables file'
        type: string
        default: './envs/${{ inputs.env }}-${{ inputs.aws_region }}.tfvars'
      uses_workspaces:
        description: 'Is this an SDLC account - dev, staging prod? If yes, use workspaces.'
        required: true
        type: boolean
      runner_label:
        description: 'Runner label to use for the job'
        required: false
        type: string
      package_version:
        description: "Current build package version"
        type: string
        required: false

jobs:
  tofu-plan:
    runs-on:
      - ${{ inputs.runner_label }}
      - ${{ github.run_id }}-${{ github.run_attempt }}-tofu-plan-${{ inputs.env }}-${{ inputs.aws_region }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.tf_actions_working_dir }}
    steps:
      - name: Cancel if not using workspaces
        if: ${{ !inputs.uses_workspaces }}
        run: echo "This workflow is only for accounts that use workspaces. Please use the non-workspace version." && exit 1

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1.0.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ inputs.deploy_role }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup Tofu modules access
        uses: risk-smart/risksmart-terraform-modules/.github/actions/setup-module-access@e37b23efb86493475a812d1a527a70ff4fbd8c2b
        with:
          app-id: ${{ secrets.TOFU_MODULES_APP_ID }}
          private-key: ${{ secrets.TOFU_MODULES_APP_PRIVATE_KEY }}

      - name: Tofu fmt
        id: fmt
        run: tofu fmt -check
        continue-on-error: true

      - name: Tofu Init
        id: init
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          if [ -n "${PACKAGE_VERSION}" ]; then
            tofu init -backend-config=envs/backend.tfbackend -var-file=envs/${{ inputs.tf_vars_file }} -var "package_version=${PACKAGE_VERSION}" -input=false
          else
            tofu init -backend-config=envs/backend.tfbackend -var-file=envs/${{ inputs.tf_vars_file }} -input=false
          fi

      - name: Select Tofu workspace
        if: ${{ inputs.uses_workspaces }}
        run: |
          tofu workspace select -or-create=true ${{ inputs.env }}-${{ inputs.aws_region }}

      - name: Tofu Validate
        id: validate
        run: tofu validate -no-color

      - name: Tofu Plan
        id: plan
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          if [ -n "${PACKAGE_VERSION}" ]; then
            tofu plan -detailed-exitcode -consolidate-errors -out=plan.tmp -no-color -input=false -var-file=envs/${{ inputs.env }}-${{ inputs.aws_region }}.tfvars -var "package_version=${PACKAGE_VERSION}"
          else
            tofu plan -detailed-exitcode -consolidate-errors -out=plan.tmp -no-color -input=false -var-file=envs/${{ inputs.env }}-${{ inputs.aws_region }}.tfvars
          fi
          tofu show -no-color plan.tmp | tee "${GITHUB_WORKSPACE}/plan.out"
        continue-on-error: true

      - name: Post plan to PR
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        if: github.event_name == 'pull_request'
        env:
          VALIDATE: ${{ steps.validate.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs')
            const run_url = process.env.GITHUB_SERVER_URL + '/' + process.env.GITHUB_REPOSITORY + '/actions/runs/' + process.env.GITHUB_RUN_ID
            const run_link = '<a href="' + run_url + '">Actions</a>.'
            const plan_file = fs.readFileSync('plan.out', 'utf8')
            const plan = plan_file.length > 65000 ? plan_file.toString().substring(plan_file.length - 65000, 65000) + " ..." : plan_file
            const truncated_message = plan_file.length > 65000 ? "Output is too long and was truncated. You can read full Plan in " + run_link + "<br /><br />" : ""
            // 1. Retrieve existing bot comments for the PR
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            })
            const botComment = comments.find(comment => {
              return comment.user.type === 'Bot' && comment.body.includes('Terraform Format and Style')
            })

            const validate = process.env.VALIDATE || ''
            // 2. Prepare format of the comment
            const output = `#### Terraform Format and Style \`${{ steps.fmt.outcome }}\`
            #### Terraform Initialization \`${{ steps.init.outcome }}\`
            #### Terraform Validation \`${{ steps.validate.outcome }}\`
            <details><summary>Validation Output</summary>

            \`\`\`\n
            ${validate}
            \`\`\`

            </details>

            #### Terraform Plan \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`\n
            ${plan}
            \`\`\`

            </details>
            ${truncated_message}

            *Pusher: @${{ github.actor }}, Action: \`${{ github.event_name }}\`, Working Directory: \`${{ inputs.tf_actions_working_dir }}\`, Workflow: \`${{ github.workflow }}\`*`;

            // 3. If we have a comment, update it, otherwise create a new one
            if (botComment) {
              github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: output
              })
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: output
              })
            }
