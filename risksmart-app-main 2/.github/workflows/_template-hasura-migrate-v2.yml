name: Template / Hasura Migrate v2

permissions:
  actions: write
  contents: read
  id-token: write
  packages: read

on:
  workflow_call:
    inputs:
      runner_label:
        required: false
        type: string
        default: "sprinters:aws:eu-west-2:ubuntu-latest:c5.xlarge:root=gp3/5000/750:temp=8/gp3/max/350"
      env:
        required: true
        type: string
      domain_prefix:
        required: true
        type: string
      tenant_keys:
        required: true
        type: string
        description: "Comma-separated tenant keys (e.g. 'MultiTenant,OctoEnergy')"
      secret_name:
        required: true
        type: string
      app_or_risksmart_app:
        required: false
        type: string
        default: ""
      max_parallel:
        required: false
        type: number
        default: 5
        description: "Maximum number of tenants to migrate in parallel (default 5)"

jobs:
  HasuraMigrate:
    name: Hasura Migration (all tenants)
    runs-on:
      - ${{ inputs.runner_label }}
      - ${{ github.run_id }}-${{ github.run_attempt }}-HasuraMigrate
    environment:
      name: ${{ inputs.env }}
    steps:
      - name: Setup Turbo cache
        uses: rharkor/caching-for-turbo@d124d2921c97c169010f6a7a624a36e9831472e1 # v 1.8

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.28.2

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Configure pnpm for GitHub Packages
        run: |
          pnpm config set @risk-smart:registry https://npm.pkg.github.com
          pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Run Hasura migrations
        run: node scripts/hasura-migrate-tenants.mjs
        env:
          TENANT_KEYS: ${{ inputs.tenant_keys }}
          HASURA_ENDPOINT_PATTERN: https://${{ inputs.domain_prefix }}${{ vars.STAGE }}-${{ inputs.app_or_risksmart_app }}-api-tenant.${{ vars.AWS_ACCOUNT_ID }}.risksmart.link/{tenantKey}/
          HASURA_ADMIN_SECRET: ${{ secrets[inputs.secret_name] }}
          HASURA_WORKDIR: api-stack/hasura
          MAX_PARALLEL: ${{ inputs.max_parallel }}
