# Usage:
# - Dev-cloud: Automatic deployment on PR (plan) and main merge (apply), or manual via workflow_dispatch
# - Lambda artifact: Automatically built and uploaded to S3 on main merge for all environments
# - Staging/Prod Tofu: Runs as part of manual-app-deploy-staging.yml and manual-app-deploy-prod.yml

name: Auto / Tofu Package External API

on:
  # Dev-cloud: automatic on PR and main merge
  pull_request:
    paths:
      - 'packages/external-api/terraform/**'
      - '.github/workflows/auto-tofu-package-extapi.yml'
      - 'packages/external-api/package.json'
  push:
    branches:
      - main

  # Manual workflow_dispatch for dev-cloud only
  workflow_dispatch:

jobs:
  # ============================================================================
  # VERSION CHECK (Required for all environments)
  # ============================================================================

  ext-api-version-check:
    name: Check External API Version
    uses: ./.github/workflows/_template-package-version-check.yml
    permissions:
      contents: read
      packages: read
      id-token: write
    with:
      package_path: 'packages/external-api/package.json'
      package_name: 'External API'
      run_published_check: true
      s3_bucket: 'ext-api-lambda-artifacts-eu-west-2'
      s3_key_prefix: 'pre-token/'
      s3_key_suffix: '.zip'
    secrets: inherit

  # ============================================================================
  # DEV-CLOUD JOBS (Automatic Triggers Only)
  # ============================================================================

  ext-api-lambda-build:
    name: Build External API Lambda
    needs: ext-api-version-check
    uses: ./.github/workflows/_template-lambda-build-publish.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      build_dockerfile: 'packages/external-api/lambda-build/Dockerfile'
      entry: 'packages/external-api/src/lambdas/cognito-pre-token/index.ts'
      targets: '[{"region":"eu-west-2","bucket":"ext-api-lambda-artifacts-eu-west-2","prefix":"pre-token"},{"region":"us-east-1","bucket":"ext-api-lambda-artifacts-us-east-1","prefix":"pre-token"},{"region":"me-central-1","bucket":"ext-api-lambda-artifacts-me-central-1","prefix":"pre-token"},{"region":"ca-central-1","bucket":"ext-api-lambda-artifacts-ca-central-1","prefix":"pre-token"}]'
      package_version: ${{ needs.ext-api-version-check.outputs.current_version }}
      version_changed: ${{ fromJSON(needs.ext-api-version-check.outputs.build_required) }}
      upload_to_s3: ${{ github.event_name != 'pull_request' && true || false }}

  tofu-plan-dev-cloud:
    name: External API - Dev Cloud - Plan
    needs:
      - ext-api-version-check
      - ext-api-lambda-build
    uses: ./.github/workflows/_template-tofu-plan-workspaces.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
    with:
      package_version: ${{ needs.ext-api-version-check.outputs.current_version }}
      runner_label: 'sprinters:aws:eu-west-2:ubuntu-latest:m7i-flex.large:spot=false'
      env: dev-cloud
      aws_region: eu-west-2
      tf_actions_working_dir: 'packages/external-api/terraform/workspaces/ext-api-resources/'
      tf_vars_file: 'dev-cloud-eu-west-2.tfvars'
      uses_workspaces: true
      deploy_role: 'arn:aws:iam::640196420962:role/RiskSmart-GitHub-Deploy-Role'
      account: dev-cloud
    secrets: inherit

  tofu-apply-dev-cloud:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    name: External API - Dev Cloud - Apply
    needs:
      - ext-api-version-check
      - ext-api-lambda-build
      - tofu-plan-dev-cloud
    uses: ./.github/workflows/_template-tofu-apply-workspaces.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
    with:
      package_version: ${{ needs.ext-api-version-check.outputs.current_version }}
      runner_label: 'sprinters:aws:eu-west-2:ubuntu-latest:m7i-flex.large:spot=false'
      env: dev-cloud
      aws_region: eu-west-2
      tf_actions_working_dir: 'packages/external-api/terraform/workspaces/ext-api-resources/'
      tf_vars_file: 'dev-cloud-eu-west-2.tfvars'
      uses_workspaces: true
      deploy_role: 'arn:aws:iam::640196420962:role/RiskSmart-GitHub-Deploy-Role'
      account: dev-cloud
    secrets: inherit
