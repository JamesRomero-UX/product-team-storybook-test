name: Manual / SST Diff or Deploy

permissions:
  actions: write
  contents: read
  id-token: write
  packages: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev-cloud
          - staging
          - prod
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - diff
          - deploy
      deploy_uk:
        description: 'Deploy to UK (eu-west-2) - all environments'
        type: boolean
        default: true
      deploy_us:
        description: 'Deploy to US (us-east-1) - staging/prod only'
        type: boolean
        default: true
      deploy_uae:
        description: 'Deploy to UAE (me-central-1) - prod only'
        type: boolean
        default: true
      deploy_ca:
        description: 'Deploy to CA (ca-central-1) - prod only'
        type: boolean
        default: true

concurrency: sst-${{ inputs.environment }}

jobs:
  # Set environment-specific Auth0 config
  SetConfig:
    name: Set Config
    runs-on: ubuntu-latest
    outputs:
      # Auth0 config per environment
      auth0_domain_uk: ${{ steps.config.outputs.auth0_domain_uk }}
      auth0_client_id_uk: ${{ steps.config.outputs.auth0_client_id_uk }}
      react_app_auth0_client_id_uk: ${{ steps.config.outputs.react_app_auth0_client_id_uk }}
      auth0_risk_smart_rest_api_client_id_uk: ${{ steps.config.outputs.auth0_risk_smart_rest_api_client_id_uk }}
      auth0_domain_us: ${{ steps.config.outputs.auth0_domain_us }}
      auth0_client_id_us: ${{ steps.config.outputs.auth0_client_id_us }}
      react_app_auth0_client_id_us: ${{ steps.config.outputs.react_app_auth0_client_id_us }}
      auth0_risk_smart_rest_api_client_id_us: ${{ steps.config.outputs.auth0_risk_smart_rest_api_client_id_us }}
      auth0_domain_uae: ${{ steps.config.outputs.auth0_domain_uae }}
      auth0_client_id_uae: ${{ steps.config.outputs.auth0_client_id_uae }}
      react_app_auth0_client_id_uae: ${{ steps.config.outputs.react_app_auth0_client_id_uae }}
      auth0_risk_smart_rest_api_client_id_uae: ${{ steps.config.outputs.auth0_risk_smart_rest_api_client_id_uae }}
      auth0_domain_ca: ${{ steps.config.outputs.auth0_domain_ca }}
      auth0_client_id_ca: ${{ steps.config.outputs.auth0_client_id_ca }}
      react_app_auth0_client_id_ca: ${{ steps.config.outputs.react_app_auth0_client_id_ca }}
      auth0_risk_smart_rest_api_client_id_ca: ${{ steps.config.outputs.auth0_risk_smart_rest_api_client_id_ca }}
      bedrock_guardrail_id: ${{ steps.config.outputs.bedrock_guardrail_id }}
    steps:
      - name: Set environment config
        id: config
        run: |
          ENV="${{ inputs.environment }}"

          if [ "$ENV" == "dev-cloud" ]; then
            echo "auth0_domain_uk=dev-cloud-t8t3iey3b54zkh7i.uk.auth0.com" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_uk=bzwh0DgvQuUzsPnL3ekSnIINN2SmYO6u" >> "$GITHUB_OUTPUT"
            echo "react_app_auth0_client_id_uk=cdUObIWyim5cw8tsj0bu43hDbZnvXe1g" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_uk=7ginl2ojPQlDh8K2ENgbC0dSjfgbKf4A" >> "$GITHUB_OUTPUT"
            # US, UAE, CA not active in dev-cloud, but set placeholders
            echo "auth0_domain_us=dev-cloud-t8t3iey3b54zkh7i.uk.auth0.com" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_us=bzwh0DgvQuUzsPnL3ekSnIINN2SmYO6u" >> "$GITHUB_OUTPUT"
            echo "react_app_auth0_client_id_us=cdUObIWyim5cw8tsj0bu43hDbZnvXe1g" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_us=7ginl2ojPQlDh8K2ENgbC0dSjfgbKf4A" >> "$GITHUB_OUTPUT"
            echo "auth0_domain_uae=dev-cloud-t8t3iey3b54zkh7i.uk.auth0.com" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_uae=bzwh0DgvQuUzsPnL3ekSnIINN2SmYO6u" >> "$GITHUB_OUTPUT"
            echo "react_app_auth0_client_id_uae=cdUObIWyim5cw8tsj0bu43hDbZnvXe1g" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_uae=7ginl2ojPQlDh8K2ENgbC0dSjfgbKf4A" >> "$GITHUB_OUTPUT"
            echo "auth0_domain_ca=dev-cloud-t8t3iey3b54zkh7i.uk.auth0.com" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_ca=bzwh0DgvQuUzsPnL3ekSnIINN2SmYO6u" >> "$GITHUB_OUTPUT"
            echo "react_app_auth0_client_id_ca=cdUObIWyim5cw8tsj0bu43hDbZnvXe1g" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_ca=7ginl2ojPQlDh8K2ENgbC0dSjfgbKf4A" >> "$GITHUB_OUTPUT"
            echo "bedrock_guardrail_id=gas5ausp88ip" >> "$GITHUB_OUTPUT"
          elif [ "$ENV" == "staging" ]; then
            echo "auth0_domain_uk=staging-risksmart.uk.auth0.com" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_uk=qmzm0UjTXVTnfL7S4nUppHjbvcfSTWl0" >> "$GITHUB_OUTPUT"
            echo "react_app_auth0_client_id_uk=NAG1yutSY5ZCR3uabEdwyskEjOxqWRGH" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_uk=LTv2kh5E6kVH1gh1aGBCjny5MjKGMuJD" >> "$GITHUB_OUTPUT"
            echo "auth0_domain_us=staging-dh7sj49hs63.us.auth0.com" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_us=UJCOjDAdirsySmWgmA2nUFDrGgXFV6gl" >> "$GITHUB_OUTPUT"
            echo "react_app_auth0_client_id_us=KNclker8jE7qEKHCZNSAqGDf24VgzeFh" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_us=mRZhQBefv1GvRFX4D6fsHc9arsw3Ybao" >> "$GITHUB_OUTPUT"
            # UAE and CA not active in staging, but set placeholders
            echo "auth0_domain_uae=staging-risksmart.uk.auth0.com" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_uae=qmzm0UjTXVTnfL7S4nUppHjbvcfSTWl0" >> "$GITHUB_OUTPUT"
            echo "react_app_auth0_client_id_uae=KNclker8jE7qEKHCZNSAqGDf24VgzeFh" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_uae=mRZhQBefv1GvRFX4D6fsHc9arsw3Ybao" >> "$GITHUB_OUTPUT"
            echo "auth0_domain_ca=staging-risksmart.uk.auth0.com" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_ca=qmzm0UjTXVTnfL7S4nUppHjbvcfSTWl0" >> "$GITHUB_OUTPUT"
            echo "react_app_auth0_client_id_ca=KNclker8jE7qEKHCZNSAqGDf24VgzeFh" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_ca=mRZhQBefv1GvRFX4D6fsHc9arsw3Ybao" >> "$GITHUB_OUTPUT"
            echo "bedrock_guardrail_id=loue9qieeqji" >> "$GITHUB_OUTPUT"
          else
            echo "auth0_domain_uk=prod.uk.auth0.com" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_uk=bQmwCwCoDHb8B6e61sxrjXDUESYRpU4B" >> "$GITHUB_OUTPUT"
            echo "react_app_auth0_client_id_uk=nuRz1vX2MFA85DUlwYxbcgrQgjs28jYX" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_uk=qYriHL3Bh5LQDs3oQLj0Pfy1zH5qjoqY" >> "$GITHUB_OUTPUT"
            echo "auth0_domain_us=prod-dh7sj49hs63.us.auth0.com" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_us=lRBBhaperwqfTOvKrXDPawbFVI8HMbLg" >> "$GITHUB_OUTPUT"
            echo "react_app_auth0_client_id_us=nuRz1vX2MFA85DUlwYxbcgrQgjs28jYX" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_us=Ky6p24dBbguqlzO8hohYj4oHzRgySIwA" >> "$GITHUB_OUTPUT"
            echo "auth0_domain_uae=prod-t8t3iey3b54zkh7i.eu.auth0.com" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_uae=NZGkfg2g6nhv81JZNPn3BNjiNY2k7Kkn" >> "$GITHUB_OUTPUT"
            echo "react_app_auth0_client_id_uae=NZGkfg2g6nhv81JZNPn3BNjiNY2k7Kkn" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_uae=okE1JkgUkyKIiLFtcbkkfQ1VSx0qnyHz" >> "$GITHUB_OUTPUT"
            echo "auth0_domain_ca=prod-gtsdfasdf123.ca.auth0.com" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_ca=8VV7UHIzJmPk2LyNYNPilH4WV6TmdBTd" >> "$GITHUB_OUTPUT"
            echo "react_app_auth0_client_id_ca=8VV7UHIzJmPk2LyNYNPilH4WV6TmdBTd" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_ca=DB0rFtROOp2ya9dYrAH7bNSHDAWa46PM" >> "$GITHUB_OUTPUT"
            echo "bedrock_guardrail_id=2qsfb3gaccyb" >> "$GITHUB_OUTPUT"
          fi

  # UK Region (eu-west-2) - Available in staging and prod
  SST-UK:
    name: SST / UK (eu-west-2)
    if: ${{ inputs.deploy_uk }}
    needs: SetConfig
    uses: ./.github/workflows/_template-sst-deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: "sprinters:aws:eu-west-2:ubuntu-latest:m7i.8xlarge:spot=false:temp=64"
      env: ${{ inputs.environment }}
      region: eu-west-2
      is_risksmart_region: false
      app_or_risksmart_app: risksmartapp
      domain_prefix: ""
      resource_prefix: ""
      react_app_auth0_domain: ${{ needs.SetConfig.outputs.auth0_domain_uk }}
      auth0_domain_noncustom: ${{ needs.SetConfig.outputs.auth0_domain_uk }}
      react_app_auth0_client_id: ${{ needs.SetConfig.outputs.react_app_auth0_client_id_uk }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.SetConfig.outputs.auth0_risk_smart_rest_api_client_id_uk }}
      auth0_third_party_connection_name: Username-Password-ThirdParty
      react_app_tpp_auth0_client_id: ${{ needs.SetConfig.outputs.auth0_client_id_uk }}
      bedrock_guardrail_identifier: ${{ needs.SetConfig.outputs.bedrock_guardrail_id }}
      bedrock_guardrail_version: "1"
      diff_only: ${{ inputs.action == 'diff' }}
    secrets: inherit

  # US Region (us-east-1) - Available in staging and prod
  SST-US:
    name: SST / US (us-east-1)
    if: ${{ inputs.deploy_us && inputs.environment != 'dev-cloud' }}
    needs: SetConfig
    uses: ./.github/workflows/_template-sst-deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: "sprinters:aws:us-east-1:ubuntu-latest:m7i.8xlarge:spot=false:temp=64"
      env: ${{ inputs.environment }}
      region: us-east-1
      is_risksmart_region: true
      app_or_risksmart_app: app
      domain_prefix: "us."
      resource_prefix: "US-1-"
      react_app_auth0_domain: ${{ needs.SetConfig.outputs.auth0_domain_us }}
      auth0_domain_noncustom: ${{ needs.SetConfig.outputs.auth0_domain_us }}
      react_app_auth0_client_id: ${{ needs.SetConfig.outputs.react_app_auth0_client_id_us }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.SetConfig.outputs.auth0_risk_smart_rest_api_client_id_us }}
      auth0_third_party_connection_name: Username-Password-ThirdParty
      react_app_tpp_auth0_client_id: ${{ needs.SetConfig.outputs.auth0_client_id_us }}
      bedrock_guardrail_identifier: ${{ needs.SetConfig.outputs.bedrock_guardrail_id }}
      bedrock_guardrail_version: "1"
      diff_only: ${{ inputs.action == 'diff' }}
    secrets: inherit

  # UAE Region (me-central-1) - Available in prod only
  SST-UAE:
    name: SST / UAE (me-central-1)
    if: ${{ inputs.deploy_uae && inputs.environment == 'prod' }}
    needs: SetConfig
    uses: ./.github/workflows/_template-sst-deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: "sprinters:aws:me-central-1:ubuntu-latest:m7i.8xlarge:spot=false:temp=64"
      env: ${{ inputs.environment }}
      region: me-central-1
      is_risksmart_region: true
      app_or_risksmart_app: app
      domain_prefix: "uae."
      resource_prefix: "UAE-1-"
      react_app_auth0_domain: ${{ needs.SetConfig.outputs.auth0_domain_uae }}
      auth0_domain_noncustom: ${{ needs.SetConfig.outputs.auth0_domain_uae }}
      react_app_auth0_client_id: ${{ needs.SetConfig.outputs.react_app_auth0_client_id_uae }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.SetConfig.outputs.auth0_risk_smart_rest_api_client_id_uae }}
      auth0_third_party_connection_name: Username-Password-ThirdParty
      react_app_tpp_auth0_client_id: ${{ needs.SetConfig.outputs.auth0_client_id_uae }}
      bedrock_guardrail_identifier: ${{ needs.SetConfig.outputs.bedrock_guardrail_id }}
      bedrock_guardrail_version: "1"
      diff_only: ${{ inputs.action == 'diff' }}
    secrets: inherit

  # CA Region (ca-central-1) - Available in prod only
  SST-CA:
    name: SST / CA (ca-central-1)
    if: ${{ inputs.deploy_ca && inputs.environment == 'prod' }}
    needs: SetConfig
    uses: ./.github/workflows/_template-sst-deploy.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: "sprinters:aws:ca-central-1:ubuntu-latest:m7i.8xlarge:spot=false:temp=64"
      env: ${{ inputs.environment }}
      region: ca-central-1
      is_risksmart_region: true
      app_or_risksmart_app: app
      domain_prefix: "ca."
      resource_prefix: "CA-1-"
      react_app_auth0_domain: ${{ needs.SetConfig.outputs.auth0_domain_ca }}
      auth0_domain_noncustom: ${{ needs.SetConfig.outputs.auth0_domain_ca }}
      react_app_auth0_client_id: ${{ needs.SetConfig.outputs.react_app_auth0_client_id_ca }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.SetConfig.outputs.auth0_risk_smart_rest_api_client_id_ca }}
      auth0_third_party_connection_name: Username-Password-ThirdParty
      react_app_tpp_auth0_client_id: ${{ needs.SetConfig.outputs.auth0_client_id_ca }}
      bedrock_guardrail_identifier: ${{ needs.SetConfig.outputs.bedrock_guardrail_id }}
      bedrock_guardrail_version: "1"
      diff_only: ${{ inputs.action == 'diff' }}
    secrets: inherit
