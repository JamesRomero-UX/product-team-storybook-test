name: Manual / CDK Diff or Deploy

permissions:
  actions: write
  contents: read
  id-token: write
  packages: read

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - dev-cloud
          - staging
          - prod
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - diff
          - deploy
      deploy_uk:
        description: 'Deploy to UK (eu-west-2) - all environments'
        type: boolean
        default: true
      deploy_us:
        description: 'Deploy to US (us-east-1) - staging/prod only'
        type: boolean
        default: true
      deploy_uae:
        description: 'Deploy to UAE (me-central-1) - prod only'
        type: boolean
        default: true
      deploy_ca:
        description: 'Deploy to CA (ca-central-1) - prod only'
        type: boolean
        default: true

jobs:
  # Validate region is available for the selected environment
  ValidateInputs:
    name: Validate Inputs
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      # Auth0 config per environment/region
      auth0_domain_uk: ${{ steps.config.outputs.auth0_domain_uk }}
      auth0_management_client_id_uk: ${{ steps.config.outputs.auth0_management_client_id_uk }}
      auth0_client_id_uk: ${{ steps.config.outputs.auth0_client_id_uk }}
      auth0_risk_smart_rest_api_client_id_uk: ${{ steps.config.outputs.auth0_risk_smart_rest_api_client_id_uk }}
      auth0_domain_us: ${{ steps.config.outputs.auth0_domain_us }}
      auth0_management_client_id_us: ${{ steps.config.outputs.auth0_management_client_id_us }}
      auth0_client_id_us: ${{ steps.config.outputs.auth0_client_id_us }}
      auth0_risk_smart_rest_api_client_id_us: ${{ steps.config.outputs.auth0_risk_smart_rest_api_client_id_us }}
      auth0_domain_uae: ${{ steps.config.outputs.auth0_domain_uae }}
      auth0_management_client_id_uae: ${{ steps.config.outputs.auth0_management_client_id_uae }}
      auth0_client_id_uae: ${{ steps.config.outputs.auth0_client_id_uae }}
      auth0_risk_smart_rest_api_client_id_uae: ${{ steps.config.outputs.auth0_risk_smart_rest_api_client_id_uae }}
      auth0_domain_ca: ${{ steps.config.outputs.auth0_domain_ca }}
      auth0_management_client_id_ca: ${{ steps.config.outputs.auth0_management_client_id_ca }}
      auth0_client_id_ca: ${{ steps.config.outputs.auth0_client_id_ca }}
      auth0_risk_smart_rest_api_client_id_ca: ${{ steps.config.outputs.auth0_risk_smart_rest_api_client_id_ca }}
    steps:

      - name: Set environment config
        id: config
        run: |
          # Map region-specific GitHub env vars to outputs
          # UK
          echo "auth0_domain_uk=${{ vars.AUTH0_DOMAIN_UK }}" >> "$GITHUB_OUTPUT"
          echo "auth0_management_client_id_uk=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
          echo "auth0_client_id_uk=${{ vars.REACT_APP_AUTH0_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
          echo "auth0_risk_smart_rest_api_client_id_uk=${{ vars.AUTH0_RISK_SMART_REST_API_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"

          ENV="${{ inputs.environment }}"

          if [ "$ENV" == "dev-cloud" ]; then
            # US, UAE, CA not active in dev-cloud, but set placeholders using UK values
            echo "auth0_domain_us=${{ vars.AUTH0_DOMAIN_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_management_client_id_us=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_us=${{ vars.REACT_APP_AUTH0_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_us=${{ vars.AUTH0_RISK_SMART_REST_API_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_domain_uae=${{ vars.AUTH0_DOMAIN_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_management_client_id_uae=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_uae=${{ vars.REACT_APP_AUTH0_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_uae=${{ vars.AUTH0_RISK_SMART_REST_API_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_domain_ca=${{ vars.AUTH0_DOMAIN_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_management_client_id_ca=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_ca=${{ vars.REACT_APP_AUTH0_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_ca=${{ vars.AUTH0_RISK_SMART_REST_API_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
          elif [ "$ENV" == "staging" ]; then
            # US
            echo "auth0_domain_us=${{ vars.AUTH0_DOMAIN_US }}" >> "$GITHUB_OUTPUT"
            echo "auth0_management_client_id_us=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID_US }}" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_us=${{ vars.REACT_APP_AUTH0_CLIENT_ID_US }}" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_us=${{ vars.AUTH0_RISK_SMART_REST_API_CLIENT_ID_US }}" >> "$GITHUB_OUTPUT"
            # UAE and CA not active in staging, but set placeholders using UK values
            echo "auth0_domain_uae=${{ vars.AUTH0_DOMAIN_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_management_client_id_uae=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_uae=${{ vars.REACT_APP_AUTH0_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_uae=${{ vars.AUTH0_RISK_SMART_REST_API_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_domain_ca=${{ vars.AUTH0_DOMAIN_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_management_client_id_ca=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_ca=${{ vars.REACT_APP_AUTH0_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_ca=${{ vars.AUTH0_RISK_SMART_REST_API_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
          else
            # prod - all regions active
            echo "auth0_domain_us=${{ vars.AUTH0_DOMAIN_US }}" >> "$GITHUB_OUTPUT"
            echo "auth0_management_client_id_us=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID_US }}" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_us=${{ vars.REACT_APP_AUTH0_CLIENT_ID_US }}" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_us=${{ vars.AUTH0_RISK_SMART_REST_API_CLIENT_ID_US }}" >> "$GITHUB_OUTPUT"
            echo "auth0_domain_uae=${{ vars.AUTH0_DOMAIN_UAE }}" >> "$GITHUB_OUTPUT"
            echo "auth0_management_client_id_uae=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID_UAE }}" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_uae=${{ vars.REACT_APP_AUTH0_CLIENT_ID_UAE }}" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_uae=${{ vars.AUTH0_RISK_SMART_REST_API_CLIENT_ID_UAE }}" >> "$GITHUB_OUTPUT"
            echo "auth0_domain_ca=${{ vars.AUTH0_DOMAIN_CA }}" >> "$GITHUB_OUTPUT"
            echo "auth0_management_client_id_ca=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID_CA }}" >> "$GITHUB_OUTPUT"
            echo "auth0_client_id_ca=${{ vars.REACT_APP_AUTH0_CLIENT_ID_CA }}" >> "$GITHUB_OUTPUT"
            echo "auth0_risk_smart_rest_api_client_id_ca=${{ vars.AUTH0_RISK_SMART_REST_API_CLIENT_ID_CA }}" >> "$GITHUB_OUTPUT"
          fi

  IntegrationsVersionCheck:
    name: Integrations / Version Check
    uses: ./.github/workflows/_template-package-version-check.yml
    with:
      env: ${{ inputs.environment }}
      package_path: 'packages/integrations/package.json'
      package_name: 'Integrations'
      run_published_check: true
      not_published_fail: ${{ inputs.environment != 'dev-cloud' }}
      ecr_repository: 'risksmart/integrations'
    secrets: inherit

  ExtAPIVersionCheck:
    name: External API / Version Check
    uses: ./.github/workflows/_template-package-version-check.yml
    with:
      env: ${{ inputs.environment }}
      package_path: 'packages/external-api/package.json'
      package_name: 'External API'
      ssm_config_name: '/${{ inputs.environment }}/ext-api/config'
    secrets: inherit

  # UK Region (eu-west-2) - Available in all environments
  CDK-UK:
    name: CDK / UK (eu-west-2)
    if: ${{ inputs.deploy_uk }}
    needs:
      - ValidateInputs
      - IntegrationsVersionCheck
      - ExtAPIVersionCheck
    uses: ./.github/workflows/_template-cdk-diff-or-deploy-region.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      action: ${{ inputs.action }}
      env: ${{ inputs.environment }}
      enable_turbo_cache: true
      aws_region: 'eu-west-2'
      multi_tenant_snapshot_prefix: ''
      vpn_enabled: true
      risksmart_region: false
      external_api_image_tag: ${{ needs.ExtAPIVersionCheck.outputs.current_version }}
      external_api_config: ${{ needs.ExtAPIVersionCheck.outputs.ssm_config_value }}
      integrations_image_tag: ${{ needs.IntegrationsVersionCheck.outputs.current_version }}
      auth0_domain: ${{ needs.ValidateInputs.outputs.auth0_domain_uk }}
      auth0_management_client_id: ${{ needs.ValidateInputs.outputs.auth0_management_client_id_uk }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.ValidateInputs.outputs.auth0_risk_smart_rest_api_client_id_uk }}
      auth0_client_id: ${{ needs.ValidateInputs.outputs.auth0_client_id_uk }}
    secrets: inherit

  # US Region (us-east-1) - Available in staging and prod
  CDK-US:
    name: CDK / US (us-east-1)
    if: ${{ inputs.deploy_us && inputs.environment != 'dev-cloud' }}
    needs:
      - ValidateInputs
      - IntegrationsVersionCheck
      - ExtAPIVersionCheck
    uses: ./.github/workflows/_template-cdk-diff-or-deploy-region.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      action: ${{ inputs.action }}
      env: ${{ inputs.environment }}
      enable_turbo_cache: true
      aws_region: 'us-east-1'
      multi_tenant_snapshot_prefix: 'US-1-'
      vpn_enabled: ${{ inputs.environment == 'prod' }}
      risksmart_region: true
      risksmart_region_prefix: 'us'
      risksmart_region_id: 'US-1'
      external_api_image_tag: ${{ needs.ExtAPIVersionCheck.outputs.current_version }}
      external_api_config: ${{ needs.ExtAPIVersionCheck.outputs.ssm_config_value }}
      integrations_image_tag: ${{ needs.IntegrationsVersionCheck.outputs.current_version }}
      auth0_domain: ${{ needs.ValidateInputs.outputs.auth0_domain_us }}
      auth0_management_client_id: ${{ needs.ValidateInputs.outputs.auth0_management_client_id_us }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.ValidateInputs.outputs.auth0_risk_smart_rest_api_client_id_us }}
      auth0_client_id: ${{ needs.ValidateInputs.outputs.auth0_client_id_us }}
    secrets: inherit

  # UAE Region (me-central-1) - Available in prod only
  CDK-UAE:
    name: CDK / UAE (me-central-1)
    if: ${{ inputs.deploy_uae && inputs.environment == 'prod' }}
    needs:
      - ValidateInputs
      - IntegrationsVersionCheck
      - ExtAPIVersionCheck
    uses: ./.github/workflows/_template-cdk-diff-or-deploy-region.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      action: ${{ inputs.action }}
      env: ${{ inputs.environment }}
      enable_turbo_cache: true
      aws_region: 'me-central-1'
      multi_tenant_snapshot_prefix: 'UAE-1-'
      vpn_enabled: true
      risksmart_region: true
      risksmart_region_prefix: 'uae'
      risksmart_region_id: 'UAE-1'
      external_api_image_tag: ${{ needs.ExtAPIVersionCheck.outputs.current_version }}
      external_api_config: ${{ needs.ExtAPIVersionCheck.outputs.ssm_config_value }}
      integrations_image_tag: ${{ needs.IntegrationsVersionCheck.outputs.current_version }}
      auth0_domain: ${{ needs.ValidateInputs.outputs.auth0_domain_uae }}
      auth0_management_client_id: ${{ needs.ValidateInputs.outputs.auth0_management_client_id_uae }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.ValidateInputs.outputs.auth0_risk_smart_rest_api_client_id_uae }}
      auth0_client_id: ${{ needs.ValidateInputs.outputs.auth0_client_id_uae }}
    secrets: inherit

  # CA Region (ca-central-1) - Available in prod only
  CDK-CA:
    name: CDK / CA (ca-central-1)
    if: ${{ inputs.deploy_ca && inputs.environment == 'prod' }}
    needs:
      - ValidateInputs
      - IntegrationsVersionCheck
      - ExtAPIVersionCheck
    uses: ./.github/workflows/_template-cdk-diff-or-deploy-region.yml
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      action: ${{ inputs.action }}
      env: ${{ inputs.environment }}
      enable_turbo_cache: true
      aws_region: 'ca-central-1'
      multi_tenant_snapshot_prefix: 'CA-1-'
      vpn_enabled: true
      risksmart_region: true
      risksmart_region_prefix: 'ca'
      risksmart_region_id: 'CA-1'
      external_api_image_tag: ${{ needs.ExtAPIVersionCheck.outputs.current_version }}
      external_api_config: ${{ needs.ExtAPIVersionCheck.outputs.ssm_config_value }}
      integrations_image_tag: ${{ needs.IntegrationsVersionCheck.outputs.current_version }}
      auth0_domain: ${{ needs.ValidateInputs.outputs.auth0_domain_ca }}
      auth0_management_client_id: ${{ needs.ValidateInputs.outputs.auth0_management_client_id_ca }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.ValidateInputs.outputs.auth0_risk_smart_rest_api_client_id_ca }}
      auth0_client_id: ${{ needs.ValidateInputs.outputs.auth0_client_id_ca }}
    secrets: inherit
