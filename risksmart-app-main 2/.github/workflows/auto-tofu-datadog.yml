# OpenTofu pipeline for Datadog infrastructure
#
# Triggers:
#   - PR: Plans on changes to infrastructure/datadog/**
#   - Push to main: Applies on merge
#   - workflow_dispatch: Manual plan & apply

name: Auto / Tofu Datadog

on:
  pull_request:
    paths:
      - 'infrastructure/datadog/**'
      - '.github/workflows/auto-tofu-datadog.yml'
      - '.github/workflows/_template-tofu-plan.yml'
      - '.github/workflows/_template-tofu-apply.yml'
  push:
    branches: [main]
    paths:
      - 'infrastructure/datadog/**'
      - '.github/workflows/auto-tofu-datadog.yml'
      - '.github/workflows/_template-tofu-plan.yml'
      - '.github/workflows/_template-tofu-apply.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Tofu action to perform'
        required: true
        type: choice
        default: 'plan'
        options:
          - plan
          - plan-and-apply

# State backend: prod account eu-west-2
env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: '826351825809'
  AWS_ROLE_NAME: RiskSmart-GitHub-Deploy-Role

jobs:
  plan:
    name: Plan
    uses: ./.github/workflows/_template-tofu-plan.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
    with:
      runner_label: 'sprinters:aws:eu-west-2:ubuntu-latest:m7i-flex.large:spot=false'
      env: datadog
      aws_region: eu-west-2
      account: prod
      tf_actions_working_dir: 'infrastructure/datadog'
      uses_workspaces: false
      deploy_role: 'arn:aws:iam::826351825809:role/RiskSmart-GitHub-Deploy-Role'
      enable_datadog_provider: true
    secrets: inherit

  apply:
    name: Apply
    needs: [plan]
    if: |
      !cancelled() &&
      needs.plan.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan-and-apply'))
    uses: ./.github/workflows/_template-tofu-apply.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
    concurrency:
      group: tofu-datadog
      cancel-in-progress: false
    with:
      runner_label: 'sprinters:aws:eu-west-2:ubuntu-latest:m7i-flex.large:spot=false'
      env: datadog
      aws_region: eu-west-2
      account: prod
      tf_actions_working_dir: 'infrastructure/datadog'
      uses_workspaces: false
      deploy_role: 'arn:aws:iam::826351825809:role/RiskSmart-GitHub-Deploy-Role'
      enable_datadog_provider: true
    secrets: inherit
