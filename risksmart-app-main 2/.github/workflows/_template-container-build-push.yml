name: Template / Container Build Push

permissions:
  actions: write
  contents: read
  id-token: write
  packages: read

on:
  workflow_call:
    inputs:
      runner_label:
        required: false
        type: string
        default: 'sprinters:aws:eu-west-2:ubuntu-24.04-arm:c6g.xlarge:spot=false:temp=64'
      env:
        required: true
        type: string
      container_name:
        required: true
        type: string
      container_dockerfile:
        required: true
        type: string
      path_to_artifact:
        required: true
        type: string
      ecr_repo_name:
        required: true
        type: string
      enable_turbo_cache:
        required: false
        type: boolean
        default: false
      aws_region:
        required: true
        type: string
      package_version:
        required: false
        type: string
        default: ''
      version_changed:
        required: false
        type: boolean
        default: true
      build_requires_graphql:
        required: false
        type: boolean
        default: false
    outputs:
      container_build:
        description: "The variable short_tag"
        value: ${{ jobs.BuildAndPublishImageArtifact.outputs.container_build }}
      container_tag:
        description: "The full image tag"
        value: ${{ jobs.BuildAndPublishImageArtifact.outputs.container_tag }}
      full_tag:
        description: "The full image tag"
        value: ${{ jobs.BuildAndPublishImageArtifact.outputs.full_tag }}

jobs:
  BuildAndPublishImageArtifact:
    name: Build Container Image
    if: inputs.version_changed
    runs-on:
      - ${{ inputs.runner_label }}
      - ${{ github.run_id }}-${{ github.run_attempt }}-BuildAndPublishImageArtifact
    outputs:
      container_build: ${{ steps.containerbuildid.outputs.container_build }}
      container_tag: ${{ steps.containertag.outputs.container_tag }}
      full_tag: ${{ steps.containertag.outputs.container_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Turbo cache
        if: inputs.build_requires_graphql
        uses: rharkor/caching-for-turbo@d124d2921c97c169010f6a7a624a36e9831472e1 # v 1.8

      - name: Setup pnpm
        if: inputs.build_requires_graphql
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.28.2

      - name: Setup node
        if: inputs.build_requires_graphql
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Configure pnpm for GitHub Packages
        if: inputs.build_requires_graphql
        run: |
          pnpm config set @risk-smart:registry https://npm.pkg.github.com
          pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: inputs.build_requires_graphql
        run: pnpm install

      - name: Start API containers
        if: inputs.build_requires_graphql
        run: docker compose up graphql-engine postgres --detach
        working-directory: api-stack

      - name: Wait for API
        if: inputs.build_requires_graphql
        timeout-minutes: 10
        run: bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' 127.0.0.1:8080/v1/version)" != "200" ]]; do sleep 1; done'

      - name: Apply Hasura migrations
        if: inputs.build_requires_graphql
        run: pnpm run hasura-migrate:for-type-gen

      - name: Generate GraphQL types
        if: inputs.build_requires_graphql
        run: pnpm run generate-graphql

      - name: Set container build
        id: containerbuildid
        run: echo "container_build=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set container tag
        id: containertag
        run: echo "container_tag=${{ inputs.container_name }}:${{ steps.containerbuildid.outputs.container_build }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (no push)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          file: ${{ inputs.container_dockerfile }}
          push: false
          tags: ${{ inputs.container_name }}:latest
          load: true
          platforms: linux/arm64
          build-args: PACKAGE_VERSION=${{ inputs.package_version || '' }}

      - name: Save Docker image
        run: docker save ${{ inputs.container_name }}:latest | gzip > ${{ inputs.container_name }}.tar.gz

      - name: Upload container artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.container_name }}
          path: ${{ inputs.container_name }}.tar.gz
          retention-days: 5

  PushToRegions:
    name: Push to ECR Regions
    if: inputs.version_changed
    needs: BuildAndPublishImageArtifact
    runs-on:

      - ${{ inputs.runner_label }}

      - ${{ github.run_id }}-${{ github.run_attempt }}-PushToRegions-${{ strategy.job-index}}
    strategy:
      fail-fast: false  # Continue pushing to other regions if one fails
      matrix:
        region: [eu-west-2, us-east-1, ca-central-1] # me-central-1 excluded until data centre is up again
    steps:

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.CI_AWS_DEPLOY_ROLE }}
          aws-region: ${{ matrix.region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          registries: ${{ vars.CI_AWS_ACCOUNT_ID }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${{ inputs.package_version != '' && inputs.package_version || needs.BuildAndPublishImageArtifact.outputs.container_build }}" >> "$GITHUB_ENV"

      - name: Check if image tag exists in ECR
        id: check-tag
        run: |
          if aws ecr describe-images --repository-name ${{ inputs.ecr_repo_name }} --image-ids imageTag="$IMAGE_TAG" 2>/dev/null; then
            echo "Image tag $IMAGE_TAG already exists in ECR, skipping push"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Image tag $IMAGE_TAG does not exist in ECR, proceeding with push"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Docker image artifact
        if: steps.check-tag.outputs.exists != 'true'
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ inputs.container_name }}

      - name: Load Docker image
        if: steps.check-tag.outputs.exists != 'true'
        run: |
          gunzip -c ${{ inputs.container_name }}.tar.gz | docker load

      - name: Tag and push image
        if: steps.check-tag.outputs.exists != 'true'
        run: |
          docker tag ${{ inputs.container_name }}:latest ${{ vars.CI_AWS_ACCOUNT_ID }}.dkr.ecr.${{ matrix.region }}.amazonaws.com/${{ inputs.ecr_repo_name }}:"$IMAGE_TAG"
          docker push ${{ vars.CI_AWS_ACCOUNT_ID }}.dkr.ecr.${{ matrix.region }}.amazonaws.com/${{ inputs.ecr_repo_name }}:"$IMAGE_TAG"

  SkipBuildReturn:
    name: Skip Build (No Version Changes)
    if: "!inputs.version_changed"
    runs-on: ubuntu-latest
    steps:
      - name: Log skip reason
        run: echo "No changes. Skipping build. Version_changed value ${{ inputs.version_changed }}"
