name: Template / Integrations Container Build

# Integrations Container Build - Behaviour Summary
#
# This workflow template builds the integrations container image and optionally
# pushes it to ECR. It uses semantic versioning from package.json (via changesets).
#
# Pre-merge (PR) runs:
# - Caller should set `version_changed` based on version check output
# - `push_to_ecr` should be false to avoid cluttering ECR with PR artifacts
# - Build runs only if `version_changed` is true
#
# Post-merge (main) runs:
# - `push_to_ecr` should be true
# - `version_changed` comes from version check (version changed OR missing in ECR)
# - Images are tagged with semver (e.g., 1.0.0) and pushed to all regions
#
# Staging / Prod:
# - Do not call this template - use pre-built images from ECR
# - Use _template-package-version-check.yml to get the version

permissions:
  actions: write
  contents: read
  id-token: write
  packages: read

on:
  workflow_call:
    inputs:
      runner_label:
        required: false
        type: string
        default: 'sprinters:aws:eu-west-2:ubuntu-24.04-arm:c6g.xlarge:spot=false:temp=64'
      env:
        required: true
        type: string
      enable_turbo_cache:
        required: false
        type: boolean
        default: false
      package_version:
        description: 'Semver from package.json (e.g., 1.0.0)'
        required: true
        type: string
      version_changed:
        description: 'Whether to perform the build (from version check version_changed output)'
        required: false
        type: boolean
        default: true
      push_to_ecr:
        description: "Whether to push to ECR (false for pre-merge, true for post-merge)"
        required: false
        type: boolean
        default: true
    outputs:
      version:
        description: "The version tag of the built image (e.g., 1.0.0)"
        value: ${{ jobs.BuildIntegrationsContainer.outputs.version }}
      image_uri:
        description: "Full ECR image URI"
        value: ${{ jobs.BuildIntegrationsContainer.outputs.image_uri }}
      build_performed:
        description: "Whether a build was actually performed"
        value: ${{ jobs.BuildIntegrationsContainer.outputs.build_performed }}

jobs:
  BuildIntegrationsContainer:
    name: Build Integrations Container
    if: ${{ inputs.version_changed }}
    runs-on:
      - ${{ inputs.runner_label }}
      - ${{ github.run_id }}-${{ github.run_attempt }}-BuildIntegrationsContainer
    environment:
      name: ${{ inputs.env }}
      url: https://github.com
    outputs:
      version: ${{ inputs.package_version }}
      image_uri: ${{ steps.version.outputs.image_uri }}
      build_performed: 'true'
    steps:
      - name: Setup Turbo cache
        uses: rharkor/caching-for-turbo@a1c4079258ae08389be75b57d4d7a70f23c1c66d # v1.8
        if: ${{ inputs.enable_turbo_cache }}

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Configure AWS credentials (CI Account)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.CI_AWS_DEPLOY_ROLE }}
          aws-region: eu-west-2

      - name: Set version outputs
        id: version
        env:
          VERSION: ${{ inputs.package_version }}
          CI_AWS_ACCOUNT_ID: ${{ vars.CI_AWS_ACCOUNT_ID }}
        run: |
          ECR_REPO="${CI_AWS_ACCOUNT_ID}.dkr.ecr.eu-west-2.amazonaws.com/risksmart/integrations"
          IMAGE_URI="${ECR_REPO}:${VERSION}"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          echo "Image URI: $IMAGE_URI"

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          registries: ${{ vars.CI_AWS_ACCOUNT_ID }}

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.28.2

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          registry-url: 'https://npm.pkg.github.com'

      - name: Configure pnpm for GitHub Packages
        run: |
          pnpm config set @risk-smart:registry https://npm.pkg.github.com
          pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Start API containers (for GraphQL codegen)
        run: docker compose up graphql-engine postgres --detach
        working-directory: api-stack

      - name: Wait for API
        timeout-minutes: 10
        run: bash -c 'while [[ "$(curl -s -o /dev/null -w ''%{http_code}'' 127.0.0.1:8080/v1/version)" != "200" ]]; do sleep 1; done'

      - name: Apply Hasura migrations
        run: pnpm run hasura-migrate:for-type-gen

      - name: Generate GraphQL types
        run: pnpm run --filter n8n-nodes-risksmart generate-graphql

      - name: Build integrations package
        run: pnpm run --filter n8n-nodes-risksmart build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Read N8N version from docker-compose.yml (source of truth)
      - name: Get N8N version
        id: n8n_version
        run: |
          # Extract N8N_VERSION from docker-compose.yml build args
          N8N_VERSION=$(grep -oP 'N8N_VERSION=\K[0-9.]+' packages/integrations/docker-compose.yml)

          if [[ -z "$N8N_VERSION" ]]; then
            echo "::error::Could not determine N8N version from packages/integrations/docker-compose.yml"
            exit 1
          fi

          echo "version=$N8N_VERSION" >> "$GITHUB_OUTPUT"
          echo "N8N version: $N8N_VERSION"

      - name: Build Docker image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./packages/integrations
          file: ./packages/integrations/Dockerfile
          push: false
          load: true
          tags: |
            integrations-build:latest
            integrations-build:${{ inputs.package_version }}
          platforms: linux/arm64
          build-args: |
            N8N_VERSION=${{ steps.n8n_version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save Docker image as artefact
        run: |
          docker save integrations-build:latest | gzip > integrations-build.tar.gz

      - name: Upload artefact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integrations-build
          path: integrations-build.tar.gz
          retention-days: 1

  # Skip job (runs when build not required)
  SkipBuild:
    name: Skip Build (No Changes)
    if: ${{ !inputs.version_changed }}
    runs-on: ubuntu-latest
    steps:
      - name: Log skip reason
        run: echo "Build not required - image already exists in ECR for version ${{ inputs.package_version }}"

  # Push to all ECR regions in parallel
  PushToRegions:
    name: Push to ${{ matrix.region }}
    if: ${{ inputs.version_changed && inputs.push_to_ecr }}
    needs: BuildIntegrationsContainer
    runs-on:
      - ${{ inputs.runner_label }}
      - ${{ github.run_id }}-${{ github.run_attempt }}-PushToRegions-${{ strategy.job-index }}
    strategy:
      fail-fast: false  # Continue pushing to other regions if one fails
      matrix:
        # All prod regions - individual failures won't cancel others
        region: [eu-west-2, us-east-1, me-central-1, ca-central-1]
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.CI_AWS_DEPLOY_ROLE }}
          aws-region: ${{ matrix.region }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@062b18b96a7aff071d4dc91bc00c4c1a7945b076 # v2.0.1
        with:
          registries: ${{ vars.CI_AWS_ACCOUNT_ID }}

      - name: Download Docker image artefact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: integrations-build

      - name: Load Docker image
        run: gunzip -c integrations-build.tar.gz | docker load

      - name: Tag and push to ${{ matrix.region }}
        env:
          CI_AWS_ACCOUNT_ID: ${{ vars.CI_AWS_ACCOUNT_ID }}
          REGION: ${{ matrix.region }}
          IMAGE_TAG: ${{ inputs.package_version }}
        run: |
          docker tag integrations-build:latest \
            "${CI_AWS_ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/risksmart/integrations:${IMAGE_TAG}"
          docker push "${CI_AWS_ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com/risksmart/integrations:${IMAGE_TAG}"

  # Summary job (runs after all pushes complete)
  Summary:
    name: Build Summary
    if: always()
    needs:
      - BuildIntegrationsContainer
      - PushToRegions
    runs-on: ubuntu-latest
    steps:
      - name: Write summary
        env:
          VERSION: ${{ inputs.package_version }}
          COMMIT_SHA: ${{ github.sha }}
          VERSION_CHANGED: ${{ inputs.version_changed }}
          PUSH_TO_ECR: ${{ inputs.push_to_ecr }}
        run: |
          echo "## Integrations Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${COMMIT_SHA:0:7}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version Changed | ${VERSION_CHANGED} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Pushed to ECR | ${PUSH_TO_ECR} |" >> "$GITHUB_STEP_SUMMARY"
