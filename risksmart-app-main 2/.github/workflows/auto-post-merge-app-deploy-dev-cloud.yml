# This workflow deploys the app to dev-cloud after merging to main
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Auto / Post-Merge App Deploy Dev Cloud

permissions:
  actions: write
  contents: read
  id-token: write
  packages: read

on:
  push:
    branches: ['main']
    paths-ignore:
      - infrastructure/**
      - .github/workflows/**
  workflow_dispatch:

concurrency: dev-cloud
jobs:
  ResolveAuth0Config:
    name: Resolve Auth0 Config
    runs-on: ubuntu-latest
    environment: dev-cloud
    outputs:
      auth0_domain_uk: ${{ steps.config.outputs.auth0_domain_uk }}
      auth0_management_client_id_uk: ${{ steps.config.outputs.auth0_management_client_id_uk }}
      auth0_client_id_uk: ${{ steps.config.outputs.auth0_client_id_uk }}
      auth0_risk_smart_rest_api_client_id_uk: ${{ steps.config.outputs.auth0_risk_smart_rest_api_client_id_uk }}
    steps:
      - name: Set Auth0 config from environment vars
        id: config
        run: |
          echo "auth0_domain_uk=${{ vars.AUTH0_DOMAIN_UK }}" >> "$GITHUB_OUTPUT"
          echo "auth0_management_client_id_uk=${{ vars.AUTH0_MANAGEMENT_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
          echo "auth0_client_id_uk=${{ vars.REACT_APP_AUTH0_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"
          echo "auth0_risk_smart_rest_api_client_id_uk=${{ vars.AUTH0_RISK_SMART_REST_API_CLIENT_ID_UK }}" >> "$GITHUB_OUTPUT"

  IntegrationsVersionCheck:
    name: Integrations / Version Check
    uses: ./.github/workflows/_template-package-version-check.yml
    with:
      env: dev-cloud
      package_path: 'packages/integrations/package.json'
      package_name: 'Integrations'
      run_published_check: true
      ecr_repository: 'risksmart/integrations'
    secrets: inherit

  IntegrationsContainerBuild:
    name: Integrations / Build
    needs: IntegrationsVersionCheck
    uses: ./.github/workflows/_template-integrations-container-build.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: sprinters:aws:eu-west-2:ubuntu-24.04-arm:c6g.xlarge:spot=false:temp=64
      env: dev-cloud
      enable_turbo_cache: true
      package_version: ${{ needs.IntegrationsVersionCheck.outputs.current_version }}
      version_changed: ${{ fromJSON(needs.IntegrationsVersionCheck.outputs.build_required) }}
      push_to_ecr: true
    secrets: inherit

  TRPCBuild:
    name: TRPC / Build
    uses: ./.github/workflows/_template-container-build-push.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      env: ci
      enable_turbo_cache: true
      container_name: 'trpc-api'
      container_dockerfile: 'packages/trpc/Dockerfile'
      path_to_artifact: 'packages/trpc'
      ecr_repo_name: 'risksmart/trpc-api'
      aws_region: 'eu-west-2'
    secrets: inherit

  TenantDeployerBuild:
    name: Tenant Deployer / Build
    uses: ./.github/workflows/_template-container-build-push.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      env: ci
      enable_turbo_cache: true
      container_name: 'tenant-deployer'
      container_dockerfile: 'packages/tenant-deployer/Dockerfile'
      path_to_artifact: 'packages/tenant-deployer'
      ecr_repo_name: 'risksmart/tenant-deployer'
      aws_region: 'eu-west-2'
    secrets: inherit

  MCPServerBuild:
    name: MCP Server / Build
    uses: ./.github/workflows/_template-container-build-push.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      env: ci
      enable_turbo_cache: true
      container_name: 'mcp-server'
      container_dockerfile: 'packages/mcp-server/Dockerfile'
      path_to_artifact: 'packages/mcp-server'
      ecr_repo_name: 'risksmart/mcp'
      aws_region: 'eu-west-2'
    secrets: inherit

  ExtAPIBuildCheck:
    name: External API / Version Check
    uses: ./.github/workflows/_template-package-version-check.yml
    with:
      env: dev-cloud
      package_path: 'packages/external-api/package.json'
      package_name: 'External API'
      run_published_check: true
      ecr_repository: 'risksmart/external-api'
      ssm_config_name: '/dev-cloud/ext-api/config'
    secrets: inherit

  ExtAPIBuild:
    name: External API / Build
    needs: ExtAPIBuildCheck
    uses: ./.github/workflows/_template-container-build-push.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      env: ci
      enable_turbo_cache: true
      container_name: 'external-api'
      container_dockerfile: 'packages/external-api/Dockerfile'
      path_to_artifact: 'packages/external-api'
      ecr_repo_name: 'risksmart/external-api'
      aws_region: 'eu-west-2'
      package_version: ${{ needs.ExtAPIBuildCheck.outputs.current_version }}
      version_changed: ${{ fromJSON(needs.ExtAPIBuildCheck.outputs.build_required) }}
      build_requires_graphql: true
    secrets: inherit

  ######## WEB APP UNIT TESTS, FAIL EARLY, ONCE, NO POINT DEPLOYING STUFF IF THESE FAIL ########

  WebTest:
    name: Web / Test
    uses: ./.github/workflows/_template-web-test.yml
    with:
      aws_region: eu-west-2
      env: dev-cloud
      runner_label: 'sprinters:aws:eu-west-2:ubuntu-latest:m7i-flex.4xlarge:spot=false:temp=50'
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    secrets: inherit

  ECRTagCommitSHA:
    name: ECR / Tag dev-cloud (commit SHA repos)
    needs:
      - TRPCBuild
      - TenantDeployerBuild
      - MCPServerBuild
    uses: ./.github/workflows/_template-ecr-environment-tag.yml
    with:
      environment_tag: dev-cloud
      ecr_repos: 'risksmart/trpc-api risksmart/tenant-deployer risksmart/mcp'
      image_tag: commit-sha
    secrets: inherit

  RiskSmartLegacyUKDeployInfra:
    name: CDK / Deploy UK
    uses: ./.github/workflows/_template-cdk-deploy-region.yml
    needs:
      # - CheckForCDKChanges
      - ResolveAuth0Config
      - WebTest
      - IntegrationsVersionCheck
      - IntegrationsContainerBuild
      - TRPCBuild
      - TenantDeployerBuild
      - MCPServerBuild
      - ExtAPIBuildCheck
      - ExtAPIBuild
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
      packages: read
    with:
      env: dev-cloud
      enable_turbo_cache: true
      aws_region: 'eu-west-2'
      multi_tenant_snapshot_prefix: ''
      vpn_enabled: true
      risksmart_region: false
      external_api_image_tag: ${{ needs.ExtAPIBuildCheck.outputs.current_version }}
      external_api_config: ${{ needs.ExtAPIBuildCheck.outputs.ssm_config_value }}
      integrations_image_tag: ${{ needs.IntegrationsVersionCheck.outputs.current_version }}
      auth0_domain: ${{ needs.ResolveAuth0Config.outputs.auth0_domain_uk }}
      auth0_management_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_management_client_id_uk }}
      auth0_risk_smart_rest_api_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_risk_smart_rest_api_client_id_uk }}
      auth0_client_id: ${{ needs.ResolveAuth0Config.outputs.auth0_client_id_uk }}
    secrets: inherit

  DeployDevGlobalTenantConfig:
    name: Tenant Config / Deploy Global Tenant Config
    uses: ./.github/workflows/_template-tenant-config-deploy.yml
    needs:
      - RiskSmartLegacyUKDeployInfra
    with:
      env: dev-cloud
      aws_region: 'eu-west-2'
      table_name: 'dev-cloud-risksmartApp-GlobalTenantConfig'
      deployment_regions: '["eu-west-2"]'
    secrets: inherit

  ######## HASURA MIGRATIONS PER TENANT ########

  HasuraMigration-TenantUKLegacy:
    name: Hasura / Migration (UK Legacy)
    uses: ./.github/workflows/_template-hasura-migrate-v2.yml
    needs:
      - RiskSmartLegacyUKDeployInfra
      - RestApiDeployLegacyUK
    with:
      runner_label: 'sprinters:aws:eu-west-2:ubuntu-latest:m7i-flex.large:spot=false'
      env: dev-cloud
      domain_prefix: ''
      tenant_keys: 'MultiTenant,OctoEnergy'
      secret_name: 'HASURA_ADMIN_SECRET'
      app_or_risksmart_app: 'risksmartapp'
    secrets: inherit

  ###### REST API DEPLOYMENTS PER REGION ########

  RestApiDeployLegacyUK:
    name: API / Deploy REST (UK Legacy)
    uses: ./.github/workflows/_template-sst-deploy.yml
    needs:
      - RiskSmartLegacyUKDeployInfra
      - DeployDevGlobalTenantConfig
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: 'sprinters:aws:eu-west-2:ubuntu-latest:m7i.8xlarge:spot=false:root=gp3/5000/1000:temp=64/gp3/max/750'
      env: dev-cloud
      region: 'eu-west-2'
      domain_prefix: ''
      resource_prefix: ''
      is_risksmart_region: false
      app_or_risksmart_app: 'risksmartapp'
      react_app_auth0_domain: dev-cloud-t8t3iey3b54zkh7i.uk.auth0.com
      auth0_domain_noncustom: dev-cloud-t8t3iey3b54zkh7i.uk.auth0.com
      auth0_third_party_connection_name: Username-Password-ThirdParty
      react_app_tpp_auth0_client_id: bzwh0DgvQuUzsPnL3ekSnIINN2SmYO6u
      auth0_risk_smart_rest_api_client_id: 7ginl2ojPQlDh8K2ENgbC0dSjfgbKf4A
      react_app_auth0_client_id: cdUObIWyim5cw8tsj0bu43hDbZnvXe1g
      bedrock_guardrail_identifier: gas5ausp88ip
      bedrock_guardrail_version: 1
    secrets: inherit

 ######## WEB BUILD AND DEPLOY - NEED TO BE IN SAME STEP FOR ARTIFACT, POTENTIAL REFACTOR ########

  WebBuildAndDeployLegacyUK:
    name: Web / Deploy (UK Legacy)
    uses: ./.github/workflows/_template-web-build-deploy.yml
    needs:
      - HasuraMigration-TenantUKLegacy
      - RestApiDeployLegacyUK
    permissions:
      actions: write
      contents: read
      id-token: write
      pull-requests: write
      packages: read
    with:
      env: dev-cloud
      aws_region: 'eu-west-2'
      domain_prefix: ''
      resource_prefix: ''
      app_cloudfront_id: 'EURWP28GM2AXG'  # Legacy UK Cloudfront ID
      app_or_risksmart_app: 'risksmartapp'
      react_app_auth0_domain: dev-cloud-t8t3iey3b54zkh7i.uk.auth0.com
      react_app_auth0_client_id: cdUObIWyim5cw8tsj0bu43hDbZnvXe1g
    secrets: inherit

  ThirdPartyPortalLegacyUK:
    name: Web / Deploy Third-Party Portal (UK Legacy)
    uses: ./.github/workflows/_template-tpp-build-deploy.yml
    needs:
      - RiskSmartLegacyUKDeployInfra
      - HasuraMigration-TenantUKLegacy
      - RestApiDeployLegacyUK
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      env: dev-cloud
      aws_region: 'eu-west-2'
      domain_prefix: ''
      resource_prefix: ''
      app_cloudfront_id: 'EURWP28GM2AXG'  # Legacy UK Cloudfront ID
      app_or_risksmart_app: 'risksmartapp'
      react_app_auth0_domain: dev-cloud-t8t3iey3b54zkh7i.uk.auth0.com
      auth0_third_party_connection_name: Username-Password-ThirdParty
      react_app_tpp_auth0_client_id: bzwh0DgvQuUzsPnL3ekSnIINN2SmYO6u
    secrets: inherit

  Auth0ConfigDeployUK-1:
    name: Auth / Deploy (UK-1)
    uses: ./.github/workflows/_template-auth0-deploy.yml
    needs:
      - WebTest
      - WebBuildAndDeployLegacyUK
      - HasuraMigration-TenantUKLegacy
      - RestApiDeployLegacyUK
    permissions:
      actions: write
      contents: read
      id-token: write
      packages: read
    with:
      runner_label: 'sprinters:aws:eu-west-2:ubuntu-latest:m7i.4xlarge:spot=false:root=gp3/5000/1000:temp=14/gp3/max/750'
      env: dev-cloud
      domain_prefix: ''
      app_or_risksmart_app: 'risksmartapp'
      auth0_region_identifier: 'uk-1'
      auth0_tenant_client_id: 'Drja98Y070tm47O1ASmblG7fR9rfK6Na'
      auth0_client_secret_name: 'UK_1_AUTH0_CLIENT_SECRET'
      auth0_tenant_name: 'dev-cloud-t8t3iey3b54zkh7i'
      hasura_admin_secret_name: 'HASURA_ADMIN_SECRET_UK_1'
      dev_tenant_id_secret_name: 'UK_1_DEV_TENANT_ID'
      dev_cloud_tenant_id_secret_name: 'UK_1_DEV_CLOUD_TENANT_ID'
      staging_tenant_id_secret_name: 'UK_1_STAGING_TENANT_ID'
    secrets: inherit

  ######## ZAPIER APP PUSH ########

  ZapierAppPush:
    name: Zapier App / Push
    runs-on:
      - sprinters:aws:ubuntu-24.04-minimal
    environment:
      name: staging
    steps:
      - name: Setup Turbo cache
        uses: rharkor/caching-for-turbo@d124d2921c97c169010f6a7a624a36e9831472e1 # v 1.8

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.28.2

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Configure pnpm for GitHub Packages
        run: |
          pnpm config set @risk-smart:registry https://npm.pkg.github.com
          pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Build Zapier app
        # Use pnpm directly instead of turbo to avoid triggering external-api's
        # generate-graphql task, which requires a running Hasura instance.
        # The zapier-app's only workspace dependency (external-api) is type-only
        # and fully erased at compile time.
        run: pnpm --filter @risksmart-app/zapier-app run build

      - name: Push to Zapier
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
        run: |
          cd packages/zapier-app
          pnpm exec zapier-platform push --skip-dep-install

  ZapierIntegrationTest:
    name: Zapier App / Integration Test
    needs: [ZapierAppPush, RestApiDeployLegacyUK]
    runs-on:
      - sprinters:aws:ubuntu-24.04-minimal
    environment:
      name: dev-cloud
    permissions:
      actions: write
      contents: read
      packages: read
    timeout-minutes: 15
    steps:
      - name: Setup Turbo cache
        uses: rharkor/caching-for-turbo@d124d2921c97c169010f6a7a624a36e9831472e1 # v 1.8

      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3
        with:
          version: 10.28.2

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://npm.pkg.github.com"

      - name: Configure pnpm for GitHub Packages
        run: |
          pnpm config set @risk-smart:registry https://npm.pkg.github.com
          pnpm config set //npm.pkg.github.com/:_authToken ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install

      - name: Build Zapier app
        # Use pnpm directly instead of turbo to avoid triggering external-api's
        # generate-graphql task, which requires a running Hasura instance.
        # The zapier-app's only workspace dependency (external-api) is type-only
        # and fully erased at compile time.
        run: pnpm --filter @risksmart-app/zapier-app run build

      - name: Run integration tests (Layer 1 - in-process)
        env:
          ZAPIER_INTEGRATION_CLIENT_KEY: ${{ vars.ZAPIER_INTEGRATION_CLIENT_KEY }}
          ZAPIER_INTEGRATION_CLIENT_SECRET: ${{ secrets.ZAPIER_INTEGRATION_CLIENT_SECRET }}
          ZAPIER_INTEGRATION_API_BASE_URL: ${{ vars.ZAPIER_INTEGRATION_API_BASE_URL }}
          ZAPIER_INTEGRATION_OWNER_ID: ${{ vars.ZAPIER_INTEGRATION_OWNER_ID }}
        run: pnpm exec turbo test:integration --filter=@risksmart-app/zapier-app
