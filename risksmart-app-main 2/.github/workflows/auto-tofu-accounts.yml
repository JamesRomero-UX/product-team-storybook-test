# OpenTofu pipeline for all AWS accounts (not workspaces!)
#
# Config: .github/config/accounts.yml
# Action: .github/actions/build-tofu-matrix
#
# Triggers:
#   - PR: Plans for changed account:region only
#   - Push to main: Applies for changed account:region only
#   - workflow_dispatch: Manual plan & apply for selected account (all regions)

name: Auto / Tofu Accounts

on:
  pull_request:
    paths:
      - 'infrastructure/aws/accounts/**'
      - '!infrastructure/aws/accounts/local/**' # exclude local account
      - '.github/workflows/auto-tofu-accounts.yml'
      - '.github/workflows/_template-tofu-plan.yml'
      - '.github/workflows/_template-tofu-apply.yml'
      - '.github/config/accounts.yml'
      - '.github/actions/build-tofu-matrix/**'
  push:
    branches: [main]
    paths:
      - 'infrastructure/aws/accounts/**'
      - '!infrastructure/aws/accounts/local/**' # exclude local account
      - '.github/workflows/auto-tofu-accounts.yml'
      - '.github/workflows/_template-tofu-plan.yml'
      - '.github/workflows/_template-tofu-apply.yml'
      - '.github/config/accounts.yml'
      - '.github/actions/build-tofu-matrix/**'
  workflow_dispatch:
    inputs:
      account:
        description: 'AWS Account to deploy (all regions)'
        required: true
        type: choice
        # Keep in sync with .github/config/accounts.yml
        # Can't figure out how to load below from above config file
        options:
          - audit
          - ci
          - dr
          - dev-cloud
          - integration
          - log-archive
          - prod
          - shared-network
          - staging
          - tech-admin
          - tech-admin-account-test
      action:
        description: 'Tofu action to perform (plan only, or plan and apply)'
        required: true
        type: choice
        default: 'plan'
        options:
          - plan
          - plan-and-apply

permissions:
  contents: read
  packages: read
  pull-requests: read # dorny/paths-filter needs read access to PRs

jobs:
  # SETUP: Detect changes, validate config, and build matrix
  setup:
    name: Setup Job Matrix
    runs-on:
      - sprinters:aws:eu-west-2:ubuntu-24.04-minimal
      - ${{ github.run_id }}-${{ github.run_attempt }}-setup
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-changes: ${{ steps.matrix.outputs.has-changes }}
      config-accounts: ${{ steps.matrix.outputs.config-accounts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # Use dorny/paths-filter for change detection (except on manual trigger)
      - name: Detect changed accounts
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          list-files: json
          filters: |
            accounts:
              - 'infrastructure/aws/accounts/**'
              - '!infrastructure/aws/accounts/local/**'

      # Extract changed account:region pairs from file paths
      # Workflow may trigger on workflow file changes, but we only process
      # actual infrastructure changes. Empty result = no accounts to process.
      - name: Extract changed account:region pairs
        id: accounts
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_ACCOUNT: ${{ github.event.inputs.account }}
          PATHS_CHANGED: ${{ steps.changes.outputs.accounts }}
          CHANGED_FILES_JSON: ${{ steps.changes.outputs.accounts_files }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            # Manual trigger: use selected account (all regions)
            # Format: just account name = all regions from config
            echo "changed=$MANUAL_ACCOUNT" >> "$GITHUB_OUTPUT"
            echo "::notice::Manual trigger for account: $MANUAL_ACCOUNT (all regions)"
          elif [[ "$PATHS_CHANGED" == "true" ]] && [[ -n "$CHANGED_FILES_JSON" ]] && [[ "$CHANGED_FILES_JSON" != "[]" ]]; then
            # Extract account:region pairs from changed file paths
            # e.g., "infrastructure/aws/accounts/ci/eu-west-2/main.tf" -> "ci:eu-west-2"
            # Only process paths that match expected pattern, exclude local/
            # Note: grep returns exit code 1 when no matches found, so use || true
            PAIRS=$(echo "$CHANGED_FILES_JSON" | \
              jq -r '.[]' | \
              { grep '^infrastructure/aws/accounts/' || true; } | \
              { grep -v '^infrastructure/aws/accounts/local/' || true; } | \
              sed 's|^infrastructure/aws/accounts/||' | \
              awk -F'/' '{if(NF>=2) print $1":"$2}' | \
              sort -u | \
              paste -sd',' - || true)
            if [[ -n "$PAIRS" ]]; then
              echo "changed=$PAIRS" >> "$GITHUB_OUTPUT"
              echo "::notice::Changed account:region pairs: $PAIRS"
            else
              echo "changed=" >> "$GITHUB_OUTPUT"
              echo "::notice::No infrastructure account changes detected (only workflow files changed)"
            fi
          else
            echo "changed=" >> "$GITHUB_OUTPUT"
            echo "::notice::No changed accounts detected"
          fi

      # Install yq for YAML processing
      - name: Install yq
        run: |
          sudo wget -O /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Build job matrix for changed accounts only
      - name: Build job matrix for changed accounts
        id: matrix
        uses: ./.github/actions/build-tofu-matrix
        with:
          config-file: .github/config/accounts.yml
          changed-accounts: ${{ steps.accounts.outputs.changed }}

  # Run tofu plan for all matching accounts from job matrix
  plan:
    needs: [setup]
    if: needs.setup.outputs.has-changes == 'true'
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    concurrency:
      group: tofu-${{ matrix.account }}-${{ matrix.region }}
      cancel-in-progress: false
    name: Plan - ${{ matrix.account }}/${{ matrix.region }}
    uses: ./.github/workflows/_template-tofu-plan.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
    with:
      runner_label: 'sprinters:aws:${{ matrix.region }}:ubuntu-24.04-slim'
      env: ${{ matrix.account }}
      aws_region: ${{ matrix.region }}
      account: ${{ matrix.account }}
      tf_actions_working_dir: 'infrastructure/aws/accounts/${{ matrix.account }}/${{ matrix.region }}'
      uses_workspaces: false
      deploy_role: 'arn:aws:iam::${{ matrix.aws_account_id }}:role/${{ matrix.role_name }}'
    secrets: inherit

  # Run tofu apply for all matching accounts (only on push to main or manual)
  # Apply runs after plan within the same workflow execution.
  # The PR plan is informational only, on merge we run a fresh plan and apply.
  apply:
    needs: [setup, plan]
    if: |
      !cancelled() &&
      needs.setup.outputs.has-changes == 'true' &&
      needs.plan.result == 'success' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'plan-and-apply'))
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    concurrency:
      group: tofu-${{ matrix.account }}-${{ matrix.region }}
      cancel-in-progress: false
    name: Apply - ${{ matrix.account }}/${{ matrix.region }}
    uses: ./.github/workflows/_template-tofu-apply.yml
    permissions:
      pull-requests: write
      actions: write
      contents: read
      id-token: write
    with:
      runner_label: 'sprinters:aws:${{ matrix.region }}:ubuntu-24.04-slim'
      env: ${{ matrix.account }}
      aws_region: ${{ matrix.region }}
      account: ${{ matrix.account }}
      tf_actions_working_dir: 'infrastructure/aws/accounts/${{ matrix.account }}/${{ matrix.region }}'
      uses_workspaces: false
      deploy_role: 'arn:aws:iam::${{ matrix.aws_account_id }}:role/${{ matrix.role_name }}'
    secrets: inherit
