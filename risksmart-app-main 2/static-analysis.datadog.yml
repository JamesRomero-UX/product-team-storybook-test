schema-version: v1
rulesets:
  - github-actions
  - typescript-express:
    rules:
      missing-helmet:
        ignore:
          - packages/external-api/src/routes/account.routes.test.ts
  - terraform-aws:
    rules:
      ami-missing-owners:
        ignore:
          - infrastructure/aws/accounts/app-environments/aie-ecs.tf
  - typescript-best-practices:
    rules:
      boolean-prop-naming:
        ignore:
          - "**"
      no-dupe-keys:
        ignore:
          - packages/web/src/pages/assessments/activities/useFilterStore.ts
      no-console:
        ignore:
          - "**/scripts/**"
  - docker-best-practices:
    rules:
      no-new-privileges:
        ignore:
          - docker-compose.yml
          - packages/integrations/docker-compose.yml
      service-writable-filesystem:
        ignore:
          - docker-compose.yml
          - packages/integrations/docker-compose.yml
  - javascript-node-security:
    rules:
      detect-non-literal-fs-filename:
        ignore:
          - scripts/dev-watcher.js
  - typescript-node-security:
    rules:
      sql-injection:
        ignore:
          - packages/external-api/src/auth/cognito-app-client.auth.test.ts
          - packages/external-api/src/auth/cognito-app-client.auth.ts
  - typescript-code-style:
    rules:
      parameter-name:
        ignore:
          - packages/atomic-ui/**/*.stories.tsx
ignore:
  - packages/external-api/src/testing
  - api-stack/nginx/certs
  - packages/scim-api/src/parsers/scim-filter.ts
  - scripts/*
  - scripts/**/*
  - packages/knock/knock_scripts/*
  - packages/events/tsup.config.ts
  - packages/trpc/tsup.config.ts
  - packages/drizzle/tsup.config.ts
  - packages/permitio/tsup.config.ts
  - packages/knock/knock_scripts/*
