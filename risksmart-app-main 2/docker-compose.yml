services:
  postgres:
    image: postgres:16.11
    restart: always
    security_opt:
      - no-new-privileges:true
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./api-stack/postgres-init:/docker-entrypoint-initdb.d
    command: postgres -c max_connections=1000
    environment:
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - min
      - v3
      - ai-chat
      - all
  pdp:
    image: permitio/pdp-v2:0.9.9
    restart: always
    environment:
      PDP_DEBUG: true
      PDP_OPA_CLIENT_QUERY_TIMEOUT: 10
      PDP_API_KEY: ${PDP_API_KEY}
    ports:
      - '7001:7000'
    profiles:
      - v3
      - all

  nginx:
    user: 1014:1014
    image: nginxinc/nginx-unprivileged:alpine
    tmpfs:
      - /tmp/nginx/conf.d:rw,exec,nosuid,nodev,size=10M,uid=1014,gid=1014
    ports:
      - '443:443'
    restart: always
    depends_on:
      - event-proxy
    volumes:
      - ./api-stack/nginx/certs:/etc/nginx/ssl:ro
      - ./api-stack/nginx/conf/proxy.conf:/etc/nginx/conf.d/proxy.conf:ro
      - ./api-stack/nginx/templates/proxy.conf.template:/etc/nginx/templates/proxy.conf.template:ro
    environment:
      REST_API_DOMAIN: ${REST_API_DOMAIN}
      NGINX_ENVSUBST_OUTPUT_DIR: /tmp/nginx/conf.d
      PDP_DEBUG: true
    profiles:
      - min
      - v3
      - ai-chat
      - all

  event-proxy:
    build:
      context: api-stack/event-proxy
    restart: always
    environment:
      REST_API_DOMAIN: ${REST_API_DOMAIN}
    ports:
      - '80:80'
    profiles:
      - min
      - v3
      - ai-chat
      - all

  dynamodb-local:
    image: amazon/dynamodb-local:latest
    restart: always
    user: root
    ports:
      - '8000:8000'
    command: '-jar DynamoDBLocal.jar -sharedDb -dbPath /data'
    volumes:
      - dynamo_db_data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf -o /dev/null -w "%{http_code}" http://localhost:8000 | grep -q 400',
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - v3
      - all

  rustfs:
    image: rustfs/rustfs:latest
    restart: always
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - RUSTFS_ACCESS_KEY=local
      - RUSTFS_SECRET_KEY=local
    volumes:
      - rustfs_data:/data
    healthcheck:
      test:
        [
          'CMD',
          'sh',
          '-c',
          'curl -f http://127.0.0.1:9000/health && curl -f http://127.0.0.1:9001/rustfs/console/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - v3
      - all

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    restart: always
    ports:
      - '9324:9324'
      - '9325:9325'
    volumes:
      - ./scripts/elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://localhost:9325 || exit 1']
      interval: 5s
      timeout: 3s
      retries: 10
    profiles:
      - v3
      - all

  aws-init:
    image: node:20-slim
    volumes:
      - ./scripts:/scripts:ro
      - ./dynamo:/dynamo:ro
    working_dir: /tmp/aws-init
    command: >
      sh -c "
        cp /scripts/init-local-aws.js . &&
        echo '{\"type\":\"module\",\"dependencies\":{\"@aws-sdk/client-dynamodb\":\"*\",\"@aws-sdk/client-s3\":\"*\"}}' > package.json &&
        npm install --silent 2>/dev/null &&
        echo 'Waiting for DynamoDB...' &&
        for i in $$(seq 1 30); do node -e \"fetch('http://dynamodb-local:8000').catch(()=>process.exit(1))\" 2>/dev/null && break || sleep 2; done &&
        echo 'Waiting for RustFS...' &&
        for i in $$(seq 1 30); do node -e \"fetch('http://rustfs:9000').catch(()=>process.exit(1))\" 2>/dev/null && break || sleep 2; done &&
        node init-local-aws.js
      "
    environment:
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      S3_ENDPOINT: http://rustfs:9000
      SQS_ENDPOINT: http://elasticmq:9324
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      dynamodb-local:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    profiles:
      - v3
      - all

  trpc:
    build:
      context: .
      dockerfile: packages/trpc/Dockerfile
    restart: always
    environment:
      PDP_API_KEY: ${PDP_API_KEY}
      # Hardcoded Docker network hostnames — never use .env values for in-container endpoints
      PDP_ENDPOINT: ${PDP_ENDPOINT:-http://pdp:7000}
      IS_LOCAL: true
      TENANT_CONFIG_TABLE: TenantConfig
      AWS_ENDPOINT_URL_DYNAMODB: http://dynamodb-local:8000
      AWS_REGION: eu-west-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOCAL_DATABASE_CONNECTION_STRING: postgres://postgres:postgrespassword@postgres:5432/postgres
      JWT_SECRET_CONFIG: '{"issuers":{"https://dev-t8t3iey3b54zkh7i.uk.auth0.com":{"type":"RS256","jwk_url":"https://dev-t8t3iey3b54zkh7i.uk.auth0.com/.well-known/jwks.json","allowed_skew":600},"http://localhost:3232":{"type":"RS256","jwk_url":"http://mock-auth-provider:3232/jwks"}, "https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_QLUpf3Klf": {"type":"RS256", "jwk_url": "https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_QLUpf3Klf/.well-known/jwks.json"}}}'
      # AWS mock endpoints — service URLs resolved via local mocks
      AWS_ENDPOINT_URL_SSM: http://ssm-mock:3012
      AWS_ENDPOINT_URL_SECRETS_MANAGER: http://secrets-manager-mock:3013
      # SSM parameter paths and secret names — injected by dev.js at container
      # restart via process env (discovered from CDK synth output, not hardcoded).
      DATA_LAYER_CLIENT_API_URL_SSM_PARAM: ${DATA_LAYER_CLIENT_API_URL_SSM_PARAM:-}
      REQUEST_STATE_API_URL_SSM_PARAM: ${REQUEST_STATE_API_URL_SSM_PARAM:-}
      AI_FEEDBACK_API_URL_SSM_PARAM: ${AI_FEEDBACK_API_URL_SSM_PARAM:-}
      PERMIT_SECRET_NAME: ${PERMIT_SECRET_NAME:-}
      KNOCK_HOST: ${KNOCK_HOST:-https://api.knock.app}
      KNOCK_SECRET_KEY: ${KNOCK_SECRET_KEY:-}
      KNOCK_TENANT_OVERRIDE: ${KNOCK_TENANT_OVERRIDE:-}
      AUTH0_CLIENT_SECRET: ${AUTH0_CLIENT_SECRET}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_MANAGEMENT_CLIENT_ID: ${AUTH0_MANAGEMENT_CLIENT_ID}
      AUTH0_STUB_URL: ${AUTH0_STUB_URL:-}
      AUTH0_RISK_SMART_REST_API_CLIENT_ID: ${AUTH0_RISK_SMART_REST_API_CLIENT_ID}
      REACT_APP_AUTH0_CLIENT_ID: ${REACT_APP_AUTH0_CLIENT_ID}
    ports:
      - '2021:2021'
    expose:
      - '2021'
    command: node dist/app.js
    healthcheck:
      test: node -e "fetch('http://localhost:2021/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 60s
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      aws-init:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      ssm-mock:
        condition: service_healthy
      secrets-manager-mock:
        condition: service_healthy
    networks:
      - default
    profiles:
      - v3
      - all

  mcp-server:
    build:
      context: .
      dockerfile: packages/mcp-server/Dockerfile
    restart: always
    environment:
      PORT: '8022'
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://localhost:8022}
      TRPC_SERVICE_BASE_URL: http://trpc:2021
      AUTH0_DOMAIN: dev-t8t3iey3b54zkh7i.uk.auth0.com
      AUTH0_API_AUDIENCE: ${AUTH0_API_REST_AUDIENCE:-http://localhost:8080}
      AUTH0_MANAGEMENT_CLIENT_ID: ${AUTH0_MANAGEMENT_CLIENT_ID}
      AUTH0_MANAGEMENT_CLIENT_SECRET: ${AUTH0_MANAGEMENT_CLIENT_SECRET}
      JWT_SECRET_CONFIG: '{"issuers":{"https://dev-t8t3iey3b54zkh7i.uk.auth0.com":{"type":"RS256","jwk_url":"https://dev-t8t3iey3b54zkh7i.uk.auth0.com/.well-known/jwks.json","allowed_skew":30},"http://localhost:3232":{"type":"RS256","jwk_url":"http://mock-auth-provider:3232/jwks"}, "https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_QLUpf3Klf": {"type":"RS256", "jwk_url": "https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_QLUpf3Klf/.well-known/jwks.json"}}}'
    ports:
      - '8022:8022'
    expose:
      - '8022'
    command: node dist/app.js
    healthcheck:
      test: node -e "fetch('http://localhost:8022/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      - default
    profiles:
      - mcp
      - all

  stub-pdp:
    build:
      context: .
      dockerfile: packages/trpc-api-tests/Dockerfile
    restart: always
    ports:
      - '8010:8010'
    expose:
      - '8010'
    command: node dist/stub-pdp/app.js
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8010/healthz || exit 1
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      - default
    profiles:
      - v3
      - all

  stub-auth0:
    build:
      context: .
      dockerfile: packages/trpc-api-tests/Dockerfile
    restart: always
    ports:
      - '8020:8020'
    expose:
      - '8020'
    command: node dist/stub-auth0/app.js
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8020/healthz || exit 1
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      - default
    profiles:
      - v3
      - all

  mock-auth-provider:
    build:
      context: .
      dockerfile: packages/local-auth-provider/Dockerfile
    ports:
      - '3232:3232'
    environment:
      LOG_LEVEL: DEBUG
      MOCK_AUTH_PORT: 3232
    command: node dist/index.js
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:3232/.well-known/openid-configuration || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    profiles:
      - external-api
      - v3
      - all
  external-api:
    build:
      context: .
      dockerfile: packages/external-api/Dockerfile
    restart: always
    environment:
      PORT: '3200'
      MOCK_AUTH_PORT: '3232'
      AUTH_CONFIG: '{"clientType": "cognito","userPoolId": "eu-west-2_QLUpf3Klf","authTableName": "ext-api-clients-tbl", "tokenUrl": "https://dev-cloud-ext-api.auth.eu-west-2.amazoncognito.com/oauth2/token"}'
      AUTH_JWT_PROVIDERS: '[{"issuer":"http://localhost:3232","alg":"RS256","jwkUri":"http://mock-auth-provider:3232/jwks"},{"issuer": "https://dev-t8t3iey3b54zkh7i.uk.auth0.com","alg":"RS256", "jwkUri":"https://dev-t8t3iey3b54zkh7i.uk.auth0.com/.well-known/jwks.json"},{"issuer": "https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_QLUpf3Klf","alg":"RS256", "jwkUri": "https://cognito-idp.eu-west-2.amazonaws.com/eu-west-2_QLUpf3Klf/.well-known/jwks.json"},{"issuer":"https://dev-cloud-t8t3iey3b54zkh7i.uk.auth0.com","alg":"RS256","jwkUri":"https://dev-cloud-t8t3iey3b54zkh7i.uk.auth0.com/.well-known/jwks.json"}]'
      API_DOCS_SIGNING_KEY: '8eQg4jb0gPd872jPgIEc5XhfTbw0Y5QaHVMy4jV85SViMAUUxixlRuLZkV1ioiB06ByzoJGbWx1gU33zNhmkJw'
      TRPC_SERVICE_BASE_URL: 'http://trpc:2021'
      DATA_CLIENT_TYPE: 'trpc'
      APP_ENVIRONMENT: 'local-docker'
      ALLOWED_RS_USER_ROLES: '["RiskManager"]'
      RATE_LIMIT_TBL_NAME: 'ext-api-rate-limit-tbl'
      ENABLE_RATE_LIMITER: 'false'
      ENABLE_TRUST_PROXY: 'false'
      AWS_REGION: 'eu-west-2'
      APP_DOMAIN: 'localhost:3200'
      HASURA_ENDPOINT: 'http://graphql-engine:8080/v1/graphql'
      HASURA_ADMIN_SECRET: 'myadminsecretkey'
    ports:
      - '3200:3200'
    expose:
      - '3200'
    command: node dist/index.js
    healthcheck:
      test: node -e "fetch('http://localhost:3200/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    profiles:
      - external-api
      - all
      - v3

  graphql-engine:
    image: hasura/graphql-engine:v2.48.11
    ports:
      - '8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    environment:
      ## postgres database to store Hasura metadata
      HASURA_GRAPHQL_METADATA_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/postgres?application_name=hasura
      ## this env var can be used to add the above postgres database to Hasura as a data source. this can be removed/updated based on your needs
      PG_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/postgres?application_name=hasura
      HASURA_GRAPHQL_DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/postgres?application_name=hasura
      ## enable the console served by server
      HASURA_GRAPHQL_ENABLE_CONSOLE: 'true' # set to "false" to disable console
      ## enable debugging mode. It is recommended to disable this in production
      HASURA_GRAPHQL_DEV_MODE: 'true'
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: 'startup,http-log,webhook-log,websocket-log,query-log,execution-log,livequery-poller-log,action-handler-log,data-connector-log'
      HASURA_GRAPHQL_ENABLE_TELEMETRY: 'false'
      TENANT: 'MultiTenant'

      ## uncomment next line to run console offline (i.e load console assets from server instead of CDN)
      # HASURA_GRAPHQL_CONSOLE_ASSETS_DIR: /srv/console-assets
      ## uncomment next line to set an admin secret
      HASURA_GRAPHQL_ADMIN_SECRET: myadminsecretkey
      # Get the JWT secret from the environment variable
      # HASURA_GRAPHQL_JWT_SECRET: ${HASURA_GRAPHQL_JWT_SECRET}
      HASURA_GRAPHQL_ENABLE_REMOTE_SCHEMA_PERMISSIONS: 'true'
      HASURA_GRAPHQL_JWT_SECRET: '{"type":"RS256","jwk_url": "https://dev-t8t3iey3b54zkh7i.uk.auth0.com/.well-known/jwks.json", "allowed_skew": 600}'
      HASURA_GRAPHQL_ENVIRONMENT: 'dev'
      REST_API_DOMAIN: nginx
      REST_API_KEY: ${REST_API_KEY}
    volumes:
      - type: bind
        source: ./api-stack/nginx/certs/nginx-selfsigned.crt
        target: /etc/ssl/certs/nginx-selfsigned.crt
        read_only: true
    security_opt:
      - no-new-privileges:true
    profiles:
      - min
      - v3
      - ai-chat
      - all

    # AI Chat Agent Service (ECR Image)
  ai-chat-agent:
    image: ${AI_CHAT_AGENT_ECR_IMAGE:-437474201705.dkr.ecr.eu-west-2.amazonaws.com/risksmart/chat-agent:0e78db4}
    restart: always
    ports:
      - '8427:8000'
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-local}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://host.docker.internal:11434}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-llama3.1:8b}
      SUPERVISOR_TEMPERATURE: ${SUPERVISOR_TEMPERATURE:-0.1}
      RISK_AGENT_TEMPERATURE: ${RISK_AGENT_TEMPERATURE:-0.3}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-dev-t8t3iey3b54zkh7i.uk.auth0.com}
      AUTH0_API_AUDIENCE: ${AUTH0_API_AUDIENCE:-http://localhost:8080}
      AUTH0_ISSUER: ${AUTH0_ISSUER:-https://dev-t8t3iey3b54zkh7i.uk.auth0.com/}
      AUTH0_ALGORITHMS: ${AUTH0_ALGORITHMS:-["RS256"]}
      E2E_MOCK_MODE: ${E2E_MOCK_MODE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SENTRY_ENABLED: ${SENTRY_ENABLED:-false}
      # LangSmith Configuration
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://eu.api.smith.langchain.com}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-pr-ai-assistant}
    healthcheck:
      test:
        [
          'CMD',
          'curl',
          '-f',
          'http://localhost:8000/ai-engine/chat-agent/health',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    profiles:
      - ai-chat
      - all
    extra_hosts:
      - 'host.docker.internal:host-gateway'

  # To be implemented in stage two with fargate cluster and redis
  # hybiscus-server:
  #   image:  437474201705.dkr.ecr.eu-west-2.amazonaws.com/hybiscusdev/managed-cloud-api:latest
  #   restart: always
  #   ports:
  #     - '3000:3030'
  #   environment:
  #     HYBISCUS_API_KEY: 'DEV_KEY'
  #     API_KEY: 'your_api_key_here'

  ssm-mock:
    image: node:20-slim
    restart: always
    volumes:
      - ./scripts/local-mocks/ssm-mock.js:/app/ssm-mock.js:ro
    working_dir: /app
    command: node --experimental-modules ssm-mock.js
    environment:
      SSM_MOCK_PORT: '3012'
    ports:
      - '3012:3012'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3012\").catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - v3
      - all

  secrets-manager-mock:
    image: node:20-slim
    restart: always
    volumes:
      - ./scripts/local-mocks/secrets-manager-mock.js:/app/secrets-manager-mock.js:ro
    working_dir: /app
    command: node --experimental-modules secrets-manager-mock.js
    environment:
      SECRETS_MANAGER_MOCK_PORT: '3013'
    ports:
      - '3013:3013'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:3013\").catch(()=>process.exit(1))"',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles:
      - v3
      - all

volumes:
  db_data:
  dynamo_db_data:
  rustfs_data:

networks:
  default:
    driver: bridge
