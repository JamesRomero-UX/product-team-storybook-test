mutation UpdateAuthUser(
  $User_Id: String!
  $OrgKey: String!
  $_set: auth_user_set_input!
) {
  update_auth_user(
    where: {
      Id: { _eq: $User_Id }
      organisationusers: { OrgKey: { _eq: $OrgKey } }
    }
    _set: $_set
  ) {
    returning {
      Id
      FirstName
      LastName
      UserName
      Email
      Status
      CreatedOn
      AuthUser_Id
      DisplayName
      JobTitle
      Department
      OfficeLocation
      organisationusers {
        OrgKey
        RoleKey
        External_Id
        LastSeen
        Status
      }
    }
    affected_rows
  }
}
