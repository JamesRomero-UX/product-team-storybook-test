mutation InsertUser(
  $userId: String!
  $userName: String
  $firstName: String
  $lastName: String
  $email: String
  $clientId: String
  $clientName: String
  $tenant: String
  $connectionID: String
  $connection: String
  $role_key: String
  $auth0UserId: String
  $status: user_status_enum = active
  $externalId: String
  $displayName: String
  $jobTitle: String
  $department: String
  $officeLocation: String
  $createdByUser: String
  $orgKey: String!
) {
  insert_auth_user_one(
    object: {
      Id: $userId
      UserName: $userName
      FirstName: $firstName
      LastName: $lastName
      Email: $email
      AuthClient_Id: $clientId
      AuthClientName: $clientName
      AuthTenant: $tenant
      AuthConnection_Id: $connectionID
      AuthConnection: $connection
      RoleKey: $role_key
      AuthUser_Id: $auth0UserId
      Status: $status
      External_Id: $externalId
      DisplayName: $displayName
      JobTitle: $jobTitle
      Department: $department
      OfficeLocation: $officeLocation
      CreatedByUser: $createdByUser
      organisationusers: {
        data: {
          OrgKey: $orgKey
          RoleKey: $role_key
          External_Id: $externalId
          Status: $status
        }
      }
    }
  ) {
    Id
    FirstName
    LastName
    UserName
    Email
    Status
    CreatedOn
    AuthUser_Id
    DisplayName
    JobTitle
    Department
    OfficeLocation
    organisationusers {
      RoleKey
      External_Id
      LastSeen
      Status
    }
  }
}
