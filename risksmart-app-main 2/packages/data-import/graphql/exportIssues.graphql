query exportIssues(
  $OrgKey: String!
  $FromDate: timestamptz!
  $ToDate: timestamptz!
) {
  issue(
    where: {
      OrgKey: { _eq: $OrgKey }
      _or: [
        { DateIdentified: { _gte: $FromDate, _lte: $ToDate } }
        { DateOccurred: { _gte: $FromDate, _lte: $ToDate } }
      ]
    }
  ) {
    DateIdentified
    DateOccurred
    Details
    Id
    ImpactsCustomer
    IsExternalIssue
    CreatedAtTimestamp
    ModifiedAtTimestamp
    Title
    CreatedByUser
    ModifiedByUser
    SequentialId
    CustomAttributeData

    owners {
      UserId
      user {
        UserName
        Id
      }
    }
    ownerGroups {
      UserGroupId
      group {
        Name
      }
    }
    contributors {
      UserId
      user {
        UserName
        Id
      }
    }
    contributorGroups {
      UserGroupId
      group {
        Name
      }
    }
    ancestorContributors {
      ContributorType
      UserId
      Id
      AncestorId
      UserGroupId
      user {
        UserName
      }
      user_group {
        Name
      }
    }

    assessment {
      ActualCloseDate
      CertifiedIndividual
      IssueCausedBySystemIssue
      IssueCausedByThirdParty
      IssueType
      ParentIssueId
      PoliciesBreached
      PolicyBreach
      PolicyOwner
      PolicyOwnerCommentary
      Rationale
      RegulatoryBreach
      RegulationsBreached
      Reportable
      Severity
      Status
      SystemResponsible
      TargetCloseDate
      ThirdPartyResponsible
      CreatedAtTimestamp
      ModifiedAtTimestamp
      CreatedByUser
      ModifiedByUser
      Id
      CustomAttributeData

      modifiedByUser {
        UserName
      }
      createdByUser {
        UserName
      }
      certifiedIndividual {
        UserName
      }
      departments {
        type {
          Description
          Name
        }
      }
    }

    causes {
      ModifiedByUser
      CreatedByUser
      Title
      ModifiedAtTimestamp
      CreatedAtTimestamp
      Significance
      ParentIssueId
      Id
      Description
      CustomAttributeData
    }

    consequences {
      CostType
      CostValue
      Criticality
      Description
      Id
      ParentIssueId
      ModifiedAtTimestamp
      CreatedAtTimestamp
      Title
      CreatedByUser
      ModifiedByUser
      CustomAttributeData
      Type
    }

    actions {
      action {
        DateDue
        DateRaised
        Description
        Id
        Priority
        Status
        ModifiedAtTimestamp
        CreatedAtTimestamp
        Title
        CreatedByUser
        ModifiedByUser
        ClosedDate
        CustomAttributeData
        SequentialId
      }
    }

    updates {
      Description
      Id
      ParentIssueId
      CreatedAtTimestamp
      ModifiedAtTimestamp
      Title
      CreatedByUser
      ModifiedByUser
      CustomAttributeData
    }
  }
}
