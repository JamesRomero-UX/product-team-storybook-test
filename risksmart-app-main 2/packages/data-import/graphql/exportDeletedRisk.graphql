query exportDeleteRisk($Id: uuid!) {
  risk_audit(
    where: { Id: { _eq: $Id }, Action: { _eq: "DELETE" } }
    order_by: { ModifiedAtTimestamp: desc }
    limit: 1
  ) {
    CreatedAtTimestamp
    CreatedByUser
    CustomAttributeData
    Description
    Id
    ModifiedAtTimestamp
    ModifiedByUser
    OrgKey
    ParentRiskId
    SequentialId
    Status
    Tier
    Title
    Treatment
    ownerAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      UserId
      ModifiedAtTimestamp
    }
    ownerGroupAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      UserGroupId
      ModifiedAtTimestamp
    }
    contributorAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      UserId
      ModifiedAtTimestamp
    }
    contributorGroupAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      UserGroupId
      ModifiedAtTimestamp
    }
    tagAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      TagTypeId
      ModifiedAtTimestamp
    }
    departmentAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      DepartmentTypeId
      ModifiedAtTimestamp
    }
    assessmentResultAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      Id
      ResultType
      ModifiedAtTimestamp
    }
    controlAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      ControlId
      ModifiedAtTimestamp
    }
    acceptanceAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      Id
      ModifiedAtTimestamp
    }
    actionAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      ActionId
      ModifiedAtTimestamp
    }
    appetiteAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      Id
      ModifiedAtTimestamp
    }

    impactRatingAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      Id
      ModifiedAtTimestamp
    }
    indicatorAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      IndicatorId
      ModifiedAtTimestamp
    }
  }
}
