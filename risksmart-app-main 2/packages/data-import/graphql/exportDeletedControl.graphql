query exportDeleteControl($Id: uuid!) {
  control_audit(
    where: { Id: { _eq: $Id }, Action: { _eq: "DELETE" } }
    order_by: { ModifiedAtTimestamp: desc }
    limit: 1
  ) {
    CreatedByUser
    ModifiedByUser
    Description
    Id
    CreatedAtTimestamp
    ModifiedAtTimestamp
    Title
    Type
    CustomAttributeData
    SequentialId
    ownerAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      UserId
      ModifiedAtTimestamp
    }
    ownerGroupAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      UserGroupId
      ModifiedAtTimestamp
    }
    contributorAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      UserId
      ModifiedAtTimestamp
    }
    contributorGroupAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      UserGroupId
      ModifiedAtTimestamp
    }
    tagAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      TagTypeId
      ModifiedAtTimestamp
    }
    departmentAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      DepartmentTypeId
      ModifiedAtTimestamp
    }
    testResultAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      Description
      DesignEffectiveness
      Id
      NextTestDate
      OverallEffectiveness
      PerformanceEffectiveness
      Submitter
      TestDate
      TestType
      CreatedAtTimestamp
      ModifiedAtTimestamp
      Title
      CreatedByUser
      ModifiedByUser
      CustomAttributeData
    }

    issueAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      IssueId
      ModifiedAtTimestamp
      ModifiedByUser
      CreatedByUser
      CreatedAtTimestamp
    }

    actionAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      ActionId
      ModifiedAtTimestamp
      ModifiedByUser
      CreatedByUser
      CreatedAtTimestamp
    }

    indicatorAudits(
      where: { Action: { _eq: "DELETE" } }
      order_by: { ModifiedAtTimestamp: desc }
    ) {
      IndicatorId
      ModifiedAtTimestamp
      ModifiedByUser
      CreatedByUser
      CreatedAtTimestamp
    }
  }
}
