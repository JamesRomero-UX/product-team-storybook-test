mutation insertAll(
  $thirdParties: [third_party_insert_input!]!
  $schedules: [schedule_insert_input!]!
  $indicators: [indicator_insert_input!]!
  $indicatorResults: [indicator_result_insert_input!]!
  $userGroups: [user_group_insert_input!]!
  $ownerGroups: [owner_group_insert_input!]!
  $contributorGroups: [contributor_group_insert_input!]!
  $controls: [control_insert_input!]!
  $controlParents: [control_parent_insert_input!]!
  $risks: [risk_insert_input!]!
  $acceptances: [acceptance_insert_input!]!
  $appetites: [appetite_insert_input!]!
  $appetiteParents: [appetite_parent_insert_input!]!
  $testResults: [test_result_insert_input!]!
  $issue: [issue_insert_input!]!
  $issueBreachLog: [issue_insert_input!]!
  $issueSarLog: [issue_insert_input!]!
  $issuePciBreachLog: [issue_insert_input!]!
  $issueGdprBreachLog: [issue_insert_input!]!
  $issueConsumerDuty: [issue_insert_input!]!
  $issueCustomerTrust: [issue_insert_input!]!
  $issueRiskEvent: [issue_insert_input!]!
  $issueAssessment: [issue_assessment_insert_input!]!
  $issueAssessmentBreachLog: [issue_assessment_insert_input!]!
  $issueAssessmentSarLog: [issue_assessment_insert_input!]!
  $issueAssessmentPciBreachLog: [issue_assessment_insert_input!]!
  $issueAssessmentGdprBreachLog: [issue_assessment_insert_input!]!
  $issueAssessmentConsumerDuty: [issue_assessment_insert_input!]!
  $issueAssessmentCustomerTrust: [issue_assessment_insert_input!]!
  $issueAssessmentRiskEvent: [issue_assessment_insert_input!]!
  $actions: [action_insert_input!]!
  $causes: [cause_insert_input!]!
  $consequences: [consequence_insert_input!]!
  $actionParents: [action_parent_insert_input!]!
  $issueParents: [issue_parent_insert_input!]!
  $actionUpdates: [action_update_insert_input!]!
  $issueUpdates: [issue_update_insert_input!]!
  $tagTypes: [tag_type_insert_input!]!
  $tags: [tag_insert_input!]!
  $departmentTypes: [department_type_insert_input!]!
  $departments: [department_insert_input!]!
  $users: [auth_user_insert_input!]!
  $organisationUsers: [auth_organisationuser_insert_input!]!
  $controlGroups: [control_group_insert_input!]!
  $owners: [owner_insert_input!]!
  $contributors: [contributor_insert_input!]!
  $obligations: [obligation_insert_input!]!
  $assessments: [assessment_insert_input!]!
  $controlledRiskAssessmentResults: [risk_assessment_result_insert_input!]!
  $uncontrolledRiskAssessmentResults: [risk_assessment_result_insert_input!]!
  $indicatorParents: [indicator_parent_insert_input!]!
  $obligationAssessmentResults: [obligation_assessment_result_insert_input!]!
  $entities: [entity_insert_input!]!
  $enterpriseRisks: [enterprise_risk_insert_input!]!
  $enterpriseRiskInstances: [enterprise_risk_instance_insert_input!]!
) {
  insert_third_party(objects: $thirdParties) {
    affected_rows
  }
  insert_auth_user(objects: $users) {
    affected_rows
  }
  insert_user_group(objects: $userGroups) {
    affected_rows
  }

  insert_auth_organisationuser(objects: $organisationUsers) {
    affected_rows
  }

  insert_control_group(objects: $controlGroups) {
    affected_rows
  }

  insert_risk(objects: $risks) {
    affected_rows
  }

  insert_obligation(objects: $obligations) {
    affected_rows
  }

  insert_control(objects: $controls) {
    affected_rows
  }

  insert_acceptance(objects: $acceptances) {
    affected_rows
  }

  insert_appetite(objects: $appetites) {
    affected_rows
  }

  insert_test_result(objects: $testResults) {
    affected_rows
  }

  insertIssue: insert_issue(objects: $issue) {
    affected_rows
  }

  insertIssueBreachLog: insert_issue(objects: $issueBreachLog) {
    affected_rows
  }

  insertIssueSarLog: insert_issue(objects: $issueSarLog) {
    affected_rows
  }

  insertIssuePciBreachLog: insert_issue(objects: $issuePciBreachLog) {
    affected_rows
  }

  insertIssueGdprBreachLog: insert_issue(objects: $issueGdprBreachLog) {
    affected_rows
  }

  insertIssueConsumerDuty: insert_issue(objects: $issueConsumerDuty) {
    affected_rows
  }
  insertIssueCustomerTrust: insert_issue(objects: $issueCustomerTrust) {
    affected_rows
  }
  insertIssueRiskEvent: insert_issue(objects: $issueRiskEvent) {
    affected_rows
  }

  insertIssueAssessment: insert_issue_assessment(objects: $issueAssessment) {
    affected_rows
  }

  insertIssueAssessmentBreachLog: insert_issue_assessment(
    objects: $issueAssessmentBreachLog
  ) {
    affected_rows
  }

  insertIssueAssessmentSarLog: insert_issue_assessment(
    objects: $issueAssessmentSarLog
  ) {
    affected_rows
  }

  insertIssueAssessmentPciBreachLog: insert_issue_assessment(
    objects: $issueAssessmentPciBreachLog
  ) {
    affected_rows
  }

  insertIssueAssessmentGdprBreachLog: insert_issue_assessment(
    objects: $issueAssessmentGdprBreachLog
  ) {
    affected_rows
  }

  insertIssueAssessmentConsumerDuty: insert_issue_assessment(
    objects: $issueAssessmentConsumerDuty
  ) {
    affected_rows
  }
  insertIssueAssessmentCustomerTrust: insert_issue_assessment(
    objects: $issueAssessmentCustomerTrust
  ) {
    affected_rows
  }
  insertIssueAssessmentRiskEvent: insert_issue_assessment(
    objects: $issueAssessmentRiskEvent
  ) {
    affected_rows
  }

  insert_indicator(objects: $indicators) {
    affected_rows
  }

  insert_indicator_result(objects: $indicatorResults) {
    affected_rows
  }

  insert_action(objects: $actions) {
    affected_rows
  }

  insert_cause(objects: $causes) {
    affected_rows
  }

  insert_consequence(objects: $consequences) {
    affected_rows
  }

  insert_action_update(objects: $actionUpdates) {
    affected_rows
  }

  insert_issue_update(objects: $issueUpdates) {
    affected_rows
  }
  insert_assessment(objects: $assessments) {
    affected_rows
  }
  controlledRiskAssessmentResults: insert_risk_assessment_result(
    objects: $controlledRiskAssessmentResults
  ) {
    affected_rows
  }
  uncontrolledRiskAssessmentResults: insert_risk_assessment_result(
    objects: $uncontrolledRiskAssessmentResults
  ) {
    affected_rows
  }
  insert_obligation_assessment_result(objects: $obligationAssessmentResults) {
    affected_rows
  }
  insert_tag_type(objects: $tagTypes) {
    affected_rows
  }

  insert_tag(
    objects: $tags
    on_conflict: { constraint: tag_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  insert_department_type(objects: $departmentTypes) {
    affected_rows
  }

  insert_department(
    objects: $departments
    on_conflict: { constraint: department_pkey, update_columns: [] }
  ) {
    affected_rows
  }
  insert_owner(
    objects: $owners
    on_conflict: { constraint: owner_pkey, update_columns: [] }
  ) {
    affected_rows
  }
  insert_owner_group(
    objects: $ownerGroups
    on_conflict: { constraint: owner_group_pkey, update_columns: [] }
  ) {
    affected_rows
  }
  insert_contributor_group(
    objects: $contributorGroups
    on_conflict: { constraint: contributor_group_pkey, update_columns: [] }
  ) {
    affected_rows
  }
  insert_contributor(
    objects: $contributors
    on_conflict: { constraint: contributor_pkey, update_columns: [] }
  ) {
    affected_rows
  }
  
  insert_schedule(
    objects: $schedules
    on_conflict: {
      constraint: schedule_pkey
      update_columns: [
        Frequency
        ManualDueDate
        TimeToCompleteValue
        TimeToCompleteUnit
        StartDate
        ModifiedAtTimestamp
        ModifiedByUser
      ]
    }
  ) {
    affected_rows
  }
  insert_entity(objects: $entities) {
    affected_rows
  }

  insert_enterprise_risk(objects: $enterpriseRisks) {
    affected_rows
  }

  insert_enterprise_risk_instance(objects: $enterpriseRiskInstances) {
    affected_rows
  }

  insert_action_parent(
    objects: $actionParents
    on_conflict: { constraint: action_parent_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  insert_issue_parent(
    objects: $issueParents
    on_conflict: { constraint: issue_parent_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  insert_control_parent(
    objects: $controlParents
    on_conflict: { constraint: control_parent_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  insert_appetite_parent(
    objects: $appetiteParents
    on_conflict: { constraint: appetite_parent_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  insert_indicator_parent(
    objects: $indicatorParents
    on_conflict: { constraint: indicator_parent_pkey, update_columns: [] }
  ) {
    affected_rows
  }
}
