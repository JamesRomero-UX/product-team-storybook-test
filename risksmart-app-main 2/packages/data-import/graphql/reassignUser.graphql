  updateOwnerCreatedByUser: update_owner(
    where: { CreatedByUser: { _eq: $OldUserId }, OrgKey: { _eq: $OrgKey } }
    _set: {
      CreatedByUser: $NewUserId
      ModifiedAtTimestamp: $ModifiedAtTimestamp1
      ModifiedByUser: "SYSTEM"
    }
  ) {
    affected_rows
  }

