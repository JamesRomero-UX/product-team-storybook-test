query getFormConfiguration($orgKey: String) {
  form_configuration(where: { OrgKey: { _eq: $orgKey } }) {
    ParentType
    customAttributeSchema {
      UiSchema
      Schema
      Id
    }
    fields_config {
      Hidden
      ReadOnly
      Required
      FormConfigurationParentType
      FieldId
      DefaultValue
      Label
      Description
      Conditions
    }
  }
}
