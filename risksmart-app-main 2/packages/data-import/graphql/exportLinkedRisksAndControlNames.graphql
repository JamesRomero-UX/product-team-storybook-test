query ExportLinkedRiskAndControlName($Targets: [uuid!]!) {
  linked_item(
    where: {
      Target: { _in: $Targets }
      _or: [{ source_risk: {} }, { source_control: {} }]
    }
  ) {
    Target
    source_risk {
      Id
      Title
      SequentialId
    }
    source_control {
      Id
      Title
      SequentialId
    }
  }
}
