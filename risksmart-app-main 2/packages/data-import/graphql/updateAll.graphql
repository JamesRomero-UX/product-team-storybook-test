mutation updateAll(
  $controls: [control_updates!]!
  $risks: [risk_updates!]!
  $actions: [action_updates!]!
  $obligations: [obligation_updates!]!
  $controlledRiskAssessmentResults: [risk_assessment_result_updates!]!
  $uncontrolledRiskAssessmentResults: [risk_assessment_result_updates!]!
) {
  update_risk_many(updates: $risks) {
    affected_rows
  }

  update_obligation_many(updates: $obligations) {
    affected_rows
  }

  update_control_many(updates: $controls) {
    affected_rows
  }

  update_action_many(updates: $actions) {
    affected_rows
  }

  controlledRiskAssessmentResults: update_risk_assessment_result_many(
    updates: $controlledRiskAssessmentResults
  ) {
    affected_rows
  }

  uncontrolledRiskAssessmentResults: update_risk_assessment_result_many(
    updates: $uncontrolledRiskAssessmentResults
  ) {
    affected_rows
  }
}
