mutation insertIssueUpdate(
  $ParentIssueId: uuid!
  $Description: String!
  $Title: String!
  $CustomAttributeData: jsonb
) {
  insert_issue_update_one(
    object: {
      Description: $Description
      ParentIssueId: $ParentIssueId
      Title: $Title
      CustomAttributeData: $CustomAttributeData
    }
  ) {
    Id
  }
}
