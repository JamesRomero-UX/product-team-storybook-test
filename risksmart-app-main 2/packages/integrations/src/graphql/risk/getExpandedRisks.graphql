query getExpandedRisks($offset: Int, $limit: Int) {
  pagination: risk_aggregate {
    aggregate {
      count
    }
  }
  data: risk(
    offset: $offset
    limit: $limit
    order_by: { CreatedAtTimestamp: asc }
  ) {
    Id
    CreatedAtTimestamp
    createdByUser {
      Id
      UserName
      Email
    }
    ModifiedAtTimestamp
    modifiedByUser {
      Id
      UserName
      Email
    }
    Title
    Tier
    Description
    ParentRiskId
    Treatment
    Status
    CustomAttributeData
    SequentialId
    schedule {
      Frequency
      ManualDueDate
      StartDate
      TimeToCompleteValue
      TimeToCompleteUnit
    }
    scheduleState {
      LatestDate
      DueDate
      OverdueDate
    }
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributors {
      ...ContributorParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
    enterpriseRiskInstance {
      entity {
        Id
        Name
      }
      enterpriseRisk {
        Id
        Title
      }
    }
    actions {
      action {
        ...ActionParts
        tags {
          ...TagParts
        }
        departments {
          ...DepartmentParts
        }
        owners {
          ...OwnerParts
        }
        contributors {
          ...ContributorParts
        }
        ownerGroups {
          ...OwnerGroupParts
        }
        contributorGroups {
          ...ContributorGroupParts
        }
      }
    }
    controls {
      control {
        ...ControlParts
        scheduleState {
          LatestDate
        }
        tags {
          ...TagParts
        }
        departments {
          ...DepartmentParts
        }
        owners {
          ...OwnerParts
        }
        contributors {
          ...ContributorParts
        }
        ownerGroups {
          ...OwnerGroupParts
        }
        contributorGroups {
          ...ContributorGroupParts
        }
      }
    }
    assessmentResults {
      riskAssessmentResult {
        ...RiskAssessmentResultParts
        parents(where: { ParentType: { _eq: assessment } }) {
          assessment {
            ...AssessmentParts
            completedByUser {
              FriendlyName
            }
          }
        }
      }
    }
  }
}
