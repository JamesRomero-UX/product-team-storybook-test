query getIssueAssessments {
  issue_assessment(order_by: { CreatedAtTimestamp: asc }) {
    ActualCloseDate
    CertifiedIndividual
    IssueCausedBySystemIssue
    IssueCausedByThirdParty
    IssueType
    ParentIssueId
    PoliciesBreached
    PolicyBreach
    PolicyOwner
    PolicyOwnerCommentary
    Rationale
    RegulatoryBreach
    RegulationsBreached
    Reportable
    Severity
    Status
    SystemResponsible
    TargetCloseDate
    ThirdPartyResponsible
    CreatedAtTimestamp
    ModifiedAtTimestamp
    CreatedByUser
    ModifiedByUser
    Type
  }
}
