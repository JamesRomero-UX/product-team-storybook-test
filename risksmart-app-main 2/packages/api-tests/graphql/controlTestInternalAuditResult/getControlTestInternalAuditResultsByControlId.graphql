query getControlTestInternalAuditResultsByControlId($_eq: uuid = "") {
  control_test_internal_audit_result(
    where: { ParentControlId: { _eq: $_eq } }
  ) {
    Title
    Submitter
    Description
    ParentControlId
    TestType
    DesignEffectiveness
    PerformanceEffectiveness
    OverallEffectiveness
    TestDate
    CustomAttributeData
    submitter {
      UserName
    }
  }
}
