mutation insertQuestionnaireInvite(
  $objects: [questionnaire_invite_insert_input!]!
) {
  insert_questionnaire_invite(objects: $objects) {
    affected_rows
  }
}

mutation inviteThirdParty(
  $ThirdPartyId: uuid!
  $UserEmails: [String!]!
  $Message: String
  $QuestionnaireTemplateVersionIds: [uuid!]!
) {
  insertQuestionnaireInvites(
    ThirdPartyId: $ThirdPartyId
    UserEmails: $UserEmails
    Message: $Message
    QuestionnaireTemplateVersionIds: $QuestionnaireTemplateVersionIds
  ) {
    affected_rows
  }
}

mutation updateQuestionnaireInvite(
  $where: questionnaire_invite_bool_exp!
  $set: questionnaire_invite_set_input
) {
  update_questionnaire_invite(where: $where, _set: $set) {
    affected_rows
  }
}

mutation deleteQuestionnaireInvite($where: questionnaire_invite_bool_exp!) {
  delete_questionnaire_invite(where: $where) {
    affected_rows
  }
}

query getQuestionnaireInvite($where: questionnaire_invite_bool_exp!) {
  questionnaire_invite(where: $where) {
    Id
  }
}
