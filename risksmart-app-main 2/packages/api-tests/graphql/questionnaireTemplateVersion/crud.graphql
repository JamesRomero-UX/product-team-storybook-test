    affected_rows
  }
}

mutation updateQuestionnaireTemplateVersion(
  $where: questionnaire_template_version_bool_exp!
  $set: questionnaire_template_version_set_input
) {
  update_questionnaire_template_version(where: $where, _set: $set) {
    affected_rows
  }
}

mutation deleteQuestionnaireTemplateVersion(
  $where: questionnaire_template_version_bool_exp!
) {
  delete_questionnaire_template_version(where: $where) {
    affected_rows
  }
}

query getQuestionnaireTemplateVersion(
