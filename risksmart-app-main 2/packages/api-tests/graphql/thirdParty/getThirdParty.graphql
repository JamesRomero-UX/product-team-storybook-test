query getThirdParty($where: third_party_bool_exp!) {
  third_party(where: $where) {
    Id
    SequentialId
    Title
    Description
    CompanyName
    CompaniesHouseNumber
    Address
    CityTown
    Postcode
    Country
    PrimaryContactName
    ContactName
    ContactEmail
    CompanyDomain
    Type
    Status
    Criticality
    CreatedByUser
    CustomAttributeData
    ModifiedByUser
    CreatedAtTimestamp
    ModifiedAtTimestamp
    owners {
      UserId
    }
    ownerGroups {
      UserGroupId
    }
    contributors {
      UserId
    }
    contributorGroups {
      UserGroupId
    }
    tags {
      TagTypeId
    }
    departments {
      DepartmentTypeId
    }
  }
}
