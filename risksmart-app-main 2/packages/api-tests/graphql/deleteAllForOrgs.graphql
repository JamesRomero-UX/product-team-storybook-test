# Delete mutations need to be in correct order. Objects that reference another table using a
# foreign key constraint need to be deleted before the table they reference
mutation DeleteAllForOrgs($orgKeys: [String!]!) {
  delete_node_ancestor(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_linked_item(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }

  # Delete *_result_parent junction tables early, before ANY entity table
  # (risk, document, obligation, assessment, etc.) whose node_delete_trigger
  # would delete the node rows these FKs reference (no ON DELETE CASCADE).
  delete_second_line_result_parent(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_internal_audit_result_parent(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_assessment_result_parent(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }

  # Delete second-line and internal-audit result tables before the entities
  # they assess (risk, document, obligation, control).
  delete_document_second_line_result(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_obligation_second_line_result(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_risk_uncontrolled_second_line_result(
    where: { OrgKey: { _in: $orgKeys } }
  ) {
    affected_rows
  }
  delete_risk_controlled_second_line_result(
    where: { OrgKey: { _in: $orgKeys } }
  ) {
    affected_rows
  }
  delete_control_test_second_line_result(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_document_internal_audit_result(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_obligation_internal_audit_result(
    where: { OrgKey: { _in: $orgKeys } }
  ) {
    affected_rows
  }
  delete_risk_uncontrolled_internal_audit_result(
    where: { OrgKey: { _in: $orgKeys } }
  ) {
    affected_rows
  }
  delete_risk_controlled_internal_audit_result(
    where: { OrgKey: { _in: $orgKeys } }
  ) {
    affected_rows
  }
  delete_control_test_internal_audit_result(
    where: { OrgKey: { _in: $orgKeys } }
  ) {
    affected_rows
  }

  # Assessment result tables (first-line) — also before entity tables.
  delete_document_assessment_result(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_obligation_assessment_result(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_risk_assessment_result(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }

  delete_custom_datasource(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_data_import_error(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }

  delete_data_import(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_enterprise_risk_instance(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_user_search_preferences(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_form_field_configuration(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_form_field_ordering(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_form_configuration(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }

  delete_impact_rating(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_impact_internal_audit_rating(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
  }
  delete_impact_second_line_rating(where: { OrgKey: { _in: $orgKeys } }) {
    affected_rows
