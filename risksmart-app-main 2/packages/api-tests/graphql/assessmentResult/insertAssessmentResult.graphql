mutation insertChildRiskAssessmentResult(
  $Rating: Int
  $Likelihood: Int
  $Impact: Int
  $Impacts: [RiskAssessmentResultImpactsInput!]
  $ControlType: risk_assessment_result_control_type_enum
  $AssessmentId: uuid
  $RiskIds: [uuid!]!
  $CustomAttributeData: jsonb
  $TestDate: timestamptz
  $Rationale: String
