mutation insertDocumentAssessmentResult(
  $objects: [document_assessment_result_insert_input!]!
) {
  insert_document_assessment_result(objects: $objects) {
    affected_rows
  }
}

mutation insertChildDocumentAssessmentResult(
  $Rating: Int
  $AssessmentId: uuid
  $DocumentIds: [uuid!]!
  $CustomAttributeData: jsonb
  $TestDate: timestamptz
  $Rationale: String
) {
  insertChildDocumentAssessmentResult(
    Rating: $Rating
    AssessmentId: $AssessmentId
    DocumentIds: $DocumentIds
    CustomAttributeData: $CustomAttributeData
    TestDate: $TestDate
    Rationale: $Rationale
  ) {
    Ids
  }
}

