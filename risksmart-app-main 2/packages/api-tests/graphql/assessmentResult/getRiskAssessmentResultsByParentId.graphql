query getRiskAssessmentResultsByParentId($Id: uuid) {
  risk_assessment_result(
    where: {
      RatingType: { _in: ["assessment", "rating"] }
      parents: { ParentId: { _eq: $Id } }
      TestDate: { _is_null: false }
    }
    order_by: { TestDate: desc }
  ) {
    Id
    Impact
    Likelihood
    Rating
    ControlType
    TestDate
    CustomAttributeData
    Rationale
    RatingType
    impacts {
      Label
      Value
    }
  }
}
