  delete_obligation_assessment_result(where: { Id: { _eq: $Id } }) {
    affected_rows
  }
}

mutation deleteRiskAssessmentResult($Id: uuid!) {
  delete_risk_assessment_result(where: { Id: { _eq: $Id } }) {
    affected_rows
  }
}
