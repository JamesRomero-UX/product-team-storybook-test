query getAllAssessmentResults($ParentId: uuid!) {
  document_assessment_result(
    where: { parents: { ParentId: { _eq: $ParentId } } }
    order_by: { CreatedByUser: asc }
  ) {
    Id
    parents {
      assessment {
        Id
      }
      document {
        Id
      }
    }
  }
  obligation_assessment_result(
    where: { parents: { ParentId: { _eq: $ParentId } } }
    order_by: { CreatedByUser: asc }
  ) {
    Id
    parents {
      assessment {
        Id
      }
      obligation {
        Id
      }
    }
  }
  risk_assessment_result(
    where: { parents: { ParentId: { _eq: $ParentId } } }
    order_by: { CreatedByUser: asc }
  ) {
    Id
    Likelihood
    Impact
    Rating
    ControlType
    CustomAttributeData
    Rationale
    TestDate
    RatingType
    ConfigId
    impacts {
      Label
      Value
    }
    parents {
      assessment {
        Id
      }
      risk {
        Id
      }
    }
  }
}
