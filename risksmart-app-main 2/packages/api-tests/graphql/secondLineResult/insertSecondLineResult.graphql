mutation insertDocumentSecondLineResult(
  $objects: [document_second_line_result_insert_input!]!
) {
  insert_document_second_line_result(objects: $objects) {
    affected_rows
  }
}

mutation insertChildDocumentSecondLineResult(
  $Rating: Int
  $ComplianceMonitoringAssessmentId: uuid!
  $DocumentIds: [uuid!]!
  $CustomAttributeData: jsonb
  $TestDate: timestamptz
  $Rationale: String
) {
  insertChildDocumentSecondLineResult(
    Rating: $Rating
    ComplianceMonitoringAssessmentId: $ComplianceMonitoringAssessmentId
    DocumentIds: $DocumentIds
    CustomAttributeData: $CustomAttributeData
    TestDate: $TestDate
    Rationale: $Rationale
  ) {
    Ids
  }
}

