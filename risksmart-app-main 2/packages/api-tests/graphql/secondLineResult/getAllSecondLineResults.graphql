query getAllSecondLineResults($ParentId: uuid!) {
  document_second_line_result(
    where: { parents: { ParentId: { _eq: $ParentId } } }
    order_by: { CreatedByUser: asc }
  ) {
    Id
    parents {
      complianceMonitoringAssessment {
        Id
      }
      document {
        Id
      }
    }
  }
  obligation_second_line_result(
    where: { parents: { ParentId: { _eq: $ParentId } } }
    order_by: { CreatedByUser: asc }
  ) {
    Id
    parents {
      complianceMonitoringAssessment {
        Id
      }
      obligation {
        Id
      }
    }
  }
  risk_controlled_second_line_result(
    where: { parents: { ParentId: { _eq: $ParentId } } }
    order_by: { CreatedByUser: asc }
  ) {
    Id
    Likelihood
    Impact
    Rating
    CustomAttributeData
    Rationale
    TestDate
    parents {
      complianceMonitoringAssessment {
        Id
      }
      risk {
        Id
      }
    }
  }
  risk_uncontrolled_second_line_result(
    where: { parents: { ParentId: { _eq: $ParentId } } }
    order_by: { CreatedByUser: asc }
  ) {
    Id
    Likelihood
    Impact
    Rating
    CustomAttributeData
    Rationale
    TestDate
    parents {
      complianceMonitoringAssessment {
        Id
      }
      risk {
        Id
      }
    }
  }
}
