mutation insertEnterpriseRisk($object: InsertEnterpriseRiskInput!) {
  insertChildEnterpriseRisk(object: $object) {
    Id
  }
}

mutation insertEnterpriseRiskInput($objects: [enterprise_risk_insert_input!]!) {
  insert_enterprise_risk(objects: $objects) {
    affected_rows
  }
}

mutation updateEnterpriseRisk($object: UpdateEnterpriseRiskInput!) {
  updateChildEnterpriseRisk(object: $object) {
    affected_rows
  }
}

mutation deleteEnterpriseRisk($Id: uuid!) {
  deleteChildEnterpriseRisk(Id: $Id) {
    affected_rows
  }
}

query getEnterpriseRisk($where: enterprise_risk_bool_exp!) {
  enterprise_risk(where: $where) {
    Id
  }
}

mutation instantiateEnterpriseRisk($object: InstantiateEnterpriseRiskInput) {
  instantiateChildEnterpriseRisk(object: $object) {
    affected_rows
  }
}
