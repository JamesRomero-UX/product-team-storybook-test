mutation updateTaxonomy(
  $Id: uuid!
  $Common: jsonb!
  $Library: jsonb!
  $Rating: jsonb!
  $Taxonomy: jsonb!
  $InternalAuditRating: jsonb!
) {
  update_taxonomy(
    where: { Id: { _eq: $Id } }
    _set: {
      Common: $Common
      Library: $Library
      Rating: $Rating
      Taxonomy: $Taxonomy
      InternalAuditRating: $InternalAuditRating
    }
  ) {
    affected_rows
  }
}
