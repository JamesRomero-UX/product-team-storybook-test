mutation insertThirdPartyResponse(
  $objects: [third_party_response_insert_input!]!
) {
  insert_third_party_response(objects: $objects) {
    affected_rows
  }
}

mutation updateThirdPartyResponse(
  $where: third_party_response_bool_exp!
  $set: third_party_response_set_input
) {
  update_third_party_response(where: $where, _set: $set) {
    affected_rows
  }
}

mutation deleteThirdPartyResponse($where: third_party_response_bool_exp!) {
  delete_third_party_response(where: $where) {
    affected_rows
  }
}

query getThirdPartyResponse($where: third_party_response_bool_exp!) {
  third_party_response(where: $where) {
    Id
  }
}
