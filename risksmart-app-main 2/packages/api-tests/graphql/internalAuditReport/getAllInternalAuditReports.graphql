query getAllInternalAuditReports {
  internal_audit_report(order_by: { ModifiedByUser: asc }) {
    Title
    Summary
    TargetCompletionDate
    ActualCompletionDate
    StartDate
    NextTestDate
    CreatedAtTimestamp
    ModifiedAtTimestamp
    CreatedByUser
    ModifiedByUser
    Outcome
  }
}
