query getPolicyAttestationRecords($where: attestation_record_bool_exp! = {}) {
  attestation_record(
    where: $where
    order_by: { Active: desc, NodeId: desc, ExpiresAt: asc }
  ) {
    ExpiresAt
    Active
    CreatedAtTimestamp
    AttestationStatus
    attestationRecordStatus {
      Status
    }
    AttestedAt
    UserId
    NodeId
    user {
      Id
      FriendlyName
      Email
    }
    node {
      documentFile {
        Id
        Version
        parent {
          Id
          Title
        }
      }
    }
  }
}
