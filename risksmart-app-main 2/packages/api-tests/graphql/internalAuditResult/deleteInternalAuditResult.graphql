mutation deleteDocumentInternalAuditResult($Id: uuid!) {
  delete_document_internal_audit_result(where: { Id: { _eq: $Id } }) {
    affected_rows
  }
}

mutation deleteObligationInternalAuditResult($Id: uuid!) {
  delete_obligation_internal_audit_result(where: { Id: { _eq: $Id } }) {
    affected_rows
  }
}

mutation deleteRiskInternalAuditResult($Id: uuid!) {
  delete_risk_controlled_internal_audit_result(where: { Id: { _eq: $Id } }) {
    affected_rows
  }
  delete_risk_uncontrolled_internal_audit_result(where: { Id: { _eq: $Id } }) {
    affected_rows
  }
}
