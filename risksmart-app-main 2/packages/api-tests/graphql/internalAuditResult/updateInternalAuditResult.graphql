mutation updateDocumentInternalAuditResult($Id: uuid!, $Rating: Int!) {
  update_document_internal_audit_result(
    where: { Id: { _eq: $Id } }
    _set: { Rating: $Rating }
  ) {
    affected_rows
  }
}

