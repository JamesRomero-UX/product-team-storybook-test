query getAllInternalAuditResults($ParentId: uuid!) {
  document_internal_audit_result(
    where: { parents: { ParentId: { _eq: $ParentId } } }
    order_by: { CreatedByUser: asc }
  ) {
    Id
    parents {
      internalAuditReport {
        Id
      }
      document {
        Id
      }
    }
  }
  obligation_internal_audit_result(
    where: { parents: { ParentId: { _eq: $ParentId } } }
    order_by: { CreatedByUser: asc }
  ) {
    Id
    parents {
      internalAuditReport {
        Id
      }
      obligation {
        Id
      }
    }
  }
  risk_controlled_internal_audit_result(
    where: { parents: { ParentId: { _eq: $ParentId } } }
    order_by: { CreatedByUser: asc }
  ) {
    Id
    Likelihood
    Impact
    Rating
    CustomAttributeData
    Rationale
    TestDate
    parents {
      internalAuditReport {
        Id
      }
      risk {
        Id
      }
    }
  }
  risk_uncontrolled_internal_audit_result(
    where: { parents: { ParentId: { _eq: $ParentId } } }
    order_by: { CreatedByUser: asc }
  ) {
    Id
    Likelihood
    Impact
    Rating
    CustomAttributeData
    Rationale
    TestDate
    parents {
      internalAuditReport {
        Id
      }
      risk {
        Id
      }
    }
  }
}
