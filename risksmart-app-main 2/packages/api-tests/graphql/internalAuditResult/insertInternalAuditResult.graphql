mutation insertDocumentInternalAuditResult(
  $objects: [document_internal_audit_result_insert_input!]!
) {
  insert_document_internal_audit_result(objects: $objects) {
    affected_rows
  }
}

mutation insertChildDocumentInternalAuditResult(
  $Rating: Int
  $InternalAuditReportId: uuid!
  $DocumentIds: [uuid!]!
  $CustomAttributeData: jsonb
  $TestDate: timestamptz
  $Rationale: String
) {
  insertChildDocumentInternalAuditResult(
    Rating: $Rating
    InternalAuditReportId: $InternalAuditReportId
    DocumentIds: $DocumentIds
    CustomAttributeData: $CustomAttributeData
    TestDate: $TestDate
    Rationale: $Rationale
  ) {
    Ids
  }
}

