query getQuestionnaireTemplate($where: questionnaire_template_bool_exp!) {
  questionnaire_template(where: $where) {
    Id
    Title
    Description
    CreatedByUser
    ModifiedByUser
    CreatedAtTimestamp
    ModifiedAtTimestamp
    CustomAttributeData
    owners {
      UserId
    }
    contributors {
      UserId
    }
    ownerGroups {
      UserGroupId
    }
    contributorGroups {
      UserGroupId
    }
    tags {
      TagTypeId
    }
    departments {
      DepartmentTypeId
    }
  }
}
