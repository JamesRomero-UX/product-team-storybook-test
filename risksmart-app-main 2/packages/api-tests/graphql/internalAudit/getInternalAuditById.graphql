query getInternalAuditById($Id: uuid!) {
  internal_audit_entity(where: {
    Id: {
      _eq: $Id
    }
  }) {
    Id
    SequentialId
    Title
    Description
    CreatedByUser
    ModifiedByUser
    CreatedAtTimestamp
    ModifiedAtTimestamp
    CustomAttributeData
    businessArea {
      Title
      Id
    }
  }
}
