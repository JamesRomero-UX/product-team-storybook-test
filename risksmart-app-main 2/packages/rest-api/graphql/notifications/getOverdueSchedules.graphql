query getOverdueSchedules(
  $minOverdueDate: timestamptz!
  $maxOverdueDate: timestamptz!
) {
  schedule_state(
    where: {
      OverdueDate: { _gt: $minOverdueDate, _lte: $maxOverdueDate }
      schedule: { Frequency: { _is_null: false, _neq: adhoc } }
    }
  ) {
    Id
    OrgKey
    DueDate
    schedule {
      Frequency
      TimeToCompleteValue
      TimeToCompleteUnit
    }
    parent {
      Id
      ObjectType
      SequentialId
      OrgKey
      risk {
        Title
      }
      control {
        Title
      }
      indicator {
        Title
      }
    }
  }
}
