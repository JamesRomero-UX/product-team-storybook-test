mutation updateAttestationCycle(
  $where: attestation_cycle_bool_exp!
  $set: attestation_cycle_set_input!
) {
  update_attestation_cycle(where: $where, _set: $set) {
    returning {
      Id
      ParentId
      Status
      AllowCarryForward
      CreatedAtTimestamp
      CreatedByUser
      ModifiedAtTimestamp
      ModifiedByUser
    }
    affected_rows
  }
}
