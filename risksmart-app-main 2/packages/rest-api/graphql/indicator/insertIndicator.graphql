mutation insertIndicator(
  $Description: String
  $LowerToleranceNum: numeric
  $TargetValueTxt: String
  $Title: String
  $Type: indicator_type_enum
  $Unit: String
  $UpperToleranceNum: numeric
  $Id: uuid!
  $ParentId: uuid!
  $CustomAttributeData: jsonb
  $Tags: [tag_insert_input!]!
  $Departments: [department_insert_input!]!
  $Owners: [owner_insert_input!]!
  $OwnerGroups: [owner_group_insert_input!]!
  $Contributors: [contributor_insert_input!]!
  $ContributorGroups: [contributor_group_insert_input!]!
  $LowerAppetiteNum: numeric
  $UpperAppetiteNum: numeric
  $schedule: schedule_insert_input!
) {
  insert_indicator_one(
    object: {
      Id: $Id
      Description: $Description
      LowerToleranceNum: $LowerToleranceNum
      TargetValueTxt: $TargetValueTxt
      Title: $Title
      Type: $Type
      Unit: $Unit
      UpperToleranceNum: $UpperToleranceNum
      CustomAttributeData: $CustomAttributeData
      LowerAppetiteNum: $LowerAppetiteNum
      UpperAppetiteNum: $UpperAppetiteNum
    }
  ) {
    Id
  }

  insert_schedule_one(object: $schedule) {
    Id
  }

  insert_indicator_parent(objects: { IndicatorId: $Id, ParentId: $ParentId }) {
    affected_rows
  }

  insert_owner(objects: $Owners) {
    affected_rows
  }

  insert_contributor(objects: $Contributors) {
    affected_rows
  }

  insert_owner_group(objects: $OwnerGroups) {
    affected_rows
  }

  insert_contributor_group(objects: $ContributorGroups) {
    affected_rows
  }

  insert_tag(objects: $Tags) {
    affected_rows
  }

  insert_department(objects: $Departments) {
    affected_rows
  }
}
