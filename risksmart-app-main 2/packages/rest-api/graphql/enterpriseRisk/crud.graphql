mutation insertEnterpriseRisk($object: enterprise_risk_insert_input!) {
  insert_enterprise_risk_one(object: $object) {
    Id
  }
}

mutation updateEnterpriseRisk(
  $where: enterprise_risk_bool_exp!
  $_set: enterprise_risk_set_input!
) {
  update_enterprise_risk(where: $where, _set: $_set) {
    affected_rows
  }
}

mutation deleteEnterpriseRisk($where: enterprise_risk_bool_exp!) {
  delete_enterprise_risk(where: $where) {
    affected_rows
  }
}

query getEnterpriseRiskById($Id: uuid!) {
  enterprise_risk_by_pk(Id: $Id) {
    Id
    Title
    Description
    Treatment
    Tier

    children {
      Id
      Title
      Description
      Treatment
      Tier

      children {
        Id
        Title
        Description
        Treatment
        Tier
      }
    }
  }
}
