mutation updateThirdPartyResponses(
  $Ids: [uuid!]!
  $Status: third_party_response_status_enum!
) {
  update_third_party_response(
    where: { Id: { _in: $Ids } }
    _set: { Status: $Status }
  ) {
    affected_rows
    returning {
      Id
      Status
      questionnaireTemplateVersion {
        Version
        parent {
          Title
        }
      }
      invitees {
        UserId
      }
    }
  }
}
