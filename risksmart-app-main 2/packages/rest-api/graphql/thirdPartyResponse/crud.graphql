query getThirdPartyResponses(
  $where: third_party_response_bool_exp
  $limit: Int
  $orderBy: [third_party_response_order_by!]
) {
  third_party_response(where: $where, limit: $limit, order_by: $orderBy) {
    ...ThirdPartyResponseParts
  }
}

query getThirdPartyResponsesWithParents(
  $where: third_party_response_bool_exp
  $limit: Int
  $orderBy: [third_party_response_order_by!]
) {
  third_party_response(where: $where, limit: $limit, order_by: $orderBy) {
    ...ThirdPartyResponseParts
    thirdParty {
      Id
      Title
    }
    questionnaireTemplateVersion {
      Id
      Version
      parent {
        Id
        Title
      }
    }
  }
}

mutation insertThirdPartyResponses(
  $objects: [third_party_response_insert_input!]!
) {
  insert_third_party_response(objects: $objects) {
    returning {
      Id
      ParentId
      QuestionnaireTemplateVersionId
    }
  }
}

mutation updateThirdPartyResponse(
  $where: third_party_response_bool_exp!
  $_set: third_party_response_set_input!
) {
  update_third_party_response(where: $where, _set: $_set) {
    affected_rows
  }
}
