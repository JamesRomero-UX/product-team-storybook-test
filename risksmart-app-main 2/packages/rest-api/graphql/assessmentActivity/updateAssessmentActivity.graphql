mutation updateAssessmentActivity(
  $ActivityType: assessment_activity_type_enum!
  $Status: assessment_activity_status_enum!
  $Summary: String!
  $Title: String!
  $CompletionDate: timestamptz
  $AssignedUser: String
  $OriginalTimestamp: timestamptz!
  $Id: uuid!
  $CustomAttributeData: jsonb
  $OwnerUserIds: [String!]!
  $OwnerGroupIds: [uuid!]!
  $Owners: [owner_insert_input!]!
  $OwnerGroups: [owner_group_insert_input!]!
) {
  update_assessment_activity(
    where: {
      Id: { _eq: $Id }
      ModifiedAtTimestamp: { _eq: $OriginalTimestamp }
    }
    _set: {
      ActivityType: $ActivityType
      Status: $Status
      Summary: $Summary
      Title: $Title
      CompletionDate: $CompletionDate
      AssignedUser: $AssignedUser
      CustomAttributeData: $CustomAttributeData
    }
  ) {
    affected_rows
  }
  delete_owner(where: { ParentId: { _eq: $Id }, UserId: { _nin: $OwnerUserIds } }) {
    affected_rows
  }
  insert_owner(
    objects: $Owners
    on_conflict: { constraint: owner_pkey, update_columns: [] }
  ) {
    affected_rows
  }
  delete_owner_group(
    where: { ParentId: { _eq: $Id }, UserGroupId: { _nin: $OwnerGroupIds } }
  ) {
    affected_rows
  }
  insert_owner_group(
    objects: $OwnerGroups
    on_conflict: { constraint: owner_group_pkey, update_columns: [] }
  ) {
    affected_rows
  }
}
