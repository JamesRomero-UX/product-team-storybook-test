fragment AcceptanceParts on acceptance {
  Id
  Status
  ModifiedAtTimestamp
  parents(where: { risk: { Id: { _is_null: false } } }) {
    risk {
      Id
      owners {
        UserId
      }
      ownerGroups {
        group {
          users {
            UserId
          }
        }
      }
    }
  }
}
