query getAcceptanceParentsById($Id: uuid!) {
  acceptance(
    where: { Id: { _eq: $Id }, parents: { risk: { Id: { _is_null: false } } } }
  ) {
    CreatedAtTimestamp
    CreatedByUser
    ModifiedAtTimestamp
    ModifiedByUser
    parents {
      risk {
        Title
        Id
        SequentialId
      }
    }
  }
}
