mutation insertDataExportSchedule(
  $Frequency: data_export_schedule_frequency_enum!
  $StartTimestamp: timestamptz!
  $EndTimestamp: timestamptz
  $StorageType: data_export_schedule_storage_type_enum!
  $SecretArn: String!
  $Status: data_export_schedule_status_enum!
) {
  insert_data_export_schedule_one(
    object: {
      Frequency: $Frequency
      StartTimestamp: $StartTimestamp
      EndTimestamp: $EndTimestamp
      StorageType: $StorageType
      SecretArn: $SecretArn
      Status: $Status
    }
  ) {
    Id
  }
}
