query getActiveDataExportById($Id: uuid!) {
  data_export_schedule(where: { Id: { _eq: $Id }, Status: { _eq: active } }) {
    Id
    CronArn
    Frequency
    EndTimestamp
    dataExportScheduleExecutions(where: { Status: { _eq: scheduled } }) {
      ExecutionTimestamp
      Status
      Errors
    }
  }
}
