mutation upsertDataExportScheduleExecutions(
  $inputs: [data_export_schedule_execution_insert_input!]!
) {
  insert_data_export_schedule_execution(
    objects: $inputs
    on_conflict: {
      constraint: data_export_schedule_execution_pkey
      update_columns: [Status, Errors, ModifiedAtTimestamp, ModifiedByUser]
    }
  ) {
    affected_rows
  }
}
