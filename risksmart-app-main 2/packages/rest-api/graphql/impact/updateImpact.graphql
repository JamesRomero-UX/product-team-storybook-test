mutation updateImpact(
  $Id: uuid!
  $Rationale: String
  $RatingGuidance: String
  $Name: String!
  $LikelihoodAppetite: smallint
  $CustomAttributeData: jsonb
  $ownerIds: [String!]!
  $owners: [owner_insert_input!]!
  $ownerGroups: [owner_group_insert_input!]!
  $ownerGroupIds: [uuid!]!
) {
  update_impact(
    where: { Id: { _eq: $Id } }
    _set: {
      RatingGuidance: $RatingGuidance
      Rationale: $Rationale
      Name: $Name
      LikelihoodAppetite: $LikelihoodAppetite
      CustomAttributeData: $CustomAttributeData
    }
  ) {
    affected_rows
  }

  delete_owner_group(
    where: { ParentId: { _eq: $Id }, UserGroupId: { _nin: $ownerGroupIds } }
  ) {
    affected_rows
  }

  delete_owner(where: { ParentId: { _eq: $Id }, UserId: { _nin: $ownerIds } }) {
    affected_rows
  }

  insert_owner(
    objects: $owners
    on_conflict: { constraint: owner_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  insert_owner_group(
    objects: $ownerGroups
    on_conflict: { constraint: owner_group_pkey, update_columns: [] }
  ) {
    affected_rows
  }
}
