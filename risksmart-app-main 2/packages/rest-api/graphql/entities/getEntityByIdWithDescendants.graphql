query getEntityByIdWithDescendants($Id: uuid!) {
  entity_by_pk(Id: $Id) {
    Id
    Name
    Description
    ParentId
    Weight
    CreatedAtTimestamp
    ModifiedAtTimestamp
    modifiedByUser {
      FriendlyName
    }
    createdByUser {
      FriendlyName
    }
    descendants {
      Id
    }
  }
}
