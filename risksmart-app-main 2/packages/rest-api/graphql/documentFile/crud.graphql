query getDocumentFiles(
  $where: document_file_bool_exp
  $limit: Int
  $orderBy: [document_file_order_by!]
) {
  document_file(where: $where, limit: $limit, order_by: $orderBy) {
    ...DocumentFileParts
  }
}

mutation deleteDocumentFiles($where: document_file_bool_exp!) {
  delete_document_file(where: $where) {
    returning {
      ...DocumentFileParts
    }
  }
}

mutation insertDocumentFile($objects: [document_file_insert_input!]!) {
  insert_document_file(objects: $objects) {
    returning {
      ...DocumentFileParts
    }
  }
}

mutation updateDocumentFiles(
  $where: document_file_bool_exp!
  $set: document_file_set_input!
) {
  update_document_file(where: $where, _set: $set) {
    returning {
      ...DocumentFileParts
    }
  }
}
