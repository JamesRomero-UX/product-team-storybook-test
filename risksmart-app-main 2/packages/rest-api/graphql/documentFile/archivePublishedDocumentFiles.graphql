mutation archivePublishedDocumentFiles(
  $documentId: uuid!
  $excludedDocumentFileIds: [uuid!]!
  $ModifiedAtTimestamp: timestamptz!
) {
  update_document_file(
    where: {
      ParentDocumentId: { _eq: $documentId }
      Status: { _eq: published }
      Id: { _nin: $excludedDocumentFileIds }
    }
    _set: {
      Status: archived
      ModifiedByUser: "SYSTEM"
      ModifiedAtTimestamp: $ModifiedAtTimestamp
    }
  ) {
    affected_rows
  }
}
