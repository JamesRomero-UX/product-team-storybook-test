query getChangeRequests(
  $where: change_request_bool_exp
  $limit: Int
  $orderBy: [change_request_order_by!]
) {
  change_request(where: $where, limit: $limit, order_by: $orderBy) {
    ...ChangeRequestForBackendParts
  }
}

mutation deleteChangeRequests($where: change_request_bool_exp!) {
  delete_change_request(where: $where) {
    returning {
      ...ChangeRequestForBackendParts
    }
  }
}

mutation insertChangeRequests($objects: [change_request_insert_input!]!) {
  insert_change_request(objects: $objects) {
    returning {
      ...ChangeRequestForBackendParts
    }
  }
}

mutation updateChangeRequests(
  $where: change_request_bool_exp!
  $set: change_request_set_input!
) {
  update_change_request(where: $where, _set: $set) {
    returning {
      ...ChangeRequestForBackendParts
    }
  }
}
