fragment ChangeRequestForBackendParts on change_request {
  Id
  ParentId
  OrgKey
  CreatedAtTimestamp
  CreatedByUser
  SequentialId
  RequestedChanges
  ActionUserId
  ChangeRequestStatus
  OverriddenByUser
  OverriddenAtTimestamp
  Comment
  RequesterComment
  Workflow
  responses {
    Approved
    Comment
    approver {
      Id
      OwnerApprover
      UserGroupId
      user {
        Id
        Email
        UserName
      }
      group {
        Id
        users {
          authUsers {
            Id
            Email
            UserName
          }
        }
      }
      level {
        Id
        ApprovalRuleType
        approval {
          Workflow
          InFlightEditRule
          parent {
            Id
          }
        }
      }
    }
  }
  parent {
    ObjectType
    SequentialId

    risk {
      Id
      Title
    }

    documentFile {
      Version

      parent {
        Id
        Title
      }
    }

    action {
      Id
      Title
    }

    issue_assessment {
      parent {
        Id
        Title
      }
    }

    acceptance {
      Id
      Title
    }

    control {
      Id
      Title
    }

    issue {
      Id
      Title
    }
  }
  createdBy {
    UserName
  }
}
