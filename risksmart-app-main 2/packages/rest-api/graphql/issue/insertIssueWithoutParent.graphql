mutation insertIssueWithoutParent(
  $Id: uuid!
  $Title: String!
  $Details: String
  $ImpactsCustomer: Boolean
  $IsExternalIssue: Boolean
  $DateOccurred: timestamptz!
  $DateIdentified: timestamptz!
  $Type: parent_type_enum!
  $CustomAttributeData: jsonb
  $Meta: json
  $Tags: [tag_insert_input!]!
  $Departments: [department_insert_input!]!
  $contributors: [contributor_insert_input!]!
  $contributorGroups: [contributor_group_insert_input!]!
  $owners: [owner_insert_input!]!
  $ownerGroups: [owner_group_insert_input!]!
) {
  insert_issue(
    objects: {
      Id: $Id
      Title: $Title
      Details: $Details
      ImpactsCustomer: $ImpactsCustomer
      IsExternalIssue: $IsExternalIssue
      DateOccurred: $DateOccurred
      DateIdentified: $DateIdentified
      Type: $Type
      CustomAttributeData: $CustomAttributeData
      RaisedAtTimestamp: "now()"
      Meta: $Meta
    }
  ) {
    affected_rows
  }

  insert_tag(objects: $Tags) {
    affected_rows
  }

  insert_department(objects: $Departments) {
    affected_rows
  }

  insert_contributor(
    objects: $contributors
    on_conflict: { constraint: contributor_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  insert_owner(
    objects: $owners
    on_conflict: { constraint: owner_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  insert_contributor_group(
    objects: $contributorGroups
    on_conflict: { constraint: contributor_group_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  insert_owner_group(
    objects: $ownerGroups
    on_conflict: { constraint: owner_group_pkey, update_columns: [] }
  ) {
    affected_rows
  }
}
