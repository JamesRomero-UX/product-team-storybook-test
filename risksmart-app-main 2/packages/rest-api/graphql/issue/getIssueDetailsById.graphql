query getIssueDetailsById($Id: uuid!) {
  issue_by_pk(Id: $Id) {
    Id
    Title
    Details
    ImpactsCustomer
    IsExternalIssue
    DateOccurred
    DateIdentified
    CustomAttributeData
    ModifiedAtTimestamp
    tags {
      TagTypeId
    }
    departments {
      DepartmentTypeId
    }
    contributors {
      UserId
    }
    owners {
      UserId
    }
    ownerGroups {
      UserGroupId
    }
    contributorGroups {
      UserGroupId
    }
  }
}
