query getRiskByTier($OrgKey: String!, $Tier: Int) {
  risk(where: { Tier: { _eq: $Tier }, OrgKey: { _eq: $OrgKey } }) {
    Id
    childRisks {
      Id
      riskScore {
        ResidualScore
        InherentScore
        ResidualImpact
        ResidualLikelihood
        InherentImpact
        InherentLikelihood
      }
    }
  }
}
