query getRisks($where: risk_bool_exp, $limit: Int, $orderBy: [risk_order_by!]) {
  risk(where: $where, limit: $limit, order_by: $orderBy) {
    ...RiskParts
    CustomAttributeData
    ownerGroups {
      UserGroupId
    }
    owners {
      UserId
    }
    contributorGroups {
      UserGroupId
    }
    contributors {
      UserId
    }
    tags {
      TagTypeId
    }
    departments {
      DepartmentTypeId
    }
    schedule {
      ...ScheduleParts
    }
  }
}
