mutation deleteRisks($where: risk_bool_exp!) {
  delete_risk(where: $where) {
    returning {
      ...RiskParts
    }
  }
}

mutation insertRisk($objects: [risk_insert_input!]!) {
  insert_risk(objects: $objects) {
    returning {
      ...RiskParts
    }
  }
}

mutation updateRisks($where: risk_bool_exp!, $set: risk_set_input!) {
  update_risk(where: $where, _set: $set) {
    returning {
      ...RiskParts
    }
  }
}
