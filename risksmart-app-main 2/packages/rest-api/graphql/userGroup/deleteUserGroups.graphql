mutation deleteUserGroups($UserGroupIds: [uuid!]) {
  delete_owner_group(
    where: {
      UserGroupId: { _in: $UserGroupIds }
      group: {
        _not: {
          approvers: {}
        }
      }
    }) {
    affected_rows
  }
  delete_contributor_group(
    where: {
      UserGroupId: { _in: $UserGroupIds }
      group: {
        _not: {
          approvers: {}
        }
      }
    }) {
    affected_rows
  }
  delete_user_group_user(where:
  {
    UserGroupId: { _in: $UserGroupIds }
    userGroups: {
      _not: {
        approvers: {}
      }
    }
  }) {
    affected_rows
  }
  delete_user_group(
    where: {
      Id: { _in: $UserGroupIds }
      _not: {
        approvers: {}
      }
    }
  ) {
    affected_rows
  }
}
