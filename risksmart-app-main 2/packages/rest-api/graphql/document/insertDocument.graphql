mutation insertDocument(
  $Id: uuid!
  $Title: String!
  $Purpose: String
  $DocumentType: String!
  $ParentDocument: uuid
  $Tags: [tag_insert_input!]!
  $Departments: [department_insert_input!]!
  $linkedDocuments: [document_linked_document_insert_input!]!
  $CustomAttributeData: jsonb
  $Owners: [owner_insert_input!]!
  $OwnerGroups: [owner_group_insert_input!]!
  $Contributors: [contributor_insert_input!]!
  $ContributorGroups: [contributor_group_insert_input!]!
  $RequireGlobalAttestation: Boolean!
  $AttestationTimeLimit: interval
  $AttestationPromptText: String
  $AttestationGroups: attestation_group_arr_rel_insert_input
  $schedule: schedule_insert_input!
) {
  insert_document_one(
    object: {
      Id: $Id
      ParentDocument: $ParentDocument
      Title: $Title
      Purpose: $Purpose
      DocumentType: $DocumentType
      tags: { data: $Tags }
      departments: { data: $Departments }
      linkedDocuments: { data: $linkedDocuments }
      CustomAttributeData: $CustomAttributeData
      contributors: { data: $Contributors }
      owners: { data: $Owners }
      contributorGroups: { data: $ContributorGroups }
      ownerGroups: { data: $OwnerGroups }
      attestationConfig: {
        data: {
          PromptText: $AttestationPromptText
          RequireGlobalAttestation: $RequireGlobalAttestation
          AttestationTimeLimit: $AttestationTimeLimit
          groups: $AttestationGroups
        }
      }
    }
  ) {
    Id
  }

  insert_schedule_one(object: $schedule) {
    Id
  }
}
