mutation deleteDocument($id: uuid!) {
  delete_document_linked_document(where: { DocumentId: { _eq: $id } }) {
    affected_rows
  }

  delete_relation_file(where: { ParentId: { _eq: $id } }) {
    affected_rows
  }

  delete_file(where: { documentFile: { ParentDocumentId: { _eq: $id } } }) {
    affected_rows
  }

  delete_document_file(where: { ParentDocumentId: { _eq: $id } }) {
    affected_rows
  }

  delete_conversation(where: { ParentId: { _eq: $id } }) {
    affected_rows
  }

  update_document(
    where: { ParentDocument: { _eq: $id } }
    _set: { ParentDocument: null }
  ) {
    affected_rows
  }

  delete_document(where: { Id: { _eq: $id } }) {
    affected_rows
  }
}
