mutation updateDocument(
  $Id: uuid!
  $Title: String!
  $Purpose: String
  $DocumentType: String!
  $ParentDocument: uuid
  $OriginalTimestamp: timestamptz!
  $LinkedDocumentIds: [uuid!]!
  $LinkedDocuments: [document_linked_document_insert_input!]!
  $CustomAttributeData: jsonb
  $ContributorIds: [String!]!
  $Contributors: [contributor_insert_input!]!
  $ContributorGroups: [contributor_group_insert_input!]!
  $ContributorGroupIds: [uuid!]!
  $OwnerIds: [String!]!
  $Owners: [owner_insert_input!]!
  $OwnerGroups: [owner_group_insert_input!]!
  $OwnerGroupIds: [uuid!]!
  $TagTypeIds: [uuid!]!
  $Tags: [tag_insert_input!]!
  $DepartmentTypeIds: [uuid!]!
  $Departments: [department_insert_input!]!
  $RequireGlobalAttestation: Boolean!
  $AttestationTimeLimit: interval
  $AttestationPromptText: String
  $AttestationGroupIds: [uuid!]!
  $AttestationGroups: [attestation_group_insert_input!]!
  $schedule: schedule_insert_input!
) {
  update_document(
    _set: {
      ParentDocument: $ParentDocument
      Title: $Title
      Purpose: $Purpose
      DocumentType: $DocumentType
      CustomAttributeData: $CustomAttributeData
    }
    where: {
      ModifiedAtTimestamp: { _eq: $OriginalTimestamp }
      Id: { _eq: $Id }
    }
  ) {
    affected_rows
  }

  insert_schedule_one(
    object: $schedule
    on_conflict: {
      constraint: schedule_pkey
      update_columns: [
        Frequency
        ManualDueDate
        TimeToCompleteValue
        TimeToCompleteUnit
        StartDate
      ]
    }
  ) {
    Id
  }

  insert_attestation_config_one(
    object: {
      ParentId: $Id
      RequireGlobalAttestation: $RequireGlobalAttestation
      AttestationTimeLimit: $AttestationTimeLimit
      PromptText: $AttestationPromptText
      groups: {
        data: $AttestationGroups
        on_conflict: { constraint: attestation_group_pkey, update_columns: [] }
      }
    }
    on_conflict: {
      constraint: attestation_config_pkey
      update_columns: [
        ParentId
        RequireGlobalAttestation
        AttestationTimeLimit
        PromptText
      ]
    }
  ) {
    ParentId
  }

  delete_document_linked_document(
    where: {
      DocumentId: { _eq: $Id }
      LinkedDocumentId: { _nin: $LinkedDocumentIds }
    }
  ) {
    affected_rows
  }

  insert_document_linked_document(
    objects: $LinkedDocuments
    on_conflict: {
      constraint: document_linked_document_pkey
      update_columns: []
    }
  ) {
    affected_rows
  }

  delete_attestation_group(
    where: {
      config: { ParentId: { _eq: $Id } }
      GroupId: { _nin: $AttestationGroupIds }
    }
  ) {
    affected_rows
  }

  delete_tag(
    where: { ParentId: { _eq: $Id }, TagTypeId: { _nin: $TagTypeIds } }
  ) {
    affected_rows
  }

  insert_tag(
    objects: $Tags
    on_conflict: { constraint: tag_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  delete_department(
    where: {
      ParentId: { _eq: $Id }
      DepartmentTypeId: { _nin: $DepartmentTypeIds }
    }
  ) {
    affected_rows
  }

  insert_department(
    objects: $Departments
    on_conflict: { constraint: department_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  delete_contributor(
    where: { ParentId: { _eq: $Id }, UserId: { _nin: $ContributorIds } }
  ) {
    affected_rows
  }

  insert_contributor(
    objects: $Contributors
    on_conflict: { constraint: contributor_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  delete_owner(where: { ParentId: { _eq: $Id }, UserId: { _nin: $OwnerIds } }) {
    affected_rows
  }

  insert_owner(
    objects: $Owners
    on_conflict: { constraint: owner_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  delete_contributor_group(
    where: {
      ParentId: { _eq: $Id }
      UserGroupId: { _nin: $ContributorGroupIds }
    }
  ) {
    affected_rows
  }

  insert_contributor_group(
    objects: $ContributorGroups
    on_conflict: { constraint: contributor_group_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  delete_owner_group(
    where: { ParentId: { _eq: $Id }, UserGroupId: { _nin: $OwnerGroupIds } }
  ) {
    affected_rows
  }

  insert_owner_group(
    objects: $OwnerGroups
    on_conflict: { constraint: owner_group_pkey, update_columns: [] }
  ) {
    affected_rows
  }
}
