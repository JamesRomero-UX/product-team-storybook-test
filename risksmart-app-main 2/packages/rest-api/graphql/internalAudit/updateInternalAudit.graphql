mutation updateInternalAudit(
  $Id: uuid!
  $Title: String!
  $Description: String
  $BusinessArea: String!
  $BusinessAreaId: uuid!
  $OriginalTimestamp: timestamptz!
  $CustomAttributeData: jsonb
  $ContributorIds: [String!]!
  $Contributors: [contributor_insert_input!]!
  $ContributorGroups: [contributor_group_insert_input!]!
  $ContributorGroupIds: [uuid!]!
  $OwnerIds: [String!]!
  $Owners: [owner_insert_input!]!
  $OwnerGroups: [owner_group_insert_input!]!
  $OwnerGroupIds: [uuid!]!
  $TagTypeIds: [uuid!]!
  $Tags: [tag_insert_input!]!
  $DepartmentTypeIds: [uuid!]!
  $Departments: [department_insert_input!]!
) {
  insert_business_area_one(
    object: { Id: $BusinessAreaId, Title: $BusinessArea }
    on_conflict: { constraint: business_area_pkey, update_columns: [] }
  ) {
    Id
  }
  update_internal_audit_entity(
    where: {
      Id: { _eq: $Id }
      ModifiedAtTimestamp: { _eq: $OriginalTimestamp }
    }
    _set: {
      Description: $Description
      Title: $Title
      CustomAttributeData: $CustomAttributeData
      BusinessAreaId: $BusinessAreaId
    }
  ) {
    affected_rows
  }

  delete_tag(
    where: { ParentId: { _eq: $Id }, TagTypeId: { _nin: $TagTypeIds } }
  ) {
    affected_rows
  }

  insert_tag(
    objects: $Tags
    on_conflict: { constraint: tag_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  delete_department(
    where: {
      ParentId: { _eq: $Id }
      DepartmentTypeId: { _nin: $DepartmentTypeIds }
    }
  ) {
    affected_rows
  }

  insert_department(
    objects: $Departments
    on_conflict: { constraint: department_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  insert_contributor(
    objects: $Contributors
    on_conflict: { constraint: contributor_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  insert_owner(
    objects: $Owners
    on_conflict: { constraint: owner_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  insert_contributor_group(
    objects: $ContributorGroups
    on_conflict: { constraint: contributor_group_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  insert_owner_group(
    objects: $OwnerGroups
    on_conflict: { constraint: owner_group_pkey, update_columns: [] }
  ) {
    affected_rows
  }

  delete_owner_group(
    where: { ParentId: { _eq: $Id }, UserGroupId: { _nin: $OwnerGroupIds } }
  ) {
    affected_rows
  }

  delete_contributor_group(
    where: {
      ParentId: { _eq: $Id }
      UserGroupId: { _nin: $ContributorGroupIds }
    }
  ) {
    affected_rows
  }

  delete_owner(where: { ParentId: { _eq: $Id }, UserId: { _nin: $OwnerIds } }) {
    affected_rows
  }

  delete_contributor(
    where: { ParentId: { _eq: $Id }, UserId: { _nin: $ContributorIds } }
  ) {
    affected_rows
  }
}
