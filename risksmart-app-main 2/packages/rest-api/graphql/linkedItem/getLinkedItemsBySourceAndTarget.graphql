query getLinkedItemsBySourceAndTarget($item1: uuid!, $item2: [uuid!]!) {
  linked_item(
    where: {
      _or: [
        { Source: { _eq: $item1 }, Target: { _in: $item2 } }
        { Source: { _in: $item2 }, Target: { _eq: $item1 } }
      ]
    }
  ) {
    Id
    Source
    Target
    RelationshipType
  }
}
