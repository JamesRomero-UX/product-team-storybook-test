query getAttestations(
  $where: attestation_record_bool_exp
  $limit: Int
  $orderBy: [attestation_record_order_by!]
) {
  attestation_record(where: $where, limit: $limit, order_by: $orderBy) {
    ...AttestationParts
  }
}

mutation deleteAttestations($where: attestation_record_bool_exp!) {
  delete_attestation_record(where: $where) {
    returning {
      ...AttestationParts
    }
  }
}

mutation insertAttestations($objects: [attestation_record_insert_input!]!) {
  insert_attestation_record(objects: $objects) {
    returning {
      ...AttestationParts
    }
  }
}

mutation updateAttestations(
  $where: attestation_record_bool_exp!
  $set: attestation_record_set_input!
) {
  update_attestation_record(where: $where, _set: $set) {
    affected_rows
  }
}
