mutation updateRiskControlledSecondLineResult(
  $Id: uuid!
  $Impact: Int
  $Likelihood: Int
  $Rating: Int
  $Rationale: String
  $TestDate: timestamptz
  $CustomAttributeData: jsonb
  $SecondLineId: uuid
  $Parents: [second_line_result_parent_insert_input!]!
) {
  update_risk_controlled_second_line_result(
    where: { Id: { _eq: $Id } }
    _set: {
      CustomAttributeData: $CustomAttributeData
      Impact: $Impact
      Likelihood: $Likelihood
      Rating: $Rating
      Rationale: $Rationale
      TestDate: $TestDate
    }
  ) {
    affected_rows
  }

  delete_second_line_result_parent(
    where: {
      Id: { _eq: $Id }
      ParentType: { _eq: compliance_monitoring_assessment }
      ParentId: { _neq: $SecondLineId }
    }
  ) {
    affected_rows
  }

  insert_second_line_result_parent(
    objects: $Parents
    on_conflict: {
      constraint: second_line_result_parent_pkey
      update_columns: []
    }
  ) {
    affected_rows
  }
}
