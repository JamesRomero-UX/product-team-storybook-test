mutation updateRiskAssessmentResult(
  $Id: uuid!
  $Impact: Int
  $Likelihood: Int
  $Rating: Int
  $Rationale: String
  $TestDate: timestamptz
  $CustomAttributeData: jsonb
  $AssessmentId: uuid
  $RatingType: String
  $Parents: [assessment_result_parent_insert_input!]!
  $Impacts: [risk_assessment_result_impact_insert_input!]!
) {
  update_risk_assessment_result(
    where: { Id: { _eq: $Id } }
    _set: {
      CustomAttributeData: $CustomAttributeData
      Impact: $Impact
      Likelihood: $Likelihood
      Rating: $Rating
      Rationale: $Rationale
      TestDate: $TestDate
      RatingType: $RatingType
    }
  ) {
    affected_rows
  }

  delete_assessment_result_parent(
    where: {
      Id: { _eq: $Id }
      ParentType: { _eq: assessment }
      ParentId: { _neq: $AssessmentId }
    }
  ) {
    affected_rows
  }

  insert_assessment_result_parent(
    objects: $Parents
    on_conflict: {
      constraint: assessment_result_parent_pkey
      update_columns: []
    }
  ) {
    affected_rows
  }

  delete_risk_assessment_result_impact(
    where: { RiskAssessmentResultId: { _eq: $Id } }
  ) {
    affected_rows
  }

  insert_risk_assessment_result_impact(objects: $Impacts) {
    affected_rows
  }
}
