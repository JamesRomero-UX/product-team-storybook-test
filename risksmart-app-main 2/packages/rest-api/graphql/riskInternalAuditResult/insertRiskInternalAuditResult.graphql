mutation insertRiskControlledInternalAuditResults(
  $results: [risk_controlled_internal_audit_result_insert_input!]!
) {
  insert_risk_controlled_internal_audit_result(objects: $results) {
    affected_rows
  }
}

mutation insertRiskUncontrolledInternalAuditResults(
  $results: [risk_uncontrolled_internal_audit_result_insert_input!]!
) {
  insert_risk_uncontrolled_internal_audit_result(objects: $results) {
    affected_rows
  }
}
