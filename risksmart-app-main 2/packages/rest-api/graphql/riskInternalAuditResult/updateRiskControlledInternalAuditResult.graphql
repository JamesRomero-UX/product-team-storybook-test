mutation updateRiskControlledInternalAuditResult(
  $Id: uuid!
  $Impact: Int
  $Likelihood: Int
  $Rating: Int
  $Rationale: String
  $TestDate: timestamptz
  $CustomAttributeData: jsonb
  $InternalAuditId: uuid
  $Parents: [internal_audit_result_parent_insert_input!]!
) {
  update_risk_controlled_internal_audit_result(
    where: { Id: { _eq: $Id } }
    _set: {
      CustomAttributeData: $CustomAttributeData
      Impact: $Impact
      Likelihood: $Likelihood
      Rating: $Rating
      Rationale: $Rationale
      TestDate: $TestDate
    }
  ) {
    affected_rows
  }

  delete_internal_audit_result_parent(
    where: {
      Id: { _eq: $Id }
      ParentType: { _eq: internal_audit_report }
      ParentId: { _neq: $InternalAuditId }
    }
  ) {
    affected_rows
  }

  insert_internal_audit_result_parent(
    objects: $Parents
    on_conflict: {
      constraint: internal_audit_result_parent_pkey
      update_columns: []
    }
  ) {
    affected_rows
  }
}
