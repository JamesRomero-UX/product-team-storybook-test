mutation updateControlTestInternalAuditResult(
  $OriginalTimestamp: timestamptz!
  $Id: uuid!
  $Description: String
  $DesignEffectiveness: Int
  $OverallEffectiveness: Int
  $ParentControlId: uuid
  $PerformanceEffectiveness: Int
  $Submitter: String
  $TestDate: timestamptz
  $TestType: String
  $Title: String
  $CustomAttributeData: jsonb
) {
  update_control_test_internal_audit_result(
    where: {
      Id: { _eq: $Id }
      ModifiedAtTimestamp: { _eq: $OriginalTimestamp }
    }
    _set: {
      Description: $Description
      DesignEffectiveness: $DesignEffectiveness
      OverallEffectiveness: $OverallEffectiveness
      ParentControlId: $ParentControlId
      PerformanceEffectiveness: $PerformanceEffectiveness
      Submitter: $Submitter
      TestDate: $TestDate
      TestType: $TestType
      Title: $Title
      CustomAttributeData: $CustomAttributeData
    }
  ) {
    affected_rows
  }
}
