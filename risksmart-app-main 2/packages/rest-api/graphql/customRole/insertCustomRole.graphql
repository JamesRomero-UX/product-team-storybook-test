mutation insertCustomRole(
  $RoleName: String!
  $Description: String
  $customRoleAssignments: [custom_role_assignment_insert_input!]!
  $users: [custom_role_user_insert_input!]!
) {
  insert_custom_role_one(
    object: {
      RoleName: $RoleName
      Description: $Description
      customRoleAssignments: { data: $customRoleAssignments }
      customRoleUsers: { data: $users }
    }
  ) {
    Id
  }
}
