mutation insertChildAction(
  $DateDue: timestamptz!
  $Title: String!
  $Status: action_status_enum!
  $Priority: Int
  $Id: uuid!
  $Description: String
  $DateRaised: timestamptz!
  $ParentId: uuid!
  $ParentType: parent_type_enum!
  $ClosedDate: timestamptz
  $CustomAttributeData: jsonb
  $Tags: [tag_insert_input!]!
  $Departments: [department_insert_input!]!
  $Owners: [owner_insert_input!]!
  $OwnerGroups: [owner_group_insert_input!]!
  $Contributors: [contributor_insert_input!]!
  $ContributorGroups: [contributor_group_insert_input!]!
) {
  insert_action_one(
    object: {
      DateDue: $DateDue
      Title: $Title
      Status: $Status
      Priority: $Priority
      Id: $Id
      Description: $Description
      DateRaised: $DateRaised
      ClosedDate: $ClosedDate
      CustomAttributeData: $CustomAttributeData
    }
  ) {
    Id
  }

  insert_action_parent(
    objects: { ActionId: $Id, ParentId: $ParentId, ParentType: $ParentType }
  ) {
    affected_rows
  }

  insert_owner(objects: $Owners) {
    affected_rows
  }

  insert_contributor(objects: $Contributors) {
    affected_rows
  }

  insert_owner_group(objects: $OwnerGroups) {
    affected_rows
  }

  insert_contributor_group(objects: $ContributorGroups) {
    affected_rows
  }

  insert_tag(objects: $Tags) {
    affected_rows
  }

  insert_department(objects: $Departments) {
    affected_rows
  }
}
