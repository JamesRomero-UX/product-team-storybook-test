query getActions(
  $where: action_bool_exp
  $limit: Int
  $orderBy: [action_order_by!]
) {
  action(where: $where, limit: $limit, order_by: $orderBy) {
    ...ActionParts
    CustomAttributeData
    ownerGroups {
      UserGroupId
    }
    owners {
      UserId
    }
    contributorGroups {
      UserGroupId
    }
    contributors {
      UserId
    }
    tags {
      TagTypeId
    }
    departments {
      DepartmentTypeId
    }
  }
}

mutation deleteActions($Ids: [uuid!]) {
  delete_file(where: { relationFile: { ParentId: { _in: $Ids } } }) {
    affected_rows
  }

  delete_relation_file(where: { ParentId: { _in: $Ids } }) {
    affected_rows
  }

  delete_action_update(where: { ParentActionId: { _in: $Ids } }) {
    affected_rows
  }

  delete_action(where: { Id: { _in: $Ids } }) {
    affected_rows
  }
}

mutation insertActions($objects: [action_insert_input!]!) {
  insert_action(objects: $objects) {
    returning {
      ...ActionParts
    }
  }
}

mutation insertActionParents($objects: [action_parent_insert_input!]!) {
  insert_action_parent(objects: $objects) {
    returning {
      ActionId
    }
  }
}

mutation updateActions($where: action_bool_exp!, $set: action_set_input!) {
  update_action(where: $where, _set: $set) {
    returning {
      ...ActionParts
    }
  }
}
