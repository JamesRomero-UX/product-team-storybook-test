mutation insertDashboard(
  $Id: uuid!
  $Name: String!
  $Description: String
  $Sharing: dashboard_sharing_type_enum!
  $Content: jsonb!
  $Owners: [owner_insert_input!]!
  $Contributors: [contributor_insert_input!]!
  $ContributorGroups: [contributor_group_insert_input!]!
) {
  insert_dashboard_one(
    object: {
      Id: $Id
      Name: $Name
      Description: $Description
      Sharing: $Sharing
      Content: $Content
    }
  ) {
    Id
  }

  insert_owner(objects: $Owners) {
    affected_rows
  }

  insert_contributor(objects: $Contributors) {
    affected_rows
  }

  insert_contributor_group(objects: $ContributorGroups) {
    affected_rows
  }
}
