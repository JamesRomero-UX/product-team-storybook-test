mutation insertChildControl(
  $Title: String!
  $Id: uuid!
  $Description: String
  $Type: control_type_enum
  $TestFrequency: test_frequency_enum
  $ParentId: uuid!
  $CustomAttributeData: jsonb
  $Tags: [tag_insert_input!]!
  $Departments: [department_insert_input!]!
  $Owners: [owner_insert_input!]!
  $OwnerGroups: [owner_group_insert_input!]!
  $Contributors: [contributor_insert_input!]!
  $ContributorGroups: [contributor_group_insert_input!]!
  $schedule: schedule_insert_input!
) {
  insert_control_one(
    object: {
      Description: $Description
      Id: $Id
      Title: $Title
      Type: $Type
      CustomAttributeData: $CustomAttributeData
    }
  ) {
    Id
  }

  insert_schedule_one(object: $schedule) {
    Id
  }

  insert_control_parent(objects: { ControlId: $Id, ParentId: $ParentId }) {
    affected_rows
  }

  insert_owner(objects: $Owners) {
    affected_rows
  }

  insert_contributor(objects: $Contributors) {
    affected_rows
  }

  insert_owner_group(objects: $OwnerGroups) {
    affected_rows
  }

  insert_contributor_group(objects: $ContributorGroups) {
    affected_rows
  }

  insert_tag(objects: $Tags) {
    affected_rows
  }

  insert_department(objects: $Departments) {
    affected_rows
  }
}
