query getControls(
  $where: control_bool_exp
  $limit: Int
  $orderBy: [control_order_by!]
) {
  control(where: $where, limit: $limit, order_by: $orderBy) {
    ...ControlParts
    CustomAttributeData
    ownerGroups {
      UserGroupId
    }
    owners {
      UserId
    }
    contributorGroups {
      UserGroupId
    }
    contributors {
      UserId
    }
    tags {
      TagTypeId
    }
    departments {
      DepartmentTypeId
    }
  }
}
