mutation upsertRiskScores($scores: [risk_score_insert_input!]!) {
  insert_risk_score(
    objects: $scores
    on_conflict: {
      constraint: risk_score_pkey
      update_columns: [
        InherentScore
        ResidualScore
        ResidualRating
        InherentRating
        ResidualImpact
        ResidualLikelihood
        InherentImpact
        InherentLikelihood
        ModifiedAtTimestamp
      ]
    }
  ) {
    affected_rows
  }
}
