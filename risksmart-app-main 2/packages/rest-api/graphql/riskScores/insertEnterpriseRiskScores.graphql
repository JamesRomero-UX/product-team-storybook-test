mutation insertEnterpriseRiskScores(
  $objects: [enterprise_risk_score_insert_input!]!
) {
  insert_enterprise_risk_score(
    objects: $objects
    on_conflict: {
      constraint: enterprise_risk_score_pkey
      update_columns: [
        ResidualScoreMean
        ResidualScoreMedian
        ResidualScoreWorstCase
        InherentScoreMean
        InherentScoreMedian
        InherentScoreWorstCase
        ResidualRatingMean
        ResidualRatingMedian
        ResidualRatingWorstCase
        InherentRatingMean
        InherentRatingMedian
        InherentRatingWorstCase
      ]
    }
  ) {
    affected_rows
  }
}
