query getAncestorRiskScoresByRiskId($RiskId: uuid!) {
  tier2: risk(where: { Id: { _eq: $RiskId }, Tier: { _eq: 2 } }) {
    Id
    childRisks {
      Id
      riskScore {
        ResidualScore
        InherentScore
        ResidualRating
        InherentRating
        ResidualImpact
        ResidualLikelihood
        InherentImpact
        InherentLikelihood
      }
    }
  }

  tier1: risk(where: { Id: { _eq: $RiskId }, Tier: { _eq: 1 } }) {
    Id
    childRisks {
      Id
      riskScore {
        ResidualScore
        InherentScore
        ResidualRating
        InherentRating
        ResidualImpact
        ResidualLikelihood
        InherentImpact
        InherentLikelihood
      }
    }
  }
}
