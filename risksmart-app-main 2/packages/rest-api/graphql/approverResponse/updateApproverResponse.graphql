mutation updateApproverResponse(
  $changeRequestId: uuid!
  $approverIds: [uuid!]!
  $response: Boolean!
  $comment: String!
  $approvedByUser: String!
  $approvedAtTimestamp: timestamptz!
) {
  update_approver_response(
    _set: {
      Approved: $response,
      Comment: $comment,
      ApprovedByUser: $approvedByUser,
      ApprovedAtTimestamp: $approvedAtTimestamp,
    }
    where: {
      _and: [
        { changeRequest: { Id: { _eq: $changeRequestId } } }
        { approver: { Id: { _in: $approverIds } } }
      ]
    }
  ) {
    returning {
      Approved
      Comment
      approver {
        OwnerApprover
        UserId
      }
    }
  }
}
