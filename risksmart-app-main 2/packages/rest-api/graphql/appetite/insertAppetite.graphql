mutation insertAppetite(
  $Id: uuid!
  $LowerAppetite: Int
  $Statement: String
  $UpperAppetite: Int
  $CustomAttributeData: jsonb
  $EffectiveDate: timestamptz
  $AppetiteType: appetite_type_enum
  $ImpactAppetite: Int
  $LikelihoodAppetite: Int
  $parents: [appetite_parent_insert_input!]!
  $ImpactId: uuid
) {
  insert_appetite_one(
    object: {
      Id: $Id
      LowerAppetite: $LowerAppetite
      Statement: $Statement
      UpperAppetite: $UpperAppetite
      CustomAttributeData: $CustomAttributeData
      EffectiveDate: $EffectiveDate
      AppetiteType: $AppetiteType
      ImpactAppetite: $ImpactAppetite
      LikelihoodAppetite: $LikelihoodAppetite
      ImpactId: $ImpactId
    }
  ) {
    Id
  }

  insert_appetite_parent(objects: $parents) {
    affected_rows
  }
}
