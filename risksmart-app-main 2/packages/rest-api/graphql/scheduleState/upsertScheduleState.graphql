mutation upsertScheduleState(
  $Id: uuid!
  $LatestDate: timestamptz
  $DueDate: timestamptz
  $OverdueDate: timestamptz
  $ModifiedByUser: String
  $ModifiedAtTimestamp: timestamptz!
  $OrgKey: String
) {
  insert_schedule_state_one(
    object: {
      Id: $Id
      DueDate: $DueDate
      OverdueDate: $OverdueDate
      LatestDate: $LatestDate
      CreatedByUser: $ModifiedByUser
      ModifiedByUser: $ModifiedByUser
      ModifiedAtTimestamp: $ModifiedAtTimestamp
      OrgKey: $OrgKey
    }
    on_conflict: {
      constraint: schedule_state_pkey
      update_columns: [
        DueDate
        OverdueDate
        LatestDate
        ModifiedByUser
        ModifiedAtTimestamp
      ]
    }
  ) {
    Id
  }
}
