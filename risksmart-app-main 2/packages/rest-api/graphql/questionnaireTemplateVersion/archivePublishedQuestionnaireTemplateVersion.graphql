mutation archivePublishedQuestionnaireTemplateVersion(
  $questionnaireTemplateId: uuid!
  $questionnaireTemplateVersionId: uuid!
  $questionnaireTemplateVersionCreationTimestamp: timestamptz!
) {
  archive: update_questionnaire_template_version(
    where: {
      ParentId: { _eq: $questionnaireTemplateId }
      CreatedAtTimestamp: { _lte: $questionnaireTemplateVersionCreationTimestamp }
      Id: { _neq: $questionnaireTemplateVersionId }
    }
    _set: {
      Status: archived
    }
  ) {
    affected_rows
  }
  publish:update_questionnaire_template_version(
    where: {
      ParentId: { _eq: $questionnaireTemplateId }
      CreatedAtTimestamp: { _lte: $questionnaireTemplateVersionCreationTimestamp }
      Id: { _eq: $questionnaireTemplateVersionId }
    }
    _set: {
      Status: published
    }
  ) {
    affected_rows
  }
}
