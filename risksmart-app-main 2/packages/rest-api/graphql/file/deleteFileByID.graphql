mutation deleteFile($FileId: uuid) {
  delete_file(where: { Id: { _eq: $FileId } }) {
    affected_rows
  }
}

mutation deleteRelationFile($parentIds: [uuid!], $fileIds: [uuid!]) {
  delete_relation_file(
    where: { FileId: { _in: $fileIds }, ParentId: { _in: $parentIds } }
  ) {
    affected_rows
  }
}
