mutation insertRelationFiles(
  $files: [file_insert_input!]!
  $relationFiles: [relation_file_insert_input!]!
) {
  insert_file(objects: $files) {
    affected_rows
  }
  insert_relation_file(objects: $relationFiles) {
    affected_rows
  }
}

mutation insertRelationFilesOnly(
  $relationFiles: [relation_file_insert_input!]!
) {
  insert_relation_file(objects: $relationFiles) {
    affected_rows
  }
}
