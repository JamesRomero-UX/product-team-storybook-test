query getFiles($where: file_bool_exp, $limit: Int, $orderBy: [file_order_by!]) {
  file(where: $where, limit: $limit, order_by: $orderBy) {
    Id
  }
}

mutation deleteFiles($where: file_bool_exp!) {
  delete_file(where: $where) {
    returning {
      Id
    }
  }
}

mutation insertFile($objects: [file_insert_input!]!) {
  insert_file(objects: $objects) {
    returning {
      Id
    }
  }
}

mutation updateFiles($where: file_bool_exp!, $set: file_set_input!) {
  update_file(where: $where, _set: $set) {
    returning {
      Id
    }
  }
}
