query GetUserById($Id: String!) {
  auth_user_by_pk(Id: $Id) {
    Id
    Email
    UserName
    FirstName
    LastName
    Status
    RoleKey
    AuthUser_Id
    DisplayName
    JobTitle
    Department
    OfficeLocation
    IsCustomerSupport
    organisationusers {
      OrgKey
      RoleKey
      External_Id
    }
  }
}
