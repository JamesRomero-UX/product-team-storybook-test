mutation UpdateUser($Id: String!, $OrgKey: String!, $RoleKey: String!) {
  update_auth_user_by_pk(pk_columns: { Id: $Id }, _set: { RoleKey: $RoleKey }) {
    Id
    RoleKey
  }
  update_auth_organisationuser_by_pk(
    pk_columns: { OrgKey: $OrgKey, User_Id: $Id }
    _set: { RoleKey: $RoleKey }
  ) {
    OrgKey
    RoleKey
  }
}
