mutation insertUser(
  $UserId: String!
  $UserName: String
  $Email: String!
  $OrgKey: String!
  $CreatedByUser: String!
  $AuthConnection: String
) {
  insert_auth_user_one(
    object: {
      Id: $UserId
      UserName: $UserName
      Email: $Email
      CreatedByUser: $CreatedByUser
      AuthConnection: $AuthConnection
    }
  ) {
    Id
    UserName
    Email
  }

  insert_auth_organisationuser_one(
    object: {
      User_Id: $UserId
      OrgKey: $OrgKey
      CreatedByUser: $CreatedByUser
      AuthConnection: $AuthConnection
    }
  ) {
    User_Id
  }
}
