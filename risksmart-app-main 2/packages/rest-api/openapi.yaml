openapi: 3.0.0
info:
  title: RiskSmart Kraken API
  version: 1.0.0
  description: API for viewing risks and associated data in the RiskSmart platform

security:
  - ApiKeyAuth: []

paths:
  /risks:
    get:
      summary: Get a list of risks
      description: Retrieves a paginated list of risks with detailed information
      parameters:
        - name: limit
          in: query
          description: Number of items to return
          required: false
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          description: Number of items to skip
          required: false
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/ExpandedRisk'
                    pagination:
                      $ref: '#/components/schemas/Pagination'

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
  schemas:
    ExpandedRisk:
      type: object
      properties:
        Id:
          type: string
          format: uuid
          example: "dca64f95-8297-4d96-a98b-daa9cd940f13"
        CreatedAtTimestamp:
          type: string
          format: date-time
        ModifiedAtTimestamp:
          type: string
          format: date-time
        Title:
          type: string
        Tier:
          type: integer
          enum: [1, 2, 3]
        Description:
          type: string
        ParentRiskId:
          type: string
          format: uuid
          nullable: true
        Treatment:
          type: string
          enum: [treat, transfer, terminate, tolerate]
          nullable: true
        Status:
          type: string
          enum: [active, emerging, retired, monitored]
          nullable: true
        CustomAttributeData:
          type: object
          additionalProperties: true
        SequentialId:
          type: integer
        schedule:
          $ref: '#/components/schemas/Schedule'
        scheduleState:
          $ref: '#/components/schemas/ScheduleState'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/Owner'
        ownerGroups:
          type: array
          items:
            $ref: '#/components/schemas/OwnerGroup'
        contributors:
          type: array
          items:
            $ref: '#/components/schemas/Contributor'
        contributorGroups:
          type: array
          items:
            $ref: '#/components/schemas/ContributorGroup'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        departments:
          type: array
          items:
            $ref: '#/components/schemas/Department'
        enterpriseRiskInstance:
          $ref: '#/components/schemas/EnterpriseRiskInstance'
        actions:
          type: array
          items:
            $ref: '#/components/schemas/Action'
        controls:
          type: array
          items:
            $ref: '#/components/schemas/Control'
        assessmentResults:
          type: array
          items:
            $ref: '#/components/schemas/RiskAssessmentResult'
        createdByUser:
          $ref: '#/components/schemas/User'
        modifiedByUser:
          $ref: '#/components/schemas/User'

    Schedule:
      type: object
      properties:
        Frequency:
          type: string
          nullable: true
        ManualDueDate:
          type: string
          format: date-time
          nullable: true
        StartDate:
          type: string
          format: date-time
          nullable: true
        TimeToCompleteValue:
          type: integer
        TimeToCompleteUnit:
          type: string
          enum: [day, week]

    ScheduleState:
      type: object
      properties:
        LatestDate:
          type: string
          format: date-time
          nullable: true
        DueDate:
          type: string
          format: date-time
        OverdueDate:
          type: string
          format: date-time

    Owner:
      type: object
      properties:
        UserId:
          type: string
        user:
          $ref: '#/components/schemas/UserRef'

    Contributor:
      type: object
      properties:
        UserId:
          type: string
        user:
          $ref: '#/components/schemas/UserRef'
          
    OwnerGroup:
      type: object
      properties:
        UserGroupId:
          type: string
          format: uuid
        group:
          type: object
          properties:
            Name:
              type: string
            users:
              type: array
              items: 
                type: object
                properties:
                  UserId:
                    type: string
    
    ContributorGroup:
      type: object
      properties:
        UserGroupId:
          type: string
          format: uuid
        group:
          type: object
          properties:
            Name:
              type: string

    User:
      type: object
      properties:
        Id:
          type: string
        UserName:
          type: string
        Email:
          type: string

    UserRef:
      type: object
      properties:
        UserName:
          type: string
        Id:
          type: string
          
    Tag:
      type: object
      properties:
        type:
          type: object
          properties:
            Description:
              type: string
            Name:
              type: string
        ParentId:
          type: string
          format: uuid
        TagTypeId:
          type: string
          format: uuid

    Department:
      type: object
      properties:
        type:
          type: object
          properties:
            Description:
              type: string
            Name:
              type: string
        ParentId:
          type: string
          format: uuid
        DepartmentTypeId:
          type: string
          format: uuid
          
    EnterpriseRiskInstance:
      type: object
      nullable: true
      properties:
        entity:
          type: object
          properties:
            entity:
              type: object
              properties:
                Id:
                  type: string
                  format: uuid
                Name:
                  type: string
            enterpriseRisk:
              type: object
              properties:
                Id:
                  type: string
                  format: uuid
    
    Action:
      type: object
      properties:
        Id:
          type: string
          format: uuid
        DateDue:
          type: string
          format: date-time
        DateRaised:
          type: string
          format: date-time
        Description:
          type: string
        Priority:
          type: string
          enum: [low, medium, high]
        Status:
          type: string
          enum: [pending, open, closed]
        ModifiedAtTimestamp:
          nullable: true
          type: string
          format: date-time
        CreatedAtTimestamp:
          type: string
          format: date-time
        Title:
          type: string
        CreatedByUser:
          type: string
          format: uuid
        ModifiedByUser:
          nullable: true
          type: string
          format: uuid
        ClosedDate:
          nullable: true
          type: string
          format: date-time
        CustomAttributeData:
          nullable: true
          type: object
        SequentialId:
          type: number
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        departments:
          type: array
          items:
            $ref: '#/components/schemas/Department'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/Owner'
        ownerGroups:
          type: array
          items:
            $ref: '#/components/schemas/OwnerGroup'
        contributors:
          type: array
          items:
            $ref: '#/components/schemas/Contributor'
        contributorGroups:
          type: array
          items:
            $ref: '#/components/schemas/ContributorGroup'

    Control:
      type: object
      properties:
        CreatedByUser:
          type: string
          format: uuid
        ModifiedByUser:
          nullable: true
          type: string
          format: uuid
        Description:
          type: string
        Id:
          type: string
          format: uuid
        CreatedAtTimestamp:
          type: string
          format: date-time
        ModifiedAtTimestamp:
          nullable: true
          type: string
          format: date-time
        Title:
          type: string
        Type:
          type: string
          enum: [Preventive, Corrective, Directive, Detective]
        CustomAttributeData:
          nullable: true
          type: object
        SequentialId:
          type: number
        scheduleState:
          type: object
          properties:
            LatestDate:
              type: string
              format: date-time
        tags:
          type: array
          items:
            $ref: '#/components/schemas/Tag'
        departments:
          type: array
          items:
            $ref: '#/components/schemas/Department'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/Owner'
        ownerGroups:
          type: array
          items:
            $ref: '#/components/schemas/OwnerGroup'
        contributors:
          type: array
          items:
            $ref: '#/components/schemas/Contributor'
        contributorGroups:
          type: array
          items:
            $ref: '#/components/schemas/ContributorGroup'

    Assessment:
      type: object
      properties:
        ActualCompletionDate:
          nullable: true
          type: string
          format: date-time
        CompletedByUser:
          type: string
          format: uuid
        CreatedAtTimestamp:
          type: string
          format: date-time
        CreatedByUser:
          type: string
          format: uuid
        CustomAttributeData:
          nullable: true
          type: object
        Id:
          type: string
          format: uuid
        ModifiedAtTimestamp:
          nullable: true
          type: string
          format: date-time
        ModifiedByUser:
          nullable: true
          type: string
          format: uuid
        NextTestDate:
          type: string
          format: date-time
        OriginatingItemId:
          type: string
          format: uuid
        SequentialId:
          type: number
        StartDate:
          type: string
          format: date-time
        Summary:
          type: string
        TargetCompletionDate:
          nullable: true
          type: string
          format: date-time
        Title:
          type: string
        Status:
          type: string
          enum: [complete, notstarted, inprogress]
        Outcome:
          nullable: true
          type: number
        completedByUser:
          type: object
          properties:
            FriendlyName:
              type: string

    RiskAssessmentResult:
      type: object
      properties:
        Id:
          type: string
          format: uuid
        Likelihood:
          type: number
        Impact:
          type: number
        Rating:
          type: number
        ControlType:
          type: string
          enum: [Preventive, Corrective, Directive, Detective]
        CustomAttributeData:
          nullable: true
          type: object
        Rationale:
          nullable: true
          type: string
        TestDate:
          nullable: true
          type: string
          format: date-time
        parents:
          type: array
          items:
            $ref: '#/components/schemas/Assessment'

    Pagination:
      type: object
      properties:
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer
