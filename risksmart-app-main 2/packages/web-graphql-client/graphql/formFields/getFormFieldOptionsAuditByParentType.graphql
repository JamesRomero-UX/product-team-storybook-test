query getFormFieldConfigurationAuditByParentType(
  $parentType: String!,
  $fieldId: String!) {
  form_field_configuration_audit(
    where: {
      FormConfigurationParentType: { _eq: $parentType }
      FieldId: { _eq: $fieldId }
    }, order_by: {ModifiedAtTimestamp: desc}
  ) {
    FieldId
    Hidden
    Required
    ReadOnly
    CreatedByUser
    CreatedAtTimestamp
    ModifiedByUser
    ModifiedAtTimestamp
    FormConfigurationParentType
  }
}
