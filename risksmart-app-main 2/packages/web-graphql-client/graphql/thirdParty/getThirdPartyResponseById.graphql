query getThirdPartyResponseById($Id: uuid!) {
  third_party_response_by_pk(Id: $Id) {
    ResponseData
    Status
    CreatedByUser
    ModifiedByUser
    CreatedAtTimestamp
    ModifiedAtTimestamp
    QuestionnaireTemplateVersionId
    ParentId
    StartDate
    ExpiresAt

    invitees {
      UserId
      UserEmail
      user {
        Email
      }
    }

    thirdParty {
      Id
      Title
      ancestorContributors {
        ...AncestorContributorParts
      }
    }

    questionnaireTemplateVersion {
      Id
      Version
      Status
      Schema
      UISchema
      parent {
        Title
      }
    }

    files {
      file {
        ContentType
        FileName
        FileSize
        Id
        CreatedAtTimestamp
        CreatedByUser
        ModifiedAtTimestamp
        ModifiedByUser
        Meta
      }
    }
  }
}

