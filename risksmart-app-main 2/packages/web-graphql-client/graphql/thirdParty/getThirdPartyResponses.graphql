subscription getThirdPartyResponses {
  third_party_response {
    Id
    ResponseData
    Status
    CreatedByUser
    ModifiedByUser
    CreatedAtTimestamp
    ModifiedAtTimestamp
    QuestionnaireTemplateVersionId
    ParentId
    StartDate
    ExpiresAt
    invitees {
      UserId
      UserEmail
      user {
        Email
      }
    }
    thirdParty {
      Id
      Title
    }
    questionnaireTemplateVersion {
      Id
      Version
      Status
      parent {
        Title
      }
    }
  }
}
