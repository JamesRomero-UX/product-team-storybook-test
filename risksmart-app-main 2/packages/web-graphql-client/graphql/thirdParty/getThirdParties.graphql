query getThirdParties($where: third_party_bool_exp! = {}) {
  third_party(where: $where) {
    ...ThirdPartyParts
    owners {
      ...OwnerParts
    }
    contributors {
      ...ContributorParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
  }
}
