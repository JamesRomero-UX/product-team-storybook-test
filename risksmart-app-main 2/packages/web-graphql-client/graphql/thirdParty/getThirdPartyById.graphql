query getThirdPartyById($Id: uuid!) {
  third_party: third_party_by_pk(Id: $Id) {
    ...ThirdPartyParts
    owners {
      ...OwnerParts
    }
    contributors {
      ...ContributorParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    ancestorContributors {
      ...AncestorContributorParts
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
    files {
      ...RelationFileParts
    }
  }
}
