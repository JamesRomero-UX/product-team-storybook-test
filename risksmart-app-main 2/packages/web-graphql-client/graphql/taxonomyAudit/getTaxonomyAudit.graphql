query getTaxonomyAudit($Locale: String!, $OrgKey: String!) {
  taxonomy_audit(
    where: {
      organisations: { Locale: { _eq: $Locale }, OrgKey: { _eq: $OrgKey } }
    }
    order_by: { ModifiedAtTimestamp: desc }
  ) {
    Description
    Id
    Common
    Library
    Rating
    Taxonomy
    InternalAuditRating
    ModifiedAtTimestamp
    organisations_aggregate {
      aggregate {
        count
      }
    }
  }
}
