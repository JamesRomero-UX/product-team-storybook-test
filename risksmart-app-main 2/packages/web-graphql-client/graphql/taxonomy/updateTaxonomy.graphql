mutation updateTaxonomy(
  $Id: uuid!
  $Common: jsonb!
  $Library: jsonb!
  $Rating: jsonb!
  $Taxonomy: jsonb!
  $InternalAuditRating: jsonb!
  $OriginalTimestamp: timestamptz
) {
  update_taxonomy(
    where: {
      Id: { _eq: $Id }
      ModifiedAtTimestamp: { _eq: $OriginalTimestamp }
    }
    _set: {
      Common: $Common
      Library: $Library
      Rating: $Rating
      Taxonomy: $Taxonomy
      InternalAuditRating: $InternalAuditRating
    }
  ) {
    affected_rows
  }
}
