query getLinkedItems(
  $Id: uuid!
  $IncludeInternalAudit: Boolean!
  $IncludeCompliance: Boolean!
) {
  linked_item(where: { Source: { _eq: $Id } }) {
    Id
    Source
    Target
    RelationshipType
    target_node {
      ObjectType
      SequentialId
    }
    target_control {
      ...ControlParts
      owners {
        ...OwnerParts
      }
      contributors {
        ...ContributorParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      contributorGroups {
        ...ContributorGroupParts
      }
    }
    target_control_group {
      ...ControlGroupParts
    }
    target_obligation {
      ...ObligationParts
      owners {
        ...OwnerParts
      }
      contributors {
        ...ContributorParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      contributorGroups {
        ...ContributorGroupParts
      }
    }
    target_obligation_change {
      Id
      SequentialId
      DescriptionBefore
      DescriptionAfter
      Rationale
      ObligationId
      ExternalId
      EffectiveDate
      CreatedAtTimestamp
      ModifiedAtTimestamp
      CreatedByUser
      ModifiedByUser
      obligation {
        Reference
        Title
        regulatorySource {
          RegulatorName
        }
      }
      owners {
        ...OwnerParts
      }
      contributors {
        ...ContributorParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      contributorGroups {
        ...ContributorGroupParts
      }
    }
    target_document {
      ...DocumentParts
      owners {
        ...OwnerParts
      }
      contributors {
        ...ContributorParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      contributorGroups {
        ...ContributorGroupParts
      }
    }
    target_risk {
      ...RiskParts
      enterpriseRiskInstance {
        EntityId
        entity {
          Id
          Name
          ParentId
        }
      }
      owners {
        ...OwnerParts
      }
      contributors {
        ...ContributorParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      contributorGroups {
        ...ContributorGroupParts
      }
    }
    target_assessment_activity {
      ...AssessmentActivityParts
      parentInternalAuditReport @include(if: $IncludeInternalAudit) {
        Id
      }
      parentAssessment {
        Id
      }
      parentComplianceMonitoringAssessment @include(if: $IncludeCompliance) {
        Id
      }
    }
    target_assessment {
      ...AssessmentParts
      owners {
        ...OwnerParts
      }
      contributors {
        ...ContributorParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      contributorGroups {
        ...ContributorGroupParts
      }
    }
    target_internal_audit_report @include(if: $IncludeInternalAudit) {
      ...InternalAuditReportParts
      owners {
        ...OwnerParts
      }
      contributors {
        ...ContributorParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      contributorGroups {
        ...ContributorGroupParts
      }
    }
    target_internal_audit_entity @include(if: $IncludeInternalAudit) {
      ...InternalAuditEntityParts
      owners {
        ...OwnerParts
      }
      contributors {
        ...ContributorParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      contributorGroups {
        ...ContributorGroupParts
      }
    }
    target_impact {
      ...ImpactParts
      owners {
        ...OwnerParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
    }
    target_obligation_impact {
      Id
      Description
      ParentObligationId
    }
    target_impact_rating {
      Id
      impact {
        ...ImpactParts
        owners {
          ...OwnerParts
        }
        ownerGroups {
          ...OwnerGroupParts
        }
      }
    }
    target_action {
      ...ActionParts
      owners {
        ...OwnerParts
      }
      contributors {
        ...ContributorParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      contributorGroups {
        ...ContributorGroupParts
      }
    }
    target_indicator {
      ...IndicatorParts
      owners {
        ...OwnerParts
      }
      contributors {
        ...ContributorParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      contributorGroups {
        ...ContributorGroupParts
      }
    }
    target_acceptance {
      ...AcceptanceParts
    }
    target_appetite {
      ...AppetiteParts
    }
    target_issue {
      ...IssueParts
      owners {
        ...OwnerParts
      }
      contributors {
        ...ContributorParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      contributorGroups {
        ...ContributorGroupParts
      }
    }
    target_consequence {
      ...ConsequenceParts
    }
    target_cause {
      ...CauseParts
    }
    target_test_result {
      ...TestResultParts
    }
    target_action_update {
      ...ActionUpdateParts
    }
    target_issue_update {
      ...IssueUpdateParts
      issue {
        Type
      }
    }
    target_third_party {
      ...ThirdPartyParts
      owners {
        ...OwnerParts
      }
      contributors {
        ...ContributorParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      contributorGroups {
        ...ContributorGroupParts
      }
    }
  }
}
