query getRiskById($_eq: uuid) {
  risk(where: { Id: { _eq: $_eq } }) {
    ...RiskParts
    scheduleState {
      LatestDate
    }
    parent {
      Id
      Title
    }
    parentNode {
      Id
      ObjectType
      SequentialId
    }
    assessmentResults(
      where: {
        riskAssessmentResult: { RatingType: { _in: ["assessment", "rating"] } }
      }
    ) {
      riskAssessmentResult {
        ControlType
        Rating
      }
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
    owners {
      ...OwnerParts
    }
    contributors {
      ...ContributorParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributorGroups {
      UserGroupId
      group {
        Name
        users {
          UserId
        }
      }
    }
    ancestorContributors {
      ...AncestorContributorParts
    }
    enterpriseRiskInstance {
      EnterpriseRiskId
      EntityId
    }
  }
}
