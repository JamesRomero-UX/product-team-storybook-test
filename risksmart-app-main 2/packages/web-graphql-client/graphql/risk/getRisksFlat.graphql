query getRisksFlat(
  $where: risk_bool_exp! = {}
  $riskAssessmentResultsWhere: risk_assessment_result_bool_exp! = {}
) {
  risk(where: $where) {
    ...RiskParts
    scheduleState {
      LatestDate
      DueDate
      OverdueDate
    }
    createdByUser {
      FriendlyName
    }
    parent {
      Title
    }
    parentNode {
      Id
      ObjectType
      SequentialId
    }
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributors {
      ...ContributorParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    appetites(
      limit: 1
      where: { appetite: { AppetiteType: { _eq: risk } } }
      order_by: [
        { appetite: { EffectiveDate: desc_nulls_last } }
        { appetite: { CreatedAtTimestamp: desc_nulls_last } }
      ]
    ) {
      appetite {
        LowerAppetite
        UpperAppetite
      }
    }
    impactRatings(
      where: { RatingType: { _in: ["assessment", "rating"] } }
      distinct_on: [ImpactId]
      order_by: [{ ImpactId: desc }, { TestDate: desc }]
    ) {
      ImpactId
      Rating
    }
    impactRatingsForTrend: impactRatings(
      where: { RatingType: { _in: ["assessment", "rating"] } }
      order_by: [{ TestDate: desc }, { CreatedAtTimestamp: desc }]
      limit: 10
    ) {
      ImpactId
      Rating
      TestDate
    }
    assessmentResults(
      where: {
        riskAssessmentResult: {
          _and: [
            { RatingType: { _in: ["assessment", "rating"] } }
            $riskAssessmentResultsWhere
          ]
        }
      }
      order_by: [
        { riskAssessmentResult: { TestDate: desc_nulls_last } }
        { riskAssessmentResult: { CreatedAtTimestamp: desc_nulls_last } }
      ]
    ) {
      ParentId
      riskAssessmentResult {
        Id
        Rating
        ControlType
        Likelihood
        Impact
        CustomAttributeData
        CreatedAtTimestamp
        TestDate
      }
    }
    controls_aggregate {
      aggregate {
        count
      }
    }
    indicators_aggregate {
      aggregate {
        count
      }
    }
    actions_aggregate {
      aggregate {
        count
      }
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
    enterpriseRiskInstance {
      entity {
        Id
        Name
      }
      enterpriseRisk {
        Id
        Title
      }
    }
  }
}
