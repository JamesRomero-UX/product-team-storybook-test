query getMyItems($userId: String!) {
  obligation(where: { ancestorContributors: { UserId: { _eq: $userId } } }) {
    Id
    Title
    Description
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributors {
      ...ContributorParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
  }

