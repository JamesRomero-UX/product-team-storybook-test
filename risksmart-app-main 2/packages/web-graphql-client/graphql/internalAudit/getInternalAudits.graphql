query getInternalAudits($where: internal_audit_entity_bool_exp! = {}) {
  internal_audit_entity(where: $where) {
    ...InternalAuditEntityParts
    actions {
      action {
        ...ActionParts
      }
    }
    internalAuditReports {
      ...InternalAuditReportParts
    }
    issues {
      issue {
        ...IssueParts
        assessment {
          ...IssueAssessmentParts
        }
      }
    }
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributors {
      ...ContributorParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    modifiedByUser {
      FriendlyName
    }
    createdByUser {
      FriendlyName
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
  }
}
