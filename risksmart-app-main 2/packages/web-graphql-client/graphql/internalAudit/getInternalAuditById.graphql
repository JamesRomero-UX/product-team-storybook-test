query getInternalAuditById($id: uuid) {
  internal_audit_entity(where: { Id: { _eq: $id } }) {
    ...InternalAuditEntityParts
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributors {
      ...ContributorParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    modifiedByUser {
      FriendlyName
    }
    createdByUser {
      FriendlyName
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
    ancestorContributors {
      ...AncestorContributorParts
    }
  }
}
