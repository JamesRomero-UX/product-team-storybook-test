mutation updateControlledRiskSecondLineResult(
  $Id: uuid!
  $Impact: Int
  $Likelihood: Int
  $Rating: Int
  $Rationale: String
  $TestDate: timestamptz
  $CustomAttributeData: jsonb
) {
  update_risk_controlled_second_line_result(
    where: { Id: { _eq: $Id } }
    _set: {
      CustomAttributeData: $CustomAttributeData
      Rating: $Rating
      Rationale: $Rationale
      TestDate: $TestDate
      Likelihood: $Likelihood
      Impact: $Impact
    }
  ) {
    affected_rows
  }
}

