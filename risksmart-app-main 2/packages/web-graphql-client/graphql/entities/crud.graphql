query getEntities {
  entity {
    Id
    Name
    Description
    ParentId
    Weight
    CreatedAtTimestamp
    ModifiedAtTimestamp
    modifiedByUser {
      FriendlyName
    }
    createdByUser {
      FriendlyName
    }
    parent {
      Id
      Name
    }
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    children {
      Id
      Name
    }
  }
}

query getEntityById($Id: uuid!) {
  entity_by_pk(Id: $Id) {
    Id
    Name
    Description
    ParentId
    Weight
    CreatedAtTimestamp
    ModifiedAtTimestamp
    modifiedByUser {
      FriendlyName
    }
    createdByUser {
      FriendlyName
    }
    parent {
      Id
      Name
    }
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
  }
}

mutation insertEntity(
  $Name: String!
  $Description: String
  $ParentId: uuid
  $Weight: numeric!
  $owners: [String!]!
  $ownerGroups: [String!]!
) {
  insertChildEntity(
    object: {
      Name: $Name
      Description: $Description
      ParentId: $ParentId
      Weight: $Weight
      owners: $owners
      ownerGroups: $ownerGroups
    }
  ) {
    Id
  }
}

mutation updateEntity(
  $Id: uuid!
  $Name: String!
  $Description: String
  $ParentId: uuid
  $Weight: numeric!
  $owners: [String!]!
  $ownerGroups: [String!]!
) {
  updateChildEntity(
    object: {
      Id: $Id
      Name: $Name
      Description: $Description
      ParentId: $ParentId
      Weight: $Weight
      owners: $owners
      ownerGroups: $ownerGroups
    }
  ) {
    affected_rows
  }
}

mutation deleteEntity($Id: uuid!) {
  deleteChildEntity(Id: $Id) {
    affected_rows
  }
}
