mutation UpdateTagType(
  $TagTypeId: uuid!
  $Name: String
  $Description: String
  $TagTypeGroupId: uuid
  $OriginalTimestamp: timestamptz
) {
  update_tag_type(
    where: {
      TagTypeId: { _eq: $TagTypeId }
      _and: { ModifiedAtTimestamp: { _eq: $OriginalTimestamp } }
    }
    _set: {
      Name: $Name
      Description: $Description
      TagTypeGroupId: $TagTypeGroupId
    }
  ) {
    affected_rows
  }
}
