query getActionById($_eq: uuid!) {
  action(where: { Id: { _eq: $_eq } }) {
    ...ActionParts
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
    files {
      ...RelationFileParts
    }
    owners {
      ...OwnerParts
    }
    contributors {
      ...ContributorParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    ancestorContributors {
      ...AncestorContributorParts
    }
  }
}
