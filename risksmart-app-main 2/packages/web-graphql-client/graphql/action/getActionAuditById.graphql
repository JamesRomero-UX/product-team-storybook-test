query getActionAuditById($id: uuid!) {
  action_audit(where: { Id: { _eq: $id } }, order_by: {ModifiedAtTimestamp: desc}) {
    DateDue
    DateRaised
    Description
    Id
    Priority
    Status
    ModifiedAtTimestamp
    CreatedAtTimestamp
    Title
    CreatedByUser
    ModifiedByUser
    ClosedDate
    CustomAttributeData
    SequentialId
  }
}
