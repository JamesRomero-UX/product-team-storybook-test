query getAssessmentRCSAActivitiesByParentId($AssessmentId: uuid!) {
  assessment_activity(
    where: { ParentId: { _eq: $AssessmentId }, IsRCSA: { _eq: true } }
  ) {
    ...AssessmentActivityParts
    parentRisk {
      Title
      SequentialId
    }
    assignedUser {
      FriendlyName
    }
    files {
      ...RelationFileParts
    }
  }
}
