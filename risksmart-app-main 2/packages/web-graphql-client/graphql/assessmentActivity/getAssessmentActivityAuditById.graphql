query getAssessmentActivityAuditById($Id: uuid!) {
  assessment_activity_audit(where: { Id: { _eq: $Id } }, order_by: {ModifiedAtTimestamp: desc}) {
    Title
    Id
    ParentId
    Summary
    Status
    ActivityType
    CompletionDate
    AssignedUser
    CreatedByUser
    CreatedAtTimestamp
    ModifiedByUser
    ModifiedAtTimestamp
    CustomAttributeData
  }
}
