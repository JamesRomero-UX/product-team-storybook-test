query getWidgetTestResults(
  $where: test_result_bool_exp!
  $controlWhere: control_bool_exp
) {
  control(where: $controlWhere) {
    testResults(where: $where) {
      ...TestResultParts
      submitter {
        FriendlyName
      }
      parent {
        Id
        Title
        tags {
          ...TagParts
        }
        departments {
          ...DepartmentParts
        }
        schedule {
          ManualDueDate
        }
      }
      createdByUser {
        FriendlyName
      }
      files_aggregate {
        aggregate {
          count
        }
      }
    }
  }
}
