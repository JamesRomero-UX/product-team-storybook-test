query getQuestionnaireInvites($thirdPartyId: uuid!) {
  questionnaire_invite(where: { ThirdPartyId: { _eq: $thirdPartyId } }) {
    Id
    UserEmail
    CreatedAtTimestamp
    ModifiedAtTimestamp
    parent {
      Id
      Status
      StartDate
      ExpiresAt
      ResponseData
    }
    thirdParty {
      Id
      Title
    }
    createdByUser {
      FriendlyName
    }
    modifiedByUser {
      FriendlyName
    }
    questionnaireTemplateVersion {
      Id
      Version
      parent {
        Title
      }
    }
  }
}
