mutation UpdateSsoConfigurationByConnectionId(
  $connectionId: String!
  $set: sso_configuration_set_input!
) {
  update_sso_configuration(
    where: { ConnectionId: { _eq: $connectionId } }
    _set: $set
  ) {
    returning {
      Id
      Name
      Strategy
      ClientId
      ConnectionId
      IsActive
      IsRestApiEnabled
      IsOrganizationConnected
      ModifiedAtTimestamp
    }
  }
}
