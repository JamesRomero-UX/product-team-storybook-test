mutation deleteIssueUpdates($Ids: [uuid!]) {
  delete_file(where: { relationFile: { ParentId: { _in: $Ids } } }) {
    affected_rows
  }

  delete_relation_file(where: { ParentId: { _in: $Ids } }) {
    affected_rows
  }

  delete_issue_update(where: { Id: { _in: $Ids } }) {
    affected_rows
  }
}
