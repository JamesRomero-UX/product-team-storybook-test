fragment MyItemsChangeRequestParts on change_request {
  ChangeRequestStatus
  CreatedAtTimestamp
  Id
  responses {
    Approved
    approver {
      OwnerApprover
      level {
        Id
        ApprovalRuleType
      }
      group {
        users {
          UserId
        }
      }
      user {
        Id
      }
    }
  }
  parent {
    Id
    SequentialId
    ObjectType
    risk {
      Id
      Title
    }

    documentFile {
      Version
      parent {
        Id
        Title
      }
    }

    action {
      Id
      Title
    }

    issue_assessment {
      parent {
        Id
        Title
      }
    }

    acceptance {
      Id
      Title
    }

    control {
      Id
      Title
    }

    issue {
      Id
      Title
    }
  }
  currentUserOwnerList: parentOwnerAndContributors(
    where: { ContributorType: { _eq: "owner" }, UserId: { _eq: $userId } }
    distinct_on: [UserId]
  ) {
    UserId
  }
}
