query getIssuesByParentId($ParentId: uuid!, $Type: parent_type_enum!) {
  issue(where: { parents: { ParentId: { _eq: $ParentId } }, Type: { _eq: $Type} }) {
    ...IssueParts
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributors {
      ...ContributorParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    assessment {
      ...IssueAssessmentParts
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
  }
}
