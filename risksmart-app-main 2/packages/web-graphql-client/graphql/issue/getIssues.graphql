query getIssues(
  $where: issue_bool_exp! = {}
) {
  issue(where: $where) {
    ...IssueParts
    consequences {
      CostType
      CostValue
      Type
    }
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributors {
      ...ContributorParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    assessment {
      ...IssueAssessmentParts
      modifiedByUser {
        FriendlyName
      }
      createdByUser {
        FriendlyName
      }
      certifiedIndividual {
        FriendlyName
      }
      departments {
        ...DepartmentParts
      }
    }
    actions_aggregate(where: { action: { Status: { _eq: open } } }) {
      aggregate {
        count
      }
    }
    modifiedByUser {
      FriendlyName
    }
    createdByUser {
      FriendlyName
    }
    departments {
      ...DepartmentParts
    }
    tags {
      ...TagParts
    }
    parents {
      parent {
        Id
        ObjectType
        SequentialId
      }
      obligation {
        Title
      }
      document {
        Title
      }
      control {
        Title
      }
      thirdParty {
        Title
      }
      assessment {
        Title
      }
      internalAuditEntity {
        Title
      }
      internalAuditReport {
        Title
      }
      complianceMonitoringAssessment {
        Title
      }
      risk {
        Title
      }
    }
    issueUpdateSummary {
      Count
      LatestTitle
      LatestDescription
      LatestCreatedAtTimestamp
    }
  }
}
