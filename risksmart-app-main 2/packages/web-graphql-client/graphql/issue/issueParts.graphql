fragment IssueParts on issue {
  RaisedAtTimestamp
  DateIdentified
  DateOccurred
  Details
  Id
  ImpactsCustomer
  IsExternalIssue
  CreatedAtTimestamp
  ModifiedAtTimestamp
  Title
  CreatedByUser
  ModifiedByUser
  SequentialId
  CustomAttributeData
  Meta
  Type
}

fragment SimplifiedIssueParts on issue {
  Id
  Title
}

fragment BreachedIssuesParts on issue_parent {
  issue {
    ...SimplifiedIssueParts
  }
}
