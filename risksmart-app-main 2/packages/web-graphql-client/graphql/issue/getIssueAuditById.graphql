query getIssueAuditById($Id: uuid!) {
  issue_audit(where: {Id: {_eq: $Id}}) {
    RaisedAtTimestamp
    DateIdentified
    DateOccurred
    Details
    Id
    ImpactsCustomer
    IsExternalIssue
    CreatedAtTimestamp
    ModifiedAtTimestamp
    Title
    CreatedByUser
    ModifiedByUser
    SequentialId
    CustomAttributeData
  }
}
