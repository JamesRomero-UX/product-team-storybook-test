query getQuestionnaireTemplates($where: questionnaire_template_bool_exp) {
  questionnaire_template(where: $where) {
    ...QuestionnaireTemplateParts
    owners {
      ...OwnerParts
    }
    contributors {
      ...ContributorParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    ancestorContributors {
      ...AncestorContributorParts
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
    createdByUser {
      Id
      FriendlyName
    }
    modifiedByUser {
      Id
      FriendlyName
    }
    draftVersions: versions(
      where: { Status: { _eq: draft } }
      order_by: { CreatedAtTimestamp: desc }
      limit: 1
    ) {
      Id
      Version
      Status
    }
    nonDraftVersions: versions(
      where: { Status: { _neq: draft } }
      order_by: { CreatedAtTimestamp: desc }
      limit: 1
    ) {
      Id
      Version
      Status
    }
    publishedVersion: versions(
      where: { Status: { _eq: published } }
      order_by: { CreatedAtTimestamp: desc }
      limit: 1
    ) {
      Id
      Version
      Status
    }
  }
}
