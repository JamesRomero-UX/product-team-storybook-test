query getAcceptanceAuditById($Id: uuid!) {
  acceptance_audit(where: { Id: { _eq: $Id } }, order_by: {ModifiedAtTimestamp: desc}) {
    DateAcceptedFrom
    DateAcceptedTo
    Details
    Id
    Status
    ModifiedAtTimestamp
    CreatedAtTimestamp
    Title
    CreatedByUser
    ModifiedByUser
    ApprovedByUser
    ApprovedByUserGroup
    RequestedByUser
    RequestedByUserGroup
    CustomAttributeData
    SequentialId
  }
}
