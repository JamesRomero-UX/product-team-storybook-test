query getAcceptances($where: acceptance_bool_exp! = {}) {
  acceptance(where: $where) {
    ...AcceptanceParts
    createdByUser {
      FriendlyName
    }
    modifiedByUser {
      FriendlyName
    }
    requestedByUser {
      FriendlyName
    }
    requestedByUserGroup {
      Name
    }
    approvedByUser {
      FriendlyName
    }
    approvedByUserGroup {
      Name
    }
    parents {
      risk {
        Id
        Tier
        Title
        owners {
          ...OwnerParts
        }
        ownerGroups {
          ...OwnerGroupParts
        }
        contributors {
          ...ContributorParts
        }
        contributorGroups {
          ...ContributorGroupParts
        }
        tags {
          ...TagParts
        }
        departments {
          ...DepartmentParts
        }
      }
    }
    files {
      ...RelationFileParts
    }
    changeRequests(
      distinct_on: [ChangeRequestStatus]
      order_by: [{ ChangeRequestStatus: asc }, { ModifiedAtTimestamp: desc }]
    ) {
      ChangeRequestStatus
      ModifiedAtTimestamp
    }
  }
}
