query getImpacts {
  impact {
    ...ImpactParts
    createdByUser {
      FriendlyName
    }
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    ratings(
      distinct_on: [RatedItemId]
      order_by: [{ RatedItemId: desc }, { TestDate: desc }]
    ) {
      Rating
      RatedItemId
      ratedItem {
        risk {
          Id
          Title
        }
      }
    }
    appetites(
      order_by: [
        { EffectiveDate: desc_nulls_last }
        { CreatedAtTimestamp: desc_nulls_last }
      ]
    ) {
      ...AppetiteParts
      ImpactId
      parents {
        risk {
          Id
        }
      }
    }
  }
}
