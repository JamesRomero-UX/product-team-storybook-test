query getImpactAuditById($id: uuid!) {
  impact_audit(where: { Id: { _eq: $id } }, order_by: {ModifiedAtTimestamp: desc}) {
    CreatedAtTimestamp
    CreatedByUser
    Rationale
    RatingGuidance
    Id
    ModifiedAtTimestamp
    ModifiedByUser
    Name
    CustomAttributeData
    SequentialId
    LikelihoodAppetite
  }
}
