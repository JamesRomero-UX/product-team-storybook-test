query getAssessments($where: assessment_bool_exp! = {}) {
  assessment(where: $where) {
    ...AssessmentParts
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributors {
      ...ContributorParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
    completedByUser {
      FriendlyName
    }
    assessedItems: assessmentResults {
      riskAssessmentResult {
        Id
        parents(where: { ParentType: { _eq: risk } }) {
          risk {
            Id
            Title
          }
        }
      }
      obligationAssessmentResult {
        Id
        parents(where: { ParentType: { _eq: obligation } }) {
          obligation {
            Id
            Title
          }
        }
      }
      documentAssessmentResult {
        Id
        parents(where: { ParentType: { _eq: document } }) {
          document {
            Id
            Title
          }
        }
      }
    }
  }
}
