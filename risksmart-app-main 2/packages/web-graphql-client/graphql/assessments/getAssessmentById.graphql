query getAssessmentById($Id: uuid!) {
  assessment(where: { Id: { _eq: $Id } }) {
    ...AssessmentParts
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributors {
      ...ContributorParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    contributors {
      ...ContributorParts
    }
    contributorGroups {
      UserGroupId
    }
    ancestorContributors {
      ...AncestorContributorParts
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
    completedByUser {
      FriendlyName
    }
  }
}
