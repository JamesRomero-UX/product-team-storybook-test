query GetAuthUsers(
  $limit: Int
  $offset: Int
  $orderBy: [auth_user_order_by!]
  $where: auth_user_bool_exp
) {
  auth_user(limit: $limit, offset: $offset, order_by: $orderBy, where: $where) {
    Id
    FirstName
    LastName
    FriendlyName
    Email
    RoleKey
    Status
    CreatedOn
    LastSeen
    DisplayName
    JobTitle
    Department
    OfficeLocation
    CreatedByUser
    ModifiedByUser
    ModifiedAtTimestamp
    organisationusers {
      RoleKey
      LastSeen
      Status
    }
    userGroupUsers {
      userGroups {
        Id
        Name
      }
    }
    customRoles {
      role {
        RoleName
        Id
        Description
      }
    }
    IsCustomerSupport
  }
  auth_user_aggregate(where: $where) {
    aggregate {
      count
    }
  }
}
