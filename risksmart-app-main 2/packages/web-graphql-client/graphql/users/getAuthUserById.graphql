query GetAuthUserById($Id: String!) {
  auth_user_by_pk(Id: $Id) {
    Id
    FirstName
    LastName
    FriendlyName
    Email
    Status
    CreatedOn
    DisplayName
    JobTitle
    Department
    OfficeLocation
    RoleKey
    organisationusers {
      RoleKey
      LastSeen
      External_Id
    }
  }
}
