query getObligationById($_eq: uuid!) {
  obligation(where: { Id: { _eq: $_eq } }) {
    ...ObligationParts
    scheduleState {
      LatestDate
    }
    CreatedBy: createdBy {
      FriendlyName
    }
    ModifiedBy: modifiedBy {
      FriendlyName
    }
    Parent: parent {
      Id
      Title
    }
    parentNode {
      Id
      ObjectType
      SequentialId
    }
    owners {
      ...OwnerParts
    }
    contributors {
      ...ContributorParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
    ancestorContributors {
      ...AncestorContributorParts
    }
  }
}
