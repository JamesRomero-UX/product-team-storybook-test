query getDocumentFileAuditById($id: uuid!) {
  document_file_audit(where: { Id: { _eq: $id } }, order_by: {ModifiedAtTimestamp: desc}) {
    CustomAttributeData
    CreatedAtTimestamp
    CreatedByUser
    FileId
    Id
    ModifiedAtTimestamp
    ModifiedByUser
    NextReviewDate
    ParentDocumentId
    ReasonForReview
    ReviewDate
    ReviewedBy
    Status
    Summary
    Version
    Type
  }
}
