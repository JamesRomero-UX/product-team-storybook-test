query getDocumentFile($where: document_file_bool_exp) {
  document_file(
    where: $where
    order_by: { CreatedAtTimestamp: desc }
    limit: 1
  ) {
    Id
    Version
    Content
    Type
    Link
    FileId
    CustomAttributeData
    PublishedDate
    file {
      FileName
    }
    parent {
      Title
      owners {
        ...OwnerParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      tags {
        ...TagParts
      }
      linkedDocuments {
        child {
          Id
          Title
        }
      }
    }
  }
}
