query getPublicDocumentFiles($currentUserId: String!) {
  document_file(
    where: { Status: { _eq: published } }
    order_by: { CreatedAtTimestamp: desc }
  ) {
    ...PublicDocumentRelationFileParts
    Link
    Content
    file {
      ...FileParts
    }
    ModifiedAtTimestamp
    reviewedBy {
      FriendlyName
    }
    parent {
      Title
      DocumentType
      owners {
        ...OwnerParts
      }
      ownerGroups {
        ...OwnerGroupParts
      }
      departments {
        ...DepartmentParts
      }
    }
    attestations(
      where: { UserId: { _eq: $currentUserId } }
      limit: 1
      order_by: { CreatedAtTimestamp: desc }
    ) {
      AttestationStatus
      attestationRecordStatus {
        Status
      }
      ExpiresAt
      Active
    }
  }
}
