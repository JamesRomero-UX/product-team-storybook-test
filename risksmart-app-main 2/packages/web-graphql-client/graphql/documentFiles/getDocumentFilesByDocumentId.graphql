query getDocumentFilesByDocumentId($documentId: uuid!) {
  document_file(where: { ParentDocumentId: { _eq: $documentId } }) {
    ...DocumentRelationFileParts
    Content
    Link
    ModifiedAtTimestamp
    file {
      ...FileParts
    }
    reviewedBy {
      FriendlyName
    }
    changeRequests(
      distinct_on: [ChangeRequestStatus]
      order_by: [{ ChangeRequestStatus: asc }, { ModifiedAtTimestamp: desc }]
    ) {
      ChangeRequestStatus
      ModifiedAtTimestamp
    }
  }
}
