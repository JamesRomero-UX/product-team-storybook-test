query getIndicatorsByParentId($parentId: uuid) {
  indicator(where: { parents: { ParentId: { _eq: $parentId } } }) {
    ...IndicatorParts
    createdBy {
      FriendlyName
    }
    modifiedBy {
      FriendlyName
    }
    owners {
      ...OwnerParts
    }
    orderedResults: results(
      limit: 2
      order_by: { ResultDate: desc_nulls_last }
    ) {
      TargetValueNum
      TargetValueTxt
      ResultDate
    }
    parents {
      control {
        Title
      }
      risk {
        Title
      }
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
  }
}
