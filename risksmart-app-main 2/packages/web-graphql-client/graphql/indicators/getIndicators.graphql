query getIndicators(
  $where: indicator_bool_exp! = {}
  $resultsWhere: indicator_result_bool_exp! = {}
) {
  indicator(where: $where) {
    ...IndicatorParts
    scheduleState {
      LatestDate
      DueDate
      OverdueDate
    }
    createdBy {
      FriendlyName
    }
    modifiedBy {
      FriendlyName
    }
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributors {
      ...ContributorParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    orderedResults: results(
      where: $resultsWhere
      order_by: { ResultDate: desc_nulls_last }
    ) {
      TargetValueNum
      TargetValueTxt
      ResultDate
    }
    parents {
      parent {
        Id
        ObjectType
        SequentialId
      }
      control {
        Title
      }
      risk {
        Title
      }
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
  }
}
