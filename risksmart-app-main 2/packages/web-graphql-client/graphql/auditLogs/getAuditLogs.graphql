query getAuditLogs(
  $limit: Int
  $offset: Int
  $orderBy: [audit_log_view_order_by!]
  $where: audit_log_view_bool_exp
) {
  audit_log_view(
    limit: $limit
    offset: $offset
    order_by: $orderBy
    where: $where
  ) {
    Action
    ModifiedByUser
    ModifiedAtTimestamp
    PerformedByUser {
      FriendlyName
    }
    ObjectType
    Item
    Id
    OrgKey
  }
}
