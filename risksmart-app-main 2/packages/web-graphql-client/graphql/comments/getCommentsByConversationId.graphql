query getCommentsByConversationId($ConversationId: uuid!) {
  comment(where: { ConversationId: { _eq: $ConversationId } }) {
    Id
    Content
    ModifiedAtTimestamp
    CreatedAtTimestamp
    CreatedByUser
    ModifiedByUser
    modifiedByUser {
      FriendlyName
    }
    createdByUser {
      FriendlyName
    }
  }
}
