query getImpactRatingAuditById($id: uuid!) {
  impact_rating_audit(where: { Id: { _eq: $id } }, order_by: {ModifiedAtTimestamp: desc}) {
    CreatedAtTimestamp
    CreatedByUser
    Id
    ModifiedAtTimestamp
    ModifiedByUser
    CustomAttributeData
    SequentialId
    Rating
    RatedItemId
    ImpactId
    TestDate
    CompletedBy
    Likelihood
  }
}
