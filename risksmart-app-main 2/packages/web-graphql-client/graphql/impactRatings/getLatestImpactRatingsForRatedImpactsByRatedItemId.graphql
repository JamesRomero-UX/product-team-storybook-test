query getLatestImpactRatingsForRatedImpactsByRatedItemId($RatedItemId: uuid!) {
  impact(
    where: {
      ratings: {
        RatedItemId: { _eq: $RatedItemId }
        RatingType: { _in: ["assessment", "rating"] }
      }
    }
  ) {
    Name
    Rationale
    ratings(
      where: {
        RatedItemId: { _eq: $RatedItemId }
        RatingType: { _in: ["assessment", "rating"] }
      }
      order_by: { TestDate: desc }
      limit: 1
    ) {
      ...ImpactRatingParts
      createdByUser {
        FriendlyName
      }
      completedBy {
        FriendlyName
      }
    }
  }
}
