query getImpactRatingsWithAppetites($today: timestamptz!) {
  impact_rating(
    where: { RatingType: { _in: ["assessment", "rating"] } }
    distinct_on: [RatedItemId, ImpactId]
    order_by: [
      { RatedItemId: desc, ImpactId: desc }
      { CreatedAtTimestamp: desc }
    ]
  ) {
    ...ImpactRatingParts
    createdByUser {
      FriendlyName
    }
    completedBy {
      FriendlyName
    }
    impact {
      Id
      Name
    }
    ratedItem {
      risk {
        Title
        likelihoodAppetite: appetites(
          where: {
            appetite: {
              AppetiteType: { _eq: likelihood }
              EffectiveDate: { _lte: $today }
            }
          }
          order_by: { appetite: { EffectiveDate: desc } }
          limit: 1
        ) {
          appetite {
            LikelihoodAppetite
            EffectiveDate
          }
        }
        impactAppetites: appetites(
          where: {
            appetite: {
              AppetiteType: { _eq: impact }
              EffectiveDate: { _lte: $today }
            }
          }
          order_by: { appetite: { EffectiveDate: desc } }
        ) {
          appetite {
            ImpactId
            ImpactAppetite
            EffectiveDate
          }
        }
      }
      ObjectType
    }
  }
}
