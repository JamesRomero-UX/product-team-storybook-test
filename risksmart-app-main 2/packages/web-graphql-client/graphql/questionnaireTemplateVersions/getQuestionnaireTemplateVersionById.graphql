query getQuestionnaireTemplateVersionById($Id: uuid!) {
  questionnaire_template_version: questionnaire_template_version_by_pk(Id:$Id) {
    Id
    Version
    Status
    ParentId
    Schema
    UISchema
    CreatedByUser
    createdByUser {
      Id
      FriendlyName
    }
    ModifiedByUser
    modifiedByUser {
      Id
      FriendlyName
    }
    parent {
      Id
      Title
    }
    CreatedAtTimestamp
    ModifiedAtTimestamp
    CustomAttributeData
  }
}
