query getLatestQuestionnaireTemplateVersion($where: questionnaire_template_version_bool_exp) {
  questionnaire_template_version(
    where: $where
    order_by: { CreatedAtTimestamp: desc }
    limit: 1
  ) {
    Id
    Version
    Status
    ParentId
    Schema
    UISchema
    CreatedByUser
    createdByUser {
      Id
      FriendlyName
    }
    ModifiedByUser
    modifiedByUser {
      Id
      FriendlyName
    }
    CreatedAtTimestamp
    ModifiedAtTimestamp
    parent {
      Id
      Title
    }
    CustomAttributeData
  }
}
