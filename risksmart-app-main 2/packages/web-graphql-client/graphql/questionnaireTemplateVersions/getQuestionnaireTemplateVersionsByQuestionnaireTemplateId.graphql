query getQuestionnaireTemplateVersionsByQuestionnaireTemplateId($questionnaireTemplateId: uuid!) {
  questionnaire_template_version(where: { ParentId: { _eq: $questionnaireTemplateId } }) {
    Id
    Version
    Status
    ParentId
    Schema
    UISchema
    CreatedByUser
    createdByUser {
      Id
      FriendlyName
    }
    ModifiedByUser
    modifiedByUser {
      Id
      FriendlyName
    }
    CreatedAtTimestamp
    ModifiedAtTimestamp
    CustomAttributeData
  }
}
