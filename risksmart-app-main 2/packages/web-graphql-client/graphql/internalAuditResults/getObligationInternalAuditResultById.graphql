query getObligationInternalAuditResultById($Id: uuid!) {
  obligation_internal_audit_result(where: { Id: { _eq: $Id } }) {
    ...ObligationInternalAuditResultParts
    parents {
      obligation {
        Id
        Title
      }
      internalAuditReport {
        Id
        Title
      }
    }
    files {
      ...RelationFileParts
    }
  }
}
