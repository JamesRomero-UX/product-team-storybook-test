query getAppetiteAuditById($Id: uuid) {
  appetite_audit(where: { Id: { _eq: $Id } }, order_by: {ModifiedAtTimestamp: desc}) {
    Id
    LowerAppetite
    UpperAppetite
    ImpactAppetite
    LikelihoodAppetite
    Statement
    EffectiveDate
    AppetiteType
    CreatedAtTimestamp
    ModifiedAtTimestamp
    CreatedByUser
    ModifiedByUser
    CustomAttributeData
    SequentialId
  }
}
