query getObligationChangeById($_eq: uuid!) {
  obligation_change(where: { Id: { _eq: $_eq } }) {
    Id
    SequentialId
    DescriptionBefore
    DescriptionAfter
    Rationale
    ObligationId
    ExternalId
    EffectiveDate
    CreatedAtTimestamp
    ModifiedAtTimestamp
    CreatedByUser
    ModifiedByUser
    obligation {
      Id
      Title
      Description
      Reference
      regulatorySource {
        RegulatorName
      }
    }
    createdBy {
      Id
      FriendlyName
    }
    modifiedBy {
      Id
      FriendlyName
    }
    owners {
      ...OwnerParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributors {
      ...ContributorParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    attestations {
      UserId
    }
    actions {
      action {
        Id
        Title
        SequentialId
      }
    }
  }
}
