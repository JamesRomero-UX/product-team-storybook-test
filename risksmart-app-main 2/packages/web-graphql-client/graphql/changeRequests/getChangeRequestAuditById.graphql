query getChangeRequestAuditById($Id: uuid!) {
  change_request_audit(where: {
    Id:{
      _eq: $Id
    }
  }, order_by: {ModifiedAtTimestamp: desc}) {
    Id
    SequentialId
    ParentId
    Type
    CreatedAtTimestamp
    CreatedByUser
    ModifiedAtTimestamp
    ModifiedByUser
    RequestedChanges
    ChangeRequestStatus
    Comment
    OverriddenByUser
    OverriddenAtTimestamp
  }
}
