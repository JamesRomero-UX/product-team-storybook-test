query getPendingChangeRequests($ParentId: uuid!) {
  change_request(
    where: {
      ParentId: { _eq: $ParentId }
      ChangeRequestStatus: { _eq: pending }
    }
  ) {
    ...ChangeRequestParts
  }
}

query getMostRecentNonPendingChangeRequest($ParentId: uuid!) {
  change_request(
    where: {
      ParentId: { _eq: $ParentId }
      ChangeRequestStatus: { _neq: pending }
    }
    order_by: { CreatedAtTimestamp: desc }
  ) {
    ...ChangeRequestParts
  }
}

subscription getLivePendingChangeRequests($ParentId: uuid!) {
  change_request(
    where: {
      ParentId: { _eq: $ParentId }
      ChangeRequestStatus: { _eq: pending }
    }
  ) {
    ...ChangeRequestParts
  }
}
