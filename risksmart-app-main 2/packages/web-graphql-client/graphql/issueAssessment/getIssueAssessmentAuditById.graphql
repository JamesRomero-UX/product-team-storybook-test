query getIssueAssessmentAuditById($Id: uuid!) {
  issue_assessment_audit(where: { Id: { _eq: $Id } }) {
    ActualCloseDate
    CertifiedIndividual
    IssueCausedBySystemIssue
    IssueCausedByThirdParty
    IssueType
    ParentIssueId
    PoliciesBreached
    PolicyBreach
    PolicyOwner
    PolicyOwnerCommentary
    Rationale
    RegulatoryBreach
    RegulationsBreached
    Reportable
    Severity
    Status
    SystemResponsible
    TargetCloseDate
    ThirdPartyResponsible
    CreatedAtTimestamp
    ModifiedAtTimestamp
    CreatedByUser
    ModifiedByUser
    Id
    Type
    CustomAttributeData
  }
}
