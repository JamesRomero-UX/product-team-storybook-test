query getDocumentAuditById($id: uuid!) {
  document_audit(
    where: { Id: { _eq: $id } }
    order_by: { ModifiedAtTimestamp: desc }
  ) {
    Id
    Title
    DocumentType
    Purpose
    ParentDocument
    CreatedByUser
    ModifiedByUser
    CreatedAtTimestamp
    ModifiedAtTimestamp
    CustomAttributeData
    SequentialId
  }
}
