query getEnterpriseRisks($where: enterprise_risk_bool_exp! = {}) {
  enterprise_risk(where: $where) {
    Id
    SequentialId
    Title
    Description
    CreatedAtTimestamp
    ModifiedAtTimestamp
    Treatment
    CustomAttributeData
    Tier
    ParentId

    score {
      InherentScoreMean
      InherentScoreMedian
      InherentScoreWorstCase
      ResidualScoreMean
      ResidualScoreMedian
      ResidualScoreWorstCase
      InherentRatingMean
      InherentRatingMedian
      InherentRatingWorstCase
      ResidualRatingMean
      ResidualRatingMedian
      ResidualRatingWorstCase
    }

    parent {
      Id
      Title
    }

    createdByUser {
      FriendlyName
    }

    modifiedByUser {
      FriendlyName
    }
  }
}

query getEnterpriseRiskById($Id: uuid!) {
  enterprise_risk(where: { Id: { _eq: $Id } }) {
    Id
    SequentialId
    Title
    Description
    CreatedAtTimestamp
    ModifiedAtTimestamp
    Treatment
    CustomAttributeData
    Tier
    ParentId
    children {
      Id
    }

    parent {
      Id
      Title
    }
  }
}

mutation deleteEnterpriseRisk($Id: uuid!) {
  deleteChildEnterpriseRisk(Id: $Id) {
    affected_rows
  }
}

mutation insertEnterpriseRisk(
  $Title: String!
  $Description: String
  $Treatment: risk_treatment_type_enum
  $CustomAttributeData: jsonb
  $Tier: Int!
  $ParentId: uuid
) {
  insertChildEnterpriseRisk(
    object: {
      Title: $Title
      Description: $Description
      Treatment: $Treatment
      CustomAttributeData: $CustomAttributeData
      Tier: $Tier
      ParentId: $ParentId
    }
  ) {
    Id
  }
}

mutation updateEnterpriseRisk(
  $Id: uuid!
  $Title: String!
  $Description: String
  $Treatment: risk_treatment_type_enum
  $CustomAttributeData: jsonb
  $Tier: Int!
  $ParentId: uuid
) {
  updateChildEnterpriseRisk(
    object: {
      Id: $Id
      Title: $Title
      Description: $Description
      Treatment: $Treatment
      CustomAttributeData: $CustomAttributeData
      Tier: $Tier
      ParentId: $ParentId
    }
  ) {
    affected_rows
  }
}
