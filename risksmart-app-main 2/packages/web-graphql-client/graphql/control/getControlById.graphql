query getControlById($_eq: uuid) {
  control(where: { Id: { _eq: $_eq } }) {
    ...ControlParts
    scheduleState {
      LatestDate
    }
    tags {
      ...TagParts
    }
    departments {
      ...DepartmentParts
    }
    owners {
      ...OwnerParts
    }
    contributors {
      ...ContributorParts
    }
    ownerGroups {
      ...OwnerGroupParts
    }
    contributorGroups {
      ...ContributorGroupParts
    }
    ancestorContributors {
      ...AncestorContributorParts
    }
  }
}
