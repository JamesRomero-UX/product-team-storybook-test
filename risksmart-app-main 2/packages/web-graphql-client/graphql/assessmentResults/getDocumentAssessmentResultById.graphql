query getDocumentAssessmentResultById($Id: uuid!) {
  document_assessment_result(where: { Id: { _eq: $Id } }) {
    ...DocumentAssessmentResultParts
    parents {
      document {
        Id
        Title
      }
      assessment {
        Id
        Title
      }
    }
    files {
      ...RelationFileParts
    }
  }
}
