query getObligationAssessmentResultAuditById(
  $Id: uuid!
) {
  obligation_assessment_result_audit(where: { Id: { _eq: $Id } }, order_by: {ModifiedAtTimestamp: desc}) {
    Id
    Rating
    CustomAttributeData
    Rationale
    TestDate
    ModifiedByUser
    ModifiedAtTimestamp
    CreatedByUser
    CreatedAtTimestamp
  }
}
