mutation updateRiskAssessmentResult(
  $Id: uuid!
  $Impact: Int
  $Likelihood: Int
  $Rating: Int
  $Rationale: String
  $TestDate: timestamptz
  $CustomAttributeData: jsonb
  $AssessmentId: uuid
) {
  updateChildRiskAssessmentResult(
    Id: $Id
    CustomAttributeData: $CustomAttributeData
    Impact: $Impact
    Likelihood: $Likelihood
    Rating: $Rating
    Rationale: $Rationale
    TestDate: $TestDate
    AssessmentId: $AssessmentId
  ) {
    affected_rows
  }
}
