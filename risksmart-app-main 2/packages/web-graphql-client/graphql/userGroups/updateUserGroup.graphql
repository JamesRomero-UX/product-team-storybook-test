mutation UpdateUserGroup(
  $Id: uuid!
  $OriginalTimestamp: timestamptz!
  $Name: String
  $Email: String
  $Description: String
  $OwnerContributor: Boolean
) {
  update_user_group(
    where: {
      Id: { _eq: $Id }
      ModifiedAtTimestamp: { _eq: $OriginalTimestamp }
    }
    _set: {
      Name: $Name
      Email: $Email
      Description: $Description
      OwnerContributor: $OwnerContributor
    }
  ) {
    affected_rows
  }
}
