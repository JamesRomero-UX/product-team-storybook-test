resourceServers:
  - name: Hasura Api
    identifier: @@API_IDENTIFIER@@
    allow_offline_access: true
    signing_alg: RS256
    skip_consent_for_verifiable_first_party_clients: true
    token_lifetime: 1800
    token_lifetime_for_web: 1800
  - name: AWS Api
    identifier: @@AWS_API_IDENTIFIER@@
    allow_offline_access: true
    signing_alg: RS256
    skip_consent_for_verifiable_first_party_clients: true
    token_lifetime: 1800
    token_lifetime_for_web: 1800
  - name: AWS Integrations Api
    identifier: @@AWS_INTEGRATIONS_API_IDENTIFIER@@
    allow_offline_access: false
    signing_alg: RS256
    skip_consent_for_verifiable_first_party_clients: true
    token_lifetime: 2592000
    token_lifetime_for_web: 1800
tenant:
  customize_mfa_in_postlogin_action: true
  allowed_logout_urls: []
  enabled_locales:
    - en
  flags:
    enable_adfs_waad_email_verification: true
    revoke_refresh_token_grant: true
    disable_clickjack_protection_headers: false
  friendly_name: ##ENV_NAME##
  idle_session_lifetime: 2
  picture_url: ##RISK_SMART_AUTH_LOGO##
  sandbox_version: '22'
  session_cookie:
    mode: non-persistent
  session_lifetime: 10
  sessions:
    oidc_logout_prompt_enabled: false
  support_email: customer-success@risksmart.com
  support_url: ''
  universal_login:
    passwordless:
      allow_magiclink_verify_without_session: true
emailProvider:
  name: ses
  credentials:
    accessKeyId: @@SES_ACCESS_KEY_ID@@
    secretAccessKey: @@SES_ACCESS_SECRET_KEY@@
    region: eu-west-2
  default_from_address: customer-success@risksmart.com
  enabled: true
emailTemplates:
  - template: blocked_account
    body: ./emailTemplates/blocked_account.html
    enabled: true
    from: customer-success@risksmart.com
    subject: We’ve blocked your access
    syntax: liquid
    urlLifetimeInSeconds: 432000
  - template: enrollment_email
    body: ./emailTemplates/enrollment_email.html
    enabled: true
    from: customer-success@risksmart.com
    subject: You've been invited to enroll in Multifactor Authentication
    syntax: liquid
  - template: mfa_oob_code
    body: ./emailTemplates/mfa_oob_code.html
    enabled: true
    from: customer-success@risksmart.com
    subject: Verification code for email MFA
    syntax: liquid
  - template: reset_email
    body: ./emailTemplates/reset_email.html
    enabled: true
    from: customer-success@risksmart.com
    subject: Reset your RiskSmart password
    syntax: liquid
    urlLifetimeInSeconds: 432000
  - template: stolen_credentials
    body: ./emailTemplates/stolen_credentials.html
    enabled: true
    from: customer-success@risksmart.com
    subject: Password Breach Alert
    syntax: liquid
  - template: user_invitation
    body: ./emailTemplates/user_invitation.html
    enabled: true
    from: customer-success@risksmart.com
    subject: You’ve been invited to RiskSmart
    syntax: liquid
  - template: verify_email
    body: ./emailTemplates/verify_email.html
    enabled: false
    from: customer-success@risksmart.com
    subject: Verify your RiskSmart account
    syntax: liquid
    urlLifetimeInSeconds: 432000
  - template: verify_email_by_code
    body: ./emailTemplates/verify_email_by_code.html
    enabled: false
    from: customer-success@risksmart.com
    subject: Verify your RiskSmart account
    syntax: liquid
  - template: welcome_email
    body: ./emailTemplates/welcome_email.html
    enabled: false
    from: customer-success@risksmart.com
    subject: You have access to RiskSmart
    syntax: liquid
guardianFactors:
  - name: duo
    enabled: false
  - name: email
    enabled: true
  - name: otp
    enabled: true
  - name: push-notification
    enabled: false
  - name: recovery-code
    enabled: false
  - name: sms
    enabled: false
  - name: webauthn-platform
    enabled: true
  - name: webauthn-roaming
    enabled: false
guardianFactorProviders: []
guardianFactorTemplates: []
guardianPolicies:
  policies: []
guardianPhoneFactorSelectedProvider:
  provider: auth0
guardianPhoneFactorMessageTypes:
  message_types: []
roles:
  - name: Public
    description: Public Access Forms / Default
    permissions: []
  - name: Standard
    description: Permissions granted by being an owner or contributor
    permissions: []
  - name: ReadOnly
    description: Full ReadOnly Access
    permissions: []
  - name: RiskManager
    description: Risk Manager / Admin
    permissions: []
  - name: CustomerSupport
    description: Customer Support
    permissions: []
  - name: StandardEnhanced
    description: Standard Enhanced
    permissions: []
  - name: InternalAudit
    description: Internal Audit
    permissions: []
  - name: TechnicalSupport
    description: Technical Support
    permissions: []
branding:
  logo_url: https://app.risksmart.link/auth_images/risksmart-internal/logo.jpeg
  templates: []
prompts:
  customText: {}
  identifier_first: true
  universal_login_experience: new
  webauthn_platform_first_factor: false
actions:
  - name: Create Risksmart User
    code: ./actions/Create Risksmart User/code.js
    dependencies:
      - name: axios
        version: 1.4.0
    deployed: true
    runtime: node18-actions
    secrets:
      - name: HASURA_API_ENDPOINT
        value: '@@HASURA_API_ENDPOINT@@'
      - name: HASURA_ADMIN_SECRET
        value: '@@HASURA_ADMIN_SECRET@@'
      - name: "HASURA_TENANT_API_ENDPOINT"
        value: '@@HASURA_TENANT_API_ENDPOINT@@'
    status: built
    supported_triggers:
      - id: post-login
        version: v3
  - name: Add M2M Claims
    code: ./actions/Add M2M Claims/code.js
    deployed: true
    runtime: node18-actions
    status: built
    supported_triggers:
      - id: credentials-exchange
        version: v2
  - name: DocsAuth
    code: ./actions/DocsAuth/code.js
    dependencies:
      - name: jsonwebtoken
        version: 9.0.2
    deployed: true
    runtime: node22
    secrets:
      - name: ARCHBEE_PROTECTED_PUBLIC_JWT_SECRET
        value: '@@ARCHBEE_PROTECTED_PUBLIC_JWT_SECRET@@'
      - name: ARCHBEE_PROTECTED_PRIVATE_JWT_SECRET
        value: '@@ARCHBEE_PROTECTED_PRIVATE_JWT_SECRET@@'
    status: built
    supported_triggers:
      - id: post-login
        version: v3
  - name: MFA
    code: ./actions/MFA/code.js
    dependencies: [ ]
    deployed: true
    runtime: node22
    status: built
    supported_triggers:
      - id: post-login
        version: v3
  - name: Update Password Set At
    code: ./actions/Update Password Set At/code.js
    dependencies:
      - name: axios
        version: 1.4.0
    deployed: true
    runtime: node22
    secrets:
      - name: HASURA_API_ENDPOINT
        value: '@@HASURA_API_ENDPOINT@@'
      - name: HASURA_ADMIN_SECRET
        value: '@@HASURA_ADMIN_SECRET@@'
      - name: "HASURA_TENANT_API_ENDPOINT"
        value: '@@HASURA_TENANT_API_ENDPOINT@@'
      - name: AUTH0_DOMAIN
        value: '@@AUTH0_DOMAIN@@'
      - name: AUTH0_MANAGEMENT_CLIENT_ID
        value: '@@AUTH0_MANAGEMENT_CLIENT_ID@@'
      - name: AUTH0_MANAGEMENT_CLIENT_SECRET
        value: '@@AUTH0_MANAGEMENT_CLIENT_SECRET@@'
    status: built
    supported_triggers:
      - id: post-change-password
        version: v2
triggers:
  post-login:
    - action_name: DocsAuth
      display_name: DocsAuth
    - action_name: Create Risksmart User
      display_name: Create Risksmart User
    - action_name: MFA
      display_name: MFA
  credentials-exchange:
    - action_name: Add M2M Claims
      display_name: Add M2M Claims
  post-change-password:
    - action_name: Update Password Set At
      display_name: Update Password Set At
attackProtection:
  breachedPasswordDetection:
    enabled: true
    shields: []
    admin_notification_frequency: []
    method: standard
    stage:
      pre-user-registration:
        shields:
          - block
      pre-change-password:
        shields:
          - block
  bruteForceProtection:
    enabled: true
    shields:
      - block
      - user_notification
    mode: count_per_identifier_and_ip
    allowlist: []
    max_attempts: 10
  suspiciousIpThrottling:
    enabled: true
    shields:
      - admin_notification
      - block
    allowlist: []
    stage:
      pre-login:
        max_attempts: 100
        rate: 864000
      pre-user-registration:
        max_attempts: 50
        rate: 1200
