themes:
  - borders:
      button_border_weight: 1
      buttons_style: pill
      button_border_radius: 3
      input_border_weight: 2
      inputs_style: rounded
      input_border_radius: 3
      widget_corner_radius: 22
      widget_border_weight: 0
      show_widget_shadow: true
    colors:
      primary_button: '#40D9CC'
      primary_button_label: '#121233'
      secondary_button_border: '#c9cace'
      secondary_button_label: '#1e212a'
      base_focus_color: '#40D9CC'
      base_hover_color: '#000000'
      links_focused_components: '#1e212a'
      header: '#1e212a'
      body_text: '#1e212a'
      widget_background: '#ffffff'
      widget_border: '#ffffff'
      input_labels_placeholders: '#65676e'
      input_filled_text: '#1e212a'
      input_border: '#B9B9C6'
      input_background: '#ffffff'
      icons: '#65676e'
      error: '#d03c38'
      success: '#13a688'
    displayName: Unnamed Theme
    fonts:
      font_url: https://fonts.gstatic.com/s/sora/v11/xMQbuFFYT72XzQUpDqW1KX4.woff2
      reference_text_size: 16
      title:
        bold: true
        size: 150
      subtitle:
        bold: false
        size: 87.5
      body_text:
        bold: false
        size: 87.5
      buttons_text:
        bold: true
        size: 100
      input_labels:
        bold: false
        size: 100
      links:
        bold: true
        size: 87.5
      links_style: underlined
    page_background:
      page_layout: left
      background_color: '#0F0F2D'
      background_image_url: https://www.risksmart.com/app-login-background-new.jpg
    widget:
      logo_position: none
      logo_url: https://www.risksmart.com/
      logo_height: 50
      header_text_alignment: center
      social_buttons_layout: bottom
logStreams:
  - name: Datadog
    isPriority: false
    sink:
      datadogApiKey: '@@AUTH0_DATADOG_API_KEY@@'
      datadogRegion: eu
    status: active
    type: datadog
  - name: eventbridge-stream-priority
    type: eventbridge
    sink:
      awsAccountId: '@@AWS_ACCOUNT_ID@@'
      awsRegion: eu-west-2
    filters: []
    isPriority: true
  - name: eventbridge-stream-all
    type: eventbridge
    sink:
      awsAccountId: '@@AWS_ACCOUNT_ID@@'
      awsRegion: eu-west-2
    filters: []
    isPriority: false
