clients:
  - name: RiskSmart
    allowed_clients: []
    allowed_logout_urls: @@APP_ALLOWED_LOGOUT@@
    app_type: spa
    callbacks: @@APP_CALLBACKS@@
    client_aliases: []
    cross_origin_auth: false
    cross_origin_authentication: false
    custom_login_page_on: true
    grant_types:
      - authorization_code
      - refresh_token
    initiate_login_uri: ##APP_LOGIN_URL##
    is_first_party: true
    is_token_endpoint_ip_header_trusted: false
    jwt_configuration:
      alg: RS256
      lifetime_in_seconds: 600
      secret_encoded: false
    logo_uri: >-
      ##RISK_SMART_AUTH_LOGO##
    native_social_login:
      apple:
        enabled: false
      facebook:
        enabled: false
    oidc_conformant: true
    organization_require_behavior: post_login_prompt
    organization_usage: require
    refresh_token:
      expiration_type: expiring
      leeway: 5
      token_lifetime: 86400
      idle_token_lifetime: 14400
      infinite_token_lifetime: false
      infinite_idle_token_lifetime: false
      rotation_type: rotating
    sso_disabled: false
    token_endpoint_auth_method: none
    web_origins: @@APP_WEB_ORIGINS@@
