connections:
  - name: AzureAD-RiskSmart-Dev-Cloud
    strategy: waad
    display_name: Work Account
    enabled_clients:
      - RiskSmart
    is_domain_connection: false
    options:
      domain: risksmart.co.uk
      client_id: fd8c0ca9-3a5c-4099-9a10-6f891105a8a9
      use_wsfed: false
      ext_groups: false
      ext_profile: false
      identity_api: microsoft-identity-platform-v2.0
      basic_profile: false
      tenant_domain: risksmart.co.uk
      waad_protocol: openid-connect
      domain_aliases:
        - risksmart.com
        - risksmart.co.uk
      api_enable_users: false
      ext_nested_groups: false
      useCommonEndpoint: false
      should_trust_email_verified_connection: always_set_emails_as_verified
    show_as_button: false
databases:
  - name: Username-Password-Authentication
    strategy: auth0
    enabled_clients:
      - auth0-deploy-cli
      - RiskSmart
      - RiskSmart Rest API
    is_domain_connection: false
    options:
      mfa:
        active: true
        return_enroll_settings: true
      import_mode: false
      customScripts:
        change_password: ./databases/Username-Password-Authentication/change_password.js
        create: ./databases/Username-Password-Authentication/create.js
        delete: ./databases/Username-Password-Authentication/delete.js
        get_user: ./databases/Username-Password-Authentication/get_user.js
        login: ./databases/Username-Password-Authentication/login.js
        verify: ./databases/Username-Password-Authentication/verify.js
      disable_signup: true
      passwordPolicy: good
      password_history:
        size: 5
        enable: true
      strategy_version: 2
      password_dictionary:
        enable: true
        dictionary: []
      brute_force_protection: true
      password_no_personal_info:
        enable: true
      password_complexity_options:
        min_length: 8
      enabledDatabaseCustomization: false
    realms:
      - Username-Password-Authentication
  - name: Username-Password-ThirdParty
    strategy: auth0
    enabled_clients:
      - Third Party Portal
      - RiskSmart Rest API
    is_domain_connection: false
    options:
      mfa:
        active: true
        return_enroll_settings: true
      import_mode: false
      customScripts:
        change_password: ./databases/Username-Password-Authentication/change_password.js
        create: ./databases/Username-Password-Authentication/create.js
        delete: ./databases/Username-Password-Authentication/delete.js
        get_user: ./databases/Username-Password-Authentication/get_user.js
        login: ./databases/Username-Password-Authentication/login.js
        verify: ./databases/Username-Password-Authentication/verify.js
      disable_signup: true
      passwordPolicy: good
      password_history:
        size: 5
        enable: true
      strategy_version: 2
      requires_username: true
      password_dictionary:
        enable: true
        dictionary: []
      brute_force_protection: true
      password_no_personal_info:
        enable: true
      password_complexity_options:
        min_length: 8
      enabledDatabaseCustomization: false
    realms:
      - Username-Password-ThirdParty
