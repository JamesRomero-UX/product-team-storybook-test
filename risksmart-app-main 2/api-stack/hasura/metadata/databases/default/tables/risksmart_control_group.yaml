table:
  name: control_group
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: control_group
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: owner
    using:
      manual_configuration:
        column_mapping:
          Owner: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
array_relationships:
  - name: ancestorContributors
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: ancestor_contributor_view
          schema: risksmart
  - name: controls
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: control_parent
          schema: risksmart
insert_permissions:
  - role: insert:control-group
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - Title
        - Owner
        - Description
        - CustomAttributeData
select_permissions:
  - role: app-user
    permission:
      columns:
        - Id
        - Title
        - Owner
        - ModifiedAtTimestamp
        - ModifiedByUser
        - Description
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _exists:
              _table:
                name: user_role_access
                schema: risksmart
              _where:
                _and:
                  - AccessType:
                      _eq: read
                  - ObjectType:
                      _eq: control_group
                  - UserId:
                      _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: update:control-group
    permission:
      columns:
        - Title
        - Owner
        - Description
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check: {}
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: delete:control-group
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
