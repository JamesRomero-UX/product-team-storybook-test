array_relationships:
  - name: source_permissions
    using:
      manual_configuration:
        column_mapping:
          Source: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
  - name: target_permissions
    using:
      manual_configuration:
        column_mapping:
          Target: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - Source
        - SourceType
        - Target
        - TargetType
        - RelationshipType
      backend_only: true
  - role: insert:linked-item
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - Source
        - SourceType
        - Target
        - TargetType
        - RelationshipType
      backend_only: true
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - Source
        - SourceType
        - Target
        - TargetType
        - RelationshipType
      filter:
        _and:
          - OrgKey:
              _eq: x-hasura-org-id
          - source_permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
          - target_permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
      allow_aggregations: true
  - role: read:linked-item
    permission:
      columns:
        - Id
        - Source
        - SourceType
        - Target
        - TargetType
        - RelationshipType
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
delete_permissions:
  - role: Standard
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: x-hasura-org-id
          # Do not remove, parent child links are deleted by the DB trigger
          - RelationshipType:
              _neq: parent_child
          - source_permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: update
  - role: delete:linked-item
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
        # Do not remove, parent child links are deleted by the DB trigger
        RelationshipType:
          _neq: parent_child
event_triggers:
  - name: linked-item
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
