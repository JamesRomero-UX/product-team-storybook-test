table:
  name: aggregation_org
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: aggregation_org
  custom_root_fields: {}
object_relationships:
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
insert_permissions:
  - role: app-user
    permission:
      columns:
        - RiskScoringModel
        - Appetite
        - Config
      check:
        OrgKey:
          _eq: x-hasura-org-id
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _exists:
              _table:
                name: user_role_access
                schema: risksmart
              _where:
                _and:
                  - AccessType:
                      _eq: insert
                  - ObjectType:
                      _eq: aggregation_org
                  - UserId:
                      _eq: X-Hasura-User-Id
      set:
        OrgKey: x-hasura-org-id
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        ModifiedAtTimestamp: now()
        CreatedAtTimestamp: now()
update_permissions:
  - role: app-user
    permission:
      columns:
        - RiskScoringModel
        - Appetite
        - Config
      check:
        OrgKey:
          _eq: x-hasura-org-id
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _exists:
              _table:
                name: user_role_access
                schema: risksmart
              _where:
                _and:
                  - AccessType:
                      _eq: update
                  - ObjectType:
                      _eq: aggregation_org
                  - UserId:
                      _eq: X-Hasura-User-Id
      set:
        ModifiedByUser: x-hasura-user-id
        ModifiedAtTimestamp: now()
      filter:
        OrgKey:
          _eq: x-hasura-org-id
select_permissions:
  - role: app-user
    permission:
      columns:
        - OrgKey
        - RiskScoringModel
        - Appetite
        - Config
      filter:
        OrgKey:
          _eq: x-hasura-org-id
