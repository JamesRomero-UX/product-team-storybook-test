table:
  name: risk_controlled_second_line_result
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: risk_controlled_second_line_result
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
array_relationships:
  - name: parents
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: second_line_result_parent
          schema: risksmart
  - name: files
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: relation_file
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
  - name: ancestorContributors
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: ancestor_contributor_view
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: X-Hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - Id
        - Likelihood
        - Impact
        - Rating
        - CustomAttributeData
        - TestDate
        - Rationale
      backend_only: true
  - role: insert:risk-controlled-second-line-result
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        CreatedByUser: X-Hasura-user-id
        ModifiedByUser: X-Hasura-user-id
        OrgKey: X-Hasura-org-id
      backend_only: true
      columns:
        - Id
        - Likelihood
        - Impact
        - Rating
        - CustomAttributeData
        - TestDate
        - Rationale
update_permissions:
  - role: update:risk-controlled-second-line-result
    permission:
      columns:
        - Likelihood
        - Impact
        - Rating
        - CustomAttributeData
        - TestDate
        - Rationale
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - Likelihood
        - Impact
        - Rating
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - TestDate
        - Rationale
        - ModifiedAtTimestamp
        - ModifiedByUser
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
      allow_aggregations: true
  - role: read:risk-controlled-second-line-result
    permission:
      columns:
        - Id
        - Likelihood
        - Impact
        - Rating
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - TestDate
        - Rationale
        - ModifiedAtTimestamp
        - ModifiedByUser
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
delete_permissions:
  - role: Standard
    backend_only: true
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
  - role: delete:risk-controlled-second-line-result
    backend_only: true
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: risk_controlled_second_line_result
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
