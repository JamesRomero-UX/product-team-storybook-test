table:
  name: assessment_activity
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: assessment_activity
  custom_root_fields: {}
object_relationships:
  - name: assignedUser
    using:
      manual_configuration:
        column_mapping:
          AssignedUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: parentAssessment
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: assessment
          schema: risksmart
  - name: parentRisk
    using:
      manual_configuration:
        column_mapping:
          RiskId: Id
        insertion_order: null
        remote_table:
          name: risk
          schema: risksmart
  - name: parentInternalAuditReport
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: internal_audit_report
          schema: risksmart
  - name: parentComplianceMonitoringAssessment
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: compliance_monitoring_assessment
          schema: risksmart
array_relationships:
  - name: ancestorContributors
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: ancestor_contributor_view
          schema: risksmart
  - name: insertPermissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: insert_permission_view
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
  - name: files
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: relation_file
          schema: risksmart
  - name: ownerGroups
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: owner_group
          schema: risksmart
  - name: owners
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: owner
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        CreatedByUser: X-Hasura-user-id
        ModifiedByUser: X-Hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Id
        - ParentId
        - ActivityType
        - Title
        - Summary
        - Status
        - CompletionDate
        - CreatedAtTimestamp
        - AssignedUser
        - CustomAttributeData
        - IsRCSA
        - RiskId
  - role: insert:assessment-activity
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: X-Hasura-user-id
        ModifiedByUser: X-Hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Id
        - ParentId
        - ActivityType
        - Title
        - Summary
        - Status
        - CompletionDate
        - AssignedUser
        - CustomAttributeData
        - IsRCSA
        - RiskId
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - ParentId
        - ActivityType
        - OrgKey
        - Title
        - Summary
        - Status
        - CompletionDate
        - CreatedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - ModifiedByUser
        - AssignedUser
        - CustomAttributeData
        - IsRCSA
        - RiskId
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
      allow_aggregations: true
  - role: read:assessment-activity
    permission:
      columns:
        - Id
        - ParentId
        - ActivityType
        - Title
        - Summary
        - Status
        - CompletionDate
        - CreatedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - ModifiedByUser
        - AssignedUser
        - CustomAttributeData
        - IsRCSA
        - RiskId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
update_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - ActivityType
        - Title
        - Summary
        - Status
        - CompletionDate
        - CreatedByUser
        - CreatedAtTimestamp
        - AssignedUser
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: update
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
  - role: update:assessment-activity
    permission:
      columns:
        - Id
        - ActivityType
        - Title
        - Summary
        - Status
        - CompletionDate
        - AssignedUser
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check: {}
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: Standard
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
  - role: delete:assessment-activity
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: assessment-activity
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
