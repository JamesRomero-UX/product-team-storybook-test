table:
  name: consequence_audit
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: consequence_audit
  custom_root_fields: {}
select_permissions:
  - role: read:audit
    permission:
      columns:
        - Id
        - Title
        - Description
        - Criticality
        - CostType
        - CostValue
        - ParentIssueId
        - ModifiedAtTimestamp
        - ModifiedByUser
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - Type
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
