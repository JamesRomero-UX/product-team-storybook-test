table:
  name: document_audit
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: document_audit
  custom_root_fields: {}
select_permissions:
  - role: read:audit
    permission:
      columns:
        - CreatedAtTimestamp
        - CreatedByUser
        - DocumentType
        - Id
        - ModifiedAtTimestamp
        - ModifiedByUser
        - ParentDocument
        - Purpose
        - Title
        - CustomAttributeData
        - SequentialId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
