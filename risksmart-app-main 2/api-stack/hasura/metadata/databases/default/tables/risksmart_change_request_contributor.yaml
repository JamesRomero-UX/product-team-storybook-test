table:
  name: change_request_contributor
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: change_request_contributor
  custom_root_fields: {}

object_relationships:
  - name: user
    using:
      manual_configuration:
        column_mapping:
          UserId: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: changeRequest
    using:
      foreign_key_constraint_on: ChangeRequestId
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - UserId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
        changeRequest:
          parent:
            permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
  - role: read:change-request
    permission:
      columns:
        - Id
        - UserId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
insert_permissions:
  - role: app-user
    permission:
      backend_only: true
      columns:
        - ChangeRequestId
        - UserId
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        OrgKey: X-Hasura-org-id
        CreatedAtTimestamp: now()
        ModifiedAtTimestamp: now()
