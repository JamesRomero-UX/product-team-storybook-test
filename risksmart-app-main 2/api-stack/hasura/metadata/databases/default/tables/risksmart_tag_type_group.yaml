table:
  name: tag_type_group
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: tag_type_group
  custom_root_fields: {}
array_relationships:
  - name: tag_types
    using:
      foreign_key_constraint_on:
        column: TagTypeGroupId
        table:
          name: tag_type
          schema: risksmart
insert_permissions:
  - role: insert:tag-type-group
    permission:
      check: {}
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-Org-Id
      columns:
        - Name
    comment: ""
select_permissions:
  - role: read:tag-type-group
    permission:
      columns:
        - Id
        - Name
        - CreatedByUser
        - CreatedAtTimestamp
        - ModifiedByUser
        - ModifiedAtTimestamp
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
update_permissions:
  - role: update:tag-type-group
    permission:
      columns:
        - Name
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check: null
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
    comment: ""
