table:
  name: data_import_error
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: data_import_error
  custom_root_fields: {} 
insert_permissions:
  - role: CustomerSupport
    permission:
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - RowNumber
        - ImportObject
        - DataImportId
        - Message
      check: {}
    backend_only: true
select_permissions:
  - role: CustomerSupport
    permission:
      columns:
        - Id
        - RowNumber
        - ImportObject
        - DataImportId
        - Message
        - CreatedByUser
        - CreatedAtTimestamp
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
delete_permissions:
  - role: CustomerSupport
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id