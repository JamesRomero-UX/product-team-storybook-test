table:
  name: enterprise_risk_score
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: enterprise_risk_score
  custom_root_fields: {}
object_relationships:
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: enterpriseRisk
    using:
      manual_configuration:
        column_mapping:
          EnterpriseRiskId: Id
        insertion_order: null
        remote_table:
          name: enterprise_risk
          schema: risksmart
insert_permissions:
  - role: insert:enterprise-risk-score
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - enterpriseRisk:
              OrgKey:
                _eq: X-Hasura-org-id
      backend_only: true
      set:
        OrgKey: x-hasura-org-id
        ModifiedAtTimestamp: now()
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
      columns:
        - EnterpriseRiskId
        - ResidualScoreMean
        - ResidualScoreMedian
        - ResidualScoreWorstCase
        - InherentScoreMean
        - InherentScoreMedian
        - InherentScoreWorstCase
        - InherentRatingMean
        - InherentRatingMedian
        - InherentRatingWorstCase
        - ResidualRatingMean
        - ResidualRatingMedian
        - ResidualRatingWorstCase
update_permissions:
  - role: update:enterprise-risk-score
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - enterpriseRisk:
              OrgKey:
                _eq: X-Hasura-org-id
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      backend_only: true
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
      columns:
        - EnterpriseRiskId
        - ResidualScoreMean
        - ResidualScoreMedian
        - ResidualScoreWorstCase
        - InherentScoreMean
        - InherentScoreMedian
        - InherentScoreWorstCase
        - InherentRatingMean
        - InherentRatingMedian
        - InherentRatingWorstCase
        - ResidualRatingMean
        - ResidualRatingMedian
        - ResidualRatingWorstCase
select_permissions:
  - role: read:enterprise-risk-score
    permission:
      columns:
        - EnterpriseRiskId
        - ResidualScoreMean
        - ResidualScoreMedian
        - ResidualScoreWorstCase
        - InherentScoreMean
        - InherentScoreMedian
        - InherentScoreWorstCase
        - InherentRatingMean
        - InherentRatingMedian
        - InherentRatingWorstCase
        - ResidualRatingMean
        - ResidualRatingMedian
        - ResidualRatingWorstCase
        - OrgKey
        - ModifiedAtTimestamp
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
delete_permissions:
  - role: delete:enterprise-risk-score
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
