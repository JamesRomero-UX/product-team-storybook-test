table:
  name: acceptance_audit
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: acceptance_audit
  custom_root_fields: {}
select_permissions:
  - role: read:audit
    permission:
      columns:
        - Id
        - Title
        - DateAcceptedFrom
        - DateAcceptedTo
        - ModifiedAtTimestamp
        - ModifiedByUser
        - Details
        - Status
        - CreatedByUser
        - CreatedAtTimestamp
        - ApprovedByUser
        - ApprovedByUserGroup
        - RequestedByUser
        - RequestedByUserGroup
        - CustomAttributeData
        - SequentialId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
