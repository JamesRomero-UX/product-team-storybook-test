table:
  name: user_search_preferences
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: user_search_preferences
  custom_root_fields: {}
select_permissions:
  - role: app-user
    permission:
      columns:
        - RecentUserIds
        - ShowGroups
        - FilterByActivePlatformUsers
        - ShowUserPlatformRole
        - ShowUserJobTitle
        - ShowDirectoryDepartment
        - ShowUserLocation
        - ShowUserEmail
        - ShowArchivedUsers
        - ShowInheritedContributors
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - CreatedByUser:
              _eq: X-Hasura-User-Id
insert_permissions:
  - role: app-user
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - RecentUserIds
        - ShowGroups
        - FilterByActivePlatformUsers
        - ShowUserPlatformRole
        - ShowUserJobTitle
        - ShowDirectoryDepartment
        - ShowUserLocation
        - ShowUserEmail
        - ShowArchivedUsers
        - ShowInheritedContributors
update_permissions:
  - role: app-user
    permission:
      columns:
        - RecentUserIds
        - ShowGroups
        - FilterByActivePlatformUsers
        - ShowUserPlatformRole
        - ShowUserJobTitle
        - ShowDirectoryDepartment
        - ShowUserLocation
        - ShowUserEmail
        - ShowArchivedUsers
        - ShowInheritedContributors
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - CreatedByUser:
              _eq: X-Hasura-User-Id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
