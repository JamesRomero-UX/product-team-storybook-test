table:
  name: role_type
  schema: auth
array_relationships:
  - name: userRoles
    using:
      foreign_key_constraint_on:
        column: RoleKey
        table:
          name: user_role
          schema: auth
  - name: resourceTypes
    using:
      foreign_key_constraint_on:
        column: RoleKey
        table:
          name: role_type_resource_type
          schema: auth
select_permissions:
  - role: app-user
    permission:
      columns:
        - RoleKey
        - Name
        - Category
        - Description
      filter:
        RiskSmartInternal:
          _eq: false
  - role: read:auth-role
    permission:
      columns:
        - RoleKey
        - Name
        - Category
        - RiskSmartInternal
        - TopLevelRoleKey
        - InstanceRoleKey
        - Description
      filter: {}
    backend_only: true
insert_permissions:
  - role: insert:auth-role
    permission:
      columns:
        - RoleKey
        - Name
        - Category
        - RiskSmartInternal
        - TopLevelRoleKey
        - InstanceRoleKey
        - Description
      check: {}
      filter: {}
    backend_only: true
update_permissions:
  - role: update:auth-role
    permission:
      columns:
        - RoleKey
        - Name
        - Category
        - RiskSmartInternal
        - TopLevelRoleKey
        - InstanceRoleKey
        - Description
      check: {}
      filter: {}
    backend_only: true
event_triggers:
  - name: role_type
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns:
          - RoleKey
          - Name
          - Category
          - RiskSmartInternal
          - TopLevelRoleKey
          - InstanceRoleKey
          - Description
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
