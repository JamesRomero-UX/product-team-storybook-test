table:
  name: third_party
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: third_party
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
array_relationships:
  - name: files
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: relation_file
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
  - name: tags
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: tag
          schema: risksmart
  - name: departments
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: department
          schema: risksmart
  - name: ancestorContributors
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: ancestor_contributor_view
          schema: risksmart
  - name: contributorGroups
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: contributor_group
          schema: risksmart
  - name: contributors
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: contributor
          schema: risksmart
  - name: ownerGroups
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: owner_group
          schema: risksmart
  - name: owners
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: owner
          schema: risksmart
  - name: contacts
    using:
      manual_configuration:
        column_mapping:
          Id: ThirdPartyId
        insertion_order: null
        remote_table:
          name: third_party_contact
          schema: risksmart
select_permissions:
  - role: app-user
    permission:
      columns:
        - Id
        - CustomAttributeData
        - SequentialId
        - Title
        - Description
        - CompanyName
        - CompaniesHouseNumber
        - Address
        - CityTown
        - Postcode
        - Country
        - PrimaryContactName
        - ContactName
        - ContactEmail
        - CompanyDomain
        - Type
        - Status
        - Criticality
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
            - _exists:
                _table:
                  name: user_role_access
                  schema: risksmart
                _where:
                  _and:
                    - AccessType:
                        _eq: read
                    - ObjectType:
                        _eq: third_party
                    - UserId:
                        _eq: X-Hasura-User-Id
            - permissions:
                _and:
                  - UserId:
                      _eq: X-Hasura-User-Id
                  - OrgKey:
                      _eq: X-Hasura-org-Id
                  - AccessType:
                      _eq: read
insert_permissions:
  - role: app-user
    permission:
      backend_only: true
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - CustomAttributeData
        - Title
        - Description
        - CompanyName
        - CompaniesHouseNumber
        - Address
        - CityTown
        - Postcode
        - Country
        - PrimaryContactName
        - ContactName
        - ContactEmail
        - CompanyDomain
        - Type
        - Status
        - Criticality
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - _exists:
                  _table:
                    name: user_role_access
                    schema: risksmart
                  _where:
                    _and:
                      - AccessType:
                          _eq: insert
                      - ObjectType:
                          _eq: third_party
                      - UserId:
                          _eq: X-Hasura-User-Id
              - permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: insert
update_permissions:
  - role: app-user
    permission:
      backend_only: true
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
      columns:
        - CustomAttributeData
        - Title
        - Description
        - CompanyName
        - CompaniesHouseNumber
        - Address
        - CityTown
        - Postcode
        - Country
        - PrimaryContactName
        - ContactName
        - ContactEmail
        - CompanyDomain
        - Type
        - Status
        - Criticality
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - _exists:
                  _table:
                    name: user_role_access
                    schema: risksmart
                  _where:
                    _and:
                      - AccessType:
                          _eq: update
                      - ObjectType:
                          _eq: third_party
                      - UserId:
                          _eq: X-Hasura-User-Id
              - permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: update
delete_permissions:
  - role: app-user
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - _exists:
                  _table:
                    name: user_role_access
                    schema: risksmart
                  _where:
                    _and:
                      - AccessType:
                          _eq: delete
                      - ObjectType:
                          _eq: third_party
                      - UserId:
                          _eq: X-Hasura-User-Id
              - permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: delete
