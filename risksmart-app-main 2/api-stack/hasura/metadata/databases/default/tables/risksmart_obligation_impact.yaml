table:
  name: obligation_impact
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: obligation_impact
  custom_root_fields: {}
object_relationships:
  - name: createdBy
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedBy
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: parent
    using:
      manual_configuration:
        column_mapping:
          ParentObligationId: Id
        insertion_order: null
        remote_table:
          name: obligation
          schema: risksmart
array_relationships:
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - parent:
              _and:
                - OrgKey:
                    _eq: X-Hasura-org-id
                - insertPermissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - ObjectType:
                          _eq: obligation_impact
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-org-id
      columns:
        - Description
        - ImpactRating
        - ParentObligationId
        - CustomAttributeData
  - role: insert:obligation-impact
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-org-id
      columns:
        - Description
        - ImpactRating
        - ParentObligationId
        - CustomAttributeData
select_permissions:
  - role: Standard
    permission:
      columns:
        - CreatedByUser
        - Description
        - ImpactRating
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Id
        - ParentObligationId
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
  - role: read:obligation-impact
    permission:
      columns:
        - CreatedByUser
        - Description
        - ImpactRating
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Id
        - ParentObligationId
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
update_permissions:
  - role: Standard
    permission:
      columns:
        - Description
        - Id
        - ImpactRating
        - ParentObligationId
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: update
      check: null
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
  - role: update:obligation-impact
    permission:
      columns:
        - Description
        - Id
        - ImpactRating
        - ParentObligationId
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check: null
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
delete_permissions:
  - role: Standard
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
  - role: delete:obligation-impact
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
