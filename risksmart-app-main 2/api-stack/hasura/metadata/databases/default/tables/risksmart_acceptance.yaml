table:
  name: acceptance
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: acceptance
  custom_root_fields: {}
object_relationships:
  - name: approvedByUser
    using:
      manual_configuration:
        column_mapping:
          ApprovedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: approvedByUserGroup
    using:
      manual_configuration:
        column_mapping:
          ApprovedByUserGroup: Id
        insertion_order: null
        remote_table:
          name: user_group
          schema: risksmart
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: requestedByUser
    using:
      manual_configuration:
        column_mapping:
          RequestedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: requestedByUserGroup
    using:
      manual_configuration:
        column_mapping:
          RequestedByUserGroup: Id
        insertion_order: null
        remote_table:
          name: user_group
          schema: risksmart
  - name: status
    using:
      foreign_key_constraint_on: Status
array_relationships:
  - name: ancestorContributors
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: ancestor_contributor_view
          schema: risksmart
  - name: changeRequests
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: change_request
          schema: risksmart
  - name: parents
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: acceptance_parent
          schema: risksmart
  - name: files
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: relation_file
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - ApprovedByUser:
                  _is_null: true
              - approvedByUser:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - RequestedByUser:
                  _is_null: true
              - requestedByUser:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - ApprovedByUserGroup:
                  _is_null: true
              - approvedByUserGroup:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - RequestedByUserGroup:
                  _is_null: true
              - requestedByUserGroup:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      backend_only: true
      columns:
        - Id
        - Title
        - DateAcceptedFrom
        - DateAcceptedTo
        - Details
        - Status
        - ApprovedByUser
        - ApprovedByUserGroup
        - RequestedByUser
        - RequestedByUserGroup
        - CustomAttributeData
  - role: insert:acceptance
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - ApprovedByUser:
                  _is_null: true
              - approvedByUser:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - RequestedByUser:
                  _is_null: true
              - requestedByUser:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - ApprovedByUserGroup:
                  _is_null: true
              - approvedByUserGroup:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - RequestedByUserGroup:
                  _is_null: true
              - requestedByUserGroup:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      backend_only: true
      columns:
        - Id
        - Title
        - DateAcceptedFrom
        - DateAcceptedTo
        - Details
        - Status
        - ApprovedByUser
        - ApprovedByUserGroup
        - RequestedByUser
        - RequestedByUserGroup
        - CustomAttributeData
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - Title
        - DateAcceptedFrom
        - DateAcceptedTo
        - ModifiedAtTimestamp
        - ModifiedByUser
        - Details
        - Status
        - CreatedByUser
        - CreatedAtTimestamp
        - ApprovedByUser
        - ApprovedByUserGroup
        - RequestedByUser
        - RequestedByUserGroup
        - CustomAttributeData
        - SequentialId
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
                - ObjectType:
                    _eq: acceptance
      allow_aggregations: true
  - role: read:acceptance
    permission:
      columns:
        - Id
        - Title
        - DateAcceptedFrom
        - DateAcceptedTo
        - ModifiedAtTimestamp
        - ModifiedByUser
        - Details
        - Status
        - CreatedByUser
        - CreatedAtTimestamp
        - ApprovedByUser
        - ApprovedByUserGroup
        - RequestedByUser
        - RequestedByUserGroup
        - CustomAttributeData
        - SequentialId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
update_permissions:
  - role: Standard
    permission:
      columns:
        - Title
        - DateAcceptedFrom
        - DateAcceptedTo
        - Details
        - Status
        - ApprovedByUser
        - ApprovedByUserGroup
        - RequestedByUser
        - RequestedByUserGroup
        - CustomAttributeData
      backend_only: true
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: update
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - ApprovedByUser:
                  _is_null: true
              - approvedByUser:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - RequestedByUser:
                  _is_null: true
              - requestedByUser:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - ApprovedByUserGroup:
                  _is_null: true
              - approvedByUserGroup:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - RequestedByUserGroup:
                  _is_null: true
              - requestedByUserGroup:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: X-Hasura-User-Id
  - role: update:acceptance
    permission:
      columns:
        - Title
        - DateAcceptedFrom
        - DateAcceptedTo
        - Details
        - Status
        - ApprovedByUser
        - ApprovedByUserGroup
        - RequestedByUser
        - RequestedByUserGroup
        - CustomAttributeData
      backend_only: true
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - ApprovedByUser:
                  _is_null: true
              - approvedByUser:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - RequestedByUser:
                  _is_null: true
              - requestedByUser:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - ApprovedByUserGroup:
                  _is_null: true
              - approvedByUserGroup:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - RequestedByUserGroup:
                  _is_null: true
              - requestedByUserGroup:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: X-Hasura-User-Id
delete_permissions:
  - role: Standard
    permission:
      backend_only: true
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
  - role: delete:acceptance
    permission:
      backend_only: true
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: acceptance
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
