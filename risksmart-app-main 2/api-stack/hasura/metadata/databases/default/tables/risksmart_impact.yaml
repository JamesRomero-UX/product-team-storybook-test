table:
  name: impact
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: impact
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
array_relationships:
  - name: ownerGroups
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: owner_group
          schema: risksmart
  - name: owners
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: owner
          schema: risksmart
  - name: ratings
    using:
      foreign_key_constraint_on:
        column: ImpactId
        table:
          name: impact_rating
          schema: risksmart
  - name: appetites
    using:
      manual_configuration:
        column_mapping:
          Id: ImpactId
        insertion_order: null
        remote_table:
          name: appetite
          schema: risksmart
  - name: ancestorContributors
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: ancestor_contributor_view
          schema: risksmart
  - name: parents
    using:
      manual_configuration:
        column_mapping:
          Id: ImpactId
        insertion_order: null
        remote_table:
          name: impact_parent
          schema: risksmart
insert_permissions:
  - role: app-user
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _exists:
              _table:
                name: user_role_access
                schema: risksmart
              _where:
                _and:
                  - AccessType:
                      _eq: insert
                  - ObjectType:
                      _eq: impact
                  - UserId:
                      _eq: X-Hasura-User-Id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - CustomAttributeData
        - LikelihoodAppetite
        - Name
        - Rationale
        - RatingGuidance
      backend_only: true
select_permissions:
  - role: app-user
    permission:
      columns:
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - Id
        - LikelihoodAppetite
        - ModifiedAtTimestamp
        - ModifiedByUser
        - Name
        - Rationale
        - RatingGuidance
        - SequentialId
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _exists:
              _table:
                name: user_role_access
                schema: risksmart
              _where:
                _and:
                  - AccessType:
                      _eq: read
                  - ObjectType:
                      _eq: impact
                  - UserId:
                      _eq: X-Hasura-User-Id
      allow_aggregations: true
update_permissions:
  - role: app-user
    permission:
      backend_only: true
      columns:
        - CustomAttributeData
        - LikelihoodAppetite
        - Name
        - Rationale
        - RatingGuidance
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _exists:
              _table:
                name: user_role_access
                schema: risksmart
              _where:
                _and:
                  - AccessType:
                      _eq: update
                  - ObjectType:
                      _eq: impact
                  - UserId:
                      _eq: X-Hasura-User-Id
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: app-user
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _exists:
              _table:
                name: user_role_access
                schema: risksmart
              _where:
                _and:
                  - AccessType:
                      _eq: delete
                  - ObjectType:
                      _eq: impact
                  - UserId:
                      _eq: X-Hasura-User-Id
event_triggers:
  - name: impact
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
