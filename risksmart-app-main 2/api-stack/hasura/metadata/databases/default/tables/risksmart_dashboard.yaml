table:
  name: dashboard
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: dashboard
  custom_root_fields: {}
array_relationships:
  - name: ancestorContributors
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: ancestor_contributor_view
          schema: risksmart
  - name: contributorGroups
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: contributor_group
          schema: risksmart
  - name: contributors
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: contributor
          schema: risksmart
  - name: ownerGroups
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: owner_group
          schema: risksmart
  - name: owners
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: owner
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
insert_permissions:
  - role: app-user
    permission:
      backend_only: true
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _exists:
              _table:
                name: user_role_access
                schema: risksmart
              _where:
                _and:
                  - AccessType:
                      _eq: insert
                  - ObjectType:
                      _eq: dashboard
                  - UserId:
                      _eq: X-Hasura-User-Id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Id
        - Name
        - Description
        - Sharing
        - Content
select_permissions:
  - role: app-user
    permission:
      columns:
        - Id
        - Name
        - Sharing
        - Description
        - Content
        - CreatedByUser
        - CreatedAtTimestamp
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - Sharing:
                  _eq: organisation
              - permissions:
                  _and:
                    - AccessType:
                        _eq: read
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id

update_permissions:
  - role: app-user
    permission:
      backend_only: true
      columns:
        - Name
        - Description
        - Content
        - Sharing
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: update
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: app-user
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
