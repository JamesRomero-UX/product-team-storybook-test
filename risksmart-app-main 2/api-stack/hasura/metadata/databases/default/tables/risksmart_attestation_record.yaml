table:
  name: attestation_record
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: attestation_record
  custom_root_fields: {}
object_relationships:
  - name: node
    using:
      foreign_key_constraint_on: NodeId
  - name: user
    using:
      foreign_key_constraint_on: UserId
  - name: config
    using:
      foreign_key_constraint_on: ConfigId
  - name: cycle
    using:
      foreign_key_constraint_on: CycleId
  - name: attestationRecordStatus
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: attestation_record_status_view
          schema: risksmart
  - name: createdBy
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedBy
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: carriedForwardFromRecord
    using:
      foreign_key_constraint_on: CarriedForwardFromRecordId
insert_permissions:
  - role: app-user
    permission:
      backend_only: true
      columns: '*'
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        OrgKey: X-Hasura-org-id
        CreatedAtTimestamp: now()
        CreatedByUser: x-hasura-user-id
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
update_permissions:
  - role: app-user
    permission:
      backend_only: true
      columns: '*'
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
select_permissions:
  - role: Public
    permission:
      columns:
        - Id
        - NodeId
        - ConfigId
        - UserId
        - Active
        - AttestationStatus
        - AttestedAt
        - ExpiresAt
        - ModifiedByUser
        - ModifiedAtTimestamp
        - CreatedAtTimestamp
        - CreatedByUser
        - CarriedForwardFromRecordId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
        UserId:
          _eq: x-hasura-user-id
  - role: Standard
    permission:
      columns:
        - Id
        - NodeId
        - ConfigId
        - UserId
        - Active
        - AttestationStatus
        - AttestedAt
        - ExpiresAt
        - ModifiedByUser
        - ModifiedAtTimestamp
        - CreatedAtTimestamp
        - CreatedByUser
        - CarriedForwardFromRecordId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
        UserId:
          _eq: x-hasura-user-id
      allow_aggregations: true
  - role: read:attestation-record
    permission:
      columns:
        - Id
        - NodeId
        - ConfigId
        - UserId
        - Active
        - AttestationStatus
        - AttestedAt
        - ExpiresAt
        - ModifiedByUser
        - ModifiedAtTimestamp
        - CreatedAtTimestamp
        - CreatedByUser
        - CarriedForwardFromRecordId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
  - role: app-user
    permission:
      backend_only: true
      columns: '*'
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: attestation_record
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
