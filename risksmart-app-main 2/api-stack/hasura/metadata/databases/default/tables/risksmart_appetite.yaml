table:
  name: appetite
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: appetite
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: impact
    using:
      foreign_key_constraint_on: ImpactId
array_relationships:
  - name: ancestorContributors
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: ancestor_contributor_view
          schema: risksmart
  - name: parents
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: appetite_parent
          schema: risksmart
  - name: files
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: relation_file
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
insert_permissions:
  - role: app-user
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      backend_only: true
      columns:
        - Id
        - LowerAppetite
        - UpperAppetite
        - Statement
        - EffectiveDate
        - ImpactAppetite
        - AppetiteType
        - CustomAttributeData
        - LikelihoodAppetite
        - ImpactId
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - ModifiedAtTimestamp
        - ModifiedByUser
        - LowerAppetite
        - UpperAppetite
        - Statement
        - EffectiveDate
        - ImpactAppetite
        - AppetiteType
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - SequentialId
        - LikelihoodAppetite
        - ImpactId
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
                - ObjectType:
                    _eq: appetite
      allow_aggregations: true
  - role: read:appetite
    permission:
      columns:
        - Id
        - ModifiedAtTimestamp
        - ModifiedByUser
        - LowerAppetite
        - UpperAppetite
        - Statement
        - EffectiveDate
        - ImpactAppetite
        - AppetiteType
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - SequentialId
        - LikelihoodAppetite
        - ImpactId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
update_permissions:
  - role: Standard
    permission:
      columns:
        - LowerAppetite
        - UpperAppetite
        - Statement
        - EffectiveDate
        - ImpactAppetite
        - AppetiteType
        - CustomAttributeData
        - LikelihoodAppetite
        - ImpactId
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: update
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: X-Hasura-user-id
  - role: update:appetite
    permission:
      columns:
        - LowerAppetite
        - UpperAppetite
        - Statement
        - EffectiveDate
        - ImpactAppetite
        - AppetiteType
        - CustomAttributeData
        - LikelihoodAppetite
        - ImpactId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: X-Hasura-user-id
delete_permissions:
  - role: Standard
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
  - role: delete:appetite
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: appetite
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
