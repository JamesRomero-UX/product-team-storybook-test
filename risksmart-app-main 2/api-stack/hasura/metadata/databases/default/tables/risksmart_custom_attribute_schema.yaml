table:
  name: custom_attribute_schema
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: custom_attribute_schema
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: form
    using:
      manual_configuration:
        column_mapping:
          Id: CustomAttributeSchemaId
        insertion_order: null
        remote_table:
          name: form_configuration
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
insert_permissions:
  - role: insert:custom-attribute-schema
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Id        
        - Schema
        - UiSchema
select_permissions:
  - role: read:custom-attribute-schema
    permission:
      columns:
        - CreatedAtTimestamp
        - CreatedByUser
        - ModifiedAtTimestamp
        - ModifiedByUser
        - Id
        - Schema
        - UiSchema
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
update_permissions:
  - role: update:custom-attribute-schema
    permission:
      columns:
        - Schema
        - UiSchema
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: delete:custom-attribute-schema
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
