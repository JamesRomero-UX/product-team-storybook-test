  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: sso_configuration_audit
  custom_root_fields: {}
select_permissions:
  - role: read:audit
    permission:
      columns:
        - Id
        - Name
        - Strategy
        - ClientId
        - ConnectionId
        - Domain
        - DomainAliases
        - IsActive
        - IsRestApiEnabled
        - IsOrganizationConnected
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Action
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
