table:
  name: indicator_audit
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: indicator_audit
  custom_root_fields: {}
select_permissions:
  - role: read:audit
    permission:
      columns:
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Id
        - Title
        - Description
        - Type
        - Unit
        - UpperToleranceNum
        - LowerToleranceNum
        - UpperAppetiteNum
        - LowerAppetiteNum
        - TargetValueTxt
        - CustomAttributeData
        - SequentialId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
