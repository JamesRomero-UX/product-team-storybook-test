table:
  name: regulatory_source
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: regulatory_source
  custom_root_fields: {}
object_relationships:
  - name: createdBy
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedBy
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: org
    using:
      manual_configuration:
        column_mapping:
          OrgKey: OrgKey
        insertion_order: null
        remote_table:
          name: organisation
          schema: auth
array_relationships:
  - name: obligations
    using:
      manual_configuration:
        column_mapping:
          Id: RegulatorySourceId
        insertion_order: null
        remote_table:
          name: obligation
          schema: risksmart
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - ExternalRegulatorId
        - RegulatorName
        - ProviderName
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - obligations:
              permissions:
                _and:
                  - UserId:
                      _eq: X-Hasura-User-Id
                  - OrgKey:
                      _eq: X-Hasura-org-Id
                  - AccessType:
                      _eq: read
                  - ObjectType:
                      _eq: obligation
      allow_aggregations: true
  - role: read:obligation
    permission:
      columns:
        - Id
        - ExternalRegulatorId
        - RegulatorName
        - ProviderName
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true