table:
  name: data_export_schedule_execution
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: data_export_schedule_execution
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: dataExportSchedule
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: data_export_schedule
          schema: risksmart   
select_permissions:
  - role: read:data-export-schedule
    permission:
      columns:
        - ExecutionTimestamp
        - Errors
        - Status
        - ParentId
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
insert_permissions:
  - role: insert:data-export-schedule
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: X-Hasura-user-id
        ModifiedByUser: X-Hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - ExecutionTimestamp
        - Errors
        - Status
        - ParentId
update_permissions:
  - role: update:data-export-schedule
    permission:
      columns:
        - Errors
        - Status
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check: {}
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id