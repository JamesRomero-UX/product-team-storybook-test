table:
  name: obligation_audit
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: obligation_audit
  custom_root_fields: {}
select_permissions:
  - role: read:audit
    permission:
      columns:
        - Adherence
        - CreatedAtTimestamp
        - CreatedByUser
        - Description
        - Id
        - Interpretation
        - ModifiedAtTimestamp
        - ModifiedByUser
        - OrgKey
        - ParentId
        - Title
        - Type
        - CustomAttributeData
        - SequentialId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
