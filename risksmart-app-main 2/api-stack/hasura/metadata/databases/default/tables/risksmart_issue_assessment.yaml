table:
  name: issue_assessment
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: issue_assessment
  custom_root_fields: {}
object_relationships:
  - name: certifiedIndividual
    using:
      manual_configuration:
        column_mapping:
          CertifiedIndividual: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: parent
    using:
      manual_configuration:
        column_mapping:
          ParentIssueId: Id
        insertion_order: null
        remote_table:
          name: issue
          schema: risksmart
  - name: policyOwner
    using:
      manual_configuration:
        column_mapping:
          PolicyOwner: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: status
    using:
      foreign_key_constraint_on: Status
array_relationships:
  - name: departments
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: department
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - parent:
              _and:
                - OrgKey:
                    _eq: X-Hasura-org-id
                - permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: read
          - _or:
              - PolicyOwner:
                  _is_null: true
              - policyOwner:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - CertifiedIndividual:
                  _is_null: true
              - certifiedIndividual:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - Id
        - ParentIssueId
        - IssueType
        - Severity
        - TargetCloseDate
        - ActualCloseDate
        - Status
        - CertifiedIndividual
        - RegulatoryBreach
        - RegulationsBreached
        - Reportable
        - Rationale
        - IssueCausedByThirdParty
        - ThirdPartyResponsible
        - IssueCausedBySystemIssue
        - SystemResponsible
        - PolicyBreach
        - PoliciesBreached
        - PolicyOwner
        - PolicyOwnerCommentary
        - Type
        - CustomAttributeData
      backend_only: true
  - role: insert:issue-assessment
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - parent:
              OrgKey:
                _eq: X-Hasura-org-id
          - _or:
              - PolicyOwner:
                  _is_null: true
              - policyOwner:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - CertifiedIndividual:
                  _is_null: true
              - certifiedIndividual:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - Id
        - ParentIssueId
        - IssueType
        - Severity
        - TargetCloseDate
        - ActualCloseDate
        - Status
        - CertifiedIndividual
        - RegulatoryBreach
        - RegulationsBreached
        - Reportable
        - Rationale
        - IssueCausedByThirdParty
        - ThirdPartyResponsible
        - IssueCausedBySystemIssue
        - SystemResponsible
        - PolicyBreach
        - PoliciesBreached
        - PolicyOwner
        - PolicyOwnerCommentary
        - Type
        - CustomAttributeData
      backend_only: true
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - ParentIssueId
        - IssueType
        - Severity
        - TargetCloseDate
        - ActualCloseDate
        - Status
        - CertifiedIndividual
        - RegulatoryBreach
        - RegulationsBreached
        - Reportable
        - Rationale
        - IssueCausedByThirdParty
        - ThirdPartyResponsible
        - IssueCausedBySystemIssue
        - SystemResponsible
        - PolicyBreach
        - PoliciesBreached
        - PolicyOwner
        - PolicyOwnerCommentary
        - ModifiedByUser
        - ModifiedAtTimestamp
        - CreatedByUser
        - CreatedAtTimestamp
        - Type
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
      allow_aggregations: true
  - role: read:issue-assessment
    permission:
      columns:
        - Id
        - ParentIssueId
        - IssueType
        - Severity
        - TargetCloseDate
        - ActualCloseDate
        - Status
        - CertifiedIndividual
        - RegulatoryBreach
        - RegulationsBreached
        - Reportable
        - Rationale
        - IssueCausedByThirdParty
        - ThirdPartyResponsible
        - IssueCausedBySystemIssue
        - SystemResponsible
        - PolicyBreach
        - PoliciesBreached
        - PolicyOwner
        - PolicyOwnerCommentary
        - ModifiedByUser
        - ModifiedAtTimestamp
        - CreatedByUser
        - CreatedAtTimestamp
        - Type
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
update_permissions:
  - role: Standard
    permission:
      columns:
        - IssueType
        - Severity
        - TargetCloseDate
        - ActualCloseDate
        - Status
        - CertifiedIndividual
        - RegulatoryBreach
        - RegulationsBreached
        - Reportable
        - Rationale
        - IssueCausedByThirdParty
        - ThirdPartyResponsible
        - IssueCausedBySystemIssue
        - SystemResponsible
        - PolicyBreach
        - PoliciesBreached
        - PolicyOwner
        - PolicyOwnerCommentary
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
      check:
        _and:
          - _or:
              - PolicyOwner:
                  _is_null: true
              - policyOwner:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - CertifiedIndividual:
                  _is_null: true
              - certifiedIndividual:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
      backend_only: true
  - role: update:issue-assessment
    permission:
      columns:
        - IssueType
        - Severity
        - TargetCloseDate
        - ActualCloseDate
        - Status
        - CertifiedIndividual
        - RegulatoryBreach
        - RegulationsBreached
        - Reportable
        - Rationale
        - IssueCausedByThirdParty
        - ThirdPartyResponsible
        - IssueCausedBySystemIssue
        - SystemResponsible
        - PolicyBreach
        - PoliciesBreached
        - PolicyOwner
        - PolicyOwnerCommentary
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        _and:
          - _or:
              - PolicyOwner:
                  _is_null: true
              - policyOwner:
                  OrgKey:
                    _eq: X-Hasura-org-id
          - _or:
              - CertifiedIndividual:
                  _is_null: true
              - certifiedIndividual:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
      backend_only: true
delete_permissions:
  - role: Standard
    permission:
      backend_only: true
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
  - role: delete:issue-assessment
    permission:
      backend_only: true
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: issue_assessment
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
