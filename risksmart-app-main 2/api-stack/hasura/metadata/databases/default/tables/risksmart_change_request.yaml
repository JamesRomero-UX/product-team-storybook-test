table:
  name: change_request
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: change_request
  custom_root_fields: {}
object_relationships:
  - name: parent
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: node
          schema: risksmart
  - name: createdBy
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedBy
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: overriddenBy
    using:
      manual_configuration:
        column_mapping:
          OverriddenByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
array_relationships:
  - name: parentOwnerAndContributors
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: ancestor_contributor_view
          schema: risksmart
  - name: responses
    using:
      foreign_key_constraint_on:
        column: ChangeRequestId
        table:
          name: approver_response
          schema: risksmart
  - name: contributors
    using:
      foreign_key_constraint_on:
        column: ChangeRequestId
        table:
          name: change_request_contributor
          schema: risksmart
  - name: requestedFileChanges
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: relation_file
          schema: risksmart
insert_permissions:
  - role: app-user
    permission:
      backend_only: true
      columns: '*'
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        OrgKey: X-Hasura-org-id
        CreatedAtTimestamp: now()
        CreatedByUser: x-hasura-user-id
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
update_permissions:
  - role: app-user
    permission:
      backend_only: true
      columns: '*'
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - Type
        - SequentialId
        - ParentId
        - ChangeRequestStatus
        - ActionUserId
        - RequestedChanges
        - Comment
        - RequesterComment
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - CreatedByUser
        - OverriddenByUser
        - OverriddenAtTimestamp
        - Workflow
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
        parent:
          permissions:
            _and:
              - UserId:
                  _eq: X-Hasura-User-Id
              - OrgKey:
                  _eq: X-Hasura-org-Id
              - AccessType:
                  _eq: read
      allow_aggregations: true
  - role: app-user
    permission:
      backend_only: true
      columns: '*'
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
  - role: read:change-request
    permission:
      columns:
        - Id
        - Type
        - SequentialId
        - ParentId
        - ChangeRequestStatus
        - ActionUserId
        - RequestedChanges
        - Comment
        - RequesterComment
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - CreatedByUser
        - OverriddenByUser
        - OverriddenAtTimestamp
        - Workflow
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
event_triggers:
  - name: change_request
    definition:
      enable_manual: true
      insert:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
