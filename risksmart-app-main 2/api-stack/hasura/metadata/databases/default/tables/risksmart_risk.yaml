insert_permissions:
  - role: StandardEnhanced
    permission:
      columns:
        - Id
        - Title
        - Description
        - Tier
        - Treatment
        - Status
        - ParentRiskId
        - CustomAttributeData
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - Tier:
                  _eq: 2
              - Tier:
                  _eq: 3
          - parent:
              OrgKey:
                _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: X-Hasura-org-id
  - role: Standard
    permission:
      backend_only: true
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - parent:
              _and:
                - OrgKey:
                    _eq: X-Hasura-org-id
                - insertPermissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - ObjectType:
                          _eq: risk

      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Id
        - Title
        - Description
        - Tier
        - Treatment
        - Status
        - ParentRiskId
        - CustomAttributeData
  - role: insert:risk
    permission:
      backend_only: true
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - ParentRiskId:
                  _is_null: true
              - parent:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Id
        - Title
        - Description
        - Tier
        - Treatment
        - Status
        - ParentRiskId
        - CustomAttributeData
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - ModifiedAtTimestamp
        - ModifiedByUser
        - Title
        - Description
        - Tier
        - Treatment
        - Status
        - ParentRiskId
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - SequentialId
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
                - ObjectType:
                    _eq: risk
      allow_aggregations: true
  - role: read:risk
    permission:
      columns:
        - Id
        - ModifiedAtTimestamp
        - ModifiedByUser
        - Title
        - Description
        - Tier
        - Treatment
        - Status
        - ParentRiskId
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - SequentialId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
update_permissions:
  - role: Standard
    permission:
      backend_only: true
      columns:
        - Title
        - Description
        - Tier
        - Treatment
        - Status
        - ParentRiskId
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: update
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - ParentRiskId:
                  _is_null: true
              - parent:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
  - role: update:risk
    permission:
      backend_only: true
      columns:
        - Title
        - Description
        - Tier
        - Treatment
        - Status
        - ParentRiskId
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - ParentRiskId:
                  _is_null: true
              - parent:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: Standard
    permission:
      backend_only: true
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
  - role: delete:risk
    permission:
      backend_only: true
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: risk
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
