table:
  name: conversation
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: conversation
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: parent
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: node
          schema: risksmart
array_relationships:
  - name: comments
    using:
      foreign_key_constraint_on:
        column: ConversationId
        table:
          name: comment
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - ParentId:
                  _is_null: true
              - parent:
                  insertPermissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - ObjectType:
                          _eq: conversation
      set:
        CreatedByUser: X-Hasura-user-id
        ModifiedByUser: X-Hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - IsResolved
        - ParentId
  - role: insert:conversation
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: X-Hasura-user-id
        ModifiedByUser: X-Hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - IsResolved
        - ParentId
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - IsResolved
        - ModifiedAtTimestamp
        - ModifiedByUser
        - CreatedByUser
        - CreatedAtTimestamp
        - ParentId
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - ParentId:
                  _is_null: true
              - permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: read
  - role: read:conversation
    permission:
      columns:
        - Id
        - IsResolved
        - ModifiedAtTimestamp
        - ModifiedByUser
        - CreatedByUser
        - CreatedAtTimestamp
        - ParentId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
update_permissions:
  - role: Standard
    permission:
      columns:
        - IsResolved
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - ParentId:
                  _is_null: true
              - permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: update
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
  - role: update:conversation
    permission:
      columns:
        - IsResolved
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: Standard
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - ParentId:
                  _is_null: true
              - permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: delete
  - role: delete:conversation
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
