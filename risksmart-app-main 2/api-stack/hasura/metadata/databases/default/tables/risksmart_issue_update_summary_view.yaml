table:
  name: issue_update_summary_view
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: issue_update_summary
  custom_root_fields: {}
array_relationships:
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          IssueId: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
select_permissions:
  - role: Standard
    permission:
      columns:
        - IssueId
        - LatestDescription
        - LatestTitle
        - Count
        - LatestCreatedAtTimestamp
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
                - ObjectType:
                    _eq: issue
      allow_aggregations: true
  - role: read:issue
    permission:
      columns:
        - IssueId
        - LatestDescription
        - LatestTitle
        - Count
        - LatestCreatedAtTimestamp
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
