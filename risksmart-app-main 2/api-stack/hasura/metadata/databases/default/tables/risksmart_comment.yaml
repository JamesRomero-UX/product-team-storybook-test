table:
  name: comment
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: comment
  custom_root_fields: {}
object_relationships:
  - name: conversation
    using:
      manual_configuration:
        column_mapping:
          ConversationId: Id
        insertion_order: null
        remote_table:
          name: conversation
          schema: risksmart
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
insert_permissions:
  - role: Standard
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - conversation:
              _or:
                - ParentId:
                    _is_null: true
                - permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: insert
      set:
        CreatedByUser: X-Hasura-user-id
        ModifiedByUser: X-Hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Content
        - ConversationId
  - role: insert:comment
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: X-Hasura-user-id
        ModifiedByUser: X-Hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Content
        - ConversationId
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - Content
        - ConversationId
        - ModifiedAtTimestamp
        - CreatedAtTimestamp
        - CreatedByUser
        - ModifiedByUser
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - conversation:
              _or:
                - ParentId:
                    _is_null: true
                - permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: read
  - role: read:comment
    permission:
      columns:
        - Id
        - Content
        - ConversationId
        - ModifiedAtTimestamp
        - CreatedAtTimestamp
        - CreatedByUser
        - ModifiedByUser
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
update_permissions:
  - role: Standard
    permission:
      columns:
        - Content
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - conversation:
              _or:
                - ParentId:
                    _is_null: true
                - permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: update
      check:
        _and:
          - CreatedByUser:
              _eq: X-Hasura-user-id
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
  - role: update:comment
    permission:
      columns:
        - Content
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        _and:
          - CreatedByUser:
              _eq: X-Hasura-user-id
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: Standard
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - conversation:
              _or:
                - ParentId:
                    _is_null: true
                - permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: delete
  - role: delete:comment
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
