table:
  name: user_tab_preference
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: user_tab_preference
  custom_root_fields: {}
select_permissions:
  - role: app-user
    permission:
      columns:
        - ObjectType
        - Preferences
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - CreatedByUser:
              _eq: X-Hasura-User-Id
insert_permissions:
  - role: app-user
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - ObjectType
        - Preferences
update_permissions:
  - role: app-user
    permission:
      columns:
        - Preferences
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - CreatedByUser:
              _eq: X-Hasura-User-Id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: app-user
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _exists:
              _table:
                name: user_role_access
                schema: risksmart
              _where:
                _and:
                  - AccessType:
                      _eq: delete
                  - ObjectType:
                      _eq: user_tab_preference
                  - UserId:
                      _eq: X-Hasura-User-Id