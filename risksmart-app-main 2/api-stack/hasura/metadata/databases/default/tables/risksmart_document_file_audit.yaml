table:
  name: document_file_audit
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: document_file_audit
  custom_root_fields: {}
select_permissions:
  - role: read:audit
    permission:
      columns:
        - Id
        - Version
        - FileId
        - Content
        - Type
        - Link
        - Summary
        - Status
        - PublishedDate
        - ReasonForReview
        - ReviewedBy
        - ReviewDate
        - NextReviewDate
        - ParentDocumentId
        - CreatedByUser
        - ModifiedByUser
        - ModifiedAtTimestamp
        - CreatedAtTimestamp
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
