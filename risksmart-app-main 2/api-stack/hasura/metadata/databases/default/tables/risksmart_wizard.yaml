table:
  name: wizard
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: wizard
  custom_root_fields: {}
object_relationships:
  - name: parent
    using:
      manual_configuration:
        column_mapping:
          RiskId: Id
        insertion_order: null
        remote_table:
          name: risk
          schema: risksmart
  - name: assessment
    using:
      manual_configuration:
        column_mapping:
          AssessmentId: Id
        insertion_order: null
        remote_table:
          name: assessment
          schema: risksmart
  - name: activity
    using:
      manual_configuration:
        column_mapping:
          ActivityId: Id
        insertion_order: null
        remote_table:
          name: assessment_activity
          schema: risksmart
insert_permissions:
  - role: app-user
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - RiskId
        - AssessmentId
        - CurrentStep
        - Status
        - ActivityId
      backend_only: true
select_permissions:
  - role: Standard
    permission:
      columns:
        - RiskId
        - CurrentStep
        - AssessmentId
        - ActivityId
        - Status
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - parent:
              permissions:
                _and:
                  - UserId:
                      _eq: X-Hasura-User-Id
                  - OrgKey:
                      _eq: X-Hasura-org-Id
                  - AccessType:
                      _eq: read
  - role: read:wizard
    permission:
      columns:
        - RiskId
        - CurrentStep
        - AssessmentId
        - ActivityId
        - Status
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
update_permissions:
  - role: app-user
    permission:
      columns:
        - RiskId
        - CurrentStep
        - Status
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
      backend_only: true
delete_permissions:
  - role: app-user
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      backend_only: true
