insert_permissions:
  - role: Standard
    permission:
      backend_only: true
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - parent:
              _and:
                - OrgKey:
                    _eq: X-Hasura-org-id
                - insertPermissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - ObjectType:
                          _eq: obligation

      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Id
        - Adherence
        - Description
        - Interpretation
        - ParentId
        - Title
        - Type
        - Reference
        - SourceUrl
        - CustomAttributeData
  - role: insert:obligation
    permission:
      backend_only: true
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-org-id
      columns:
        - Id
        - Adherence
        - Description
        - Interpretation
        - ParentId
        - Title
        - Type
        - CustomAttributeData
        - Reference
        - SourceUrl
select_permissions:
  - role: Standard
    permission:
      columns:
        - Adherence
        - CreatedAtTimestamp
        - CreatedByUser
        - Description
        - Id
        - Interpretation
        - ModifiedAtTimestamp
        - ModifiedByUser
        - OrgKey
        - ParentId
        - Title
        - Type
        - CustomAttributeData
        - SequentialId
        - ExternalId
        - RegulatorySourceId
        - ExternalSyncedAt
        - Reference
        - SourceUrl
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
                - ObjectType:
                    _eq: obligation
      allow_aggregations: true
  - role: read:obligation
    permission:
      columns:
        - Adherence
        - CreatedAtTimestamp
        - CreatedByUser
        - Description
        - Id
        - Interpretation
        - ModifiedAtTimestamp
        - ModifiedByUser
        - OrgKey
        - ParentId
        - Title
        - Type
        - CustomAttributeData
        - SequentialId
        - ExternalId
        - RegulatorySourceId
        - ExternalSyncedAt
        - Reference
        - SourceUrl
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
update_permissions:
  - role: Standard
    permission:
      backend_only: true
      columns:
        - Adherence
        - Description
        - Interpretation
        - ModifiedAtTimestamp
        - ModifiedByUser
        - ParentId
        - Title
        - Type
        - CustomAttributeData
        - Reference
        - SourceUrl
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: update
      check: null
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
  - role: update:obligation
    permission:
      backend_only: true
      columns:
        - Adherence
        - Description
        - Interpretation
        - ModifiedAtTimestamp
        - ModifiedByUser
        - ParentId
        - Title
        - Type
        - CustomAttributeData
        - Reference
        - SourceUrl
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check: null
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
delete_permissions:
  - role: Standard
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
  - role: delete:obligation
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
