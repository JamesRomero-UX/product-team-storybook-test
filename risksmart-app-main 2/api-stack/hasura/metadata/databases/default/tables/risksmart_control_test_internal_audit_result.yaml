table:
  name: control_test_internal_audit_result
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: control_test_internal_audit_result
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: parent
    using:
      manual_configuration:
        column_mapping:
          ParentControlId: Id
        insertion_order: null
        remote_table:
          name: control
          schema: risksmart
  - name: submitter
    using:
      manual_configuration:
        column_mapping:
          Submitter: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
array_relationships:
  - name: parents
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: internal_audit_result_parent
          schema: risksmart
  - name: files
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: relation_file
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - Title
        - Submitter
        - Description
        - ParentControlId
        - TestType
        - DesignEffectiveness
        - PerformanceEffectiveness
        - OverallEffectiveness
        - TestDate
        - CustomAttributeData
      backend_only: true
  - role: insert:control-test-internal-audit-result
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - Title
        - Submitter
        - Description
        - ParentControlId
        - TestType
        - DesignEffectiveness
        - PerformanceEffectiveness
        - OverallEffectiveness
        - TestDate
        - CustomAttributeData
      backend_only: true
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - ModifiedAtTimestamp
        - ModifiedByUser
        - Title
        - Submitter
        - Description
        - ParentControlId
        - TestType
        - DesignEffectiveness
        - PerformanceEffectiveness
        - OverallEffectiveness
        - TestDate
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - SequentialId
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
      allow_aggregations: true
  - role: read:control-test-internal-audit-result
    permission:
      columns:
        - Id
        - ModifiedAtTimestamp
        - ModifiedByUser
        - Title
        - Submitter
        - Description
        - ParentControlId
        - TestType
        - DesignEffectiveness
        - PerformanceEffectiveness
        - OverallEffectiveness
        - TestDate
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - SequentialId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
update_permissions:
  - role: Standard
    permission:
      columns:
        - Title
        - Submitter
        - Description
        - ParentControlId
        - TestType
        - DesignEffectiveness
        - PerformanceEffectiveness
        - OverallEffectiveness
        - TestDate
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: update
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - parent:
              OrgKey:
                _eq: X-Hasura-org-id
          - _or:
              - Submitter:
                  _is_null: true
              - submitter:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
      backend_only: true
  - role: update:control-test-internal-audit-result
    permission:
      columns:
        - Title
        - Submitter
        - Description
        - ParentControlId
        - TestType
        - DesignEffectiveness
        - PerformanceEffectiveness
        - OverallEffectiveness
        - TestDate
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - parent:
              OrgKey:
                _eq: X-Hasura-org-id
          - _or:
              - Submitter:
                  _is_null: true
              - submitter:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
      backend_only: true
delete_permissions:
  - role: Standard
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
  - role: delete:control-test-internal-audit-result
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: control_test_internal_audit_result
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
