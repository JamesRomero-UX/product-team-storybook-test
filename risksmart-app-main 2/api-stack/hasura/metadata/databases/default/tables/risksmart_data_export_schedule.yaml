table:
  name: data_export_schedule
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: data_export_schedule
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
array_relationships:
  - name: dataExportScheduleExecutions
    using:
      foreign_key_constraint_on:
        column: ParentId
        table:
          name: data_export_schedule_execution
          schema: risksmart
insert_permissions:
  - role: insert:data-export-schedule
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: X-Hasura-user-id
        ModifiedByUser: X-Hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Id
        - Frequency
        - StartTimestamp
        - EndTimestamp
        - StorageType
        - SecretArn
        - CronArn
        - Status
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
select_permissions:
  - role: read:data-export-schedule
    permission:
      columns:
        - Id
        - Frequency
        - StartTimestamp
        - EndTimestamp
        - StorageType
        - SecretArn
        - CronArn
        - Status
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
update_permissions:
  - role: update:data-export-schedule
    permission:
      columns:
        - Id
        - Frequency
        - StartTimestamp
        - EndTimestamp
        - StorageType
        - SecretArn
        - CronArn
        - Status
        - ModifiedByUser
        - ModifiedAtTimestamp
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check: {}
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: delete:data-export-schedule
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: data_export_schedule
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
