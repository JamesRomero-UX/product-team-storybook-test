table:
  name: approval_level
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: approval_level
  custom_root_fields: {}
object_relationships:
  - name: approval
    using:
      manual_configuration:
        column_mapping:
          ApprovalId: Id
        insertion_order: null
        remote_table:
          name: approval
          schema: risksmart
  - name: ruleType
    using:
      foreign_key_constraint_on: ApprovalRuleType
array_relationships:
  - name: approvers
    using:
      manual_configuration:
        column_mapping:
          Id: LevelId
        insertion_order: null
        remote_table:
          name: approver
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - approval:
              parent:
                permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: update
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-org-id
      columns:
        - Description
        - SequenceOrder
        - ApprovalId
        - ApprovalRuleType
  - role: insert:approval-level
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-org-id
      columns:
        - Description
        - SequenceOrder
        - ApprovalId
        - ApprovalRuleType
select_permissions:
  - role: Standard
    permission:
      columns:
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Id
        - Description
        - SequenceOrder
        - ApprovalId
        - ApprovalRuleType
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
  - role: read:approval-level
    permission:
      columns:
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Id
        - Description
        - SequenceOrder
        - ApprovalId
        - ApprovalRuleType
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
update_permissions:
  - role: Standard
    permission:
      columns:
        - Description
        - SequenceOrder
        - ApprovalId
        - ApprovalRuleType
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - approval:
              parent:
                permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: update
      check: null
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
  - role: update:approval-level
    permission:
      columns:
        - Description
        - SequenceOrder
        - ApprovalId
        - ApprovalRuleType
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check: null
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
delete_permissions:
  - role: Standard
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - approval:
              parent:
                permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: update
  - role: delete:approval-level
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
