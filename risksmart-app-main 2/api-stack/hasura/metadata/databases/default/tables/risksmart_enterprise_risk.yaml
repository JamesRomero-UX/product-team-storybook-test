table:
  name: enterprise_risk
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: enterprise_risk
  custom_root_fields: {}
object_relationships: 
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: parent
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: enterprise_risk
          schema: risksmart
  - name: parentNode
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: node
          schema: risksmart
  - name: treatment
    using:
      manual_configuration:
        column_mapping:
          Treatment: Value
        insertion_order: null
        remote_table:
          name: risk_treatment_type
          schema: risksmart
  - name: score
    using:
      manual_configuration:
        column_mapping:
          Id: EnterpriseRiskId
        insertion_order: null
        remote_table:
          name: enterprise_risk_score
          schema: risksmart
array_relationships:
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
  - name: children
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: enterprise_risk
          schema: risksmart
  - name: instances
    using:
      manual_configuration:
        column_mapping:
          Id: EnterpriseRiskId
        insertion_order: null
        remote_table:
          name: enterprise_risk_instance
          schema: risksmart
insert_permissions:
  - role: app-user
    permission:
      backend_only: true
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - _exists:
                  _table:
                    name: user_role_access
                    schema: risksmart
                  _where:
                    _and:
                      - AccessType:
                          _eq: insert
                      - ObjectType:
                          _eq: enterprise_risk
                      - UserId:
                          _eq: X-Hasura-User-Id
              - permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: insert
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - ParentId:
                  _is_null: true
              - parent:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Id
        - Title
        - Description
        - Tier
        - Treatment
        - ParentId
        - CustomAttributeData
select_permissions:
  - role: app-user
    permission:
      columns:
        - Id
        - ModifiedAtTimestamp
        - ModifiedByUser
        - Title
        - Description
        - Tier
        - Treatment
        - ParentId
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - SequentialId
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
            - _exists:
                _table:
                  name: user_role_access
                  schema: risksmart
                _where:
                  _and:
                    - AccessType:
                        _eq: read
                    - ObjectType:
                        _eq: enterprise_risk
                    - UserId:
                        _eq: X-Hasura-User-Id
            - permissions:
                _and:
                  - UserId:
                      _eq: X-Hasura-User-Id
                  - OrgKey:
                      _eq: X-Hasura-org-Id
                  - AccessType:
                      _eq: read
      allow_aggregations: true
update_permissions:
  - role: app-user
    permission:
      backend_only: true
      columns:
        - Title
        - Description
        - Tier
        - Treatment
        - ParentId
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - _exists:
                  _table:
                    name: user_role_access
                    schema: risksmart
                  _where:
                    _and:
                      - AccessType:
                          _eq: update
                      - ObjectType:
                          _eq: enterprise_risk
                      - UserId:
                          _eq: X-Hasura-User-Id
              - permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: update
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - ParentId:
                  _is_null: true
              - parent:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: app-user
    permission:
      backend_only: true
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - _exists:
                  _table:
                    name: user_role_access
                    schema: risksmart
                  _where:
                    _and:
                      - AccessType:
                          _eq: delete
                      - ObjectType:
                          _eq: enterprise_risk
                      - UserId:
                          _eq: X-Hasura-User-Id
              - permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: delete
