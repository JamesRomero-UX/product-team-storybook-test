table:
  name: form_field_configuration
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: form_field_configuration
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: form
    using:
      manual_configuration:
        column_mapping:
          FormConfigurationParentType: ParentType
        insertion_order: null
        remote_table:
          name: form_configuration
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
insert_permissions:
  - role: insert:form-field-configuration
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - FormConfigurationParentType
        - FieldId
        - Hidden
        - Required
        - ReadOnly
        - DefaultValue
        - Label
        - Description
        - Conditions
select_permissions:
  - role: read:form-field-configuration
    permission:
      columns:
        - CreatedAtTimestamp
        - CreatedByUser
        - ModifiedAtTimestamp
        - ModifiedByUser
        - FormConfigurationParentType
        - FieldId
        - Hidden
        - Required
        - ReadOnly
        - DefaultValue
        - Label
        - Description
        - Conditions
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
update_permissions:
  - role: update:form-field-configuration
    permission:
      columns:
        - FormConfigurationParentType
        - FieldId
        - Hidden
        - Required
        - ReadOnly
        - DefaultValue
        - Label
        - Description
        - Conditions
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: delete:form-field-configuration
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
