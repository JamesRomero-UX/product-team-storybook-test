table:
  name: indicator_result
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: indicator_result
  custom_root_fields: {}
object_relationships:
  - name: createdBy
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedBy
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: parent
    using:
      manual_configuration:
        column_mapping:
          IndicatorId: Id
        insertion_order: null
        remote_table:
          name: indicator
          schema: risksmart
array_relationships:
  - name: files
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: relation_file
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - parent:
              permissions:
                _and:
                  - UserId:
                      _eq: X-Hasura-User-Id
                  - OrgKey:
                      _eq: X-Hasura-org-Id
                  - AccessType:
                      _eq: insert
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-org-id
      columns:
        - IndicatorId
        - Description
        - ResultDate
        - TargetValueTxt
        - TargetValueNum
        - CustomAttributeData
  - role: insert:indicator-result
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-org-id
      columns:
        - IndicatorId
        - Description
        - ResultDate
        - TargetValueTxt
        - TargetValueNum
        - CustomAttributeData
select_permissions:
  - role: Standard
    permission:
      columns:
        - CreatedByUser
        - ModifiedByUser
        - OrgKey
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Id
        - IndicatorId
        - Description
        - ResultDate
        - TargetValueTxt
        - TargetValueNum
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
  - role: read:indicator-result
    permission:
      columns:
        - CreatedByUser
        - ModifiedByUser
        - OrgKey
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Id
        - IndicatorId
        - Description
        - ResultDate
        - TargetValueTxt
        - TargetValueNum
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
update_permissions:
  - role: Standard
    permission:
      columns:
        - IndicatorId
        - Description
        - ResultDate
        - TargetValueTxt
        - TargetValueNum
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: update
      check: null
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
  - role: update:indicator-result
    permission:
      columns:
        - IndicatorId
        - Description
        - ResultDate
        - TargetValueTxt
        - TargetValueNum
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check: null
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
delete_permissions:
  - role: Standard
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
  - role: delete:indicator-result
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: indicator-result
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
