table:
  name: issue
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: issue
  custom_root_fields: {}
object_relationships:
  - name: issueUpdateSummary
    using:
      manual_configuration:
        column_mapping:
          Id: IssueId
        insertion_order: null
        remote_table:
          name: issue_update_summary_view
          schema: risksmart
  - name: issueStatus
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: issue_status_view
          schema: risksmart
  - name: assessment
    using:
      manual_configuration:
        column_mapping:
          Id: ParentIssueId
        insertion_order: null
        remote_table:
          name: issue_assessment
          schema: risksmart
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
array_relationships:
  - name: ancestorContributors
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: ancestor_contributor_view
          schema: risksmart
  - name: actions
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: action_parent
          schema: risksmart
  - name: causes
    using:
      manual_configuration:
        column_mapping:
          Id: ParentIssueId
        insertion_order: null
        remote_table:
          name: cause
          schema: risksmart
  - name: consequences
    using:
      manual_configuration:
        column_mapping:
          Id: ParentIssueId
        insertion_order: null
        remote_table:
          name: consequence
          schema: risksmart
  - name: contributorGroups
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: contributor_group
          schema: risksmart
  - name: contributors
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: contributor
          schema: risksmart
  - name: departments
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: department
          schema: risksmart
  - name: files
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: relation_file
          schema: risksmart
  - name: ownerGroups
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: owner_group
          schema: risksmart
  - name: owners
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: owner
          schema: risksmart
  - name: parents
    using:
      manual_configuration:
        column_mapping:
          Id: IssueId
        insertion_order: null
        remote_table:
          name: issue_parent
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
  - name: tags
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: tag
          schema: risksmart
  - name: updates
    using:
      manual_configuration:
        column_mapping:
          Id: ParentIssueId
        insertion_order: null
        remote_table:
          name: issue_update
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      backend_only: true
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - DateIdentified
        - DateOccurred
        - Details
        - Id
        - ImpactsCustomer
        - IsExternalIssue
        - Title
        - CustomAttributeData
        - RaisedAtTimestamp
        - Meta
        - Type
  - role: insert:issue
    permission:
      backend_only: true
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - DateIdentified
        - DateOccurred
        - Details
        - Id
        - ImpactsCustomer
        - IsExternalIssue
        - Title
        - CustomAttributeData
        - RaisedAtTimestamp
        - Meta
        - Type
select_permissions:
  - role: Standard
    permission:
      columns:
        - DateIdentified
        - DateOccurred
        - Details
        - Id
        - ImpactsCustomer
        - IsExternalIssue
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Title
        - CreatedByUser
        - ModifiedByUser
        - SequentialId
        - CustomAttributeData
        - RaisedAtTimestamp
        - Meta
        - Type
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
                - ObjectType:
                    _eq: issue
      allow_aggregations: true
  - role: read:issue
    permission:
      columns:
        - DateIdentified
        - DateOccurred
        - Details
        - Id
        - ImpactsCustomer
        - IsExternalIssue
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Title
        - CreatedByUser
        - ModifiedByUser
        - SequentialId
        - CustomAttributeData
        - RaisedAtTimestamp
        - Meta
        - Type
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      allow_aggregations: true
update_permissions:
  - role: Standard
    permission:
      columns:
        - Title
        - Details
        - ImpactsCustomer
        - IsExternalIssue
        - DateOccurred
        - DateIdentified
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - Meta
        - Type
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: update
      check: {}
      backend_only: true
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
  - role: update:issue
    permission:
      columns:
        - Title
        - Details
        - ImpactsCustomer
        - IsExternalIssue
        - DateOccurred
        - DateIdentified
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - Meta
        - Type
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check: {}
      backend_only: true
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: Standard
    permission:
      backend_only: true
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
  - role: delete:issue
    permission:
      backend_only: true
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: issue
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
