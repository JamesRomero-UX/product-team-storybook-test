table:
  name: audit_log_view
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: audit_log_view
  custom_root_fields: {}
object_relationships:
  - name: PerformedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
select_permissions:
  - role: read:audit-log
    permission:
      columns:
        - Action
        - ModifiedAtTimestamp
        - ModifiedByUser
        - ObjectType
        - Item
        - Id
        - OrgKey
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
    comment: ''
