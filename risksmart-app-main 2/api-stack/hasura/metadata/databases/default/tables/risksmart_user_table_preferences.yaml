table:
  name: user_table_preferences
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: user_table_preferences
  custom_root_fields: {}
select_permissions:
  - role: app-user
    permission:
      columns:
        - TableId
        - Preferences
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - CreatedByUser:
              _eq: X-Hasura-User-Id
insert_permissions:
  - role: app-user
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - TableId
        - Preferences
update_permissions:
  - role: app-user
    permission:
      columns:
        - Preferences
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - CreatedByUser:
              _eq: X-Hasura-User-Id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
