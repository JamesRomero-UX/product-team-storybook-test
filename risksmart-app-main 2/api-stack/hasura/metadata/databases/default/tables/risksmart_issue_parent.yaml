table:
  name: issue_parent
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: issue_parent
  custom_root_fields: {}
object_relationships:
  - name: thirdParty
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: third_party
          schema: risksmart
  - name: control
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: control
          schema: risksmart
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: document
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: document
          schema: risksmart
  - name: issue
    using:
      manual_configuration:
        column_mapping:
          IssueId: Id
        insertion_order: null
        remote_table:
          name: issue
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: obligation
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: obligation
          schema: risksmart
  - name: assessment
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: assessment
          schema: risksmart
  - name: internalAuditReport
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: internal_audit_report
          schema: risksmart
  - name: internalAuditEntity
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: internal_audit_entity
          schema: risksmart
  - name: complianceMonitoringAssessment
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: compliance_monitoring_assessment
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: parent
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: node
          schema: risksmart
  - name: risk
    using:
      manual_configuration:
        column_mapping:
          ParentId: Id
        insertion_order: null
        remote_table:
          name: risk
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - parent:
              OrgKey:
                _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - ParentId
        - IssueId
        - ParentType
      backend_only: true
  - role: insert:issue-parent
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - parent:
              OrgKey:
                _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - ParentId
        - IssueId
        - ParentType
      backend_only: true
select_permissions:
  - role: Standard
    permission:
      columns:
        - ParentId
        - IssueId
        - ModifiedAtTimestamp
        - ModifiedByUser
        - CreatedByUser
        - CreatedAtTimestamp
        - ParentType
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - parent:
                  permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: read
              - issue:
                  permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: read
      allow_aggregations: true
  - role: read:issue-parent
    permission:
      columns:
        - ParentId
        - IssueId
        - ModifiedAtTimestamp
        - ModifiedByUser
        - CreatedByUser
        - CreatedAtTimestamp
        - ParentType
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
delete_permissions:
  - role: Standard
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      backend_only: true
  - role: delete:issue-parent
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      backend_only: true
event_triggers:
  - name: issue-parent
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
