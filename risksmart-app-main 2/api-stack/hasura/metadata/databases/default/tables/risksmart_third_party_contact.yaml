table:
  name: third_party_contact
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: third_party_contact
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: user
    using:
      manual_configuration:
        column_mapping:
          UserId: Id
        insertion_order: null
        remote_table:
          name: user
          schema: auth
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: thirdParty
    using:
      foreign_key_constraint_on: ThirdPartyId
select_permissions:
  - role: app-user
    permission:
      columns:
        - Id
        - ThirdPartyId
        - Email
        - Name
        - JobTitle
        - IsRevoked
        - PasswordSetAtTimestamp
        - UserId
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
            - _exists:
                _table:
                  name: user_role_access
                  schema: risksmart
                _where:
                  _and:
                    - AccessType:
                        _eq: read
                    - ObjectType:
                        _eq: third_party
                    - UserId:
                        _eq: X-Hasura-User-Id
            - thirdParty:
                permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: read
insert_permissions:
  - role: app-user
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - ThirdPartyId
        - Email
        - Name
        - JobTitle
        - UserId
        - PasswordSetAtTimestamp
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - _exists:
                  _table:
                    name: user_role_access
                    schema: risksmart
                  _where:
                    _and:
                      - AccessType:
                          _eq: update
                      - ObjectType:
                          _eq: third_party
                      - UserId:
                          _eq: X-Hasura-User-Id
              - thirdParty:
                  permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: update
update_permissions:
  - role: app-user
    permission:
      columns:
        - Name
        - JobTitle
        - IsRevoked
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - _exists:
                  _table:
                    name: user_role_access
                    schema: risksmart
                  _where:
                    _and:
                      - AccessType:
                          _eq: update
                      - ObjectType:
                          _eq: third_party
                      - UserId:
                          _eq: X-Hasura-User-Id
              - thirdParty:
                  permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: update
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: app-user
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - _exists:
                  _table:
                    name: user_role_access
                    schema: risksmart
                  _where:
                    _and:
                      - AccessType:
                          _eq: update
                      - ObjectType:
                          _eq: third_party
                      - UserId:
                          _eq: X-Hasura-User-Id
              - thirdParty:
                  permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: update
