  - name: controlledRiskAssessmentResult
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: risk_controlled_second_line_result
          schema: risksmart
  - name: uncontrolledRiskAssessmentResult
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: risk_uncontrolled_second_line_result
          schema: risksmart
  - name: obligationAssessmentResult
    using:
      manual_configuration:
        column_mapping:
