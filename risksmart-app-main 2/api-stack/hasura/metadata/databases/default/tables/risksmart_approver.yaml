table:
  name: approver
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: approver
  custom_root_fields: {}
array_relationships:
  - name: responses
    using:
      manual_configuration:
        column_mapping:
          Id: ApproverId
        insertion_order: null
        remote_table:
          name: approver_response
          schema: risksmart
object_relationships:
  - name: createdBy
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: level
    using:
      manual_configuration:
        column_mapping:
          LevelId: Id
        insertion_order: null
        remote_table:
          name: approval_level
          schema: risksmart
  - name: modifiedBy
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: org
    using:
      manual_configuration:
        column_mapping:
          OrgKey: OrgKey
        insertion_order: null
        remote_table:
          name: organisation
          schema: auth
  - name: user
    using:
      manual_configuration:
        column_mapping:
          UserId: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: group
    using:
      manual_configuration:
        column_mapping:
          UserGroupId: Id
        insertion_order: null
        remote_table:
          name: user_group
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - level:
              approval:
                parent:
                  permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: update
          - _or:
              - group:
                  OrgKey:
                    _eq: X-Hasura-org-id
              - user:
                  OrgKey:
                    _eq: X-Hasura-org-id
              - OwnerApprover:
                  _eq: true
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-org-id
      columns:
        - OwnerApprover
        - UserId
        - UserGroupId
        - LevelId
  - role: insert:approver
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - group:
                  OrgKey:
                    _eq: X-Hasura-org-id
              - user:
                  OrgKey:
                    _eq: X-Hasura-org-id
              - OwnerApprover:
                  _eq: true

      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-org-id
      columns:
        - OwnerApprover
        - UserId
        - UserGroupId
        - LevelId
select_permissions:
  - role: Standard
    permission:
      columns:
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Id
        - OwnerApprover
        - UserId
        - UserGroupId
        - LevelId
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      allow_aggregations: true
  - role: read:approver
    permission:
      columns:
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Id
        - OwnerApprover
        - UserId
        - UserGroupId
        - LevelId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
update_permissions:
  - role: Standard
    permission:
      columns:
        - OwnerApprover
        - UserId
        - UserGroupId
        - LevelId
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - level:
              approval:
                parent:
                  permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: update
      check:
        _or:
          - group:
              OrgKey:
                _eq: X-Hasura-org-id
          - user:
              OrgKey:
                  _eq: X-Hasura-org-id
          - OwnerApprover:
              _eq: true
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
  - role: update:approver
    permission:
      columns:
        - OwnerApprover
        - UserId
        - UserGroupId
        - LevelId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        _or:
          - group:
              OrgKey:
                _eq: X-Hasura-org-id
          - user:
              OrgKey:
                _eq: X-Hasura-org-id
          - OwnerApprover:
              _eq: true
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
delete_permissions:
  - role: Standard
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - level:
              approval:
                parent:
                  permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: delete
  - role: delete:approver
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
