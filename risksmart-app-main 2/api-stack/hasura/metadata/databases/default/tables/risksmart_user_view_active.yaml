table:
  name: user_view_active
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: user
  custom_root_fields: {}
array_relationships:
  - name: group_memberships
    using:
      manual_configuration:
        column_mapping:
          Id: UserId
        insertion_order: null
        remote_table:
          name: user_group_user
          schema: risksmart
object_relationships:
  - name: status
    using:
      manual_configuration:
        column_mapping:
          Status: Value
        insertion_order: null
        remote_table:
          name: user_status
          schema: auth
select_permissions:
  - role: read:user
    permission:
      columns:
        - RoleKey
        - Email
        - FirstName
        - Id
        - LastName
        - UserName
        - BusinessUnit_Id
        - Status
        - JobTitle
        - Department
        - OfficeLocation
        - LastSeen
        - FriendlyName
        - IsCustomerSupport
        - AuthConnection
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
