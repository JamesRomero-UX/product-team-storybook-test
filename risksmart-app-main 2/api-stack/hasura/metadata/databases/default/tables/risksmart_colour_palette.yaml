table:
  name: colour_palette
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: colour_palette
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
insert_permissions:
  - role: insert:colour-palette
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: X-Hasura-user-id
        ModifiedByUser: X-Hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Id
        - Name
        - Settings
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
select_permissions:
  - role: read:colour-palette
    permission:
      columns:
        - Id
        - Name
        - Settings
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
update_permissions:
  - role: update:colour-palette
    permission:
      columns:
        - Id
        - Name
        - Settings
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check: {}
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: X-Hasura-user-id
delete_permissions:
  - role: delete:colour-palette
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id

