array_relationships:
  - name: ancestorContributors
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: ancestor_contributor_view
          schema: risksmart
  - name: insertPermissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: insert_permission_view
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
  - name: anyContributorAccess
    using:
      manual_configuration:
        column_mapping:
          ObjectType: ObjectType
        insertion_order: null
        remote_table:
          name: user_role_access
          schema: risksmart
select_permissions:
  - role: app-user
    permission:
      columns:
        - Id
        - ObjectType
        - SequentialId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
event_triggers:
  - name: node
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
