table:
  name: schedule_state
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: schedule_state
  custom_root_fields: {}
object_relationships:
  - name: schedule
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: schedule
          schema: risksmart  
  - name: parent
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: node
          schema: risksmart  
select_permissions:
  - role: app-user
    permission:
      columns:
        - Id
        - DueDate
        - OverdueDate
        - LatestDate
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
      query_root_fields: []
      subscription_root_fields: []