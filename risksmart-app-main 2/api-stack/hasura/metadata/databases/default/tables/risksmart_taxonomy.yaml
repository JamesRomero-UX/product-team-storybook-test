table:
  name: taxonomy
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: taxonomy
  custom_root_fields: {}
array_relationships:
  - name: organisations
    using:
      foreign_key_constraint_on:
        column: TaxonomyId
        table:
          name: taxonomy_org
          schema: risksmart
insert_permissions:
  - role: CustomerSupport
    permission:
      check: {}
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
      columns:
        - Description
        - Common
        - Library
        - Rating
        - Taxonomy
        - InternalAuditRating
select_permissions:
  - role: app-user
    permission:
      columns:
        - Id
        - Description
        - Common
        - Library
        - Rating
        - Taxonomy
        - InternalAuditRating
        - CreatedByUser
        - ModifiedByUser
        - ModifiedAtTimestamp
        - CreatedAtTimestamp
      filter:
        organisations:
          OrgKey:
            _eq: X-Hasura-org-Id
      allow_aggregations: true
update_permissions:
  - role: CustomerSupport
    permission:
      columns:
        - Description
        - Common
        - Library
        - Rating
        - Taxonomy
        - InternalAuditRating
      filter: {}
      check: null
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: X-Hasura-user-id
delete_permissions:
  - role: CustomerSupport
    permission:
      filter: {}
