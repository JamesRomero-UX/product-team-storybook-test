table:
  name: user_group
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: user_group
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
array_relationships:
  - name: users
    using:
      manual_configuration:
        column_mapping:
          Id: UserGroupId
        insertion_order: null
        remote_table:
          name: user_group_user
          schema: risksmart
  - name: approvers
    using:
      manual_configuration:
        column_mapping:
          Id: UserGroupId
        insertion_order: null
        remote_table:
          name: approver
          schema: risksmart
insert_permissions:
  - role: insert:user-group
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-Org-Id
      columns:
        - Name
        - Description
        - Email
        - OwnerContributor
    comment: ''
select_permissions:
  - role: Standard
    permission:
      columns:
        - CreatedAtTimestamp
        - CreatedByUser
        - Id
        - ModifiedAtTimestamp
        - ModifiedByUser
        - Name
        - Email
        - Description
        - OwnerContributor
      filter:
        OrgKey:
          _eq: x-hasura-org-id
  - role: read:user-group
    permission:
      columns:
        - CreatedAtTimestamp
        - CreatedByUser
        - Id
        - ModifiedAtTimestamp
        - ModifiedByUser
        - Name
        - Email
        - Description
        - OwnerContributor
      filter:
        OrgKey:
          _eq: x-hasura-org-id
update_permissions:
  - role: update:user-group
    permission:
      columns:
        - Name
        - Description
        - Email
        - OwnerContributor
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
    comment: ''
delete_permissions:
  - role: delete:user_group
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      backend_only: true
event_triggers:
  - name: user-group
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
