table:
  name: organisation
  schema: auth
array_relationships:
  - name: organisationusers
    using:
      foreign_key_constraint_on:
        column: OrgKey
        table:
          name: organisationuser
          schema: auth
select_permissions:
  - role: app-user
    permission:
      columns:
        - Meta
        - Name
        - OrgKey
        - ScimEnabled
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
update_permissions:
  - role: update:organisation
    permission:
      columns:
        - ScimEnabled
      set:
        ModifiedByUser: x-hasura-user-id
        ModifiedAtTimestamp: now()
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check: {}
event_triggers:
  - name: organisation
    definition:
      enable_manual: true
      update:
        columns:
          - ScimEnabled
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY