table:
  name: assessment_audit
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: assessment_audit
  custom_root_fields: {}
select_permissions:
  - role: read:audit
    permission:
      columns:
        - Id
        - Title
        - Summary
        - TargetCompletionDate
        - ActualCompletionDate
        - StartDate
        - SequentialId
        - NextTestDate
        - CompletedByUser
        - ModifiedAtTimestamp
        - ModifiedByUser
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
        - OriginatingItemId
        - Status
        - Outcome
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
