table:
  name: questionnaire_invite
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: questionnaire_invite
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
  - name: thirdParty
    using:
      foreign_key_constraint_on: ThirdPartyId
  - name: user
    using:
      foreign_key_constraint_on: UserId
  - name: questionnaireTemplateVersion
    using:
      foreign_key_constraint_on: QuestionnaireTemplateVersionId
  - name: parent
    using:
      foreign_key_constraint_on: ParentId
  - name: contact
    using:
      foreign_key_constraint_on: ContactId
select_permissions:
  - role: app-user
    permission:
      columns:
        - Id
        - ParentId
        - ThirdPartyId
        - UserEmail
        - UserId
        - ContactId
        - Message
        - QuestionnaireTemplateVersionId
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
            - _exists:
                _table:
                  name: user_role_access
                  schema: risksmart
                _where:
                  _and:
                    - AccessType:
                        _eq: read
                    - ObjectType:
                        _eq: third_party
                    - UserId:
                        _eq: X-Hasura-User-Id
            - thirdParty:
                permissions:
                  _and:
                    - UserId:
                        _eq: X-Hasura-User-Id
                    - OrgKey:
                        _eq: X-Hasura-org-Id
                    - AccessType:
                        _eq: read
insert_permissions:
  - role: app-user
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-user-id
        ModifiedByUser: x-hasura-user-id
        OrgKey: x-hasura-org-id
      columns:
        - ParentId
        - ThirdPartyId
        - UserEmail
        - UserId
        - ContactId
        - Message
        - QuestionnaireTemplateVersionId
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - _exists:
                  _table:
                    name: user_role_access
                    schema: risksmart
                  _where:
                    _and:
                      - AccessType:
                          _eq: update
                      - ObjectType:
                          _eq: third_party
                      - UserId:
                          _eq: X-Hasura-User-Id
              - thirdParty:
                  permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: update
update_permissions:
  - role: app-user
    permission:
      backend_only: true
      columns: '*'
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
delete_permissions:
  - role: app-user
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - _exists:
                  _table:
                    name: user_role_access
                    schema: risksmart
                  _where:
                    _and:
                      - AccessType:
                          _eq: update
                      - ObjectType:
                          _eq: third_party
                      - UserId:
                          _eq: X-Hasura-User-Id
              - thirdParty:
                  permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: update
