table:
  name: indicator
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: indicator
  custom_root_fields: {}
object_relationships:
  - name: schedule
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: schedule
          schema: risksmart 
  - name: scheduleState
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: schedule_state
          schema: risksmart  
  - name: createdBy
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: indicator_type
    using:
      foreign_key_constraint_on: Type
  - name: modifiedBy
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: org
    using:
      manual_configuration:
        column_mapping:
          OrgKey: OrgKey
        insertion_order: null
        remote_table:
          name: organisation
          schema: auth
array_relationships:
  - name: ancestorContributors
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: ancestor_contributor_view
          schema: risksmart
  - name: contributorGroups
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: contributor_group
          schema: risksmart
  - name: contributors
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: contributor
          schema: risksmart
  - name: departments
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: department
          schema: risksmart
  - name: files
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: relation_file
          schema: risksmart
  - name: ownerGroups
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: owner_group
          schema: risksmart
  - name: owners
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: owner
          schema: risksmart
  - name: parents
    using:
      manual_configuration:
        column_mapping:
          Id: IndicatorId
        insertion_order: null
        remote_table:
          name: indicator_parent
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
  - name: results
    using:
      manual_configuration:
        column_mapping:
          Id: IndicatorId
        insertion_order: null
        remote_table:
          name: indicator_result
          schema: risksmart
  - name: tags
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: tag
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-org-id
      columns:
        - Id
        - Title
        - Description
        - Type
        - Unit
        - UpperToleranceNum
        - LowerToleranceNum
        - UpperAppetiteNum
        - LowerAppetiteNum
        - TargetValueTxt
        - CustomAttributeData
      backend_only: true
  - role: insert:indicator
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-org-id
      columns:
        - Id
        - Title
        - Description
        - Type
        - Unit
        - UpperToleranceNum
        - LowerToleranceNum
        - UpperAppetiteNum
        - LowerAppetiteNum
        - TargetValueTxt
        - CustomAttributeData
      backend_only: true
select_permissions:
  - role: Standard
    permission:
      columns:
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Id
        - Title
        - Description
        - Type
        - Unit
        - UpperToleranceNum
        - LowerToleranceNum
        - UpperAppetiteNum
        - LowerAppetiteNum
        - TargetValueTxt
        - CustomAttributeData
        - SequentialId
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
                - ObjectType:
                    _eq: indicator
  - role: read:indicator
    permission:
      columns:
        - CreatedByUser
        - ModifiedByUser
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - Id
        - Title
        - Description
        - Type
        - Unit
        - UpperToleranceNum
        - LowerToleranceNum
        - UpperAppetiteNum
        - LowerAppetiteNum
        - TargetValueTxt
        - CustomAttributeData
        - SequentialId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
update_permissions:
  - role: Standard
    permission:
      columns:
        - Title
        - Description
        - Unit
        - UpperToleranceNum
        - LowerToleranceNum
        - UpperAppetiteNum
        - LowerAppetiteNum
        - TargetValueTxt
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: update
      check: null
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
      backend_only: true
  - role: update:indicator
    permission:
      columns:
        - Title
        - Description
        - Unit
        - UpperToleranceNum
        - LowerToleranceNum
        - UpperAppetiteNum
        - LowerAppetiteNum
        - TargetValueTxt
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check: null
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
      backend_only: true
delete_permissions:
  - role: Standard
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
  - role: delete:indicator
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: indicator
    definition:
      delete:
        columns: '*'
      enable_manual: false
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
