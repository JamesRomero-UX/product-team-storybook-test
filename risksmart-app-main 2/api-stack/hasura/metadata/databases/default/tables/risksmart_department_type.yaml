table:
  name: department_type
  schema: risksmart
configuration:
  column_config:
    Id:
      custom_name: DepartmentTypeId
  custom_column_names:
    Id: DepartmentTypeId
  custom_name: department_type
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: department_type_group
    using:
      foreign_key_constraint_on: DepartmentTypeGroupId
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
insert_permissions:
  - role: insert:department-type
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - DepartmentTypeGroupId:
                  _is_null: true
              - department_type_group:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        CreatedByUser: x-hasura-User-Id
        ModifiedByUser: x-hasura-User-Id
        OrgKey: x-hasura-Org-Id
      columns:
        - Description
        - Name
        - DepartmentTypeGroupId
    comment: ""
select_permissions:
  - role: read:department-type
    permission:
      columns:
        - Id
        - ModifiedAtTimestamp
        - Name
        - Description
        - ModifiedByUser
        - CreatedByUser
        - CreatedAtTimestamp
        - DepartmentTypeGroupId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
update_permissions:
  - role: update:department-type
    permission:
      columns:
        - Description
        - Name
        - DepartmentTypeGroupId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - _or:
              - DepartmentTypeGroupId:
                  _is_null: true
              - department_type_group:
                  OrgKey:
                    _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-User-Id
    comment: ""
delete_permissions:
  - role: delete:department-type
    permission:
      backend_only: true
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
