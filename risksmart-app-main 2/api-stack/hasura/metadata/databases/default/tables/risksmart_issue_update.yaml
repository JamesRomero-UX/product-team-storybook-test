table:
  name: issue_update
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: issue_update
  custom_root_fields: {}
object_relationships:
  - name: createdByUser
    using:
      manual_configuration:
        column_mapping:
          CreatedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: issue
    using:
      manual_configuration:
        column_mapping:
          ParentIssueId: Id
        insertion_order: null
        remote_table:
          name: issue
          schema: risksmart
  - name: modifiedByUser
    using:
      manual_configuration:
        column_mapping:
          ModifiedByUser: Id
        insertion_order: null
        remote_table:
          name: user_view_active
          schema: risksmart
  - name: organisation
    using:
      foreign_key_constraint_on: OrgKey
array_relationships:
  - name: files
    using:
      manual_configuration:
        column_mapping:
          Id: ParentId
        insertion_order: null
        remote_table:
          name: relation_file
          schema: risksmart
  - name: permissions
    using:
      manual_configuration:
        column_mapping:
          Id: Id
        insertion_order: null
        remote_table:
          name: permission_view
          schema: risksmart
insert_permissions:
  - role: Standard
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - issue:
              _and:
                - OrgKey:
                    _eq: X-Hasura-org-id
                - permissions:
                    _and:
                      - UserId:
                          _eq: X-Hasura-User-Id
                      - OrgKey:
                          _eq: X-Hasura-org-Id
                      - AccessType:
                          _eq: insert
      set:
        CreatedByUser: X-Hasura-user-id
        ModifiedByUser: X-Hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Title
        - Description
        - ParentIssueId
        - CustomAttributeData
  - role: insert:issue-update
    permission:
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - issue:
              OrgKey:
                _eq: X-Hasura-org-id
      set:
        CreatedByUser: X-Hasura-user-id
        ModifiedByUser: X-Hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Title
        - Description
        - ParentIssueId
        - CustomAttributeData
select_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - Title
        - Description
        - ParentIssueId
        - ModifiedAtTimestamp
        - ModifiedByUser
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: read
                - ObjectType:
                    _eq: issue_update
  - role: read:issue-update
    permission:
      columns:
        - Id
        - Title
        - Description
        - ParentIssueId
        - ModifiedAtTimestamp
        - ModifiedByUser
        - CreatedByUser
        - CreatedAtTimestamp
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
update_permissions:
  - role: Standard
    permission:
      columns:
        - Id
        - Title
        - Description
        - ParentIssueId
        - CustomAttributeData
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: update
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - issue:
              OrgKey:
                _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: X-Hasura-user-id
  - role: update:issue-update
    permission:
      columns:
        - Id
        - Title
        - Description
        - ParentIssueId
        - CustomAttributeData
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - issue:
              OrgKey:
                _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: X-Hasura-user-id
delete_permissions:
  - role: Standard
    permission:
      filter:
        _and:
          - OrgKey:
              _eq: X-Hasura-org-id
          - permissions:
              _and:
                - UserId:
                    _eq: X-Hasura-User-Id
                - OrgKey:
                    _eq: X-Hasura-org-Id
                - AccessType:
                    _eq: delete
  - role: delete:issue-update
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: issue-update
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns: '*'
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
