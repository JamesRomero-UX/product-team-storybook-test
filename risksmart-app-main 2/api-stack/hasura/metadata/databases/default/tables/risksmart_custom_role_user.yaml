table:
  name: custom_role_user
  schema: risksmart
configuration:
  column_config: {}
  custom_column_names: {}
  custom_name: custom_role_user
  custom_root_fields: {}
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: UserId
  - name: role
    using:
      foreign_key_constraint_on: CustomRoleId
insert_permissions:
  - role: insert:custom-role
    permission:
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        CreatedAtTimestamp: now()
        CreatedByUser: x-hasura-user-id
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
        OrgKey: X-Hasura-org-id
      columns:
        - Id
        - CustomRoleId
        - UserId
      backend_only: true
select_permissions:
  - role: app-user
    permission:
      columns:
        - Id
        - CustomRoleId
        - UserId
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - CreatedByUser
        - ModifiedByUser
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
  - role: read:custom-role
    permission:
      columns:
        - Id
        - CustomRoleId
        - UserId
        - CreatedAtTimestamp
        - ModifiedAtTimestamp
        - CreatedByUser
        - ModifiedByUser
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      allow_aggregations: true
update_permissions:
  - role: update:custom-role
    permission:
      columns:
        - CustomRoleId
        - UserId
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
      check:
        OrgKey:
          _eq: X-Hasura-org-id
      set:
        ModifiedAtTimestamp: now()
        ModifiedByUser: x-hasura-user-id
      backend_only: true
delete_permissions:
  - role: delete:custom-role
    permission:
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
event_triggers:
  - name: custom_role_user
    definition:
      delete:
        columns: '*'
      enable_manual: true
      insert:
        columns: '*'
      update:
        columns:
          - Id
          - CustomRoleId
          - UserId
          - OrgKey
          - CreatedAtTimestamp
          - ModifiedAtTimestamp
          - CreatedByUser
          - ModifiedByUser
    retry_conf:
      interval_sec: 10
      num_retries: 3
      timeout_sec: 60
    webhook: https://{{REST_API_DOMAIN}}/events
    headers:
      - name: RestApiKey
        value_from_env: REST_API_KEY
