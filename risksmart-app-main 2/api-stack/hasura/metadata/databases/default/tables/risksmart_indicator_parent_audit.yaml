table:
  name: indicator_parent_audit
  schema: risksmart
select_permissions:
  - role: read:audit
    permission:
      columns:
        - ParentId
        - IndicatorId
        - ModifiedAtTimestamp
        - ModifiedByUser
        - CreatedByUser
        - CreatedAtTimestamp
      filter:
        OrgKey:
          _eq: X-Hasura-org-id
