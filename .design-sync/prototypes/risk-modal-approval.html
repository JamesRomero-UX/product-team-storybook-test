<!-- @dsCard group="prototypes" viewport="1440x900" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../_ds_bundle.css">
  <link rel="stylesheet" href="../_ds_app_bundle.css">
  <style>html,body{margin:0;padding:0;background:#fff}#root{min-height:100vh}.ds-err{padding:24px;font:14px/1.5 system-ui;color:#b91c1c;white-space:pre-wrap}</style>
</head><body class="atomic-ui">
  <div id="root"></div>
  <script src="../_vendor/react.js"></script>
  <script src="../_vendor/react-dom.js"></script>
  <script src="../_ds_bundle.js"></script>
  <script src="../_ds_app_bundle.js"></script>
  <script>
  (function(){
    var h = React.createElement, A = window.RiskSmartApp, C = window.RiskSmart;
    function ApprovalModal(props){
      var s1=React.useState(null), approver=s1[0], setApprover=s1[1];
      var s2=React.useState(''), note=s2[0], setNote=s2[1];
      return h(C.Modal,{ visible:props.visible, onDismiss:props.onDismiss, size:'medium', header:'Submit for approval',
        footer:h(C.Box,{float:'right'}, h(C.SpaceBetween,{direction:'horizontal',size:'xs'},
          h(A.Button,{variant:'link',onClick:props.onDismiss},'Cancel'),
          h(A.Button,{variant:'primary',onClick:props.onDismiss},'Submit for approval')))
      },
        h(C.SpaceBetween,{size:'l'},
          h(C.Alert,{type:'info',header:'This change needs Tier 1 approval'},'Risk acceptance — Tier 1 has 3 approval levels. It becomes active only once every level has signed off.'),
          h(C.FormField,{label:'First approver',description:'Who should review this first?'},
            h(C.Select,{selectedOption:approver,onChange:function(e){setApprover(e.detail.selectedOption);},placeholder:'Select approver',
              options:[{label:'Richard Poole — Head of Risk',value:'rp'},{label:'Emma Bamford — CISO',value:'eb'},{label:'Liam Chen — Compliance',value:'lc'}]})),
          h(C.FormField,{label:'Note to approver',description:'Optional — add context for the reviewer.'},
            h(C.Textarea,{value:note,placeholder:'e.g. Accepting residual risk until the Q3 migration completes.',onChange:function(e){setNote(e.detail.value);}}))
        )
      );
    }
    function App(){
      var v=React.useState(true), visible=v[0], setVisible=v[1];
      return h(A.RealProviders,{initialPath:'/risks/R-001'},
        h(A.PageLayout,{title:'Data breach via legacy S3 bucket', counter:'(R-001)',
          actions:h(A.Button,{variant:'primary',onClick:function(){setVisible(true);}},'Submit for approval')},
          h(A.TabHeader,null,'Approvals'),
          h(ApprovalModal,{visible:visible,onDismiss:function(){setVisible(false);}})
        ));
    }
    try { ReactDOM.createRoot(document.getElementById('root')).render(h(App)); }
    catch(e){ var el=document.getElementById('root'); el.className='ds-err'; el.textContent='⚠ '+((e&&e.stack)||e); }
  })();
  </script>
</body></html>
