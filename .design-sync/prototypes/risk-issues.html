<!-- @dsCard group="prototypes" viewport="1440x900" -->
<!doctype html>
<html><head><meta charset="utf-8">
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="../_ds_bundle.css">
  <link rel="stylesheet" href="../_ds_app_bundle.css">
  <style>html,body{margin:0;padding:0;background:#fff}#root{min-height:100vh}.ds-err{padding:24px;font:14px/1.5 system-ui;color:#b91c1c;white-space:pre-wrap}</style>
</head><body class="atomic-ui">
  <div id="root"></div>
  <script src="../_vendor/react.js"></script>
  <script src="../_vendor/react-dom.js"></script>
  <script src="../_ds_bundle.js"></script>
  <script src="../_ds_app_bundle.js"></script>
  <script>
  (function(){
    var h = React.createElement, A = window.RiskSmartApp, C = window.RiskSmart;

    var HIGH={color:'light-red',label:'High'}, MED={color:'orange',label:'Medium'}, LOW={color:'light-green',label:'Low'}, CRIT={color:'dark-red',label:'Critical'};
    // status → Cloudscape StatusIndicator type
    var ISSUES = [
      { id:'I-001', Title:'Customer data exposed in export tool', Type:'Breach log', Severity:CRIT, Status:['error','Open'], Owners:[{label:'Emma Bamford'}], Raised:'02 Jul 2026' },
      { id:'I-002', Title:'Unfair fee disclosure in onboarding', Type:'Consumer duty', Severity:HIGH, Status:['in-progress','Investigating'], Owners:[{label:'Liam Chen'}], Raised:'30 Jun 2026' },
      { id:'I-003', Title:'Failed payment reconciliation batch', Type:'Risk event', Severity:MED, Status:['in-progress','Investigating'], Owners:[{label:'James Romero'}], Raised:'28 Jun 2026' },
      { id:'I-004', Title:'Subject access request overdue', Type:'SAR', Severity:HIGH, Status:['warning','Awaiting response'], Owners:[{label:'Maya Okafor'}], Raised:'26 Jun 2026' },
      { id:'I-005', Title:'Marketing email sent without consent', Type:'GDPR', Severity:MED, Status:['success','Resolved'], Owners:[{label:'Ava Rodriguez'}], Raised:'22 Jun 2026' },
      { id:'I-006', Title:'Mis-sold add-on insurance', Type:'Consumer duty', Severity:HIGH, Status:['in-progress','Investigating'], Owners:[{label:'Tom Patel'}], Raised:'20 Jun 2026' },
      { id:'I-007', Title:'Vendor outage — card processing', Type:'Risk event', Severity:CRIT, Status:['error','Open'], Owners:[{label:'Richard Poole'}], Raised:'18 Jun 2026' },
      { id:'I-008', Title:'Incorrect KYC document retained', Type:'Breach log', Severity:LOW, Status:['success','Resolved'], Owners:[{label:'Sofia Marsh'}], Raised:'15 Jun 2026' }
    ];

    var FILTERING_PROPERTIES = [
      { propertyLabel:'Title', key:'Title', groupValuesLabel:'Titles', operators:[':','!:','=','!='] },
      { propertyLabel:'Type', key:'Type', groupValuesLabel:'Types', operators:['=','!='] }
    ];

    var COLUMNS = [
      { id:'id', header:'Reference', sortingField:'id', minWidth:110, cell:function(it){ return h('a',{href:'#/issues/'+it.id,style:{color:'#0972d3',textDecoration:'none',fontWeight:600}}, it.id); } },
      { id:'Title', header:'Title', sortingField:'Title', isRowHeader:true, minWidth:300, cell:function(it){ return it.Title; } },
      { id:'Type', header:'Type', sortingField:'Type', minWidth:150, cell:function(it){ return it.Type; } },
      { id:'Severity', header:'Severity', sortingField:'Severity', minWidth:120, cell:function(it){ return h(A.SimpleRatingBadge,{rating:it.Severity}); } },
      { id:'Status', header:'Status', minWidth:170, cell:function(it){ return h(C.StatusIndicator,{type:it.Status[0]}, it.Status[1]); } },
      { id:'Owners', header:'Owner', minWidth:180, cell:function(it){ return h(A.BadgeList,{badges:it.Owners.map(function(o){return o.label;})}); } },
      { id:'Raised', header:'Raised', sortingField:'Raised', minWidth:120, cell:function(it){ return it.Raised; } }
    ];

    function RibbonRow(props){
      return h('div',{className:'flex gap-6 flex-grow overflow-x-auto rounded-md border border-solid border-grey200 bg-white px-6 py-5'},
        props.items.map(function(it,idx){
          return h('div',{key:it.id,className:'flex flex-1 justify-between'},
            h(A.DashboardItem,{title:it.title,value:it.value,selected:it.id===props.selected,onClick:function(){props.onSelect(it.id);}}),
            idx!==props.items.length-1 ? h('div',{className:'w-1 h-full bg-grey200'}) : null);
        }));
    }
    function seg(r,s){ if(s==='open')return r.Status[1]!=='Resolved'; if(s==='breach')return r.Type==='Breach log'; if(s==='high')return r.Severity.label==='High'||r.Severity.label==='Critical'; if(s==='mine')return r.Owners.some(function(o){return o.label==='James Romero';}); return true; }

    function Content(){
      var st=React.useState('all'), segment=st[0], setSegment=st[1];
      var rows=ISSUES.filter(function(r){return seg(r,segment);});
      var col=A.useCollection(rows,{propertyFiltering:{filteringProperties:FILTERING_PROPERTIES,empty:h('span',null,'No matches')},pagination:{pageSize:10},sorting:{},selection:{}});
      var ribbon=[
        {id:'all',title:'All issues',value:ISSUES.length},
        {id:'open',title:'Open',value:ISSUES.filter(function(r){return seg(r,'open');}).length},
        {id:'breach',title:'Breaches',value:ISSUES.filter(function(r){return seg(r,'breach');}).length},
        {id:'high',title:'High severity',value:ISSUES.filter(function(r){return seg(r,'high');}).length},
        {id:'mine',title:'My issues',value:ISSUES.filter(function(r){return seg(r,'mine');}).length}
      ];
      return h(C.SpaceBetween,{size:'l'},
        h(RibbonRow,{items:ribbon,selected:segment,onSelect:setSegment}),
        h(A.Table, Object.assign({}, col.collectionProps, {
          columnDefinitions:COLUMNS, items:col.items, selectionType:'multi', trackBy:'id',
          filter:h(A.PropertyFilterPanel, Object.assign({}, col.propertyFilterProps, {countText:col.items.length+' matches', filteringPlaceholder:'Filter issues', virtualScroll:true})),
          empty:h(A.NoMatchesCollection,{onClearClick:function(){col.collectionProps.actions.setPropertyFiltering({tokens:[],operation:'and'});}}),
          pagination:h(C.Pagination, col.paginationProps)
        }))
      );
    }
    function App(){
      return h(A.RealProviders,{initialPath:'/issues'},
        h(A.PageLayout,{title:'Issues register', counter:'('+ISSUES.length+')',
          actions:h(C.SpaceBetween,{direction:'horizontal',size:'xs'},
            h(A.Button,null,'Export'), h(A.Button,{variant:'primary'},'Report an issue'))
        }, h(Content)));
    }
    try { ReactDOM.createRoot(document.getElementById('root')).render(h(App)); }
    catch(e){ var el=document.getElementById('root'); el.className='ds-err'; el.textContent='⚠ '+((e&&e.stack)||e); }
  })();
  </script>
</body></html>
